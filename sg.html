  return '--accent';
}

// 섬김카드의 계절 질문 — 자연스럽게 가족·인맥 이야기를 여는 대화거리
// 대화거리 — 팀에서 함께 쓰는 문구. 바꾸시려면 이 목록만 고쳐 다시 올리면 됩니다.
const SEASON_QA = [
  { m:[1,2],   q:['설날에는 가족들이 많이 모이시나요?'] },
  { m:[3,4],   q:['꽃구경 다녀오셨나요?','누구랑 주로 다니세요?'] },
  { m:[5,6],   q:['어버이날에는 요즘 주로 뭐 하시나요?'] },
  { m:[7,8],   q:['휴가 계획은 세우셨나요?','휴가는 다녀오셨나요?','누구랑 가는 게 편하신가요?'] },
  { m:[9,10],  q:['추석은 어디서 보내시나요?','가족들은 다 모이시나요?','추석은 잘 쉬셨나요?'] },
  { m:[11,12], q:['김장은 언제 하시나요?','가족들이 다 함께 모이시나요?'] },
];

function seasonBox(){
  const mm = new Date().getMonth() + 1;
  const s = SEASON_QA.find(x => x.m.includes(mm));
  if(!s || !s.q.length) return '';
  return `<div class="season">
    <div class="st">${mm}월 대화거리</div>
    <ul>${s.q.map(q => `<li>${esc(q)}</li>`).join('')}</ul>
  </div>`;
}


let DB = load();
let VIEW = 'dash';
let TEAM = (() => { try{ return localStorage.getItem(KEY_TEAM) || ''; }catch(e){ return ''; } })();
let Q = '';
let FILTER = 'all';
let GFILTER = null;          // 명단분류 화면에서 고른 분류
let ATAB = 'plan';           // 섬김활동 화면: 'plan' 예정 · 'log' 기록
let SORT = 'next';
let OPEN = null;   // 열려 있는 고객 id

/* ---------- 저장 ---------- */
// 예전 버전(가족·인맥이 표 형태)에서 저장한 자료를 메모장 글로 바꿔 이어받는다
function migrate(d){
  if(!Array.isArray(d.groups) || !d.groups.length) d.groups = DEFAULT_GROUPS.slice();
  if(!Array.isArray(d.teams)) d.teams = [];
  // 예전 자료에 팀명이 적혀 있으면 목록으로 살려둔다
  (d.people || []).forEach(p => {
    if(p.team && !d.teams.includes(p.team)) d.teams.push(p.team);
  });
  (d.people || []).forEach(p => {
    // 예전에 '알게 된 경로'로 자유롭게 적어둔 값도 분류로 살려둔다
    if(p.source && !d.groups.includes(p.source)) d.groups.push(p.source);
    if(Array.isArray(p.family)){
      p.family = p.family.map(f =>
        [f.rel, f.name, f.age, f.job].filter(Boolean).join(' ') + (f.need ? ' — ' + f.need : '')
      ).join('\n');
    }
    if(Array.isArray(p.network)){
      p.network = p.network.map(n =>
        [n.rel, n.name].filter(Boolean).join(' ') + (n.memo ? ' — ' + n.memo : '')
      ).join('\n');
    }
    if(typeof p.family  !== 'string') p.family  = '';
    if(typeof p.network !== 'string') p.network = '';

    // 예전에 '시스템'으로 묻혀 있던 완료·성장 기록을 되살린다
    (p.logs || []).forEach(l => {
      if(l.kind !== '시스템') return;
      if(/^완료:\s*/.test(l.text)){
        l.kind = '완료';
        l.text = l.text.replace(/^완료:\s*/, '');
      }else if(/\s→\s/.test(l.text)){
        l.kind = '성장';
      }
    });
  });
  return d;
}
function read1(k){
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}
function parseDB(raw){
  const d = JSON.parse(raw);
  if(!d || !Array.isArray(d.people)) throw new Error('형식이 다릅니다');
  return migrate(d);
}
function load(){
  const main = read1(KEY);
  if(main){
    try{ return parseDB(main); }
    catch(e){ console.warn('기본 자료를 읽지 못했습니다', e); LOAD_BROKEN = main; }
  }
  const bak = read1(KEY_BAK);            // 예비본으로 되살려 본다
  if(bak){
    try{
      const d = parseDB(bak);
      LOAD_BROKEN = null;
      setTimeout(() => toast('예비 자료로 되살렸습니다'), 600);
      return d;
    }catch(e){ console.warn('예비 자료도 읽지 못했습니다', e); }
  }
  return { people:[], groups:DEFAULT_GROUPS.slice(), teams:[], updatedAt:null };
}
function save(){
  // 예전 자료를 읽지 못한 상태라면 절대 덮어쓰지 않는다
  if(LOAD_BROKEN && !DB.people.length){
    toast('예전 자료를 읽지 못해 저장을 멈췄습니다');
    return;
  }
  DB.updatedAt = new Date().toISOString();
  try{
    const json = JSON.stringify(DB);
    localStorage.setItem(KEY, json);
    localStorage.setItem(KEY_BAK, json);   // 한 벌 더
    stamp();
  }catch(e){
    toast('⚠️ 저장되지 않았습니다 — 데이터 화면에서 백업 글을 복사해 두세요');
  }
}
function stamp(){
  const el = document.getElementById('savedAt');
  if(!el) return;
  el.textContent = DB.updatedAt ? '저장됨 · ' + fmtTime(DB.updatedAt) : '';
}

/* ---------- 유틸 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function today(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function toDate(s){
  if(!s) return null;
  const p = String(s).split('-').map(Number);
  if(p.length < 3 || isNaN(p[0])) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysFromToday(s){
  const d = toDate(s);
  if(!d) return null;
  return Math.round((d - today()) / 86400000);
}
function fmtDue(s){
  const n = daysFromToday(s);
  if(n === null) return { txt:'—', cls:'none' };
  if(n === 0)  return { txt:'오늘', cls:'today' };
  if(n === 1)  return { txt:'내일', cls:'today' };
  if(n < 0)    return { txt:`${-n}일 지남`, cls:'over' };
  if(n <= 7)   return { txt:`${n}일 후`, cls:'' };
  return { txt:s.slice(5).replace('-','/'), cls:'' };
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${String(d.getMonth()+1)}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function pad2(n){ return String(n).padStart(2, '0'); }
function fmtTimeK(t){
  if(!t) return '';
  const p = String(t).split(':').map(Number);
  if(isNaN(p[0])) return '';
  const ap = p[0] < 12 ? '오전' : '오후';
  const hh = p[0] % 12 === 0 ? 12 : p[0] % 12;
  return p[1] ? `${ap} ${hh}:${pad2(p[1])}` : `${ap} ${hh}시`;
}

// 캘린더 표준 파일 — 아이폰 · 구글 · 네이버 모두 읽는다
function icsText(p){
  const d = p.nextDate.replace(/-/g, '');
  let start, end, allDay = false;
  if(p.nextTime){
    const t = p.nextTime.split(':').map(Number);
    start = `${d}T${pad2(t[0])}${pad2(t[1])}00`;
    const e = (t[0] + 1) % 24;
    end   = `${d}T${pad2(e)}${pad2(t[1])}00`;
  }else{
    allDay = true;
    const nd = toDate(p.nextDate); nd.setDate(nd.getDate() + 1);
    start = d;
    end   = `${nd.getFullYear()}${pad2(nd.getMonth()+1)}${pad2(nd.getDate())}`;
  }
  const q = v => String(v || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//섬김노트//KO', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${p.id}-${d}@seomgim`,
    `DTSTAMP:${stamp}`,
    allDay ? `DTSTART;VALUE=DATE:${start}` : `DTSTART:${start}`,
    allDay ? `DTEND;VALUE=DATE:${end}`     : `DTEND:${end}`,
    `SUMMARY:${q(p.name + ' — ' + (p.nextAction || '섬김활동'))}`,
    `DESCRIPTION:${q(p.phone || '')}`,
    'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:섬김활동', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}

// 인터넷 주소로 열렸을 때는 파일 대신 캘린더 사이트를 연다 (이름과 할 일만 넘긴다)
function calUrl(p){
  const d = p.nextDate.replace(/-/g, '');
  let dates;
  if(p.nextTime){
    const t = p.nextTime.split(':').map(Number);
    dates = `${d}T${pad2(t[0])}${pad2(t[1])}00/${d}T${pad2((t[0]+1)%24)}${pad2(t[1])}00`;
  }else{
    const nd = toDate(p.nextDate); nd.setDate(nd.getDate() + 1);
    dates = `${d}/${nd.getFullYear()}${pad2(nd.getMonth()+1)}${pad2(nd.getDate())}`;
  }
  return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
    action: 'TEMPLATE',
    text: `${p.name} — ${p.nextAction || '섬김활동'}`,
    dates,
  }).toString();
}

// 쓰는 기기에 따라 캘린더에 넣는 길이 다르다
const UA = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
const IS_ANDROID = /Android/i.test(UA);
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) ||
               (/Macintosh/.test(UA) && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);

// 아이폰이 날짜로 알아보는 형태 — 길게 누르면 '이벤트 생성'이 뜬다
function dateForPhone(d, t){
  const x = toDate(d);
  if(!x) return '';
  let out = `${x.getFullYear()}년 ${x.getMonth()+1}월 ${x.getDate()}일`;
  if(t){
    const p = t.split(':').map(Number);
    const ap = p[0] < 12 ? '오전' : '오후';
    const hh = p[0] % 12 === 0 ? 12 : p[0] % 12;
    out += ` ${ap} ${hh}시` + (p[1] ? ` ${p[1]}분` : '');
  }
  return out;
}

// 주는 월요일에 시작한다. 0 = 이번 주, 1 = 지난주, 2 = 지지난주 …
function weekStart(d){
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function weekIndex(at){
  return Math.round((weekStart(new Date()) - weekStart(new Date(at))) / (7 * 86400000));
}
const DOW = ['일','월','화','수','목','금','토'];
// 주소는 광역시·도 + 시·군·구까지 (예: 경기도 남양주시). 적어주신 그대로 보여드린다.
const SIDO_LIST = [
  '서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시',
  '세종특별자치시','강원특별자치도','전북특별자치도','제주특별자치도',
  '경기도','강원도','충청북도','충청남도','전라북도','전라남도','경상북도','경상남도','제주도',
  '서울','부산','대구','인천','광주','대전','울산','세종','경기','강원',
  '충북','충남','전북','전남','경북','경남','제주',
].sort((a, b) => b.length - a.length);      // 긴 이름부터 맞춰본다

function shortAddr(a){
  if(!a) return '';
  let str = String(a).trim();
  // 붙여 쓴 주소도 갈라낸다: '경기도남양주시' → '경기도 남양주시'
  for(const p of SIDO_LIST){
    if(str.startsWith(p)){ str = p + ' ' + str.slice(p.length).trim(); break; }
  }
  const t = str.split(/\s+/).filter(Boolean);
  if(!t.length) return '';
  const out = [t[0]];
  // 시·군·구를 하나 더 붙인다. '남양주'처럼 '시'를 빼고 적으셔도 잡히도록,
  // 읍·면·동·리·로·길·번지 같은 아래 단위가 나오면 거기서 멈춘다.
  const LOWER = /(동|읍|면|리|로|길|가|번지|번길)$|^\d/;
  for(let i = 1; i < t.length && out.length < 2; i++){
    if(LOWER.test(t[i])) break;
    out.push(t[i]);
  }
  return out.join(' ');
}

function shortDay(at){
  const d = new Date(at);
  return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
}

function fmtDateK(s){
  if(!s) return '';
  const p = s.split('-');
  return p.length === 3 ? `${p[0]}. ${Number(p[1])}. ${Number(p[2])}.` : s;
}
// 숫자만 남기고 자동으로 - 를 넣는다
// 번호를 누르면 전화를 걸어보고, 동시에 번호를 복사해 둔다.
// 클로드 안에서 열린 페이지는 보안 때문에 전화 앱을 직접 못 열 수 있어서,
// 그때는 복사해 둔 번호를 전화 앱에 붙여넣으면 된다.
// mode: 'big' 상세화면 · 'row' 고객목록(아이콘 있음) · 그 외 아이콘 없이
function telLink(phone, mode){
  if(!phone) return '';
  const digits = String(phone).replace(/[^0-9+]/g, '');
  if(!digits) return esc(phone);
  const cls = mode === 'big' ? 'tel big' : (mode === 'row' ? 'tel row' : 'tel');
  const ic  = (mode === 'big' || mode === 'row') ? '📞 ' : '';
  return `<a class="${cls}" href="tel:${esc(digits)}"
            data-tel="${esc(digits)}" data-raw="${esc(phone)}">${ic}${esc(phone)}</a>`;
}

// 목록에서 번호를 누르면 전화만 걸리고 뒤의 줄은 열리지 않게
function tapPhone(e){ e.stopPropagation(); }

function fmtPhone(v){
  const d = String(v || '').replace(/[^0-9]/g, '').slice(0, 11);
  if(d.length < 4) return d;
  if(d.startsWith('02')){                                  // 서울 지역번호
    if(d.length <= 5) return d.slice(0,2) + '-' + d.slice(2);
    if(d.length <= 9) return d.slice(0,2) + '-' + d.slice(2,5) + '-' + d.slice(5);
    return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
  }
  if(d.length <= 7)  return d.slice(0,3) + '-' + d.slice(3);
  if(d.length <= 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
}
function initials(name){
  const n = String(name || '?').trim();
  return n.length <= 2 ? n : n.slice(-2);
}
function avatarColor(id){
  const palette = ['#8b5cf6','#0ea5e9','#10b981','#f59e0b','#e11d48','#6366f1','#14b8a6','#f97316'];
  let h = 0;
  for(const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}
// 브라우저 기본 확인창은 이 안에서 막히므로 화면 안에 직접 그린다
function askConfirm(msg, okLabel){
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'overlay ask';
    el.innerHTML = `<div class="modal" style="max-width:420px">
      <div class="mbody" style="font-size:15.5px;line-height:1.7;white-space:pre-wrap">${esc(msg)}</div>
      <div class="mfoot">
        <button class="btn" data-no>취소</button>
        <button class="btn primary" data-yes>${esc(okLabel || '확인')}</button>
      </div>
    </div>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => {
      if(e.target.closest('[data-yes]')){ el.remove(); resolve(true); }
      else if(e.target.closest('[data-no]') || e.target === el){ el.remove(); resolve(false); }
    });
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// 팀을 고르면 그 팀 사람만 본다. '전체'면 모두.
function people(){
  return TEAM ? DB.people.filter(p => (p.team || '') === TEAM) : DB.people;
}
function teamCount(t){ return DB.people.filter(p => (p.team || '') === t).length; }
function setTeam(t){
  TEAM = t || '';
  try{ localStorage.setItem(KEY_TEAM, TEAM); }catch(e){}
  GFILTER = null; FILTER = 'all'; Q = '';
  render();
}
function byId(id){ return DB.people.find(p => p.id === id); }
function countStage(sid){ return people().filter(p => p.stage === sid).length; }

function filtered(){
  const q = Q.trim().toLowerCase();
  let out = people().filter(p => {
    if(FILTER !== 'all' && p.stage !== FILTER) return false;
    if(!q) return true;
    const hay = [p.name, p.phone, p.email, p.source, p.sponsor, p.memo, p.nextAction, (p.tags||[]).join(' ')]
      .join(' ').toLowerCase();
    return hay.includes(q);
  });
  out.sort((a,b) => {
    if(SORT === 'name')  return a.name.localeCompare(b.name, 'ko');
    if(SORT === 'stage') return stageIdx(b.stage) - stageIdx(a.stage) || a.name.localeCompare(b.name,'ko');
    if(SORT === 'new')   return (b.createdAt||'').localeCompare(a.createdAt||'');
    // next: 다음 할 일 빠른 순, 없는 건 뒤로
    const av = (a.nextDate || '9999-99-99') + (a.nextTime || '99:99');
    const bv = (b.nextDate || '9999-99-99') + (b.nextTime || '99:99');
    return av.localeCompare(bv) || a.name.localeCompare(b.name,'ko');
  });
  return out;
}
function todos(){
  return people()
    .filter(p => p.nextAction || p.nextDate)
    .sort((a,b) => ((a.nextDate||'9999-99-99') + (a.nextTime||'99:99'))
      .localeCompare((b.nextDate||'9999-99-99') + (b.nextTime||'99:99')));
}
function overdueCount(){
  return people().filter(p => p.nextDate && daysFromToday(p.nextDate) < 0).length;
}
function dueTodayCount(){
  return people().filter(p => p.nextDate && daysFromToday(p.nextDate) === 0).length;
}

// 섬김활동 — 사람이 남긴 기록만 (자동 기록 제외)
function allActs(){
  return people()
    .flatMap(p => (p.logs || []).map(l => ({ ...l, pid:p.id, who:p.name, stage:p.stage })))
    .filter(l => l.kind !== '시스템')
    .sort((a,b) => b.at.localeCompare(a.at));
}
function doneActs(){ return allActs().filter(l => l.kind === '완료'); }
function weekActs(){
  const from = new Date();
  from.setDate(from.getDate() - 7);
  return allActs().filter(l => new Date(l.at) >= from);
}

        n ? `'${t}'을(를) 지웁니다.\n이 팀의 고객 ${n}명은 지워지지 않고 '팀 없음'이 됩니다.`

      if(!ok) return;
      DB.people.forEach(p => { if(p.team === t) p.team = ''; });
      DB.teams = DB.teams.filter(x => x !== t);
      if(TEAM === t) setTeamQuiet('');

    if(ren){

      el.value = t; el.dataset.old = t; el.focus();
      document.getElementById('newTeamAdd').textContent = '이름 바꾸기';
    }
  };

    const el = document.getElementById('newTeam');
    const name = el.value.trim();
    const old = el.dataset.old || '';
    if(!name){ toast('팀 이름을 적어주세요'); el.focus(); return; }
    if(name !== old && DB.teams.includes(name)){ toast('이미 있는 팀입니다'); return; }

const KEY_NTC = 'crm.amway.v1.notice';   // 이미 본 메시지 번호
let NTC_LAST = null;                     // 마지막으로 받아둔 메시지

async function checkNotice(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch('notice.json?v=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const n = await r.json();
    if(!n || !n.id || !n.body) return;
    if(n.until && n.until < todayStr()) return;      // 기한이 지난 메시지는 넘어간다
    NTC_LAST = n;
    let seen = '';
    try{ seen = localStorage.getItem(KEY_NTC) || ''; }catch(e){}
    if(seen === n.id) return;                        // 이미 본 것은 다시 안 띄운다
    showNotice(n, true);
  }catch(e){ /* 인터넷이 없으면 그냥 넘어간다 */ }
}

  const img = el.querySelector('.shotimg');

    if(step === 0){ img.classList.remove('big'); img.style.width = ''; }

    el.scrollLeft = 0;

/* ============================================================
   월별 일정표 — 올려둔 그림을 보여주기만 한다
   ============================================================ */
const SCHEDS = [
  { id:'jumping', name:'점핑팀일정',     ic:'🏃', c:'--s2', b:'--s2b' },
  { id:'winners', name:'전국위너스일정', ic:'🏆', c:'--s4', b:'--s4b' },
];
const schedUrl = (ym, id) => `sched/${ym}-${id}.jpg`;
let SH_YM = '';

function thisYM(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function shiftYM(ym, n){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function ymLabel(ym){
  const [y, m] = ym.split('-').map(Number);
  return `${y}년 ${m}월`;
}

// 홈 맨 아래 — 누르면 열리는 두 칸
function schedCard(){
  const ym = thisYM(), m = +ym.slice(5);
  return `<div class="slots">${SCHEDS.map(k => `
    <button type="button" class="sbtn" data-sc="${k.id}"
      style="background:var(${k.b});border-color:var(${k.c});color:var(${k.c})">
      ${m}월 ${k.name}
    </button>`).join('')}</div>`;
}

// 크게 보기 — 가로로 펼쳐 보고 눌러서 확대한다
function openSched(kind, ym){
  SH_YM = ym || thisYM();
  const k = SCHEDS.find(x => x.id === kind) || SCHEDS[0];
  const el = document.createElement('div');
  el.className = 'shotwrap';
  el.innerHTML = `
    <div class="shotbar">
      <button type="button" class="btn sm" data-prev>◀</button>
      <b id="shTitle"></b>
      <button type="button" class="btn sm" data-next>▶</button>
      <button type="button" class="btn sm" data-x>닫기</button>
    </div>
    <div class="shotbody" id="shBody"></div>
    <div class="shothint" id="shHint"></div>`;
  document.body.appendChild(el);

  const close = () => el.remove();
  el.querySelector('[data-x]').onclick = close;
  el.querySelector('[data-prev]').onclick = () => { SH_YM = shiftYM(SH_YM, -1); drawShot(el, k); };
  el.querySelector('[data-next]').onclick = () => { SH_YM = shiftYM(SH_YM,  1); drawShot(el, k); };
  drawShot(el, k);
}

function drawShot(el, k){
  const ym = SH_YM;
  el.querySelector('#shTitle').textContent = `${+ym.slice(5)}월 ${k.name}`;
  const body = el.querySelector('#shBody');
  const hint = el.querySelector('#shHint');
  body.innerHTML = `<div class="shotload">불러오는 중…</div>`;
  hint.textContent = '';
  el.scrollTop = 0;

  const img = new Image();
  img.className = 'shotimg';
  img.alt = `${ymLabel(ym)} ${k.name}`;
  img.onload = () => {
    body.innerHTML = '';
    body.appendChild(img);
    // 화면맞춤 → 원래크기 → 두 배, 누를 때마다 커진다
    let step = 0;
    const say = () => hint.textContent = step === 0
      ? '사진을 누르면 크게 보입니다'
      : step === 1
      ? '원래 크기 · 옆으로 밀어서 보세요 (눌러서 더 크게)'
      : '두 배 크기 · 눌러서 처음으로';
    say();
    img.onclick = () => {
      step = (step + 1) % 3;
      if(step === 0){ img.classList.remove('big'); img.style.width = ''; }
      else{
        img.classList.add('big');
        img.style.width = (img.naturalWidth * (step === 1 ? 1 : 2)) + 'px';
      }
      say();
      el.scrollLeft = 0;
    };
  };
  img.onerror = () => {
    body.innerHTML = `<div class="shotnone">
      <div style="font-size:34px;margin-bottom:8px">🗓️</div>
      <b>${ymLabel(ym)} ${k.name}은 아직 없습니다</b>
      <div style="margin-top:6px;opacity:.75">올라오면 여기에서 바로 보실 수 있습니다.</div>
    </div>`;
  };
  img.src = schedUrl(ym, k.id);
}

    <h3>아직 등록된 고객이 없습니다</h3>

/* ---------- 할 일 ---------- */
// 대시보드용 — 한 줄로 짧게
function todoMini(p){
  const d = fmtDue(p.nextDate);
  const st = stageOf(p.stage);
  return `<button class="mini" data-id="${p.id}">
    <span class="mdot" style="background:var(${st.c})"></span>
    <span class="mnm">${esc(p.name)}</span>
    <span class="mtx">${p.nextAction ? esc(p.nextAction) : '섬김 내용 없음'}</span>
    <span class="due ${d.cls}">${d.txt}</span>
  </button>`;
}

function todoRow(p){
  const d = fmtDue(p.nextDate);
  const s = stageOf(p.stage);
  const n = daysFromToday(p.nextDate);
  const cls = n === null ? '' : (n < 0 ? 'overdue' : (n === 0 ? 'today' : ''));
  return `<div class="todo ${cls}">
    <div class="body">
      <div class="who">
        ${esc(p.name)}
        <span class="badge" style="background:var(${s.b});color:var(${s.c})">${s.name}</span>
        <span class="due ${d.cls}" style="margin-left:auto">${d.txt}${p.nextTime ? ' ' + fmtTimeK(p.nextTime) : ''}</span>
      </div>
      <div class="what">${p.nextAction ? esc(p.nextAction) : '<span style="color:var(--faint)">섬김 내용 없음</span>'}</div>
      <div class="tacts">
        <button class="btn sm" data-open="${p.id}">수정</button>
        <button class="btn sm" data-done="${p.id}">완료</button>
      </div>
    </div>
  </div>`;
}

// 예정 — 앞으로 챙겨야 할 것
function planBody(){
  const list = todos();
  if(!list.length){
    return `<div class="card empty">
      <div class="big">✓</div><h3>예정된 섬김활동이 없습니다</h3>
      <p>고객을 열어 섬김활동 화면에서 '다음 섬김'을 정하면 여기에 모입니다.</p>
    </div>`;
  }
  const groups = [
    ['지난 일정',   p => p.nextDate && daysFromToday(p.nextDate) < 0],
    ['오늘',       p => p.nextDate && daysFromToday(p.nextDate) === 0],
    ['이번 주',    p => { const n = daysFromToday(p.nextDate); return n !== null && n > 0 && n <= 7; }],
    ['이후 예정',  p => { const n = daysFromToday(p.nextDate); return n !== null && n > 7; }],
    ['날짜 미정',  p => !p.nextDate],
  ];
  return groups.map(([label, fn]) => {
    const g = list.filter(fn);
    if(!g.length) return '';
    return `<div class="todo-group">
      <div class="todo-head"><h3>${label}</h3><span class="n">${g.length}</span></div>
      ${g.map(todoRow).join('')}
    </div>`;
  }).join('') || '';
}

/* ---------- 고객 목록 한 사람 — 두 줄로 짧게 ---------- */
function personRows(rows){
  if(!rows.length) return `<div class="card" style="padding:40px;text-align:center;color:var(--faint);font-size:14.5px">
      조건에 맞는 고객이 없습니다</div>`;
  return rows.map(p => {
    const st = stageOf(p.stage);
    const d = fmtDue(p.nextDate);
    return `<button class="crow" data-id="${p.id}">
      <div class="crow-1">
        <span class="cnm">${esc(p.name)}</span>
        ${p.phone ? telLink(p.phone, 'row') : ''}
        <span class="badge" style="background:var(${st.b});color:var(${st.c})">${st.name}</span>
        ${p.memberNo ? `<span class="cmem">${esc(p.memberNo)}</span>` : ''}
      </div>
      <div class="crow-2">
        <span class="cact">${p.nextAction
          ? esc(p.nextAction)
          : `<span style="color:var(--faint)">다음 섬김 없음</span>`}</span>
        <span class="due ${d.cls}">${d.txt}${p.nextTime ? ' ' + fmtTimeK(p.nextTime) : ''}</span>
      </div>
    </button>`;
  }).join('');
}

/* ---------- 명부 한 줄 (명단분류용) ---------- */
function listRows(rows){
  if(!rows.length) return `<tr><td colspan="3" style="text-align:center;padding:40px;color:var(--faint)">
      이 분류에 등록된 분이 없습니다</td></tr>`;
  return rows.map(p => {
    const st = stageOf(p.stage);
    const ad = shortAddr(p.address);
    return `<tr data-id="${p.id}">
      <td class="c-nm"><span class="sdot" style="background:var(${st.c})" title="${st.name}"></span>${esc(p.name)}</td>
      <td class="c-ph">
        ${p.phone ? telLink(p.phone) : '<span style="color:var(--faint)">—</span>'}
        ${p.memberNo ? `<div class="c-mem">${esc(p.memberNo)}</div>` : ''}
      </td>
      <td class="c-ad">${ad ? esc(ad) : '<span style="color:var(--faint)">—</span>'}</td>
    </tr>`;
  }).join('');
}

/* ---------- 명단분류 탭 ---------- */
function groupCount(g){
  return people().filter(p => (p.source || NOGROUP) === g).length;
}
function viewGroups(){
  if(!people().length) return TEAM ? emptyTeam() : emptyAll();

  const names = DB.groups.slice();
  if(groupCount(NOGROUP)) names.push(NOGROUP);

  const cards = `<button class="chip ${!GFILTER ? 'on' : ''}" data-g="">전체 ${people().length}</button>` +
    names.map(g => `<button class="chip ${GFILTER === g ? 'on' : ''}" data-g="${esc(g)}">${esc(g)} ${groupCount(g)}</button>`).join('');

  const rows = GFILTER
    ? people().filter(p => (p.source || NOGROUP) === GFILTER)
    : people().slice();
  rows.sort((a,b) => a.name.localeCompare(b.name, 'ko'));

  return `
    <div class="chips" style="margin:16px 0 4px">${cards}</div>
    <div class="listhead">
      <div class="section-title" style="margin:0">${GFILTER ? esc(GFILTER) : '전체'} · ${rows.length}명</div>
      ${rows.length ? `<button class="btn sm" id="grpCsv">엑셀로 내보내기</button>` : ''}
    </div>
    <div class="tablewrap simple">
      <table>
        <thead><tr>
          <th style="width:20%">이름</th>
          <th style="width:34%">전화 · 회원번호</th>
          <th style="width:46%">주소</th>
        </tr></thead>
        <tbody>${listRows(rows)}</tbody>
      </table>
    </div>
    <div class="hint" style="margin-top:9px">이름을 누르면 그분의 섬김활동이 열립니다. 주소는 시·군·구까지만 보여드립니다.</div>`;
}

/* ---------- 섬김활동 탭 — 예정 / 기록 ---------- */
function viewActs(){
  if(!people().length) return TEAM ? emptyTeam() : emptyAll();
  const nPlan = todos().length;
  const nDone = doneActs().length;
  const sw = `<div class="chips" style="margin:18px 0 14px">
    <button class="chip ${ATAB === 'plan' ? 'on' : ''}" data-atab="plan">예정된 섬김 ${nPlan}</button>
    <button class="chip ${ATAB === 'log'  ? 'on' : ''}" data-atab="log">완료된 섬김 ${nDone}</button>
  </div>`;
  return sw + (ATAB === 'plan' ? planBody() : logBody());
}

// 완료된 섬김 — 주 단위로 세어 본다
function logBody(){
  const logs = doneActs();

  if(!logs.length){
    return `<div class="card empty">
      <div class="big">✓</div>
      <h3>아직 완료한 섬김이 없습니다</h3>
      <p>고객을 열어 다음 섬김을 정하고, 마치시면 <b>완료</b>를 눌러주세요. 여기에 쌓입니다.</p>
    </div>`;
  }

  // 이번 주 / 지난주 / 지지난주 / 그 이전
  const wk = [[], [], [], []];
  logs.forEach(l => {
    const i = weekIndex(l.at);
    wk[Math.min(Math.max(i, 0), 3)].push(l);
  });
  const HEAD  = ['이번 주 완료', '지난주 완료', '지지난주 완료', '그 이전'];
  const SHORT = ['이번 주', '지난주', '지지난주'];

  const three = wk[0].concat(wk[1], wk[2]);
  const who   = new Set(three.map(l => l.pid)).size;
  const avg   = Math.round(three.length / 3 * 10) / 10;

  const cards = [0, 1, 2].map(i =>
    `<div class="gcard ${i === 0 ? 'on' : ''}" style="cursor:default">
       <div class="gn">${SHORT[i]}</div>
       <div class="gc">${wk[i].length}<small>건</small></div>
     </div>`).join('');

  const summary = `
    <div class="wcards">${cards}</div>
    <div class="card" style="padding:14px 16px;margin:8px 0 4px;font-size:14.5px;color:var(--muted)">
      최근 3주 동안 섬김을 <strong style="color:var(--text)">${three.length}건</strong> 마치셨고,
      <strong style="color:var(--text)">${who}분</strong>을 만나셨습니다
      &nbsp;·&nbsp; 주 평균 ${avg}건
    </div>`;

  const rows = list => list.map(l => {
    const sg = stageOf(l.stage);
    return `<div class="todo" data-id="${l.pid}">
      <div class="body">
        <div class="who">${esc(l.who)}
          <span class="badge" style="background:var(${sg.b});color:var(${sg.c})">${sg.name}</span>
        </div>
        <div class="what">${esc(l.text)}</div>
      </div>
      <div class="when" style="color:var(--faint);font-weight:600">${shortDay(l.at)}</div>
    </div>`;
  }).join('');

  const groups = wk.map((list, i) => {
    if(i < 3 && !list.length){
      return `<div class="todo-group">
        <div class="todo-head"><h3>${HEAD[i]}</h3><span class="n">0</span></div>
        <div class="card" style="padding:20px;text-align:center;color:var(--faint);font-size:14px">
          ${i === 0 ? '이번 주는 아직 없습니다' : '없습니다'}
        </div>
      </div>`;
    }
    if(!list.length) return '';
    return `<div class="todo-group">
      <div class="todo-head"><h3>${HEAD[i]}</h3><span class="n">${list.length}</span></div>
      ${rows(list)}
    </div>`;
  }).join('');

  return summary + groups;
}

/* ============================================================
   모달 — 섬김활동 상세
   ============================================================ */
function closeModal(){
  document.getElementById('modal').innerHTML = '';
  OPEN = null;
}

function openDetail(id){
  const p = byId(id);
  if(!p) return;
  OPEN = id;
  const st = stageOf(p.stage);
  const next = STAGES[stageIdx(p.stage) + 1];

  // 새 고객 추가에서 적어둔 내용 — 있는 것만 보여준다
  const info = [['팀분류', p.team], ['명단분류', p.source], ['주소', p.address], ['회원번호', p.memberNo]]
    .filter(x => x[1]);

  // 적어둔 것만 모아 '특이사항' 하나로 — 빈 항목은 아예 나오지 않는다
  const bits = [];
  if((p.tags || []).length) bits.push(['관심사항',
    `<div class="tagrow">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`]);
  if(p.needs)   bits.push(['불편한 점 · 필요한 것', `<div class="nx">${esc(p.needs)}</div>`]);
  if(p.route)   bits.push(['고객동선확인', `<div class="nx">${esc(p.route)}</div>`]);
  if(p.family)  bits.push(['가족관계', `<div class="nx">${esc(p.family)}</div>`]);
  if(p.network) bits.push(['주변인맥', `<div class="nx">${esc(p.network)}</div>`]);
  if(p.memo)    bits.push(['메모',     `<div class="nx">${esc(p.memo)}</div>`]);
  const noteBox = bits.length
    ? `<div class="nbox">${bits.map(b => `<div class="nrow"><div class="nk">${b[0]}</div>${b[1]}</div>`).join('')}</div>`
    : `<div class="nbox" style="color:var(--faint);font-size:15px">아직 적은 내용이 없습니다. 위 '수정'에서 적어주세요.</div>`;

  const logs = (p.logs || []).slice().sort((a,b) => b.at.localeCompare(a.at));
  const logHtml = logs.length
    ? `<div class="timeline">` + logs.map(l => `
        <div class="log ${l.kind === '시스템' ? 'sys' : ''}">
          <div class="lh">
            <span class="kchip" style="background:var(${kindColor(l.kind)})">${esc(l.kind)}</span>
            <span class="lt">${shortDay(l.at)}</span>
            <button class="del" data-dellog="${l.id}">삭제</button>
          </div>
          <div class="lx">${esc(l.text)}</div>
        </div>`).join('') + `</div>`
    : `<div style="color:var(--faint);font-size:13.5px;padding:6px 0">아직 기록이 없습니다.</div>`;

  document.getElementById('modal').innerHTML = `
  <div class="overlay" data-close>
    <div class="modal wide">
      <div class="mhead">
        <h2>섬김활동</h2>
        <button class="btn sm" data-edit="${p.id}">수정</button>
        <button class="x" data-close>×</button>
      </div>
      <div class="mbody">
        <div class="dhero">
          <span class="avatar" style="background:${avatarColor(p.id)}">${esc(initials(p.name))}</span>
          <div style="flex:1;min-width:0">
            <div class="nm">${esc(p.name)}</div>
            <div class="meta">
              <span class="badge" style="background:var(${st.b});color:var(${st.c})">
                <span class="dot" style="background:var(${st.c})"></span>${st.name}</span>
              ${p.phone ? telLink(p.phone, 'big') : ''}
            </div>
          </div>
          ${next ? `<button class="btn sm primary" data-advance="${p.id}">${next.name}(으)로 성장 ↑</button>` : ''}
        </div>

        ${info.length ? `<div class="infoline">` +
          info.map(x => `<span><b>${x[0]}</b>${esc(x[1])}</span>`).join('') + `</div>` : ''}

        <div class="section-title" style="margin-top:0">특이사항</div>
        ${noteBox}

        <div class="section-title" style="margin-top:0">다음 섬김</div>
        <div class="dtf" style="margin-bottom:10px">
          <input type="text" id="naText" value="${esc(p.nextAction || '')}"
                 placeholder="섬김 내용 — 예: 무릎에 좋은 제품 알아봐 드리기" autocomplete="off">
        </div>
        <div class="dtrow compact">
          <label class="dtf2"><span>날짜</span><input type="date" id="naDate" value="${esc(p.nextDate || todayStr())}"></label>
          <label class="dtf2"><span>시간</span><input type="time" id="naTime" value="${esc(p.nextTime || '')}"></label>
        </div>
        <div class="dthint">시간은 안 정했으면 비워두세요</div>
        <div class="btnrow">
          <button class="btn primary" id="naSave">저장</button>
          ${p.nextAction || p.nextDate ? `<button class="btn" data-done="${p.id}">완료</button>` : ''}
          <button class="btn" id="naCal">📅 캘린더에 저장</button>
        </div>


        <div class="section-title" style="margin-top:0">활동 기록</div>
        <div class="logadd">
          <div class="logrow">
            <select id="logKind">${LOG_KINDS.map(k => `<option>${k}</option>`).join('')}</select>
            <input type="date" id="logDate" value="${todayStr()}">
          </div>
          <div class="logrow">
            <input id="logText" placeholder="무슨 이야기를 나눴는지, 무엇을 챙겨드렸는지" autocomplete="off">
            <button class="btn primary" id="logAdd">기록</button>
          </div>
        </div>
        ${logHtml}
      </div>
      <div class="mfoot">
        <button class="btn danger left" data-del="${p.id}">삭제</button>
        <button class="btn" data-close>닫기</button>
      </div>
    </div>
  </div>`;

  // 다음 할 일 저장
  const saveNext = () => {
    const t  = document.getElementById('naText').value.trim();
    const dt = document.getElementById('naDate').value;
    const tm = document.getElementById('naTime').value;
    if(!t && !dt){ toast('섬김 내용을 적어주세요'); return; }
    p.nextAction = t;
    p.nextDate   = t ? (dt || todayStr()) : '';   // 내용을 지우면 날짜도 함께 비운다
    p.nextTime   = t ? tm : '';
    save(); render(); openDetail(id);
    toast(p.nextAction ? '홈 섬김활동에 올렸습니다' : '다음 섬김을 비웠습니다');
  };
  document.querySelectorAll('#modal a.tel').forEach(a => a.onclick = tapPhone);

  document.getElementById('naSave').onclick = saveNext;

  // 캘린더 — 저장 전이라도 지금 화면에 적힌 날짜·시간으로 일정을 만든다
  const liveEvent = () => ({
    id: p.id, name: p.name, phone: p.phone,
    nextAction: document.getElementById('naText').value.trim(),
    nextDate:   document.getElementById('naDate').value,
    nextTime:   document.getElementById('naTime').value,
  });
  const calEl = document.getElementById('naCal');
  const syncCal = () => {
    calEl.classList.toggle('hide', !liveEvent().nextDate);
  };
  ['naText', 'naDate', 'naTime'].forEach(id =>
    document.getElementById(id).addEventListener('input', syncCal));
  syncCal();

  calEl.onclick = () => {
    const ev = liveEvent();
    if(!ev.nextDate){ toast('날짜를 먼저 정해주세요'); return; }
    download(icsText(ev), `섬김활동_${ev.name}_${ev.nextDate}.ics`,
      'text/calendar;charset=utf-8', '일정을 만들었습니다. 파일을 눌러 캘린더에 추가하세요');
  };
  document.getElementById('naText').addEventListener('keydown', e => { if(e.key === 'Enter') saveNext(); });

  // 활동 기록
  document.getElementById('logText').addEventListener('keydown', e => { if(e.key === 'Enter') addLog(p.id); });
  document.getElementById('logAdd').onclick = () => addLog(p.id);
}

function addLog(id){
  const p = byId(id); if(!p) return;
  const text = document.getElementById('logText').value.trim();
  if(!text){ toast('내용을 입력하세요'); return; }
  p.logs = p.logs || [];
  const ld = (document.getElementById('logDate') || {}).value;
  const at = ld && ld !== todayStr() ? new Date(ld + 'T12:00:00').toISOString() : new Date().toISOString();
  p.logs.push({ id:uid(), at, kind:document.getElementById('logKind').value, text });
  save(); openDetail(id); render();
  toast('기록했습니다');
}
// 단계가 오른 것도 쌓이는 기록이다
function growLog(p, text){
  p.logs = p.logs || [];
  p.logs.push({ id:uid(), at:new Date().toISOString(), kind:'성장', text });
}
function sysLog(p, text){
  p.logs = p.logs || [];
  p.logs.push({ id:uid(), at:new Date().toISOString(), kind:'시스템', text });
}

function teamOptions(cur){
  const list = (DB.teams || []).slice();
  if(cur && !list.includes(cur)) list.unshift(cur);
  return `<option value="">— 팀 없음 —</option>` +
    list.map(t => `<option ${t === cur ? 'selected' : ''}>${esc(t)}</option>`).join('') +
    `<option value="__new">+ 새 팀 만들기…</option>`;
}

  return `<div class="card empty" style="margin-top:24px">

}

function groupOptions(cur){
  const list = DB.groups.slice();
  if(cur && !list.includes(cur)) list.unshift(cur);
  return `<option value="">— 선택 —</option>` +
    list.map(g => `<option ${g === cur ? 'selected' : ''}>${esc(g)}</option>`).join('') +

/* ============================================================
   명단 한 번에 불러오기
   ============================================================ */
const PHONE_RE = /(01[016-9])[-.\s]?(\d{3,4})[-.\s]?(\d{4})|(0\d{1,2})[-.\s]?(\d{3,4})[-.\s]?(\d{4})/;

// 붙여넣은 글에서 한 줄에 한 분씩 이름 · 연락처 · 나머지를 갈라낸다
// 폰 연락처를 바로 고를 수 있는 기기인지 (안드로이드 크롬 등)
const CAN_PICK = !!(typeof navigator !== 'undefined' && navigator.contacts && window.ContactsManager);

// 연락처 파일(.vcf) 읽기 — 아이폰은 '연락처 공유 → 파일에 저장'으로 이 파일을 만든다
function vcUnesc(v){
  return String(v || '').replace(/\\n/gi, ' ').replace(/\\,/g, ',')
    .replace(/\;/g, ';').replace(/\\\\/g, '\\').trim();
}
function parseVCards(text){
  const lines = String(text || '').replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n');
  const out = [];
  let cur = null;
  for(const raw of lines){
    const line = raw.trim();
    if(/^BEGIN:VCARD$/i.test(line)){ cur = { name:'', phone:'', address:'', memo:'' }; continue; }
    if(/^END:VCARD$/i.test(line)){
      if(cur && (cur.name || cur.phone)) out.push(cur);
      cur = null; continue;
    }
    if(!cur) continue;
    const i = line.indexOf(':');
    if(i < 0) continue;
    const key = line.slice(0, i).split(';')[0].toUpperCase();
    const val = line.slice(i + 1);
    if(key === 'FN' && !cur.name) cur.name = vcUnesc(val);
    else if(key === 'N' && !cur.name){
      const p = val.split(';');
      cur.name = (vcUnesc(p[0]) + vcUnesc(p[1])).trim();   // 성 + 이름
    }
    else if(key === 'TEL' && !cur.phone) cur.phone = fmtPhone(vcUnesc(val));
    else if(key === 'ADR' && !cur.address){
      const p = val.split(';');                             // ;;거리;시;도;우편;나라
      cur.address = [p[4], p[3], p[2]].map(vcUnesc).filter(Boolean).join(' ');
    }
    else if(key === 'NOTE' && !cur.memo) cur.memo = vcUnesc(val);
  }
  return out;
}

// 폰 연락처에서 한 사람 고르기 (되는 기기에서만)
async function pickContact(){
  try{
    const list = await navigator.contacts.select(['name', 'tel', 'address'], { multiple: false });
    if(!list || !list.length) return null;
    const c = list[0];
    const a = (c.address && c.address[0]) || null;
    return {
      name: (c.name && c.name[0]) || '',
      phone: fmtPhone((c.tel && c.tel[0]) || ''),
      address: a ? [a.region, a.city, a.addressLine && a.addressLine.join(' ')]
        .filter(Boolean).join(' ').trim() : '',
    };
  }catch(e){ return null; }
}

function parseList(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(raw => {
    let line = raw.trim();
    if(!line) return;
    // '1.' '2)' 같은 목록 번호만 떼어낸다. '010-...' 같은 전화번호는 건드리지 않는다
    line = line.replace(/^\d{1,2}[.)]\s*/, '');

    let phone = '';
    const m = line.match(PHONE_RE);
    if(m){
      phone = fmtPhone(m[0]);
      line = line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length);
    }

    // 쉼표·탭이 있으면 그것으로, 없으면 띄어쓰기로 나눈다
    const parts = (/[\t,;|]/.test(line) ? line.split(/[\t,;|]/) : line.split(/\s+/))
      .map(t => t.trim()).filter(Boolean);

    let name = '', group = '';
    const rest = [];
    parts.forEach(t => {
      if(!name  && /^[가-힣]{2,5}$/.test(t)){ name = t;  return; }   // 한글 이름
      if(!group && DB.groups.includes(t)){    group = t; return; }   // 아는 분류면 분류로
      rest.push(t);
    });
    if(!name && rest.length) name = rest.shift();                    // 못 찾으면 첫 낱말
    if(!name && !phone) return;

    out.push({ name, phone, group, memo: rest.join(' ') });
  });
  return out;
}

   엑셀 · CSV 로 명단 불러오기
   ============================================================ */

// 표 머리글 → 우리 항목. 띄어쓰기와 기호는 지우고 견준다.
const SHEET_KEYS = [
  ['name',      ['이름','성명','고객명','성함','name']],
  ['phone',     ['연락처','전화','전화번호','휴대폰','핸드폰','휴대전화','phone','mobile','tel']],
  ['memberNo',  ['회원번호','암웨이회원번호','abo','회원no']],
  ['address',   ['주소','사는곳','거주지','address']],
  ['team',      ['팀분류','팀','팀명','레그','team']],
  ['source',    ['명단분류','분류','그룹','알게된경로','경로','group']],
  ['stageName', ['단계','상태','stage']],
  ['needs',     ['불편한점필요한것','불편한점','필요한것','니즈','불편']],
  ['route',     ['고객동선확인','고객동선','동선']],
  ['family',    ['가족관계','가족']],
  ['network',   ['주변인맥','인맥','주변']],
  ['tags',      ['관심사항','관심','태그','tag']],
  ['memo',      ['메모특이사항','특이사항','메모','비고','memo','note']],
  ['nextAction',['다음섬김','다음할일','할일']],
  ['nextDate',  ['섬김날짜','예정일','날짜']],
];
const normKey  = v => String(v == null ? '' : v).replace(/[\s()·.,\-_/]/g, '').toLowerCase();
const colIdx   = a => [...a].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
const unxml    = t => t.replace(/&lt;/g,'<').replace(/&gt;/g,'>')
                       .replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

// 엑셀이 전화번호를 숫자로 저장하면 앞의 0이 떨어진다 — 되돌린다
function sheetPhone(v){
  let t = String(v == null ? '' : v).trim();
  if(!t) return '';
  if(/^\d+$/.test(t) && t.length >= 9 && t.length <= 10) t = '0' + t;
  return fmtPhone(t);
}
// 엑셀 날짜는 1899-12-30 부터 센 숫자다
function sheetDate(v){
  const t = String(v == null ? '' : v).trim();
  if(!t) return '';
  if(/^\d{5}(\.\d+)?$/.test(t)){
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(parseFloat(t)) * 86400000);
    return d.toISOString().slice(0, 10);
  }
  const m = t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
}

// 쉼표 · 탭 · 세미콜론 어느 것으로 나뉘어 있어도 읽는다
function parseCsv(text){
  const t = String(text).replace(/^﻿/, '');
  const head = t.split(/\r?\n/)[0] || '';
  const cnt = c => (head.split(c).length - 1);
  const d = cnt('\t') > cnt(',') ? '\t' : cnt(';') > cnt(',') ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){
      if(c === '"'){ if(t[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }
    else if(c === '"') q = true;
    else if(c === d){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r') cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

// .xlsx 는 zip 파일이다 — 브라우저가 풀어준다
async function unzip(buf){
  const v = new DataView(buf), u = new Uint8Array(buf), dec = new TextDecoder();
  let eo = -1;
  for(let i = u.length - 22; i >= 0 && i > u.length - 65558; i--){
    if(v.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  }
  if(eo < 0) throw new Error('엑셀 파일이 아닌 것 같습니다');
  const cnt = v.getUint16(eo + 10, true);
  let p = v.getUint32(eo + 16, true);
  const out = {};
  for(let i = 0; i < cnt; i++){
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true),
          nLen = v.getUint16(p + 28, true), eLen = v.getUint16(p + 30, true),
          cLen = v.getUint16(p + 32, true), off  = v.getUint32(p + 42, true);
    const name = dec.decode(u.subarray(p + 46, p + 46 + nLen));
    const lnLen = v.getUint16(off + 26, true), leLen = v.getUint16(off + 28, true);
    const start = off + 30 + lnLen + leLen;
    const raw = u.subarray(start, start + size);
    if(name === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(name)){
      out[name] = method === 0 ? raw : await inflateRaw(raw);
    }
    p += 46 + nLen + eLen + cLen;
  }
  return out;
}
async function inflateRaw(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

async function xlsxToGrid(buf){
  const files = await unzip(buf);
  const dec = b => new TextDecoder().decode(b);
  const texts = x => (x.match(/<t[^>]*>[\s\S]*?<\/t>/g) || [])
                       .map(t => unxml(t.replace(/<[^>]+>/g, ''))).join('');
  const shared = [];
  if(files['xl/sharedStrings.xml']){
    (dec(files['xl/sharedStrings.xml']).match(/<si[\s\S]*?<\/si>/g) || [])
      .forEach(si => shared.push(texts(si)));
  }
  const sheet = Object.keys(files)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a, b) => (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]))[0];
  if(!sheet) throw new Error('엑셀 안에 표가 없습니다');
  const grid = [];
  (dec(files[sheet]).match(/<row[\s\S]*?<\/row>/g) || []).forEach(rw => {
    const row = [];
    (rw.match(/<c[\s\S]*?(\/>|<\/c>)/g) || []).forEach(c => {
      const ref = (c.match(/r="([A-Z]+)/) || [])[1];
      const ci  = ref ? colIdx(ref) : row.length;
      const ty  = (c.match(/t="([^"]+)"/) || [])[1];
      let val = '';
      if(ty === 'inlineStr') val = texts(c);
      else {
        const m = c.match(/<v>([\s\S]*?)<\/v>/);
        val = m ? unxml(m[1]) : '';
        if(ty === 's') val = shared[+val] || '';
      }
      row[ci] = val;
    });
    grid.push(row);
  });
  return grid;
}

async function readSheetFile(f){
  const n = f.name.toLowerCase();
  if(n.endsWith('.xls'))
    throw new Error('예전 엑셀(.xls)은 못 읽습니다. 엑셀에서 .xlsx 나 CSV 로 저장해 주세요.');
  if(n.endsWith('.xlsx') || n.endsWith('.xlsm')){
    if(typeof DecompressionStream === 'undefined')
      throw new Error('이 브라우저는 엑셀을 바로 못 엽니다. 엑셀에서 CSV 로 저장해 주세요.');
    return xlsxToGrid(await f.arrayBuffer());
  }
  return parseCsv(await f.text());
}

// 표 → 사람 목록. 첫 줄이 머리글이면 열 이름을 보고 맞춘다.
function gridToRows(grid){
  const rows = grid.filter(r => (r || []).some(c => String(c == null ? '' : c).trim()));
  if(!rows.length) return [];
  const head = (rows[0] || []).map(normKey);
  const map = {};
  SHEET_KEYS.forEach(([k, names]) => {
    const i = head.findIndex(h => h && (names.includes(h) ||
      names.some(n => n.length > 1 && h.includes(n))));
    if(i >= 0 && map[k] === undefined) map[k] = i;
  });
  const titled = Object.keys(map).length >= 2;      // 머리글로 볼 만한가
  const body = titled ? rows.slice(1) : rows;
  if(!titled){ map.name = 0; map.phone = 1; map.source = 2; map.memo = 3; }
  return body.map(r => {
    const g = k => map[k] === undefined ? '' : String((r || [])[map[k]] == null ? '' : r[map[k]]).trim();
    return {
      name:g('name'), phone:sheetPhone(g('phone')), group:g('source'), team:g('team'),
      memberNo:g('memberNo'), address:g('address'), needs:g('needs'), route:g('route'),
      family:g('family'), network:g('network'), tags:g('tags'), memo:g('memo'),
      nextAction:g('nextAction'), nextDate:sheetDate(g('nextDate')), stageName:g('stageName'),
    };
  }).filter(o => o.name || o.phone);
}

// 이름·연락처·메모 말고 더 읽어온 게 있으면 알려준다
function extraNote(rows){
  const KEYS = [['team','팀분류'],['memberNo','회원번호'],['address','주소'],['stageName','단계'],
    ['needs','불편한 점'],['route','고객동선확인'],['family','가족관계'],
    ['network','주변인맥'],['tags','관심사항'],['nextAction','다음섬김']];
  const found = KEYS.filter(k => rows.some(r => r[k[0]])).map(k => k[1]);
  return found.length
    ? `<br><b style="color:var(--accent)">${found.join(' · ')}</b> 도 함께 들어갑니다.`
    : '';
}

function commitImport(){
  const els = [...document.querySelectorAll('#impRows .irow')];
  const stage = document.getElementById('impStage').value;
  const gsel  = document.getElementById('impGroup').value;
  const tsel  = document.getElementById('impTeam').value;
  let n = 0;
  els.forEach(el => {
    const o = {};
    el.querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value.trim());
    if(!o.name && !o.phone) return;
    const m = IMP_MORE[+el.dataset.ix] || {};
    const src = gsel || el.dataset.grp || '';
    if(src && !DB.groups.includes(src)) DB.groups.push(src);
    const tm = tsel || m.team || TEAM || '';
    if(tm && !DB.teams.includes(tm)) DB.teams.push(tm);
    const byName = (STAGES.find(x => x.name === (m.stageName || '').trim()) || {}).id;
    const rec = {
      id:uid(), createdAt:new Date().toISOString(), logs:[],
      name:o.name || '(이름 없음)', phone:fmtPhone(o.phone), stage: byName || stage,
      team: tsel || m.team || TEAM || '',
      memberNo:m.memberNo || '', address:m.address || '', source:src,
      tags:(m.tags || '').split(/[,·]/).map(t => t.trim()).filter(Boolean),
      needs:m.needs || '', route:m.route || '', family:m.family || '',
      network:m.network || '', memo:o.memo || '',
      nextAction:m.nextAction || '', nextDate:m.nextDate || '',
    };
    sysLog(rec, '명단에서 한 번에 등록');
    DB.people.push(rec);
    n++;
  });
  if(!n){ toast('추가할 사람이 없습니다'); return; }
  save(); closeModal(); render();
  toast(`${n}명을 추가했습니다`);
}

const CSV_COLS = [
  ['name','이름'],['team','팀분류'],['stageName','단계'],['phone','연락처'],['memberNo','회원번호'],
  ['address','주소'],['source','명단분류'],
  ['needs','불편한점·필요한것'],['route','고객동선확인'],
  ['family','가족관계'],['network','주변인맥'],
  ['tagsStr','관심사항'],['memo','메모(특이사항)'],
  ['nextAction','다음섬김'],['nextDate','섬김날짜'],['nextTime','섬김시간'],
  ['createdDate','등록일'],['logCount','활동수'],
];
function csvCell(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportCSV(){
  if(!DB.people.length){ toast('내보낼 데이터가 없습니다'); return; }
  const rows = DB.people.map(p => ({
    ...p,
    stageName: stageOf(p.stage).name,
    tagsStr: (p.tags||[]).join(' / '),
    createdDate: (p.createdAt||'').slice(0,10),
    logCount: (p.logs||[]).length,
  }));
  const csv = [CSV_COLS.map(c => c[1]).join(',')]
    .concat(rows.map(r => CSV_COLS.map(c => csvCell(r[c[0]])).join(',')))
    .join('\r\n');
  download('﻿' + csv, `섬김명단_${todayStr()}.csv`, 'text/csv;charset=utf-8', '엑셀 파일을 저장했습니다');
}
function daysSinceBackup(){
  if(!DB.lastBackup) return null;
  return Math.floor((Date.now() - new Date(DB.lastBackup)) / 86400000);
}
function exportJSON(){
  DB.lastBackup = new Date().toISOString();
  save();
  download(JSON.stringify(DB, null, 2), `섬김노트_백업_${todayStr()}.json`, 'application/json', '백업 파일을 저장했습니다');
  render();
}
function download(text, filename, mime, okMsg){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(okMsg);
}
function importJSON(file){
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.people)) throw new Error('형식 오류');
      migrate(d);
      const yes = await askConfirm(
        `백업 파일에 ${d.people.length}명이 들어 있습니다.\n지금 자료(${DB.people.length}명)를 이 내용으로 덮어쓸까요?`, '되살리기');
      if(!yes) return;
      DB = { people: d.people, groups: d.groups, growth: d.growth || DB.growth, updatedAt: null };
      save(); closeModal(); render();
      toast(`${d.people.length}명을 불러왔습니다`);
    }catch(e){
      toast('파일을 읽을 수 없습니다 — 백업 JSON이 맞는지 확인하세요');
    }
  };
  r.readAsText(file);
}

  document.getElementById('doUpgrade').onclick = () => {

    bakEl.style.borderColor = 'var(--accent)';

  v.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { ATAB = b.dataset.atab; render(); });

// 글씨 크기 — 화면 전체를 단계별로 키운다
const ZOOM_KEY = 'crm.zoom';
const ZOOM_STEPS = [0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
const ZOOM_HOME = 2;                       // 100% 자리
let zoomIdx = ZOOM_HOME;
function applyZoom(i, tell){
  const n = Math.max(0, Math.min(ZOOM_STEPS.length - 1, i));
  if(tell && n === zoomIdx){
    toast(n === 0 ? '가장 작은 크기입니다' : '가장 큰 크기입니다');
    return;
  }
  zoomIdx = n;
  document.documentElement.style.zoom = ZOOM_STEPS[zoomIdx];
  try{ localStorage.setItem(ZOOM_KEY, String(ZOOM_STEPS[zoomIdx])); }catch(e){}
  if(tell) toast('글씨 크기 ' + Math.round(ZOOM_STEPS[zoomIdx] * 100) + '%');
}
try{
  const saved = parseFloat(localStorage.getItem(ZOOM_KEY));
  const i = ZOOM_STEPS.indexOf(saved);
  applyZoom(i >= 0 ? i : ZOOM_HOME, false);
}catch(e){ applyZoom(ZOOM_HOME, false); }
document.getElementById('btnZoomIn').onclick  = () => applyZoom(zoomIdx + 1, true);
document.getElementById('btnZoomOut').onclick = () => applyZoom(zoomIdx - 1, true);

// 테마
const THEME_KEY = 'crm.theme';
function applyTheme(t){
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
try{ applyTheme(localStorage.getItem(THEME_KEY) || 'auto'); }catch(e){}
document.getElementById('btnTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  const nxt = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
  applyTheme(nxt);
  try{ localStorage.setItem(THEME_KEY, nxt); }catch(e){}
  toast(nxt === 'auto' ? '시스템 설정 따름' : (nxt === 'light' ? '밝은 화면' : '어두운 화면'));
};

// 단축키
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if(typing) return;
  if(e.key === 'n' || e.key === 'ㅜ'){ e.preventDefault(); openForm(); }
  if(e.key === '/'){ e.preventDefault(); VIEW = 'list'; render(); document.getElementById('q')?.focus(); }
});

render();

<script>
/* ============================================================
   고객구분 자동 상향·하향 — 섬김활동 기록으로 단계를 정한다
   수동으로 바꾼 단계는 기준이 바뀔 때까지 그대로 둔다.
   ============================================================ */
(function(){
"use strict";
const BUY   = ['제품첫구매','제품재구매','제품 구매','재구매'];
const REBUY = ['제품재구매','재구매'];
const LEARN = {'자료제공':3, '미팅참석':2, '음원프로모션':1};
const ymOf = d => { const x = new Date(d); return x.getFullYear()*12 + x.getMonth(); };

const CRITERIA = [
  {id:'prospect', name:'예상고객',  rule:'입력한 모든 분. 아직 제품을 사지 않은 예상고객입니다.', keep:''},
  {id:'consumer', name:'소비자',    rule:'제품첫구매 또는 제품재구매 기록이 한 번이라도 있는 분.', keep:'한 번 소비자는 계속 소비자로 남습니다.'},
  {id:'active',   name:'이달소비자', rule:'소비자 중 이번 달에 제품을 산 분.', keep:'이번 달 구매가 없으면 소비자로 내려갑니다.'},
  {id:'learner',  name:'학습소비자', rule:'이달소비자 중 누적 자료제공 3회 · 미팅참석 2회 · 음원프로모션 1회 이상인 분.', keep:'두 달 연속 구매도 없고 자료제공·미팅참석·음원프로모션도 없으면 내려갑니다.'},
  {id:'loyal',    name:'애용자',    rule:'학습소비자 중 누적 제품재구매 10회 이상이고 두 달 연속 산 분.', keep:'두 달 연속 구매가 끊기면 내려갑니다.'},
  {id:'partner',  name:'사업자',    rule:'미팅참석 누적 10회 이상, 매달 제품재구매, 섬김성장노트를 쓰는 분 (고객 정보 수정에서 체크).', keep:'매달 구매가 끊기면 내려갑니다.'}
];

function calc(p){
  const now = ymOf(new Date());
  const buyM = new Set(), learnM = new Set();
  let buys = 0, rebuy = 0, meet = 0;
  const learn = {'자료제공':0, '미팅참석':0, '음원프로모션':0};
  (p.logs || []).forEach(l => {
    if(!l || !l.at || !l.kind) return;
    const m = ymOf(l.at);
    if(BUY.includes(l.kind)){ buys++; buyM.add(m); if(REBUY.includes(l.kind)) rebuy++; }
    if(l.kind in learn){ learn[l.kind]++; learnM.add(m); }
    if(l.kind === '미팅참석') meet++;
  });
  const b0 = buyM.has(now), b1 = buyM.has(now-1), b2 = buyM.has(now-2);
  const consec = (b0 && b1) || (b1 && b2);                 // 이번 달은 아직 진행 중이라 지난 두 달도 인정
  const learnOK = Object.keys(LEARN).every(k => learn[k] >= LEARN[k]);
  const recent = b0 || b1 || learnM.has(now) || learnM.has(now-1);
  if(buys === 0) return 'prospect';
  if(meet >= 10 && consec && p.noteUser) return 'partner';
  if(learnOK && rebuy >= 10 && consec) return 'loyal';
  if(learnOK && recent) return 'learner';
  if(b0) return 'active';
  return 'consumer';
}

function applyAll(){
  if(typeof DB === 'undefined' || !DB || !Array.isArray(DB.people)) return false;
  let changed = false;
  if(!DB.nameCleaned && window.cleanContactName){            // 한 번만: 등록된 분들도 이름만 남긴다
    DB.people.forEach(p => { const n = cleanContactName(p.name); if(n && n !== p.name){ p.name = n; } });
    DB.nameCleaned = true; changed = true;
  }
  DB.people.forEach(p => {
    if(p.stage === 'core'){ p.stage = 'partner'; changed = true; }          // 코어사업자는 없어졌다
    if(!STAGES.some(s => s.id === p.stage)){ p.stage = 'prospect'; changed = true; }
    const a = calc(p);
    const setStage = (why) => {
      if(p.stage === a) return;
      const up = stageIdx(a) > stageIdx(p.stage);
      p.logs = p.logs || [];
      p.logs.push({ id:uid(), at:new Date().toISOString(), kind:'성장',
        text:`${stageOf(p.stage).name} → ${stageOf(a).name} (${why} 자동 ${up ? '상향' : '하향'})` });
      p.stage = a;
    };
    if(p.stageAuto === undefined){                       // 처음 한 번: 기준이 더 높으면 올리고, 손으로 올려둔 단계는 지키지 않고 내리지 않는다
      if(stageIdx(a) > stageIdx(p.stage)) setStage('기준에 따라');
      p.stageAuto = a; changed = true; return;
    }
    if(a === p.stageAuto) return;
    const down = stageIdx(a) < stageIdx(p.stageAuto);   // 기준에서 내려간 사건이면 손으로 올린 단계도 내린다
    if(down || stageIdx(a) > stageIdx(p.stage)) setStage('기준에 따라');
    p.stageAuto = a; changed = true;
  });
  return changed;
}

function showCriteria(){
  document.getElementById('modal').innerHTML = `
  <div class="overlay" data-close>
    <div class="modal">
      <div class="mhead"><h2>고객구분 기준</h2><button class="x" data-close>×</button></div>
      <div class="mbody">
        <div style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:14px">
          섬김활동 기록(제품첫구매 · 제품재구매 · 자료제공 · 미팅참석 · 음원프로모션)을 보고
          <b style="color:var(--text)">자동으로 올리고 내립니다.</b> 손으로 바꾼 단계는 기준이 달라질 때까지 그대로 둡니다.
        </div>
        ${CRITERIA.map((c, i) => { const st = stageOf(c.id); return `
        <div class="crit">
          <div class="crit-h"><span class="badge" style="background:var(${st.b});color:var(${st.c})">${i+1}. ${c.name}</span></div>
          <div class="crit-r">${c.rule}</div>
          ${c.keep ? `<div class="crit-k">↓ ${c.keep}</div>` : ''}
        </div>`; }).join('')}
      </div>
      <div class="mfoot"><button class="btn" data-close>닫기</button></div>
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  if(e.target.closest('[data-criteria]')) showCriteria();
});
window.STAGE_AUTO = { calc, applyAll, showCriteria, CRITERIA };

window.cleanContactName = function(raw){
  const s = String(raw || '').replace(/[0-9\-+()~·,.:/#]+/g, ' ').replace(/\s+/g, ' ').trim();
  const tok = s.split(' ').filter(Boolean);
  if(!tok.length) return String(raw || '').trim();

  return s;
};

const PKEY = 'crm.pendingCall';
const digits = s => String(s || '').replace(/\D/g, '');
const tail8 = s => digits(s).slice(-8);
let leftApp = false, promptTimer = null;
function findByTel(href, el){
  const t = tail8(href);
  let p = null;
  if(t) p = DB.people.find(x => tail8(x.phone) === t) || null;
  if(!p && el){ const host = el.closest('[data-id]'); if(host) p = byId(host.dataset.id) || null; }
  if(!p && typeof OPEN !== 'undefined' && OPEN) p = byId(OPEN) || null;
  return p;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="tel:"]');
  if(!a) return;
  const p = findByTel(a.getAttribute('href'), a);
  if(!p) return;
  try{ localStorage.setItem(PKEY, JSON.stringify({pid:p.id, at:Date.now()})); }catch(e){}
  leftApp = false;
  clearTimeout(promptTimer);
  promptTimer = setTimeout(() => { if(!leftApp) askCall(); }, 4000);     // 컴퓨터처럼 앱을 벗어나지 않는 경우
}, true);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ if(pending()) leftApp = true; return; }
  if(leftApp){ leftApp = false; clearTimeout(promptTimer); setTimeout(askCall, 400); }
});
window.addEventListener('pageshow', () => { if(pending() && Date.now() - pending().at > 3000) setTimeout(askCall, 600); });
function pending(){
  try{ const v = JSON.parse(localStorage.getItem(PKEY) || 'null'); if(v && Date.now() - v.at < 3*3600e3) return v; }catch(e){}
  return null;
}
const clearPending = () => { try{ localStorage.removeItem(PKEY); }catch(e){} };
function askCall(){
  const v = pending(); if(!v) return;
  const p = byId(v.pid); if(!p){ clearPending(); return; }
  if(document.getElementById('callAsk')) return;
  const el = document.createElement('div');
  el.id = 'callAsk'; el.className = 'callask';
  el.innerHTML = `<div class="t">📞 <b>${esc(p.name)}</b> 님과 통화하셨나요?</div>

      <button type="button" class="btn" data-no>나중에</button></div>`;
  document.body.appendChild(el);
  el.querySelector('[data-yes]').onclick = () => { clearPending(); el.remove(); open({pid:p.id, kind:'통화', expandInfo:true}); };
  el.querySelector('[data-no]').onclick = () => { clearPending(); el.remove(); };
}
if(pending() && Date.now() - pending().at > 3000) setTimeout(askCall, 800);      // 앱이 새로 열린 경우

const iname = v => (typeof v === 'string' ? v : (v && v.n) || '').trim();
const imemo = v => (typeof v === 'string' ? '' : (v && v.m) || '').trim();
function put(date, id, val){
  const r = G.log[date] || (G.log[date] = {});
  const empty = id === 'audio'
    ? !(val.title||'').trim() && !(val.msg||'').trim()
    : !val.filter(iname).length;
  if(empty) delete r[id]; else r[id] = val;
  if(!Object.keys(r).length) delete G.log[date];
  gsave();
}
/* 섬김노트(고객목록)의 활동 기록 — 읽기만 한다 */
let CRM_IDX = null, CRM_STAMP = '';
function crmIndex(){
  const db = (typeof DB !== 'undefined' && DB && Array.isArray(DB.people)) ? DB : null;
  const stamp = db ? (db.updatedAt || '') + ':' + db.people.length : '';
  if(CRM_IDX && stamp === CRM_STAMP) return CRM_IDX;
  const idx = {};
  if(db) db.people.forEach(p => (p.logs || []).forEach(l => {
    if(!l || !l.at) return;
    const d = ymd(new Date(l.at));
    (idx[d] = idx[d] || []).push({name:p.name, pid:p.id, kind:l.kind, text:l.text || ''});
  }));
  CRM_IDX = idx; CRM_STAMP = stamp;
  return idx;
}
const crmOn = (date, c) => (crmIndex()[date] || []).filter(x => c.kinds.includes(x.kind));

function dayN(date, c){
  if(c.kind === 'crm'){
    const items = crmOn(date, c);
    return c.distinct ? new Set(items.map(x => x.pid)).size : items.length;
  }
  const r = rec(date);
  if(!r || !r[c.id]) return 0;
  if(c.id === 'audio') return (r.audio.title||'').trim() && (r.audio.msg||'').trim() ? 1 : 0;
  return r[c.id].filter(iname).length;
}
function sumR(c, f, t){
  if(c.distinct){
    const set = new Set();
    for(let d = pd(f); ymd(d) <= t; d = addD(d,1)){
      if(c.kind === 'crm') crmOn(ymd(d), c).forEach(x => set.add(x.pid));
      else ((rec(ymd(d)) || {})[c.id] || []).forEach(v => { const n = iname(v); if(n) set.add(n); });
    }
    return set.size;
  }
  let s = 0;
  for(let d = pd(f); ymd(d) <= t; d = addD(d,1)) s += dayN(ymd(d), c);
  return s;
}
function rate(c, f, t){
  if(c.cadence === 'daily'){
    let s = 0, n = 0;
    for(let d = pd(f); ymd(d) <= t; d = addD(d,1)){ s += Math.min(dayN(ymd(d),c)/c.target,1); n++; }
    return n ? s/n : 0;
  }
  if(c.cadence === 'weekly'){
    let acc = 0, w = 0, ws = weekStart(pd(f));
    while(ymd(ws) <= t){
      const a = ymd(ws) < f ? f : ymd(ws);
      const b = ymd(addD(ws,6)) > t ? t : ymd(addD(ws,6));
      const days = Math.round((pd(b)-pd(a))/864e5)+1;
      acc += Math.min(sumR(c,a,b)/Math.max(1, Math.ceil(c.target*days/7)), 1); w++;
      ws = addD(ws,7);
    }
    return w ? acc/w : 0;
  }
  const total = dim(pd(f).getFullYear(), pd(f).getMonth());
  const days = Math.round((pd(t)-pd(f))/864e5)+1;
  const goal = goalOf(c, pd(f).getFullYear(), pd(f).getMonth());
  return Math.min(sumR(c,f,t)/Math.max(1, Math.ceil(goal*days/total)), 1);
}
function score(f, t){
  let a = 0, b = 0;
  cores().forEach(c => { a += c.w*rate(c,f,t); b += c.w; });
  return b ? Math.round(a/b*100) : 0;
}
function dayScore(d){
  const cs = cores().filter(c => c.cadence === 'daily');
  let a = 0, b = 0;
  cs.forEach(c => { a += c.w*Math.min(dayN(d,c)/c.target,1); b += c.w; });
  return b ? Math.round(a/b*100) : 0;
}
const full = d => cores().filter(c => c.cadence === 'daily').every(c => dayN(d,c) >= c.target);
function streak(){
  let n = 0, d = new Date(T0);
  if(!full(ymd(d))) d = addD(d,-1);
  while(full(ymd(d))){ n++; d = addD(d,-1); }
  return n;
}
function longest(f,t){
  let best = 0, run = 0;
  for(let d = pd(f); ymd(d) <= t; d = addD(d,1)){
    if(full(ymd(d))){ run++; best = Math.max(best,run); } else run = 0;
  }
  return best;
}
function grade(s){
  if(s >= 90) return {k:'S', t:'다이아 실행'};
  if(s >= 80) return {k:'A', t:'골드 실행'};
  if(s >= 65) return {k:'B', t:'실버 실행'};
  if(s >= 50) return {k:'C', t:'브론즈 실행'};
  return {k:'D', t:'리빌드 구간'};
}
function mrange(y,m){
  const f = `${y}-${pad(m+1)}-01`;
  const last = `${y}-${pad(m+1)}-${pad(dim(y,m))}`;
  return {f, t: last > TS ? TS : last, ended: last <= TS, y, m};
}
function plan(y,m){
  const k = mk(y,m);
  if(!G.plans[k]) G.plans[k] = {goals:{}, vow:'', actions:['','','']};
  const p = G.plans[k];
  p.goals = p.goals || {}; p.actions = p.actions || ['','',''];
  return p;
}
const goalOf = (c,y,m) => plan(y,m).goals[c.id] || c.base(dim(y,m));
function pace(c,y,m){
  const R = mrange(y,m), total = dim(y,m);
  const done = sumR(c,R.f,R.t), goal = goalOf(c,y,m);
  const el = Math.round((pd(R.t)-pd(R.f))/864e5)+1;
  const left = Math.max(0, total-el);
  return {done, goal, left,
    running:(y === T0.getFullYear() && m === T0.getMonth()),
    proj: el ? Math.round(done/el*total) : 0,
    need: left > 0 ? Math.ceil(Math.max(0, goal-done)/left) : 0,
    pct: goal ? Math.min(done/goal,1)*100 : 0,
    exp: goal ? Math.min(el/total,1)*100 : 0};
}
function achieve(y,m,useBase){
  const R = mrange(y,m); let a = 0, b = 0;
  cores().forEach(c => {
    const done = sumR(c, R.f, R.t), goal = useBase ? c.base(dim(y,m)) : goalOf(c,y,m);
    a += c.w*Math.min(done/Math.max(1,goal), 1); b += c.w;
  });
  return b ? Math.round(a/b*100) : 0;
}
const fmtN = n => Number(n || 0).toLocaleString('ko-KR');
const col = s => s >= 80 ? 'var(--accent)' : s >= 50 ? 'var(--s4)' : 'var(--danger)';
const delta = (v,u) => `<span class="gx-d ${v>0?'up':v<0?'dn':''}">${v>0?'▲ +'+v+u:v<0?'▼ '+Math.abs(v)+u:'– 유지'}</span>`;

function coreBlock(c){
  const r = rec(SEL) || {};
  let pg, lb;
  if(c.cadence === 'daily'){ const n = dayN(SEL,c); pg = Math.min(n/c.target,1); lb = `${n} / ${c.target}${c.unit}`; }
  else if(c.cadence === 'weekly'){
    const ws = weekStart(pd(SEL));
    const s = sumR(c, ymd(ws), ymd(addD(ws,6)));
    pg = Math.min(s/c.target,1); lb = `${s} / ${c.target}${c.unit}`;
  }else{
    const d = pd(SEL), R = mrange(d.getFullYear(), d.getMonth());
    const s = sumR(c,R.f,R.t), g = goalOf(c,d.getFullYear(),d.getMonth());
    pg = g ? Math.min(s/g,1) : 0; lb = `${s} / ${g}${c.unit}`;
  }
  let body = '';
  if(c.kind === 'audio'){
    const v = r.audio || {title:'', msg:''};
    body = `<div class="gx-row2">
      <input type="text" data-gaud="title" value="${E(v.title||'')}" placeholder="음원 제목">
      <input type="text" data-gaud="msg" value="${E(v.msg||'')}" placeholder="아침 메시지 한 문장"></div>`;
  }else if(c.kind === 'crm'){
    const items = crmOn(SEL, c);
    body = `<div class="gx-auto">섬김활동의 <b>${c.hint}</b> 기록에서 자동 저장</div>` +
      (items.length ? `<div class="gx-items">${items.map(x =>
          `<span class="gx-item"><small>${E(x.kind)}</small> <b>${E(x.name)}</b>${x.text ? ' ' + E(x.text) : ''}</span>`).join('')}</div>` : '');
  }else if(c.kind === 'pairs'){
    const v = r[c.id] || [];
    const n = Math.max(c.rows, v.length);
    let rows = '';
    for(let i = 0; i < n; i++){
      rows += `<div class="gx-pair" data-gpr="${c.id}">
        <span>${i+1}</span>
        <input type="text" data-gp="n" value="${E(iname(v[i]))}" placeholder="${E(c.ph)}">
        <input type="text" data-gp="m" value="${E(imemo(v[i]))}" placeholder="${E(c.ph2)}"></div>`;
    }
    body = rows + `<button class="gx-more" data-gmore="${c.id}">＋ 한 명 더</button>`;
  }else{
    const v = r[c.id] || [];
    body = `<div class="gx-add"><input type="text" data-gnew="${c.id}" placeholder="${E(c.ph)}">
      <button class="btn sm" data-gaddbtn="${c.id}">추가</button></div>
      ${v.length ? `<div class="gx-tags">${v.map((t,i) =>
        `<span class="gx-tag">${E(iname(t))}<button data-gdel="${c.id}" data-i="${i}">×</button></span>`).join('')}</div>`
        : '<div class="gx-empty">아직 입력이 없습니다.</div>'}`;
  }
  return `<div class="gx-core ${c.kind === 'crm' ? 'auto' : ''}">
    <div class="gx-ch"><span class="no">${c.no}</span><b>${E(c.name)}</b>
      <span class="gx-chip">${CAD[c.cadence]}</span>
      <span class="st ${pg>=1?'done':''}">${lb}<i class="mini"><u style="width:${pg*100}%"></u></i></span></div>
    ${body}</div>`;
}

function week(){
  const ws = weekStart(pd(SEL));

    const d = addD(ws,i), s = ymd(d), fut = s > TS;
    const v = fut ? 0 : dayScore(s);
    out += `<button class="gx-day ${s===SEL?'on':''} ${fut?'fut':''}" data-gday="${s}" ${fut?'disabled':''}>
      <span class="w">${WD[i]}</span><span class="n">${d.getDate()}</span>
      <span class="b"><i style="height:${fut?0:Math.max(v,2)}%;background:${col(v)}"></i></span>
      <span class="s">${fut?'–':v}</span></button>`;
  }
  return out;
}
/* ── 성장활동 — 항목별 월간 내역 ── */
const GTYPES = [
  {id:'audio',    ic:'🎧', name:'음원',     core:'audio', field:'title'},
  {id:'msg',      ic:'💬', name:'메세지',   core:'audio', field:'msg'},

let GSEL = 'audio';
let GMON = {y:T0.getFullYear(), m:T0.getMonth()};
const gType = () => GTYPES.find(x => x.id === GSEL) || GTYPES[0];
function gEntries(t, R){
  const c = CORES.find(x => x.id === t.core), out = [];
  for(let d = pd(R.t); ymd(d) >= R.f; d = addD(d,-1)){
    const ds = ymd(d);
    if(c.kind === 'crm'){
      crmOn(ds, c).forEach(x => out.push({d:ds, k:x.kind, text:x.name + (x.text ? ' · ' + x.text : '')}));
    }else if(c.kind === 'audio'){
      const a = (rec(ds) || {}).audio, v = a && (a[t.field] || '').trim();
      if(v) out.push({d:ds, text:v});
    }else{
      ((rec(ds) || {})[c.id] || []).forEach(v => {
        const n = iname(v); if(n) out.push({d:ds, text:n + (imemo(v) ? ' · ' + imemo(v) : '')});
      });
    }
  }
  return out;
}
function gHistText(){
  const t = gType(), R = mrange(GMON.y, GMON.m), L = gEntries(t, R);
  return [`[${GMON.y}년 ${GMON.m+1}월 ${t.name} 내역] ${G.name || ''} · ${L.length}건`,
    ...L.map(e => { const d = pd(e.d); return `${d.getMonth()+1}.${d.getDate()} ${WD[(d.getDay()+6)%7]} · ${e.k ? e.k + ' ' : ''}${e.text}`; })
  ].join('\n');
}
function vGrow(){
  const t = gType(), c = CORES.find(x => x.id === t.core);
  const {y,m} = GMON, R = mrange(y,m);
  const now = (y === T0.getFullYear() && m === T0.getMonth());
  const list = gEntries(t, R), P = pace(c, y, m);
  const done = c.kind === 'audio' ? new Set(list.map(e => e.d)).size : P.done;
  const goal = P.goal, pct = goal ? Math.min(done/goal,1)*100 : 0;
  const days = new Set(list.map(e => e.d)).size;
  const auto = c.kind === 'crm';
  const byD = new Map();
  list.forEach(e => { if(!byD.has(e.d)) byD.set(e.d, []); byD.get(e.d).push(e); });
  const rows = [...byD.entries()].map(([ds, es]) => {
    const d = pd(ds);
    return `<div class="gx-hist"><div class="h"><b>${d.getMonth()+1}.${d.getDate()}</b><span>${WD[(d.getDay()+6)%7]}</span><small>${es.length}건</small></div>
      <div class="b">${es.map(e => `<div class="e">${e.k ? `<i>${E(e.k)}</i>` : ''}${E(e.text)}</div>`).join('')}</div></div>`;
  }).join('');
  return `
  <div class="gx-types">${GTYPES.map(x => {
    const isAuto = CORES.find(k => k.id === x.core).kind === 'crm';
    return `<button class="gx-type ${x.id === GSEL ? 'on' : ''} ${isAuto ? 'auto' : ''}" data-gtype="${x.id}"><span>${x.ic}</span>${x.name}</button>`;
  }).join('')}</div>
  <div class="gx-datebar">
    <button class="btn sm ghost" data-ggmon="-1">‹</button>
    <b>${y}년 ${m+1}월 · ${t.ic} ${t.name}</b>
    <button class="btn sm ghost" data-ggmon="1" ${now ? 'disabled' : ''}>›</button>
  </div>
  <div class="card gx-rate ${auto ? 'auto' : ''}">
    <div><span class="k">달성율</span><b>${Math.round(pct)}<small>%</small></b><span class="d">${P.running ? (P.proj >= goal ? '순항' : '페이스 부족') : (done >= goal ? '목표 달성' : '미달')}</span></div>
    <div><span class="k">이 달 합계</span><b>${done}<small>${c.unit}</small></b><span class="d">목표 ${goal}${c.unit}</span></div>
    <div><span class="k">활동한 날</span><b>${days}<small>일</small></b><span class="d">${P.running ? `남은 ${P.left}일` : '마감'}</span></div>
    <div class="tr"><i style="width:${pct}%"></i></div>

  <div class="section-title">일자별 내역 <small class="gx-sub">${list.length}건 · 최근 순</small>
    <span class="gx-mnav"><button class="btn sm" data-ghcopy>내역 복사</button></span></div>
  <div class="card gx-pad ${auto ? 'gx-autocard' : ''}">${rows || '<div class="gx-empty">이 달에는 아직 기록이 없습니다.</div>'}</div>

const ORG_KEY = 'growth.note.v1.org';

function fbReady(){
  if(FBAPP) return true;
  if(!window.firebase || !window.FB_CONFIG) return false;
  try{
    FBAPP = firebase.initializeApp(window.FB_CONFIG);
    AUTH = firebase.auth(); FS = firebase.firestore();
    AUTH.onAuthStateChanged(async u => {
      ME = u; LEADER = null; LEADER_LOADED = false;
      if(!u){ AUTH.signInAnonymously().catch(() => {}); return; }
      if(!u.isAnonymous){
        try{ const d = await FS.collection('leaders').doc(u.uid).get(); LEADER = d.exists ? Object.assign({uid:u.uid}, d.data()) : null; }
        catch(e){ LEADER = null; }

  }catch(e){ FBAPP = null; return false; }

}

/* ---- 팀원: 이 달 요약을 올린다 ---- */
function monthCounts(y,m){
  const R = mrange(y,m), counts = {}, rates = {};
  CORES.forEach(c => { counts[c.id] = sumR(c, R.f, R.t); rates[c.id] = Math.round(rate(c, R.f, R.t)*100); });
  let days = 0;
  for(let d = pd(R.f); ymd(d) <= R.t; d = addD(d,1)){
    const ds = ymd(d);
    if(dayScore(ds) > 0 || (crmIndex()[ds] || []).length) days++;
  }
  return {score:score(R.f,R.t), counts, rates, days};
}
let PUSH_T = null; const PUSH_DONE = {};
function pushReport(){
  if(!fbReady() || !ME || !(G.name || '').trim()) return;
  clearTimeout(PUSH_T);
  PUSH_T = setTimeout(async () => {
    const months = [[T0.getFullYear(), T0.getMonth()]];
    if(T0.getDate() <= 7) months.push(T0.getMonth() === 0 ? [T0.getFullYear()-1, 11] : [T0.getFullYear(), T0.getMonth()-1]);
    for(const [y,m] of months){
      const mc = monthCounts(y,m), key = mk(y,m);
      const doc = {uid:ME.uid, name:G.name.trim(), pt:G.upPt || '', jewel:G.upJewel || '', nowPin:G.vision.nowPin || '',
        score:mc.score, counts:mc.counts, rates:mc.rates, days:mc.days, streak:streak(), month:key,
        app:(typeof APP_VER === 'string' ? APP_VER : '')};
      const sig = JSON.stringify(doc);
      if(PUSH_DONE[key] === sig) continue;
      try{
        await FS.collection('reports').doc(key).collection('members').doc(ME.uid).set(Object.assign({updated:SV()}, doc));
        PUSH_DONE[key] = sig;
      }catch(e){}
    }
  }, 2500);
}

const emailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
async function leaderRegister(f){
  if(!f.name) throw new Error('이름을 적어 주세요');
  if(!f.role) throw new Error('역할을 골라 주세요');
  if(f.role !== 'all' && !f.target) throw new Error('본인 이름을 목록에서 골라 주세요');
  if(!emailOk(f.email)) throw new Error('이메일 형식을 확인해 주세요');
  if((f.pw || '').length < 6) throw new Error('비밀번호는 6자 이상이어야 합니다');
  const cred = firebase.auth.EmailAuthProvider.credential(f.email, f.pw);
  let user;
  if(ME && ME.isAnonymous){ user = (await ME.linkWithCredential(cred)).user; }      // 같은 uid 유지 → 내 보고도 그대로
  else { user = (await AUTH.createUserWithEmailAndPassword(f.email, f.pw)).user; }
  await FS.collection('leaders').doc(user.uid).set({name:f.name, role:f.role, target:f.target || '', email:f.email, approved:false, created:SV()});
  LEADER = {uid:user.uid, name:f.name, role:f.role, target:f.target || '', email:f.email, approved:false};
  LEADER_LOADED = true;
}
async function leaderLogin(email, pw){
  if(!emailOk(email)) throw new Error('이메일 형식을 확인해 주세요');
  await AUTH.signInWithEmailAndPassword(email, pw);
}
async function leaderLogout(){ TEAM = {month:'', rows:[], prevRows:[], leaders:[], loading:false, loaded:false, err:''}; await AUTH.signOut(); }
const isAdmin = () => !!(LEADER && LEADER.approved && LEADER.role === 'all');
const tKey = () => mk(TMON.y, TMON.m);
const tPrev = () => TMON.m === 0 ? mk(TMON.y-1, 11) : mk(TMON.y, TMON.m-1);

async function loadTeam(){
  if(!FS || !LEADER || !LEADER.approved || TEAM.loading) return;

const fmtErr = e => {

  if(c.includes('email-already-in-use') || c.includes('credential-already-in-use')) return '이미 등록된 이메일입니다. 로그인해 주세요';
  if(c.includes('weak-password')) return '비밀번호는 6자 이상이어야 합니다';
  if(c.includes('network')) return '인터넷 연결을 확인해 주세요';
  return (e && e.message) || '실패했습니다';

/* 집계 도우미 */
const tCnt = (r,id) => (r.counts && r.counts[id]) || 0;
const tAvg = a => a.length ? Math.round(a.reduce((s,v) => s+v,0)/a.length) : 0;
const promo = () => Object.assign({title:'', score:80, calls:100, meeting:8, consumer:18}, ORG.promo || {});
function tHitN(r){
  const g = promo();
  return [r.score >= g.score, tCnt(r,'calls') >= g.calls, tCnt(r,'meeting') >= g.meeting, tCnt(r,'consumer') >= g.consumer].filter(Boolean).length;
}
const tMs = r => (r.updated && typeof r.updated.toMillis === 'function') ? r.updated.toMillis() : 0;
const tStale = r => (Date.now() - tMs(r)) > 7*864e5;
const tWhen = r => { const t = tMs(r); if(!t) return '-'; const d = new Date(t); return `${d.getMonth()+1}.${d.getDate()}`; };
function scoped(rows){
  if(!LEADER) return [];
  if(LEADER.role === 'pt') return rows.filter(r => r.pt === LEADER.target);
  if(LEADER.role === 'jewel') return rows.filter(r => r.jewel === LEADER.target);
  return rows;
}
function legs(){
  const mine = scoped(TEAM.rows), pv = scoped(TEAM.prevRows);
  const field = LEADER.role === 'pt' ? 'name' : LEADER.role === 'jewel' ? 'pt' : 'jewel';
  const title = LEADER.role === 'pt' ? '직속 팀원' : LEADER.role === 'jewel' ? 'PT 레그' : '보석핀 라인';
  const map = new Map();
  const touch = n => { if(!map.has(n)) map.set(n, {name:n, rows:[], prev:[]}); return map.get(n); };
  mine.forEach(x => touch(x[field] || '미지정').rows.push(x));
  pv.forEach(x => touch(x[field] || '미지정').prev.push(x));
  return {title, mine, prev:pv, list:[...map.values()].sort((a,b) => tAvg(b.rows.map(x => x.score)) - tAvg(a.rows.map(x => x.score)))};
}
const TM_COLS = [['calls','전화'],['meeting','미팅'],['consumer','소비자'],['learner','학습'],['newjoin','가입']];

function teamBoard(){

  const gone = prev.filter(x => !names.has(x.name));
  const topN = Math.max(1, Math.round(sorted.length * .2));

let RSEL = 'month';
function repRange(){
  if(RSEL === 'week'){
    const ws = weekStart(pd(SEL)), we = addD(ws,6);
    return {f:ymd(ws), t: ymd(we) > TS ? TS : ymd(we), label:`${ws.getMonth()+1}/${ws.getDate()} ~ ${we.getMonth()+1}/${we.getDate()} 주간`,
      months:[[ws.getFullYear(), ws.getMonth()], [we.getFullYear(), we.getMonth()]].filter((x,i,a) => i === 0 || x[1] !== a[0][1])};
  }
  if(RSEL === 'q'){
    const a = new Date(GMON.y, GMON.m-2, 1), b = new Date(GMON.y, GMON.m-1, 1), R = mrange(GMON.y, GMON.m);
    return {f:ymd(a), t:R.t, label:`${a.getMonth()+1}월 ~ ${GMON.m+1}월 · 3개월`,
      months:[[a.getFullYear(), a.getMonth()], [b.getFullYear(), b.getMonth()], [GMON.y, GMON.m]]};
  }
  const R = mrange(GMON.y, GMON.m);
  return {f:R.f, t:R.t, label:`${GMON.y}년 ${GMON.m+1}월${R.ended ? '' : ` (${Number(R.t.slice(8))}일까지)`}`, months:[[GMON.y, GMON.m]]};
}
function repData(){
  const R = repRange();
  const sc = score(R.f, R.t);
  const days = Math.round((pd(R.t)-pd(R.f))/864e5)+1;
  const psc = score(ymd(addD(pd(R.f), -days)), ymd(addD(pd(R.f), -1)));
  const items = CORES.map(c => {
    const done = sumR(c, R.f, R.t);
    let goal = 0;
    R.months.forEach(([y,m]) => {
      const M = mrange(y,m), a = M.f > R.f ? M.f : R.f, b = M.t < R.t ? M.t : R.t;
      if(a > b) return;
      const dd = Math.round((pd(b)-pd(a))/864e5)+1;
      goal += goalOf(c,y,m) * dd / dim(y,m);
    });
    goal = Math.max(1, Math.round(goal));
    return {c, done, goal, pct:Math.round(done/goal*100)};
  });
  const bySc = items.slice().sort((a,b) => b.pct-a.pct);
  const monthly = R.months.map(([y,m]) => { const M = mrange(y,m); return {m, sc:score(M.f, M.t)}; });
  return {R, sc, psc, items, best:bySc[0], worst:bySc[bySc.length-1], monthly, streak:streak(), longest:longest(R.f,R.t)};
}
