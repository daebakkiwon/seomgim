function closeModal(){
  document.getElementById('modal').innerHTML = '';
  OPEN = null;
}

function openDetail(id){
  const p = byId(id);
  if(!p) return;
  OPEN = id;
  const st = stageOf(p.stage);
  const next = STAGES[stageIdx(p.stage) + 1];

  // 새 고객 추가에서 적어둔 내용 — 있는 것만 보여준다
  const info = [['팀분류', p.team], ['명단분류', p.source], ['주소', p.address], ['회원번호', p.memberNo]]
    .filter(x => x[1]);

  // 적어둔 것만 모아 '특이사항' 하나로 — 빈 항목은 아예 나오지 않는다
  const bits = [];
  if((p.tags || []).length) bits.push(['관심사항',
    `<div class="tagrow">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`]);
  if(p.needs)   bits.push(['불편한 점 · 필요한 것', `<div class="nx">${esc(p.needs)}</div>`]);
  if(p.route)   bits.push(['고객동선확인', `<div class="nx">${esc(p.route)}</div>`]);
  if(p.family)  bits.push(['가족관계', `<div class="nx">${esc(p.family)}</div>`]);
  if(p.network) bits.push(['주변인맥', `<div class="nx">${esc(p.network)}</div>`]);
  if(p.memo)    bits.push(['메모',     `<div class="nx">${esc(p.memo)}</div>`]);
  const noteBox = bits.length
    ? `<div class="nbox">${bits.map(b => `<div class="nrow"><div class="nk">${b[0]}</div>${b[1]}</div>`).join('')}</div>`
    : `<div class="nbox" style="color:var(--faint);font-size:15px">아직 적은 내용이 없습니다. 위 '수정'에서 적어주세요.</div>`;

  const logs = (p.logs || []).slice().sort((a,b) => b.at.localeCompare(a.at));
  const logHtml = logs.length
    ? `<div class="timeline">` + logs.map(l => `
        <div class="log ${l.kind === '시스템' ? 'sys' : ''}">
          <div class="lh">
            <span class="kchip" style="background:var(${kindColor(l.kind)})">${esc(l.kind)}</span>
            <span class="lt">${shortDay(l.at)}</span>
            <button class="del" data-dellog="${l.id}">삭제</button>
          </div>
          <div class="lx">${esc(l.text)}</div>
        </div>`).join('') + `</div>`
    : `<div style="color:var(--faint);font-size:13.5px;padding:6px 0">아직 기록이 없습니다.</div>`;

  document.getElementById('modal').innerHTML = `
  <div class="overlay" data-close>
    <div class="modal wide">
      <div class="mhead">
        <h2>섬김활동</h2>
        <button class="btn sm" data-edit="${p.id}">수정</button>
        <button class="x" data-close>×</button>
      </div>
      <div class="mbody">
        <div class="dhero">
          <span class="avatar" style="background:${avatarColor(p.id)}">${esc(initials(p.name))}</span>
          <div style="flex:1;min-width:0">
            <div class="nm">${esc(p.name)}</div>
            <div class="meta">
              <span class="badge" style="background:var(${st.b});color:var(${st.c})">
                <span class="dot" style="background:var(${st.c})"></span>${st.name}</span>
              ${p.phone ? telLink(p.phone, 'big') : ''}
            </div>
          </div>
          ${next ? `<button class="btn sm primary" data-advance="${p.id}">${next.name}(으)로 성장 ↑</button>` : ''}
        </div>

        ${info.length ? `<div class="infoline">` +
          info.map(x => `<span><b>${x[0]}</b>${esc(x[1])}</span>`).join('') + `</div>` : ''}

        <div class="section-title" style="margin-top:0">특이사항</div>
        ${noteBox}

        <div class="section-title" style="margin-top:0">다음 섬김</div>
        <div class="dtf" style="margin-bottom:10px">
          <input type="text" id="naText" value="${esc(p.nextAction || '')}"
                 placeholder="섬김 내용 — 예: 무릎에 좋은 제품 알아봐 드리기" autocomplete="off">
        </div>
        <div class="dtrow">
          <div class="dtf">
            <label for="naDate">날짜</label>
            <input type="date" id="naDate" value="${esc(p.nextDate || todayStr())}">
          </div>
          <div class="dtf">
            <label for="naTime">시간 <span style="color:var(--faint);font-weight:600">(안 정했으면 비워두세요)</span></label>
            <input type="time" id="naTime" value="${esc(p.nextTime || '')}">
          </div>
        </div>
        <div class="btnrow">
          <button class="btn primary" id="naSave">저장</button>
          ${p.nextAction || p.nextDate ? `<button class="btn" data-done="${p.id}">완료</button>` : ''}
          <button class="btn" id="naCal">📅 캘린더에 저장</button>
        </div>


        <div class="section-title" style="margin-top:0">활동 기록</div>
        <div class="logadd">
          <select id="logKind">${LOG_KINDS.map(k => `<option>${k}</option>`).join('')}</select>
          <input id="logText" placeholder="무슨 이야기를 나눴는지, 무엇을 챙겨드렸는지" autocomplete="off">
          <button class="btn primary" id="logAdd">기록</button>
        </div>
        ${logHtml}
      </div>
      <div class="mfoot">
        <button class="btn danger left" data-del="${p.id}">삭제</button>
        <button class="btn" data-close>닫기</button>
      </div>
    </div>
  </div>`;

  // 다음 할 일 저장
  const saveNext = () => {
    const t  = document.getElementById('naText').value.trim();
    const dt = document.getElementById('naDate').value;
    const tm = document.getElementById('naTime').value;
    if(!t && !dt){ toast('섬김 내용을 적어주세요'); return; }
    p.nextAction = t;
    p.nextDate   = t ? (dt || todayStr()) : '';   // 내용을 지우면 날짜도 함께 비운다
    p.nextTime   = t ? tm : '';
    save(); render(); openDetail(id);
    toast(p.nextAction ? '홈 섬김활동에 올렸습니다' : '다음 섬김을 비웠습니다');
  };
  document.querySelectorAll('#modal a.tel').forEach(a => a.onclick = tapPhone);

  document.getElementById('naSave').onclick = saveNext;

  // 캘린더 — 저장 전이라도 지금 화면에 적힌 날짜·시간으로 일정을 만든다
  const liveEvent = () => ({
    id: p.id, name: p.name, phone: p.phone,
    nextAction: document.getElementById('naText').value.trim(),
    nextDate:   document.getElementById('naDate').value,
    nextTime:   document.getElementById('naTime').value,
  });
  const calEl = document.getElementById('naCal');
  const syncCal = () => {
    calEl.classList.toggle('hide', !liveEvent().nextDate);
  };
  ['naText', 'naDate', 'naTime'].forEach(id =>
    document.getElementById(id).addEventListener('input', syncCal));
  syncCal();

  calEl.onclick = () => {
    const ev = liveEvent();
    if(!ev.nextDate){ toast('날짜를 먼저 정해주세요'); return; }
    download(icsText(ev), `섬김활동_${ev.name}_${ev.nextDate}.ics`,
      'text/calendar;charset=utf-8', '일정을 만들었습니다. 파일을 눌러 캘린더에 추가하세요');
  };
  document.getElementById('naText').addEventListener('keydown', e => { if(e.key === 'Enter') saveNext(); });

  // 활동 기록
  document.getElementById('logText').addEventListener('keydown', e => { if(e.key === 'Enter') addLog(p.id); });
  document.getElementById('logAdd').onclick = () => addLog(p.id);
}

function addLog(id){
  const p = byId(id); if(!p) return;
  const text = document.getElementById('logText').value.trim();
  if(!text){ toast('내용을 입력하세요'); return; }
  p.logs = p.logs || [];
  p.logs.push({ id:uid(), at:new Date().toISOString(), kind:document.getElementById('logKind').value, text });
  save(); openDetail(id); render();
  toast('기록했습니다');
}

function advance(id){

  const next = STAGES[stageIdx(p.stage) + 1];
  if(!next) return;
  growLog(p, `${stageOf(p.stage).name} → ${next.name}`);
  p.stage = next.id;
  save(); render(); openDetail(id);
  toast(`${p.name} 님 → ${next.name}`);
}
function doneTask(id){
  const p = byId(id); if(!p) return;
  if(p.nextAction){
    p.logs = p.logs || [];
    p.logs.push({ id:uid(), at:new Date().toISOString(), kind:'완료', text:p.nextAction });

  p.nextAction = ''; p.nextDate = ''; p.nextTime = '';
  save(); render();
  if(OPEN === id) openDetail(id);

}

/* ============================================================
   명단 한 번에 불러오기
   ============================================================ */
const PHONE_RE = /(01[016-9])[-.\s]?(\d{3,4})[-.\s]?(\d{4})|(0\d{1,2})[-.\s]?(\d{3,4})[-.\s]?(\d{4})/;

// 붙여넣은 글에서 한 줄에 한 분씩 이름 · 연락처 · 나머지를 갈라낸다
// 폰 연락처를 바로 고를 수 있는 기기인지 (안드로이드 크롬 등)
const CAN_PICK = !!(typeof navigator !== 'undefined' && navigator.contacts && window.ContactsManager);

// 연락처 파일(.vcf) 읽기 — 아이폰은 '연락처 공유 → 파일에 저장'으로 이 파일을 만든다
function vcUnesc(v){
  return String(v || '').replace(/\\n/gi, ' ').replace(/\\,/g, ',')
    .replace(/\;/g, ';').replace(/\\\\/g, '\\').trim();
}
function parseVCards(text){
  const lines = String(text || '').replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n');
  const out = [];
  let cur = null;
  for(const raw of lines){
    const line = raw.trim();
    if(/^BEGIN:VCARD$/i.test(line)){ cur = { name:'', phone:'', address:'', memo:'' }; continue; }
    if(/^END:VCARD$/i.test(line)){
      if(cur && (cur.name || cur.phone)) out.push(cur);
      cur = null; continue;
    }
    if(!cur) continue;
    const i = line.indexOf(':');
    if(i < 0) continue;
    const key = line.slice(0, i).split(';')[0].toUpperCase();
    const val = line.slice(i + 1);
    if(key === 'FN' && !cur.name) cur.name = vcUnesc(val);
    else if(key === 'N' && !cur.name){
      const p = val.split(';');
      cur.name = (vcUnesc(p[0]) + vcUnesc(p[1])).trim();   // 성 + 이름
    }
    else if(key === 'TEL' && !cur.phone) cur.phone = fmtPhone(vcUnesc(val));
    else if(key === 'ADR' && !cur.address){
      const p = val.split(';');                             // ;;거리;시;도;우편;나라
      cur.address = [p[4], p[3], p[2]].map(vcUnesc).filter(Boolean).join(' ');
    }
    else if(key === 'NOTE' && !cur.memo) cur.memo = vcUnesc(val);
  }
  return out;
}

// 폰 연락처에서 한 사람 고르기 (되는 기기에서만)
async function pickContact(){
  try{
    const list = await navigator.contacts.select(['name', 'tel', 'address'], { multiple: false });
    if(!list || !list.length) return null;
    const c = list[0];
    const a = (c.address && c.address[0]) || null;
    return {
      name: (c.name && c.name[0]) || '',
      phone: fmtPhone((c.tel && c.tel[0]) || ''),
      address: a ? [a.region, a.city, a.addressLine && a.addressLine.join(' ')]
        .filter(Boolean).join(' ').trim() : '',
    };
  }catch(e){ return null; }
}

function parseList(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(raw => {
    let line = raw.trim();
    if(!line) return;
    // '1.' '2)' 같은 목록 번호만 떼어낸다. '010-...' 같은 전화번호는 건드리지 않는다
    line = line.replace(/^\d{1,2}[.)]\s*/, '');

    let phone = '';
    const m = line.match(PHONE_RE);
    if(m){
      phone = fmtPhone(m[0]);
      line = line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length);
    }

    // 쉼표·탭이 있으면 그것으로, 없으면 띄어쓰기로 나눈다
    const parts = (/[\t,;|]/.test(line) ? line.split(/[\t,;|]/) : line.split(/\s+/))
      .map(t => t.trim()).filter(Boolean);

    let name = '', group = '';
    const rest = [];
    parts.forEach(t => {
      if(!name  && /^[가-힣]{2,5}$/.test(t)){ name = t;  return; }   // 한글 이름
      if(!group && DB.groups.includes(t)){    group = t; return; }   // 아는 분류면 분류로
      rest.push(t);
    });
    if(!name && rest.length) name = rest.shift();                    // 못 찾으면 첫 낱말
    if(!name && !phone) return;

    out.push({ name, phone, group, memo: rest.join(' ') });
  });
  return out;
}

let verAt = 0;
async function checkUpdate(){
  if(location.protocol === 'file:') return;
  if(document.getElementById('newbar')) return;
  if(Date.now() - verAt < 120000) return;
  verAt = Date.now();
  try{
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const m = (await r.text()).match(/const APP_VER = '([^']+)'/);
    if(m && m[1] !== APP_VER) showNewBar();
  }catch(e){ /* 인터넷이 없으면 그냥 넘어간다 */ }
}
function showNewBar(){
  if(document.getElementById('newbar')) return;
  const el = document.createElement('div');
  el.id = 'newbar';
  el.innerHTML = `<span>✨ 새로워진 내용이 있습니다</span>
    <button class="btn sm" id="nbGo">받기</button>
    <button class="btn sm ghost" id="nbNo">나중에</button>`;
  document.body.appendChild(el);
  // 알림줄이 제목을 가리지 않도록 그만큼 아래로 민다
  const push = () => document.body.style.paddingTop = el.offsetHeight + 'px';
  push();
  addEventListener('resize', push);
  document.getElementById('nbGo').onclick = () => {
    location.replace(location.pathname + '?v=' + Date.now());

// 표 머리글 → 우리 항목. 띄어쓰기와 기호는 지우고 견준다.
const SHEET_KEYS = [
  ['name',      ['이름','성명','고객명','성함','name']],
  ['phone',     ['연락처','전화','전화번호','휴대폰','핸드폰','휴대전화','phone','mobile','tel']],
  ['memberNo',  ['회원번호','암웨이회원번호','abo','회원no']],
  ['address',   ['주소','사는곳','거주지','address']],
  ['team',      ['팀분류','팀','팀명','레그','team']],
  ['source',    ['명단분류','분류','그룹','알게된경로','경로','group']],
  ['stageName', ['단계','상태','stage']],
  ['needs',     ['불편한점필요한것','불편한점','필요한것','니즈','불편']],
  ['route',     ['고객동선확인','고객동선','동선']],
  ['family',    ['가족관계','가족']],
  ['network',   ['주변인맥','인맥','주변']],
  ['tags',      ['관심사항','관심','태그','tag']],
  ['memo',      ['메모특이사항','특이사항','메모','비고','memo','note']],
  ['nextAction',['다음섬김','다음할일','할일']],
  ['nextDate',  ['섬김날짜','예정일','날짜']],
];
const normKey  = v => String(v == null ? '' : v).replace(/[\s()·.,\-_/]/g, '').toLowerCase();
const colIdx   = a => [...a].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
const unxml    = t => t.replace(/&lt;/g,'<').replace(/&gt;/g,'>')
                       .replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

// 엑셀이 전화번호를 숫자로 저장하면 앞의 0이 떨어진다 — 되돌린다
function sheetPhone(v){
  let t = String(v == null ? '' : v).trim();
  if(!t) return '';
  if(/^\d+$/.test(t) && t.length >= 9 && t.length <= 10) t = '0' + t;
  return fmtPhone(t);
}
// 엑셀 날짜는 1899-12-30 부터 센 숫자다
function sheetDate(v){
  const t = String(v == null ? '' : v).trim();
  if(!t) return '';
  if(/^\d{5}(\.\d+)?$/.test(t)){
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(parseFloat(t)) * 86400000);
    return d.toISOString().slice(0, 10);
  }
  const m = t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
}

// 쉼표 · 탭 · 세미콜론 어느 것으로 나뉘어 있어도 읽는다
function parseCsv(text){
  const t = String(text).replace(/^﻿/, '');
  const head = t.split(/\r?\n/)[0] || '';
  const cnt = c => (head.split(c).length - 1);
  const d = cnt('\t') > cnt(',') ? '\t' : cnt(';') > cnt(',') ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){
      if(c === '"'){ if(t[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }
    else if(c === '"') q = true;
    else if(c === d){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r') cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

// .xlsx 는 zip 파일이다 — 브라우저가 풀어준다
async function unzip(buf){
  const v = new DataView(buf), u = new Uint8Array(buf), dec = new TextDecoder();
  let eo = -1;
  for(let i = u.length - 22; i >= 0 && i > u.length - 65558; i--){
    if(v.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  }
  if(eo < 0) throw new Error('엑셀 파일이 아닌 것 같습니다');
  const cnt = v.getUint16(eo + 10, true);
  let p = v.getUint32(eo + 16, true);
  const out = {};
  for(let i = 0; i < cnt; i++){
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true),
          nLen = v.getUint16(p + 28, true), eLen = v.getUint16(p + 30, true),
          cLen = v.getUint16(p + 32, true), off  = v.getUint32(p + 42, true);
    const name = dec.decode(u.subarray(p + 46, p + 46 + nLen));
    const lnLen = v.getUint16(off + 26, true), leLen = v.getUint16(off + 28, true);
    const start = off + 30 + lnLen + leLen;
    const raw = u.subarray(start, start + size);
    if(name === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(name)){
      out[name] = method === 0 ? raw : await inflateRaw(raw);
    }
    p += 46 + nLen + eLen + cLen;
  }
  return out;
}
async function inflateRaw(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

async function xlsxToGrid(buf){
  const files = await unzip(buf);
  const dec = b => new TextDecoder().decode(b);
  const texts = x => (x.match(/<t[^>]*>[\s\S]*?<\/t>/g) || [])
                       .map(t => unxml(t.replace(/<[^>]+>/g, ''))).join('');
  const shared = [];
  if(files['xl/sharedStrings.xml']){
    (dec(files['xl/sharedStrings.xml']).match(/<si[\s\S]*?<\/si>/g) || [])
      .forEach(si => shared.push(texts(si)));
  }
  const sheet = Object.keys(files)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a, b) => (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]))[0];
  if(!sheet) throw new Error('엑셀 안에 표가 없습니다');
  const grid = [];
  (dec(files[sheet]).match(/<row[\s\S]*?<\/row>/g) || []).forEach(rw => {
    const row = [];
    (rw.match(/<c[\s\S]*?(\/>|<\/c>)/g) || []).forEach(c => {
      const ref = (c.match(/r="([A-Z]+)/) || [])[1];
      const ci  = ref ? colIdx(ref) : row.length;
      const ty  = (c.match(/t="([^"]+)"/) || [])[1];
      let val = '';
      if(ty === 'inlineStr') val = texts(c);
      else {
        const m = c.match(/<v>([\s\S]*?)<\/v>/);
        val = m ? unxml(m[1]) : '';
        if(ty === 's') val = shared[+val] || '';
      }
      row[ci] = val;
    });
    grid.push(row);
  });
  return grid;
}

async function readSheetFile(f){
  const n = f.name.toLowerCase();
  if(n.endsWith('.xls'))
    throw new Error('예전 엑셀(.xls)은 못 읽습니다. 엑셀에서 .xlsx 나 CSV 로 저장해 주세요.');
  if(n.endsWith('.xlsx') || n.endsWith('.xlsm')){
    if(typeof DecompressionStream === 'undefined')
      throw new Error('이 브라우저는 엑셀을 바로 못 엽니다. 엑셀에서 CSV 로 저장해 주세요.');
    return xlsxToGrid(await f.arrayBuffer());
  }
  return parseCsv(await f.text());
}

// 표 → 사람 목록. 첫 줄이 머리글이면 열 이름을 보고 맞춘다.
function gridToRows(grid){
  const rows = grid.filter(r => (r || []).some(c => String(c == null ? '' : c).trim()));
  if(!rows.length) return [];
  const head = (rows[0] || []).map(normKey);
  const map = {};
  SHEET_KEYS.forEach(([k, names]) => {
    const i = head.findIndex(h => h && (names.includes(h) ||
      names.some(n => n.length > 1 && h.includes(n))));
    if(i >= 0 && map[k] === undefined) map[k] = i;
  });
  const titled = Object.keys(map).length >= 2;      // 머리글로 볼 만한가
  const body = titled ? rows.slice(1) : rows;
  if(!titled){ map.name = 0; map.phone = 1; map.source = 2; map.memo = 3; }
  return body.map(r => {
    const g = k => map[k] === undefined ? '' : String((r || [])[map[k]] == null ? '' : r[map[k]]).trim();
    return {
      name:g('name'), phone:sheetPhone(g('phone')), group:g('source'), team:g('team'),
      memberNo:g('memberNo'), address:g('address'), needs:g('needs'), route:g('route'),
      family:g('family'), network:g('network'), tags:g('tags'), memo:g('memo'),
      nextAction:g('nextAction'), nextDate:sheetDate(g('nextDate')), stageName:g('stageName'),
    };
  }).filter(o => o.name || o.phone);
}

          drawImport(all.map(c => ({ name:c.name, phone:c.phone, group:'', memo:c.memo || '' })));
          toast(`${all.length}명을 읽었습니다`);
        }
      };
      r.readAsText(f);
    });
  };

  document.getElementById('impXlsBtn').onclick = () => document.getElementById('impXls').click();
  document.getElementById('impXls').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if(!f) return;
    try{
      const rows = gridToRows(await readSheetFile(f));
      if(!rows.length){ toast('표에서 사람을 찾지 못했습니다'); return; }
      drawImport(rows);
      toast(`${rows.length}명을 읽었습니다`);
    }catch(err){
      toast(err.message || '파일을 읽지 못했습니다');
    }
  };

  document.getElementById('impParse').onclick = () => {
    const rows = parseList(document.getElementById('impText').value);
    drawImport(rows);
    if(rows.length) toast(`${rows.length}명을 읽었습니다`);
  };
  document.getElementById('impSave').onclick = commitImport;
}

function extraNote(rows){
  const KEYS = [['team','팀분류'],['memberNo','회원번호'],['address','주소'],['stageName','단계'],
    ['needs','불편한 점'],['route','고객동선확인'],['family','가족관계'],
    ['network','주변인맥'],['tags','관심사항'],['nextAction','다음섬김']];
  const found = KEYS.filter(k => rows.some(r => r[k[0]])).map(k => k[1]);
  return found.length
    ? `<br><b style="color:var(--accent)">${found.join(' · ')}</b> 도 함께 들어갑니다.`
    : '';
}

  const els = [...document.querySelectorAll('#impRows .irow')];
  const stage = document.getElementById('impStage').value;

    if(!o.name && !o.phone) return;
    const m = IMP_MORE[+el.dataset.ix] || {};

    if(src && !DB.groups.includes(src)) DB.groups.push(src);

    const byName = (STAGES.find(x => x.name === (m.stageName || '').trim()) || {}).id;
    const rec = {
      id:uid(), createdAt:new Date().toISOString(), logs:[],
      name:o.name || '(이름 없음)', phone:fmtPhone(o.phone), stage: byName || stage,
      team: tsel || m.team || TEAM || '',

      tags:(m.tags || '').split(/[,·]/).map(t => t.trim()).filter(Boolean),

const CSV_COLS = [
  ['name','이름'],['team','팀분류'],['stageName','단계'],['phone','연락처'],['memberNo','회원번호'],
  ['address','주소'],['source','명단분류'],
  ['needs','불편한점·필요한것'],['route','고객동선확인'],
  ['family','가족관계'],['network','주변인맥'],
  ['tagsStr','관심사항'],['memo','메모(특이사항)'],
  ['nextAction','다음섬김'],['nextDate','섬김날짜'],['nextTime','섬김시간'],
  ['createdDate','등록일'],['logCount','활동수'],
];
function csvCell(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportCSV(){
  if(!DB.people.length){ toast('내보낼 데이터가 없습니다'); return; }
  const rows = DB.people.map(p => ({
    ...p,
    stageName: stageOf(p.stage).name,
    tagsStr: (p.tags||[]).join(' / '),
    createdDate: (p.createdAt||'').slice(0,10),
    logCount: (p.logs||[]).length,
  }));
  const csv = [CSV_COLS.map(c => c[1]).join(',')]
    .concat(rows.map(r => CSV_COLS.map(c => csvCell(r[c[0]])).join(',')))
    .join('\r\n');
  download('﻿' + csv, `섬김명단_${todayStr()}.csv`, 'text/csv;charset=utf-8', '엑셀 파일을 저장했습니다');
}
function daysSinceBackup(){
  if(!DB.lastBackup) return null;
  return Math.floor((Date.now() - new Date(DB.lastBackup)) / 86400000);
}
function exportJSON(){
  DB.lastBackup = new Date().toISOString();
  save();
  download(JSON.stringify(DB, null, 2), `섬김노트_백업_${todayStr()}.json`, 'application/json', '백업 파일을 저장했습니다');
  render();
}
function download(text, filename, mime, okMsg){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(okMsg);
}
function importJSON(file){
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.people)) throw new Error('형식 오류');
      migrate(d);
      const yes = await askConfirm(
        `백업 파일에 ${d.people.length}명이 들어 있습니다.\n지금 자료(${DB.people.length}명)를 이 내용으로 덮어쓸까요?`, '되살리기');
      if(!yes) return;
      DB = { people: d.people, groups: d.groups, updatedAt: null };
      save(); closeModal(); render();
      toast(`${d.people.length}명을 불러왔습니다`);
    }catch(e){
      toast('파일을 읽을 수 없습니다 — 백업 JSON이 맞는지 확인하세요');
    }
  };
  r.readAsText(file);
}

  const gb2 = document.getElementById('goBackup2');
  if(gb2) gb2.onclick = () => openData();

  // 검색 / 정렬
  const q = document.getElementById('q');
  if(q){
    // 한 글자 칠 때마다 화면 전체를 다시 그리면 한글 조합이 끊긴다.
    // 그래서 목록 부분만 갈아 끼우고, 조합 중에는 건드리지 않는다.
    let composing = false;
    const refresh = () => {
      const rows = filtered();
      const box = document.getElementById('listRows');

      box.innerHTML = personRows(rows);

    q.addEventListener('compositionstart', () => { composing = true; });
    q.addEventListener('compositionend', () => { composing = false; Q = q.value; refresh(); });
    q.addEventListener('input', () => { Q = q.value; if(!composing) refresh(); });
  }
  const sel = document.getElementById('sort');
  if(sel) sel.onchange = () => { SORT = sel.value; render(); };
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER = b.dataset.f; render(); });
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { GFILTER = b.dataset.g || null; render(); });
  const gc = document.getElementById('grpCsv');
  if(gc) gc.onclick = () => {
    const rows = (GFILTER ? people().filter(p => (p.source || NOGROUP) === GFILTER) : people().slice())
      .sort((a,b) => a.name.localeCompare(b.name, 'ko'));
    const csv = ['이름,전화번호,주소,명단분류,단계']
      .concat(rows.map(p => [p.name, p.phone, shortAddr(p.address), p.source || NOGROUP, stageOf(p.stage).name]
        .map(csvCell).join(','))).join('\r\n');
    download('﻿' + csv, `${GFILTER || '전체'}_명부_${todayStr()}.csv`,
      'text/csv;charset=utf-8', '명부를 엑셀 파일로 저장했습니다');
  };
  v.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { ATAB = b.dataset.atab; render(); });

  // 행 / 할일 클릭
  v.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
  v.querySelectorAll('.crow[data-id]').forEach(b => b.onclick = () => openDetail(b.dataset.id));
  v.querySelectorAll('.todo[data-id]').forEach(el => el.onclick = e => {
    if(e.target.closest('a,button')) return;
    openDetail(el.dataset.id);
  });
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = e => {
    e.stopPropagation(); openDetail(b.dataset.open);
  });
  v.querySelectorAll('[data-done]').forEach(b => b.onclick = e => {
    e.stopPropagation(); doneTask(b.dataset.done);
  });
  v.querySelectorAll('.mini[data-id]').forEach(b => b.onclick = () => openDetail(b.dataset.id));
  const ms = document.getElementById('moreSoon');
  if(ms) ms.onclick = () => { VIEW = 'acts'; ATAB = 'plan'; render(); };
  v.querySelectorAll('.jump').forEach(b => b.onclick = () => openDetail(b.dataset.id));
  // 번호를 누르면 전화만 걸리고, 뒤의 줄은 열리지 않게
  v.querySelectorAll('a.tel').forEach(a => a.onclick = tapPhone);
}

// 모달 내부는 위임으로 처리
document.getElementById('modal').addEventListener('click', e => {
  const t = e.target;
  if(t.hasAttribute('data-close') && (t.classList.contains('overlay') || t.tagName === 'BUTTON')){
    closeModal(); return;
  }
  const edit = t.closest('[data-edit]');    if(edit){ openForm(edit.dataset.edit); return; }
  const adv  = t.closest('[data-advance]'); if(adv){ advance(adv.dataset.advance); return; }
  const dn   = t.closest('[data-done]');    if(dn){ doneTask(dn.dataset.done); return; }
  const del  = t.closest('[data-del]');     if(del){ removePerson(del.dataset.del); return; }
  const dl   = t.closest('[data-dellog]');
  if(dl){
    const p = byId(OPEN); if(!p) return;
    p.logs = (p.logs||[]).filter(l => l.id !== dl.dataset.dellog);
    save(); openDetail(OPEN); render();
    return;
  }
});

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { VIEW = t.dataset.view; render(); });
document.getElementById('btnNew').onclick  = () => openForm();
document.getElementById('fabNew').onclick  = () => openForm();
document.getElementById('btnData').onclick = openData;

// 글씨 크기 — 화면 전체를 단계별로 키운다
const ZOOM_KEY = 'crm.zoom';
const ZOOM_STEPS = [0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
const ZOOM_HOME = 2;                       // 100% 자리
let zoomIdx = ZOOM_HOME;
function applyZoom(i, tell){
  const n = Math.max(0, Math.min(ZOOM_STEPS.length - 1, i));
  if(tell && n === zoomIdx){
    toast(n === 0 ? '가장 작은 크기입니다' : '가장 큰 크기입니다');
    return;
  }
  zoomIdx = n;
  document.documentElement.style.zoom = ZOOM_STEPS[zoomIdx];
  try{ localStorage.setItem(ZOOM_KEY, String(ZOOM_STEPS[zoomIdx])); }catch(e){}
  if(tell) toast('글씨 크기 ' + Math.round(ZOOM_STEPS[zoomIdx] * 100) + '%');
}
try{
  const saved = parseFloat(localStorage.getItem(ZOOM_KEY));
  const i = ZOOM_STEPS.indexOf(saved);
  applyZoom(i >= 0 ? i : ZOOM_HOME, false);
}catch(e){ applyZoom(ZOOM_HOME, false); }
document.getElementById('btnZoomIn').onclick  = () => applyZoom(zoomIdx + 1, true);
document.getElementById('btnZoomOut').onclick = () => applyZoom(zoomIdx - 1, true);

// 테마
const THEME_KEY = 'crm.theme';
function applyTheme(t){
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
try{ applyTheme(localStorage.getItem(THEME_KEY) || 'auto'); }catch(e){}
document.getElementById('btnTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  const nxt = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
  applyTheme(nxt);
  try{ localStorage.setItem(THEME_KEY, nxt); }catch(e){}
  toast(nxt === 'auto' ? '시스템 설정 따름' : (nxt === 'light' ? '밝은 화면' : '어두운 화면'));
};

// 단축키
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if(typing) return;
  if(e.key === 'n' || e.key === 'ㅜ'){ e.preventDefault(); openForm(); }
  if(e.key === '/'){ e.preventDefault(); VIEW = 'list'; render(); document.getElementById('q')?.focus(); }
});

render();
</script>
<script>
/* ============================================================
   성장노트 — 섬김노트에 얹는 모듈
   섬김노트의 자료(crm.amway.v1)는 건드리지 않는다. 저장소가 따로다.
   ============================================================ */
(function(){
"use strict";

const GKEY = 'growth.note.v1';
const VIEWS = {
  gvision:'비전 · 목표', gself:'자기섬김', ggrow:'성장활동',
  gstats:'성장통계', gteam:'리더성장'
};

/* ---------- 코어 ---------- */
const CORES = [
  {id:'audio', no:1, name:'음원 / 아침 메시지', spec:'음원 제목 + 아침 메시지 한 문장',
   kind:'audio', cadence:'daily', target:1, unit:'개', w:3, tier:1, base:d => Math.round(d*0.87)},
  {id:'meeting', no:2, name:'미팅', spec:'주 2회 이상 · 미팅 제목',
   kind:'list', cadence:'weekly', target:2, unit:'회', w:3, tier:1,
   ph:'미팅 제목 (예: 화요 OM)', base:d => Math.round(d/7*2)},
  {id:'calls', no:3, name:'5통 전화', spec:'1일 5명 · 이름과 통화 내용',
   kind:'pairs', rows:5, cadence:'daily', target:5, unit:'명', w:3, tier:1,
   ph:'상대 이름', ph2:'통화 내용', base:d => Math.round(d*5*0.8)},
  {id:'health', no:4, name:'건강 · 운동', spec:'뉴트리 + 운동',
   kind:'list', cadence:'daily', target:1, unit:'회', w:2, tier:2,
   ph:'운동 내용 (예: 헬스 40분)', base:d => Math.round(d*0.7)},
  {id:'consumer', no:5, name:'소비자 만들기', spec:'월 30명 · 제품을 전달한 분',
   kind:'pairs', rows:3, cadence:'monthly', target:30, unit:'명', w:2, tier:2,
   ph:'소비자 이름', ph2:'무엇을 전달했나', distinct:true, base:() => 30}
];
const TIER = {3:1, 5:2};
const CAD = {daily:'매일', weekly:'주간', monthly:'월 누적'};
const PIN_PH = ['PT','FSPH','EM','DIA','EDC'];
const LV_HINT = {
  3:'음원 · 미팅 · 5통 전화 — 사업이 실제로 굴러가게 하는 최소 단위입니다.',
  5:'3코어에 건강·운동과 소비자 만들기를 얹었습니다.'
};

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => addD(d, -((d.getDay()+6)%7));
const dim = (y,m) => new Date(y,m+1,0).getDate();
const WD = ['월','화','수','목','금','토','일'];
const T0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const TS = ymd(T0);
const mk = (y,m) => `${y}-${pad(m+1)}`;
const yy = n => String(n).slice(2);
const FY = T0.getMonth() >= 8 ? T0.getFullYear()+1 : T0.getFullYear();
const fyEnd = new Date(FY, 7, 31);
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say = t => (typeof toast === 'function' ? toast(t) : null);

/* ---------- 자료 ---------- */
function blank(){
  return {name:'', upPt:'', upJewel:'', level:3,
    vision:{why:'', nowPin:'', pins:{}, g1:'', subs:['','','']},
    plans:{}, log:{},
    org:{jewels:[], pts:[]}, admin:{type:'', name:''},
    team:{rows:{}, promo:{}}, leader:false};
}
let G = (() => {
  try{
    const raw = localStorage.getItem(GKEY);
    if(raw){
      const o = JSON.parse(raw), b = blank();
      const g = Object.assign(b, o);
      g.vision = Object.assign(b.vision, o.vision || {});
      if(!g.vision.pins || typeof g.vision.pins !== 'object') g.vision.pins = {};
      g.plans = g.plans || {}; g.log = g.log || {};
      g.org = Object.assign({jewels:[], pts:[]}, g.org || {});
      g.admin = Object.assign({type:'', name:''}, g.admin || {});
      g.team = Object.assign({rows:{}, promo:{}}, g.team || {});
      if(!TIER[g.level]) g.level = 3;
      return g;
    }
  }catch(e){}
  return blank();
})();
function gsave(){ try{ localStorage.setItem(GKEY, JSON.stringify(G)); }catch(e){ say('저장되지 않았습니다'); } }

let PUB = null;                                  // 리더가 올려둔 team.json
(function loadPub(){
  if(location.protocol === 'file:') return;
  fetch('team.json?v=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(j => { if(j && j.rank){ PUB = j; if(window.VIEW && GROWTH.has(VIEW)) render(); } })
    .catch(() => {});
})();

let SEL = TS;                                   // 보고 있는 날
let MON = {y:T0.getFullYear(), m:T0.getMonth()}; // 보고 있는 달
let TMON = {y:T0.getFullYear(), m:T0.getMonth()};

/* ---------- 집계 ---------- */
const cores = () => CORES.filter(c => c.tier <= TIER[G.level]);
const rec = d => G.log[d] || null;
const iname = v => (typeof v === 'string' ? v : (v && v.n) || '').trim();
const imemo = v => (typeof v === 'string' ? '' : (v && v.m) || '').trim();
function put(date, id, val){
  const r = G.log[date] || (G.log[date] = {});
  const empty = id === 'audio'
    ? !(val.title||'').trim() && !(val.msg||'').trim()
    : !val.filter(iname).length;
  if(empty) delete r[id]; else r[id] = val;
  if(!Object.keys(r).length) delete G.log[date];
  gsave();
}
function dayN(date, c){
  const r = rec(date);
  if(!r || !r[c.id]) return 0;
  if(c.id === 'audio') return (r.audio.title||'').trim() && (r.audio.msg||'').trim() ? 1 : 0;
  return r[c.id].filter(iname).length;
}
function sumR(c, f, t){
  if(c.distinct){
    const set = new Set();
    for(let d = pd(f); ymd(d) <= t; d = addD(d,1))
      ((rec(ymd(d)) || {})[c.id] || []).forEach(v => { const n = iname(v); if(n) set.add(n); });
    return set.size;
  }
  let s = 0;
  for(let d = pd(f); ymd(d) <= t; d = addD(d,1)) s += dayN(ymd(d), c);
  return s;
}
function rate(c, f, t){
  if(c.cadence === 'daily'){
    let s = 0, n = 0;
    for(let d = pd(f); ymd(d) <= t; d = addD(d,1)){ s += Math.min(dayN(ymd(d),c)/c.target,1); n++; }
    return n ? s/n : 0;
  }
  if(c.cadence === 'weekly'){
    let acc = 0, w = 0, ws = weekStart(pd(f));
    while(ymd(ws) <= t){
      const a = ymd(ws) < f ? f : ymd(ws);
      const b = ymd(addD(ws,6)) > t ? t : ymd(addD(ws,6));
      const days = Math.round((pd(b)-pd(a))/864e5)+1;
      acc += Math.min(sumR(c,a,b)/Math.max(1, Math.ceil(c.target*days/7)), 1); w++;
      ws = addD(ws,7);
    }
    return w ? acc/w : 0;
  }
  const total = dim(pd(f).getFullYear(), pd(f).getMonth());
  const days = Math.round((pd(t)-pd(f))/864e5)+1;
  return Math.min(sumR(c,f,t)/Math.max(1, Math.ceil(c.target*days/total)), 1);
}
function score(f, t){
  let a = 0, b = 0;
  cores().forEach(c => { a += c.w*rate(c,f,t); b += c.w; });
  return b ? Math.round(a/b*100) : 0;
}
function dayScore(d){
  const cs = cores().filter(c => c.cadence === 'daily');
  let a = 0, b = 0;
  cs.forEach(c => { a += c.w*Math.min(dayN(d,c)/c.target,1); b += c.w; });
  return b ? Math.round(a/b*100) : 0;
}
const full = d => cores().filter(c => c.cadence === 'daily').every(c => dayN(d,c) >= c.target);
function streak(){
  let n = 0, d = new Date(T0);
  if(!full(ymd(d))) d = addD(d,-1);
  while(full(ymd(d))){ n++; d = addD(d,-1); }
  return n;
}
function longest(f,t){
  let best = 0, run = 0;
  for(let d = pd(f); ymd(d) <= t; d = addD(d,1)){
    if(full(ymd(d))){ run++; best = Math.max(best,run); } else run = 0;
  }
  return best;
}
function grade(s){
  if(s >= 90) return {k:'S', t:'다이아 실행'};
  if(s >= 80) return {k:'A', t:'골드 실행'};
  if(s >= 65) return {k:'B', t:'실버 실행'};
  if(s >= 50) return {k:'C', t:'브론즈 실행'};
  return {k:'D', t:'리빌드 구간'};
}
function mrange(y,m){
  const f = `${y}-${pad(m+1)}-01`;
  const last = `${y}-${pad(m+1)}-${pad(dim(y,m))}`;
  return {f, t: last > TS ? TS : last, ended: last <= TS, y, m};
}
function plan(y,m){
  const k = mk(y,m);
  if(!G.plans[k]) G.plans[k] = {goals:{}, vow:'', actions:['','','']};
  const p = G.plans[k];
  p.goals = p.goals || {}; p.actions = p.actions || ['','',''];
  return p;
}
const goalOf = (c,y,m) => plan(y,m).goals[c.id] || c.base(dim(y,m));
function pace(c,y,m){
  const R = mrange(y,m), total = dim(y,m);
  const done = sumR(c,R.f,R.t), goal = goalOf(c,y,m);
  const el = Math.round((pd(R.t)-pd(R.f))/864e5)+1;
  const left = Math.max(0, total-el);
  return {done, goal, left,
    running:(y === T0.getFullYear() && m === T0.getMonth()),
    proj: el ? Math.round(done/el*total) : 0,
    need: left > 0 ? Math.ceil(Math.max(0, goal-done)/left) : 0,
    pct: goal ? Math.min(done/goal,1)*100 : 0,
    exp: goal ? Math.min(el/total,1)*100 : 0};
}
const col = s => s >= 80 ? 'var(--accent)' : s >= 50 ? 'var(--s4)' : 'var(--danger)';
const delta = (v,u) => `<span class="gx-d ${v>0?'up':v<0?'dn':''}">${v>0?'▲ +'+v+u:v<0?'▼ '+Math.abs(v)+u:'– 유지'}</span>`;

/* ============================================================
   화면
   ============================================================ */
function dateBar(){
  const d = pd(SEL), today = SEL === TS;
  return `<div class="gx-datebar">
    <button class="btn sm ghost" data-gnav="-1">‹</button>
    <b>${d.getMonth()+1}월 ${d.getDate()}일 (${WD[(d.getDay()+6)%7]})${today?' · 오늘':''}</b>
    <button class="btn sm ghost" data-gnav="1" ${today?'disabled':''}>›</button>
  </div>`;
}
function levelBar(){
  return `<div class="gx-lv">
    ${[3,5].map(n => `<button class="gx-lvb ${G.level===n?'on':''}" data-glv="${n}">${n}코어</button>`).join('')}
    <span class="gx-hint">${LV_HINT[G.level]}</span>
  </div>`;
}

/* ── 비전 · 목표 ── */
function vVision(){
  const R = mrange(T0.getFullYear(), T0.getMonth());
  const sc = score(R.f, R.t);
  const pins = [];
  for(let i = 0; i < 6; i++){
    const fy = FY + i - 1;
    const lb = i === 0 ? '현재' : `${yy(fy)}.9`;
    const val = i === 0 ? (G.vision.nowPin || '') : (G.vision.pins[fy] || '');
    pins.push(`<div class="gx-pin ${i===0?'now':''} ${i===5?'last':''}">
      <input type="text" data-gpin="${i===0?'now':fy}" value="${E(val)}" placeholder="${E(i===0?'12%':PIN_PH[i-1])}">
      <span>${lb}</span></div>`);
  }
  return `
  <div class="card gx-idbox">
    <label><span>성명</span><input type="text" data-gme="name" value="${E(G.name)}" placeholder="이름"></label>
    <label><span>상위 PT</span>${pick('upPt', G.org.pts.map(p => p.name))}</label>
    <label><span>상위 보석핀</span>${pick('upJewel', G.org.jewels)}</label>
  </div>
  <div class="gx-hero">
    <div class="gx-why">
      <span>내가 이 사업을 하는 이유</span>
      <input type="text" data-gv="why" value="${E(G.vision.why)}" placeholder="한 문장으로 적어 보세요">
    </div>
    <div class="gx-meta">
      <div><span class="k">FY${FY} 남은 날</span><span class="v">${Math.round((fyEnd-T0)/864e5)+1}<small>일</small></span></div>
      <div><span class="k">이번 달 남은 날</span><span class="v">${dim(T0.getFullYear(),T0.getMonth())-T0.getDate()+1}<small>일</small></span></div>
      <div><span class="k">연속 실행</span><span class="v">${streak()}<small>일</small></span></div>
      <div class="bar"><span class="k">이번 달 실행률 <b>${sc}점 · ${grade(sc).t}</b></span>
        <span class="tr"><i style="width:${sc}%"></i></span></div>
    </div>
  </div>

  <div class="section-title">성장 궤도 · 5개년 핀 목표</div>
  <div class="card gx-pad">
    <div class="gx-pinwrap"><div class="gx-pins">${pins.join('')}</div></div>
    <p class="gx-note">${yy(FY-1)}.9 현재 위치에서 출발해 매년 9월 도달할 핀을 적습니다.</p>
    <div class="gx-arrow"><svg id="gxArrow" viewBox="0 0 1000 300" role="img" aria-label="성장 궤도">
      <defs><linearGradient id="gxg" x1="0" y1="1" x2="1" y2="0">

  }else{
    const d = pd(SEL), R = mrange(d.getFullYear(), d.getMonth());
    const s = sumR(c,R.f,R.t), g = goalOf(c,d.getFullYear(),d.getMonth());
    pg = g ? Math.min(s/g,1) : 0; lb = `이번 달 ${s} / ${g}${c.unit}`;

  }else if(c.kind === 'pairs'){
    const v = r[c.id] || [];
    const n = Math.max(c.rows, v.length);
    let rows = '';
    for(let i = 0; i < n; i++){
      rows += `<div class="gx-pair" data-gpr="${c.id}">
        <span>${i+1}</span>
        <input type="text" data-gp="n" value="${E(iname(v[i]))}" placeholder="${E(c.ph)}">
        <input type="text" data-gp="m" value="${E(imemo(v[i]))}" placeholder="${E(c.ph2)}"></div>`;
    }
    body = rows + `<button class="gx-more" data-gmore="${c.id}">＋ 한 명 더</button>`;
  }else{
    const v = r[c.id] || [];
    body = `<div class="gx-add"><input type="text" data-gnew="${c.id}" placeholder="${E(c.ph)}">

        : '<div class="gx-empty">아직 입력이 없습니다.</div>'}`;

  return `<div class="gx-core">
    <div class="gx-ch"><span class="no">${c.no}</span><b>${E(c.name)}</b>
      <span class="gx-chip">${CAD[c.cadence]}</span><small>${E(c.spec)}</small>
      <span class="st ${pg>=1?'done':''}">${lb}<i class="mini"><u style="width:${pg*100}%"></u></i></span></div>
    ${body}</div>`;
}

/* ── 성장통계 ── */
function vStats(){
  const {y,m} = MON, R = mrange(y,m);
  const P = mrange(m === 0 ? y-1 : y, m === 0 ? 11 : m-1);

    const s = `${y}-${pad(m+1)}-${pad(d)}`, fut = s > TS;

    cal += `<span class="c${s===TS?' today':''}" title="${m+1}월 ${d}일 · ${v}점"

      <div><div class="gx-lb">코어별 월 달성률</div>
        ${cores().map(c => {
          const p = Math.round(rate(c,R.f,R.t)*100);
          const a = sumR(c,R.f,R.t), b = sumR(c,P.f,P.t);
          return `<div class="gx-pb ${p<50?'low':p<80?'mid':''}">

}
const vol = R => ['calls','meeting','consumer'].filter(id => cores().some(c => c.id === id))
  .reduce((s,id) => s + sumR(CORES.find(c => c.id === id), R.f, R.t), 0);
function statusList(R){
  let out = '', any = false;
  for(let d = pd(R.t); ymd(d) >= R.f; d = addD(d,-1)){
    const ds = ymd(d), r = rec(ds);
    if(!r) continue;
    any = true;
    const bits = [];
    if(r.audio && r.audio.title) bits.push(`음원 「${E(r.audio.title)}」 — ${E(r.audio.msg||'')}`);
    (r.meeting||[]).forEach(v => bits.push(`미팅 · ${E(iname(v))}`));
    (r.health||[]).forEach(v => bits.push(`운동 · ${E(iname(v))}`));
    const items = [];
    ['calls','consumer'].forEach(id => (r[id]||[]).filter(iname).forEach(v =>
      items.push(`<span class="gx-item"><b>${E(iname(v))}</b> ${E(imemo(v))}</span>`)));

      ${items.length ? `<div class="gx-items">${items.join('')}</div>` : ''}</div>`;
  }

function advice(sc,psc,R){
  const out = [];
  const weak = cores().map(c => ({c, r:rate(c,R.f,R.t)})).sort((a,b) => a.r-b.r)[0];
  const behind = cores().map(c => ({c, P:pace(c,R.y,R.m)}))
    .filter(x => x.P.running && x.P.proj < x.P.goal)
    .sort((a,b) => (a.P.proj/a.P.goal)-(b.P.proj/b.P.goal))[0];
  if(G.vision.why) out.push(['','왜 하는가', `“${E(G.vision.why)}” — 이 문장이 흔들릴 때 숫자는 언제나 먼저 흔들립니다.`]);
  if(behind) out.push(['warn','목표 페이스',
    `<b>${E(behind.c.name)}</b>는 이 속도면 월말 ${behind.P.proj}${behind.c.unit}로 목표 ${behind.P.goal}${behind.c.unit}에 못 미칩니다. 남은 ${behind.P.left}일 동안 하루 <b>${behind.P.need}${behind.c.unit}</b>씩 필요합니다.`]);
  if(sc >= 85 && G.level === 3) out.push(['','승급 신호', `3코어를 ${sc}점으로 소화하고 있습니다. 다음 달은 <b>5코어</b>로 올리세요.`]);
  else if(sc < 55 && G.level === 5) out.push(['warn','범위 축소 권장', `5코어 ${sc}점입니다. 다음 달은 <b>3코어</b>로 좁혀 85점을 먼저 만드세요.`]);
  if(weak && weak.r < .7) out.push(['warn','가장 약한 코어',
    `<b>${weak.c.no}. ${E(weak.c.name)}</b> ${Math.round(weak.r*100)}%. 다른 걸 늘리기 전에 이것 하나만 다음 주 목표로 잡으세요.`]);
  if(psc > 0){
    const d = sc-psc;
    out.push(['','성장 판정', d >= 5 ? `전월 대비 <b>+${d}점</b>. 상승 추세입니다.`
      : d <= -5 ? `전월 대비 <b>${d}점</b>. 하락은 대개 미팅 결석에서 시작됩니다.`
      : `전월 대비 ${d>=0?'+':''}${d}점으로 평행선입니다. 이제 <b>실행 볼륨</b>을 20% 올려 보세요.`]);
  }
  return out.map(([w,k,p]) => `<div class="gx-adv ${w}"><div class="k">${k}</div><p>${p}</p></div>`).join('');
}

function drawArrow(){
  const line = document.getElementById('gxLine');
  if(!line) return;
  const L = line.getTotalLength();
  const N = 72, up = [], dn = [];
  for(let i = 0; i <= N; i++){
    const t = i/N, len = L*t;
    const p = line.getPointAtLength(len);
    const a = line.getPointAtLength(Math.max(0, len-1.2));
    const b = line.getPointAtLength(Math.min(L, len+1.2));
    const m = Math.hypot(b.x-a.x, b.y-a.y) || 1;
    const nx = -(b.y-a.y)/m, ny = (b.x-a.x)/m;
    const w = 2 + 7*Math.pow(t, 1.4);
    up.push(`${(p.x+nx*w).toFixed(1)},${(p.y+ny*w).toFixed(1)}`);
    dn.push(`${(p.x-nx*w).toFixed(1)},${(p.y-ny*w).toFixed(1)}`);
  }
  document.getElementById('gxRibbon').setAttribute('d', `M${up.join(' L')} L${dn.reverse().join(' L')} Z`);
  const tip = line.getPointAtLength(L), pre = line.getPointAtLength(L-7);
  const ang = Math.atan2(tip.y-pre.y, tip.x-pre.x)*180/Math.PI;
  const PLANE = 'M28,0 C24,-3 18,-4.2 12,-4.4 L2,-4.4 L-16,-21 L-21.5,-21 L-11,-4.4 ' +
    'L-19,-4.2 L-24,-11 L-28,-11 L-27,-3 L-30.5,0 L-27,3 L-28,11 L-24,11 L-19,4.2 ' +
    'L-11,4.4 L-21.5,21 L-16,21 L2,4.4 L12,4.4 C18,4.2 24,3 28,0 Z';
  let out = `<g transform="translate(${tip.x.toFixed(1)} ${tip.y.toFixed(1)}) rotate(${ang.toFixed(2)}) scale(.92)">
    <path d="${PLANE}" fill="var(--accent)"></path>
    <ellipse cx="13" cy="0" rx="7" ry="2.4" fill="var(--panel)" opacity=".45"></ellipse></g>`;
  [0.012, 0.20, 0.385, 0.565, 0.75, 0.92].forEach((f,i) => {
    const p = line.getPointAtLength(L*f);
    const fy = FY + i - 1, last = i === 5;
    const raw = (i === 0 ? (G.vision.nowPin||'') : (G.vision.pins[fy]||'')).trim();
    const pin = raw ? (raw.length > 11 ? raw.slice(0,10)+'…' : raw) : (i === 0 ? '지금' : '핀 입력');
    const size = last ? 21 : 17.5;
    const lx = Math.min(Math.max(p.x, 92), 908);
    if(i === 0) out += `<circle cx="${p.x}" cy="${p.y}" r="17" fill="var(--accent)" opacity=".15"></circle>`;
    out += `<circle cx="${p.x}" cy="${p.y}" r="${last?11:8}" fill="var(--panel)" stroke="var(--accent)" stroke-width="${last?5:3.6}"></circle>`;
    if(last){
      const w = Math.max(116, pin.length*size*1.02+36);
      out += `<rect x="${(lx-w/2).toFixed(1)}" y="${(p.y-66).toFixed(1)}" width="${w.toFixed(1)}" height="50" rx="25"
        fill="var(--accent)" fill-opacity=".07" stroke="var(--accent)" stroke-opacity=".5" stroke-width="2"></rect>`;
    }
    out += `<text x="${lx}" y="${(p.y-(last?45:48)).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1"
        fill="var(--muted)">${i===0 ? yy(FY-1)+'.9 · 현재' : yy(fy)+'.9'}</text>
      <text x="${lx}" y="${(p.y-(last?23:25)).toFixed(1)}" text-anchor="middle" font-size="${size+1}" font-weight="700"
        fill="${raw ? (last?'var(--accent)':'var(--text)') : 'var(--muted)'}" style="font-family:'Gowun Batang',serif">${E(pin)}</text>`;
  });
  document.getElementById('gxNodes').innerHTML = out;
}

/* ============================================================
   바깥에서 부르는 것
   ============================================================ */
window.GROWTH = {
  views: VIEWS,
  has: v => !!VIEWS[v],
  html(v){
    if(v === 'gvision') return vVision();
    if(v === 'gself') return vSelf();
    if(v === 'ggrow') return vGrow();
    if(v === 'gstats') return vStats();
    if(v === 'gteam') return vTeam();
    return '';
  },
  bind(v, redraw){
    const root = document.getElementById('view');
    const again = () => redraw();
    const on = (sel, fn, ev) => root.querySelectorAll(sel).forEach(el => el[ev || 'onclick'] = () => fn(el));

    on('[data-gnav]', el => { const n = ymd(addD(pd(SEL), Number(el.dataset.gnav))); if(n <= TS){ SEL = n; again(); } });
    on('[data-gday]', el => { SEL = el.dataset.gday; again(); });
    on('[data-glv]', el => { G.level = Number(el.dataset.glv); gsave(); again(); });
    on('[data-gmon]', el => {
      let {y,m} = MON; m += Number(el.dataset.gmon);
      if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
      if(y*12+m > T0.getFullYear()*12+T0.getMonth()) return;
      MON = {y,m}; again();
    });
    on('[data-gsuggest]', () => {
      const p = plan(MON.y, MON.m);
      cores().forEach(c => { p.goals[c.id] = c.base(dim(MON.y, MON.m)); });
      gsave(); again(); say('권장값을 채웠습니다');
    });
    on('[data-ggoal]', el => {
      plan(MON.y, MON.m).goals[el.dataset.ggoal] = Math.max(0, parseInt(el.value.replace(/[^0-9]/g,''),10) || 0);
      gsave(); again();
    }, 'onchange');

    on('[data-gme]', el => { G[el.dataset.gme] = el.value; gsave(); }, 'oninput');
    on('select[data-gme]', el => {
      G[el.dataset.gme] = el.value;
      if(el.dataset.gme === 'upPt'){
        const p = G.org.pts.find(x => x.name === el.value);
        if(p && p.jewel) G.upJewel = p.jewel;
      }
      gsave(); again();
    }, 'onchange');
    on('[data-gv]', el => { G.vision[el.dataset.gv] = el.value; gsave(); }, 'oninput');
    on('[data-gsub]', el => { G.vision.subs[Number(el.dataset.gsub)] = el.value; gsave(); }, 'oninput');
    on('[data-gvow]', el => { plan(MON.y,MON.m).vow = el.value; gsave(); }, 'oninput');
    on('[data-gact]', el => { plan(MON.y,MON.m).actions[Number(el.dataset.gact)] = el.value; gsave(); }, 'oninput');
    on('[data-gpin]', el => {
      const k = el.dataset.gpin;
      if(k === 'now') G.vision.nowPin = el.value; else G.vision.pins[k] = el.value;
      gsave(); drawArrow();
    }, 'oninput');

    on('[data-gaud]', () => {
      const t = root.querySelector('[data-gaud="title"]'), m = root.querySelector('[data-gaud="msg"]');
      put(SEL, 'audio', {title:t.value, msg:m.value});
    }, 'oninput');
    root.querySelectorAll('[data-gpr]').forEach(row => {
      row.querySelectorAll('input').forEach(inp => inp.oninput = () => {
        const id = row.dataset.gpr, arr = [];
        root.querySelectorAll(`[data-gpr="${id}"]`).forEach(r => {
          const [a,b] = r.querySelectorAll('input');
          arr.push({n:a.value, m:b.value});
        });
        while(arr.length && !arr[arr.length-1].n.trim() && !arr[arr.length-1].m.trim()) arr.pop();
        put(SEL, id, arr);
      });
    });
    on('[data-gmore]', el => {
      const id = el.dataset.gmore;
      const arr = ((rec(SEL)||{})[id] || []).map(x => ({n:iname(x), m:imemo(x)}));
      arr.push({n:'', m:''});
      G.log[SEL] = G.log[SEL] || {}; G.log[SEL][id] = arr; gsave(); again();
    });
    on('[data-gaddbtn]', el => {
      const id = el.dataset.gaddbtn;
      const inp = root.querySelector(`[data-gnew="${id}"]`);
      const t = inp.value.trim(); if(!t) return;
      put(SEL, id, [...((rec(SEL)||{})[id] || []), t]); again();
    });
    root.querySelectorAll('[data-gnew]').forEach(inp => inp.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); root.querySelector(`[data-gaddbtn="${inp.dataset.gnew}"]`).click(); }
    });
    on('[data-gdel]', el => {
      const id = el.dataset.gdel, arr = ((rec(SEL)||{})[id] || []).slice();
      arr.splice(Number(el.dataset.i), 1); put(SEL, id, arr); again();
    });

    on('[data-grep]', el => {
      const k = el.dataset.grep;
      if(k === 'dump') copyOut('gxOut', JSON.stringify(G));
      else copyOut('gxOut', k === 'week' ? weekReport() : monthReport());
    });

    /* 리더성장 */
    on('[data-gtmon]', el => {
      let {y,m} = TMON; m += Number(el.dataset.gtmon);
      if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
      if(y*12+m > T0.getFullYear()*12+T0.getMonth()) return;
      TMON = {y,m}; again();
    });
    on('[data-gtprev]', () => {
      const prev = G.team.rows[tPrev()] || {}, b = tBucket();
      let n = 0;
      Object.values(prev).forEach(r => {
        if(b[r.name]) return;
        b[r.name] = {name:r.name, pt:r.pt, jewel:r.jewel, nowPin:r.nowPin, score:0, counts:{}}; n++;
      });
      gsave(); again(); say(`${n}명을 가져왔습니다`);
    });
    on('[data-gjw]', () => {
      const v = document.getElementById('gxJw').value.trim();
      if(v && !G.org.jewels.includes(v)) G.org.jewels.push(v);
      gsave(); again();
    });
    on('[data-gjwdel]', el => { G.org.jewels.splice(Number(el.dataset.gjwdel),1); gsave(); again(); });
    on('[data-gpt]', () => {
      const v = document.getElementById('gxPt').value.trim();
      if(v && !G.org.pts.some(p => p.name === v)) G.org.pts.push({name:v, jewel:document.getElementById('gxPtJw').value});
      gsave(); again();
    });
    on('[data-gptdel]', el => { G.org.pts.splice(Number(el.dataset.gptdel),1); gsave(); again(); });
    const at = document.getElementById('gxAType');
    if(at) at.onchange = () => { G.admin.type = at.value; G.admin.name = ''; gsave(); again(); };
    on('[data-gadmin]', () => {
      const n = document.getElementById('gxAName');
      G.admin.name = n ? n.value : '';
      if(G.admin.type && G.admin.type !== 'all' && !G.admin.name){ say('이름을 골라 주세요'); return; }
      gsave(); again(); say('관리자로 등록했습니다');
    });
    on('[data-gtmadd]', () => {
      const n = document.getElementById('gxTmName').value.trim();
      if(!n){ say('이름을 적어 주세요'); return; }
      const b = tBucket(), pt = document.getElementById('gxTmPt').value;
      const jw = (G.org.pts.find(p => p.name === pt) || {}).jewel || '';
      b[n] = b[n] || {name:n, pt, jewel:jw, nowPin:'', score:0, counts:{}};
      gsave(); again();
    });
    on('[data-gtmdel]', el => {
      if(!confirm(`${el.dataset.gtmdel} 님을 이 달 명단에서 뺄까요?`)) return;
      delete tBucket()[el.dataset.gtmdel]; gsave(); again();
    });
    root.querySelectorAll('[data-gtm] input').forEach(inp => inp.onchange = () => {
      const name = inp.closest('[data-gtm]').dataset.gtm, f = inp.dataset.gf, r = tBucket()[name];
      if(!r) return;
      r.counts = r.counts || {};
      if(f === 'nowPin') r.nowPin = inp.value.trim();
      else if(f === 'score') r.score = Math.max(0, Math.min(100, parseInt(inp.value,10) || 0));
      else r.counts[f] = Math.max(0, parseInt(inp.value,10) || 0);
      gsave(); again();
    });
    on('[data-gpg]', el => {
      const k = el.dataset.gpg, g = tPromo();
      g[k] = k === 'title' ? el.value : Math.max(0, parseInt(el.value,10) || 0);
      gsave(); if(k !== 'title') again();
    }, 'onchange');
    on('[data-gnotice]', el => copyOut('gxNotice', teamNotice(el.dataset.gnotice === '1')));
    on('[data-gpub]', el => {
      const t = buildPub();
      if(el.dataset.gpub === 'file'){ document.getElementById('gxPub').textContent = t; download('team.json', t); }
      else copyOut('gxPub', t);
    });

    if(v === 'gvision') setTimeout(drawArrow, 0);
  }
};
})();

</script>
