<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9d5a72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>섬김성장노트</title>
<meta name="apple-mobile-web-app-title" content="섬김성장노트">
<link rel="manifest" href="sg-manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="sg-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="sg-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="sg-icon-512.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

:root{
  --bg:#faf6f4; --panel:#ffffff; --panel-2:#fdf9f8; --line:#eee0dc;
  --text:#2c2427; --muted:#7b6a70; --faint:#ab999f;
  --accent:#9d5a72; --accent-soft:#fbeef2; --on-accent:#ffffff;
  --s1:#9b7bb8; --s1b:#f3edf8;
  --s2:#6f9dc4; --s2b:#eaf2f8;
  --s6:#4f9c8e; --s6b:#e7f3f0;
  --s3:#6f9c5f; --s3b:#eef4e9;
  --s4:#c68a3f; --s4b:#fbf1e2;
  --s5:#bc5a72; --s5b:#fbeaee;
  --danger:#c0504f; --ok:#5f9b6b;
  --shadow:0 1px 2px rgba(90,60,70,.05), 0 2px 8px rgba(90,60,70,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1416; --panel:#241c20; --panel-2:#2b2126; --line:#3d2f35;
    --text:#f2eaed; --muted:#b8a5ac; --faint:#83717a;
    --accent:#e0a0b8; --accent-soft:#3a222c; --on-accent:#2a181f;
    --s1:#c0a5d8; --s1b:#302740;
    --s2:#93bede; --s2b:#1e2c38;
    --s6:#7fc9ba; --s6b:#17322e;
    --s3:#a2c98f; --s3b:#20301c;
    --s4:#e8b871; --s4b:#3a2c17;
    --s5:#e59aa9; --s5b:#3d222a;
    --danger:#e88b8a; --ok:#8fc49a;
    --shadow:0 1px 2px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1416; --panel:#241c20; --panel-2:#2b2126; --line:#3d2f35;
  --text:#f2eaed; --muted:#b8a5ac; --faint:#83717a;
  --accent:#e0a0b8; --accent-soft:#3a222c; --on-accent:#2a181f;
  --s1:#c0a5d8; --s1b:#302740;
  --s2:#93bede; --s2b:#1e2c38;
  --s6:#7fc9ba; --s6b:#17322e;
  --s3:#a2c98f; --s3b:#20301c;
  --s4:#e8b871; --s4b:#3a2c17;
  --s5:#e59aa9; --s5b:#3d222a;
  --danger:#e88b8a; --ok:#8fc49a;
  --shadow:0 1px 2px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}

/* 제목에는 부드러운 명조를 — 이름과 마음이 먼저 눈에 들도록 */
.brand h1,.mhead h2,.dhero .nm,.section-title,.empty h3,.todo-head h3,.pstage .nm,.gcard .gn{
  font-family:'Gowun Batang','Apple SD Gothic Neo','Nanum Myeongjo',serif;
}
.brand h1{letter-spacing:0;font-weight:700}
.dhero .nm{letter-spacing:0}
.section-title{letter-spacing:0;font-weight:700}
button{cursor:pointer}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header.top{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand .sub{color:var(--faint);font-size:12.5px}
.brand .spacer{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;padding:9px 14px;border-bottom:2px solid transparent;
  color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-radius:6px 6px 0 0;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11.5px;color:var(--faint);margin-left:5px;font-weight:600}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--panel);border-radius:11px;
  padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--text);
  display:inline-flex;align-items:center;gap:6px;transition:.12s;
  text-decoration:none;
}
.btn:hover{background:var(--panel-2);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--s5b)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* ---------- cards / panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:26px 0 10px;letter-spacing:.2px}

/* ---------- pipeline ---------- */
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:16px}
@media(max-width:360px){.pipeline{grid-template-columns:1fr}}
.pstage{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:.12s;
}
.pstage:hover{border-color:var(--faint);transform:translateY(-1px)}
.pstage .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.pstage .n{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.pstage .n small{font-size:11px;font-weight:600;color:var(--faint);margin-left:1px;letter-spacing:0}
.pstage .nm{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.pstage .dot{width:7px;height:7px;border-radius:50%}
.pstage .n{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:6px}
.pstage .n small{font-size:13px;font-weight:600;color:var(--faint);margin-left:2px;letter-spacing:0}
.pstage .desc{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.35}

/* ---------- stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.stat .v.warn{color:var(--danger)}
.stat .v.ok{color:var(--ok)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.search{
  flex:1;min-width:180px;position:relative;
}
.search input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);outline:none;font-size:14px;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;
  font-size:12.5px;font-weight:600;color:var(--muted);
}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;font-size:13.5px}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{
  text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:11px 14px;
  border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--panel-2)}
.nm-cell{font-weight:700;display:flex;align-items:center;gap:9px}   /* 명단분류 표에서 사용 */
.avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.3px;
}
.sub-cell{font-size:12px;color:var(--faint);font-weight:500;margin-top:1px}
.tel{color:var(--accent);text-decoration:none;font-weight:700;
  display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tel:hover{text-decoration:underline}
.tel.big{font-weight:800;padding:3px 0}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:20px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%}
.due{font-size:12.5px;font-weight:600}
.due.over{color:var(--danger)}
.due.today{color:var(--accent)}
.due.none{color:var(--faint);font-weight:500}
.tagrow{display:flex;gap:4px;flex-wrap:wrap}
.tag{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:11px;color:var(--muted);font-weight:600}

/* ---------- empty ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--faint)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--muted);font-weight:700}
.empty p{margin:0 0 16px;font-size:13.5px}

/* ---------- todo ---------- */
.crows{display:flex;flex-direction:column;gap:6px}
.crow{display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  box-shadow:var(--shadow);transition:.1s}
.crow:hover{border-color:var(--faint)}
.crow-1{display:flex;align-items:center;gap:7px 9px;flex-wrap:wrap}
.tel.row{font-size:14px;font-weight:600}
.cnm{font-weight:700;font-size:15.5px}
.cmem{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.crow-2{display:flex;align-items:baseline;gap:10px;margin-top:5px}
.cact{flex:1;min-width:0;color:var(--muted);font-size:14.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-2 .due{flex-shrink:0}
.minis{display:flex;flex-direction:column;gap:5px}
.mini{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:10px 13px;box-shadow:var(--shadow);transition:.1s}
.mini:hover{border-color:var(--faint)}
.mini .mdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mini .mnm{font-weight:700;flex-shrink:0}
.mini .mtx{color:var(--muted);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mini .due{flex-shrink:0}
.todo-group{margin-bottom:22px}
.todo-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.todo-head h3{margin:0;font-size:14px;font-weight:700}
.todo-head .n{font-size:12px;color:var(--faint);font-weight:700}
.todo{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow);
  cursor:pointer;transition:.1s;
}
.todo:hover{border-color:var(--faint)}
.todo.overdue{border-left:3px solid var(--danger)}
.todo.today{border-left:3px solid var(--accent)}
.todo .body{flex:1;min-width:0}
.todo .who{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .what{font-size:13.5px;color:var(--muted);margin-top:3px}
.todo .when{font-size:12px;font-weight:700;white-space:nowrap;padding-top:2px}
.todo .who .due{font-weight:700;flex-shrink:0}
.tacts{display:flex;gap:7px;margin-top:10px}
.tacts .btn{padding:7px 16px}
.check{
  width:20px;height:20px;border:2px solid var(--line);border-radius:6px;background:transparent;
  flex-shrink:0;margin-top:1px;display:grid;place-items:center;color:transparent;font-size:12px;
}
.check:hover{border-color:var(--ok);color:var(--ok)}

/* ---------- modal ---------- */
.overlay.ask{z-index:210;align-items:center}
.overlay.ask .modal{min-height:0;border-radius:18px}
.overlay{
  position:fixed;inset:0;background:rgba(10,12,16,.5);backdrop-filter:blur(2px);
  z-index:100;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;
}
@media(max-width:640px){.overlay{padding:0}}
.modal{
  background:var(--panel);border-radius:20px;width:100%;max-width:620px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line);overflow:hidden;
}
@media(max-width:640px){.modal{border-radius:0;min-height:100vh}}
.modal.wide{max-width:760px}
.mhead{
  padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  position:sticky;top:0;background:var(--panel);z-index:2;
}
.mhead h2{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.2px}
.mbody{padding:20px 22px}
.mfoot{
  padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;
  background:var(--panel-2);flex-wrap:wrap;
}
.mfoot .left{margin-right:auto}
.x{background:none;border:0;font-size:22px;color:var(--faint);line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--panel-2);color:var(--text)}

/* ---------- form ---------- */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{
  border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:10px 12px;
  font-size:14px;outline:none;width:100%;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea{resize:vertical;min-height:76px;line-height:1.55}
.f .hint{font-size:11.5px;color:var(--faint)}
.stagepick{display:flex;gap:6px;flex-wrap:wrap}
.sp{
  border:1.5px solid var(--line);background:var(--panel-2);border-radius:9px;padding:7px 12px;
  font-size:13px;font-weight:700;color:var(--muted);
}
.sp:hover{border-color:var(--faint)}

/* ---------- detail ---------- */
.dhero{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.dhero .avatar{width:52px;height:52px;font-size:19px}
.dhero .nm{font-size:20px;font-weight:800;letter-spacing:-.4px}
.dhero .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;font-size:14px;margin-bottom:18px}
.kv .k{color:var(--muted);font-weight:600;font-size:13px}
.kv .v{word-break:break-word}
.kv .v.empty-v{color:var(--faint)}
.memo{
  background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
  font-size:13.5px;white-space:pre-wrap;line-height:1.6;margin-bottom:18px;
}
.advance{
  display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:18px;flex-wrap:wrap;
}
.advance .t{font-size:13px;color:var(--muted);font-weight:600;flex:1}

/* ---------- log ---------- */
.logadd{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.logadd select{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:9px 10px;font-size:13.5px}
.logadd input{flex:1;min-width:150px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
.logadd input:focus{border-color:var(--accent);background:var(--panel)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.log{position:relative;padding-bottom:15px}
.log::before{
  content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);border:2px solid var(--panel);
}
.log.sys::before{background:var(--faint)}
.log .lh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.log .lt{font-size:11.5px;color:var(--faint);font-weight:600}
.log .lk{font-size:11px;font-weight:800;color:var(--accent)}
.kchip{display:inline-block;color:#fff;font-size:11.5px;font-weight:800;
  border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px;letter-spacing:.2px}
.log.sys .lk{color:var(--faint)}
.log .lx{font-size:13.5px;margin-top:2px;line-height:1.5}
.log .del{font-size:11px;color:var(--faint);background:none;border:0;padding:0 2px;opacity:0}
.log:hover .del{opacity:1}
.log .del:hover{color:var(--danger)}

/* ---------- toast ---------- */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  z-index:300;
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:10px;
  font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:.25s;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,0,0,.2);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fab{
  position:fixed;right:24px;bottom:24px;z-index:30;
  background:var(--accent);color:var(--on-accent);border:0;border-radius:50%;width:54px;height:54px;
  font-size:26px;line-height:1;box-shadow:0 6px 20px rgba(37,99,235,.4);
}
.fab:hover{filter:brightness(1.1)}
@media(min-width:900px){.fab{display:none}}
/* ---------- 니즈 · 계절 대화 · 사람 목록 ---------- */
.needs{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;
  padding:12px 14px 12px 16px;font-size:13.5px;white-space:pre-wrap;line-height:1.6;margin-bottom:18px}
.season{background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:12px 15px;margin-bottom:18px}
.season .st{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin-bottom:6px}
.season ul{margin:0;padding-left:16px}
.season li{font-size:13.5px;line-height:1.8;color:var(--text)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-bottom:4px}
.wcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.wcards .gcard{padding:11px 10px}
.wcards .gn{font-size:12.5px}
.wcards .gc{font-size:22px}
.kbreak{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line);font-size:13.5px}
.kbreak span{display:inline-flex;align-items:center;gap:5px}
.kbreak i{width:9px;height:9px;border-radius:50%;display:inline-block}
.kbreak b{color:var(--text);font-weight:800}
.listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.listhead .btn{margin-left:auto}
.c-nm{font-weight:700;white-space:nowrap;padding-right:4px}
.c-ph .tel{font-weight:600;white-space:nowrap}
.c-mem{font-size:14.5px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:.2px}
.c-ad{color:var(--muted);line-height:1.35}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;
  text-align:left;box-shadow:var(--shadow);transition:.12s}
.gcard:hover{border-color:var(--faint);transform:translateY(-1px)}
.gcard.on{border-color:var(--accent);background:var(--accent-soft)}
.gcard .gn{font-size:12.5px;font-weight:700;color:var(--muted)}
.gcard.on .gn{color:var(--accent)}
.gcard .gc{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
.gcard .gc small{font-size:12px;font-weight:600;color:var(--faint);margin-left:2px;letter-spacing:0}
.howto{background:var(--accent-soft);border-radius:11px;padding:14px 16px;margin-bottom:16px}
.ways{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.way{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;transition:.1s}
.way:hover{border-color:var(--faint)}
.way.on{border-color:var(--accent);background:var(--accent-soft)}
.way b{display:block;font-size:15px;font-weight:700}
.way span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.waybox{background:var(--accent-soft);border-radius:11px;padding:14px 16px;margin-top:-3px}
.howto .ht{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:8px}
.howto ol{margin:0;padding-left:20px}
.howto li{font-size:14.5px;line-height:1.9}
.howto b{font-weight:800}
.cal-s{font-size:14.5px;line-height:1.95;margin:0 0 13px;padding-left:19px}
.cal-s b{font-weight:800}
.irows{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:1.1fr 1.3fr 2fr 30px;gap:6px;align-items:center}
.irow input{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;
  padding:8px 10px;font-size:14.5px;outline:none;width:100%;min-width:0}
.irow input:focus{border-color:var(--accent);background:var(--panel)}
.irowhead{display:grid;grid-template-columns:1.1fr 1.3fr 2fr 30px;gap:6px;
  font-size:12.5px;color:var(--faint);font-weight:700;padding:0 3px 3px}
.rdel{background:none;border:0;color:var(--faint);font-size:19px;line-height:1;
  padding:2px 5px;border-radius:6px}
.rdel:hover{color:var(--danger);background:var(--s5b)}
.newgrp{display:flex;gap:6px;margin-top:6px}
.newgrp input,.newgrp textarea{flex:1;min-width:0;border:1px solid var(--accent);background:var(--panel);
  border-radius:9px;padding:8px 11px;font-size:13.5px;outline:none;resize:vertical;line-height:1.5}
.newgrp textarea{flex:1 1 100%}
.chkline{padding:4px 0;line-height:1.55}
.chkline+.chkline{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
/* ---------- 리더 메시지 ---------- */
.ntc .modal{max-width:440px}
.ntc-top{background:var(--accent);color:var(--on-accent);padding:16px 18px}
.ntc-top .kn{font-size:12.5px;opacity:.85;letter-spacing:.02em}
.ntc-top h2{font-size:19px;font-weight:800;margin-top:3px;line-height:1.4;color:var(--on-accent)}
.ntc-body{padding:18px;font-size:16px;line-height:1.75;color:var(--text);white-space:pre-wrap;
  word-break:keep-all}
.ntc-img{width:100%;border-radius:11px;margin-top:14px;display:block;background:#fff;
  border:1px solid var(--line)}
.ntc-tap{text-align:center;font-size:12.5px;color:var(--faint);padding-top:7px}
.ntc-when{font-size:12.5px;color:var(--faint);padding:0 18px 4px}

/* ---------- 어록 ---------- */
.qwrap{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;
  -webkit-overflow-scrolling:touch}
.qbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:13px 15px;background:var(--accent);color:var(--on-accent)}
.qbar b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:var(--on-accent)}
.qnote{padding:14px 18px 4px;font-size:13.5px;color:var(--faint)}
.qbody{padding:8px 18px 60px;max-width:680px;margin:0 auto}
.qb{margin-bottom:20px}
.qb .lead{display:flex;gap:8px;font-size:17px;font-weight:700;line-height:1.65;
  color:var(--text);word-break:keep-all}
.qb .lead i{flex:0 0 auto;color:var(--accent);font-style:normal}
.qb .sub{font-size:16px;line-height:1.75;color:var(--muted);margin:6px 0 0 20px;
  word-break:keep-all}
.qend{text-align:center;color:var(--faint);font-size:13.5px;padding:10px 0 30px}

/* ---------- 월별 일정표 ---------- */
.slots{display:flex;gap:8px}
.sbtn{flex:1;min-width:0;text-align:center;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 8px;font-size:14.5px;font-weight:700;line-height:1.35}
.sbtn:active{filter:brightness(.95)}
.shotwrap{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.93);overflow:auto;
  -webkit-overflow-scrolling:touch}
.shotbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:7px;padding:11px 13px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.shotbar b{flex:1;color:#fff;font-size:15px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shotbar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.shotbody{min-height:40vh}
.shotimg{display:block;margin:0 auto;max-width:100%;background:#fff}
.shotimg.big{max-width:none;margin:0}
.shotload,.shotnone{color:rgba(255,255,255,.8);text-align:center;padding:60px 24px;
  font-size:15px;line-height:1.6}
.shothint{color:rgba(255,255,255,.62);text-align:center;font-size:13px;padding:10px 16px 30px}

.teamrow{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:7px 0 1px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.teamrow::-webkit-scrollbar{display:none}
.tlabel{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--faint);padding-right:1px}
.tchip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tchip.add{color:var(--faint);border-style:dashed}
.trow{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:7px;background:var(--panel)}
.trow b{flex:1;font-size:15px;font-weight:700}
.trow .n{font-size:13px;color:var(--muted)}
#newbar{position:fixed;left:0;right:0;top:0;z-index:120;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 16px;
  background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;
  box-shadow:0 3px 14px rgba(0,0,0,.18)}
#newbar .btn{background:var(--on-accent);border-color:var(--on-accent);color:var(--accent)}
#newbar .btn.ghost{background:transparent;border-color:var(--on-accent);color:var(--on-accent)}
.bkwarn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;
  margin-top:10px;font-size:14px;color:var(--muted);border-color:var(--s4)}
.bkwarn b{color:var(--text)}
.bkwarn .btn{margin-left:auto;white-space:nowrap}
.nbox{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:14px}
.nrow{display:flex;flex-direction:column;gap:4px}
.nk{font-size:12.5px;font-weight:800;color:var(--accent);letter-spacing:.2px}
.nx{white-space:pre-wrap;line-height:1.65;font-size:15px}
.dtrow{display:flex;gap:9px;margin-bottom:12px}
.dtf{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dtf label{font-size:13px;font-weight:700;color:var(--muted)}
.dtf input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;
  padding:10px 11px;font-size:15.5px;outline:none}
.dtf input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.infoline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-bottom:18px}
.infoline b{color:var(--faint);font-weight:600;margin-right:5px;font-size:12.5px}
/* ============================================================
   글씨 크기 — 눈이 편하도록 전반적으로 키운 기본값

/* ============================================================
   모바일 (아이폰 등) — 640px 이하
   ============================================================ */
@media(max-width:640px){
  body{font-size:17px}
  .wrap{padding:0 14px calc(96px + env(safe-area-inset-bottom))}
  .top-in{padding:10px 14px 0;gap:10px}
  .brand h1{font-size:18px}
  .brand .sub{display:none}
  .brand{gap:5px}
  #btnNew{display:none}                    /* 아래 + 버튼이 대신한다 */
  .brand .btn.sm{padding:7px 10px;font-size:14.5px;min-height:36px}
  #btnZoomOut,#btnZoomIn,#btnTheme{padding:7px 8px}
  .tab{padding:10px 8px;font-size:16px}
  .tabs{gap:0}
  .tab .cnt{margin-left:4px;font-size:12.5px}
  .section-title{margin:22px 0 9px;font-size:14.5px}

  /* iOS는 입력칸 글자가 16px보다 작으면 화면을 확대해버린다 */

  .btn{padding:10px 14px;font-size:15px;min-height:42px}
  .tchip{font-size:14.5px;padding:6px 13px}
  .sbtn{font-size:15.5px;padding:14px 8px}
  .qb .lead{font-size:18px}
  .qb .sub{font-size:17px}
  .ntc-body{font-size:17px}
  .ntc-top h2{font-size:20px}
  .shothint{font-size:14px}
  .tlabel{font-size:13px}
  .btn.sm{padding:8px 12px;font-size:14px;min-height:38px}
  .chip{padding:9px 14px;font-size:14px}

  .pipeline{grid-template-columns:repeat(3,1fr);gap:6px}
  .pstage{padding:9px 8px;border-radius:11px}
  .pstage .nm{font-size:12px;line-height:1.25}
  .pstage .n{font-size:19px}
  .pstage .desc{display:none}
  .gcards{grid-template-columns:1fr 1fr;gap:8px}
  .wcards{grid-template-columns:repeat(3,1fr);gap:7px}
  .wcards .gcard{padding:10px 8px}
  .wcards .gn{font-size:13px}
  .wcards .gc{font-size:23px}

  /* 표를 카드로 — 옆으로 밀지 않고 아래로 읽는다 */
  .tablewrap{border:0;background:transparent;box-shadow:none;overflow:visible}
  table{min-width:0;display:block}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:block;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow)}
  tbody td{display:flex;gap:10px;border:0;padding:5px 0;align-items:flex-start;font-size:16px}
  tbody td:first-child{padding:0 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
  tbody td[data-l]::before{content:attr(data-l);flex:0 0 80px;color:var(--faint);
    font-size:13.5px;font-weight:700;padding-top:3px}
  tbody td:empty{display:none}
  .nm-cell{font-size:17px}
  .crow{padding:12px 14px}
  .cnm{font-size:16.5px}
  .tel.row{font-size:15px;padding:2px 0}
  .cmem{font-size:15px}
  .cact{font-size:15.5px}
  .tablewrap.simple{border:1px solid var(--line);background:var(--panel);
    border-radius:12px;overflow-x:auto;box-shadow:var(--shadow)}
  .tablewrap.simple table{display:table;min-width:0;width:100%}
  .tablewrap.simple thead{display:table-header-group}
  .tablewrap.simple tbody{display:table-row-group}
  .tablewrap.simple tbody tr{display:table-row;background:transparent;border:0;
    border-radius:0;padding:0;margin:0;box-shadow:none}
  .tablewrap.simple tbody td{display:table-cell;border-bottom:1px solid var(--line);
    padding:10px 6px;font-size:14.5px;vertical-align:middle}
  .tablewrap.simple tbody td:first-child{padding-left:11px}
  .tablewrap.simple tbody td:last-child{padding-right:11px}
  .tablewrap.simple th{padding:9px 6px;font-size:12px}
  .tablewrap.simple .sdot{width:7px;height:7px;margin-right:5px}
  .c-ad{font-size:14px}
  .c-ph .tel{font-size:14.5px}
  .c-mem{font-size:14.5px}
  .tablewrap.simple tbody td::before{content:none}
  .tablewrap.simple tbody tr:last-child td{border-bottom:0}
  .tablewrap.simple th{padding:11px 10px}
  .tel{padding:5px 0}
  .tel.big{font-size:17px}
  .avatar{width:34px;height:34px;font-size:13.5px}

  .todo{padding:14px 15px}
  .todo .who{font-size:16.5px}
  .todo .what{font-size:16px;margin-top:4px}
  .todo .when{font-size:13.5px}
  .check{width:24px;height:24px}
  .todo-head h3{font-size:15px}

  /* 모달 */
  .mhead{padding:15px 16px}
  .mhead h2{font-size:18px}
  .mbody{padding:16px}
  .mfoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .dhero{flex-wrap:wrap;gap:12px}
  .dhero .avatar{width:46px;height:46px;font-size:17px}
  .dhero .nm{font-size:21px}
  .dhero > .btn{width:100%}
  .frow{gap:10px;margin-bottom:10px}
  .kv,.infoline{font-size:15px}
  .nx{font-size:16px}
  .nk{font-size:13.5px}
  .memo,.needs{font-size:16px}
  .season li{font-size:16px}
  .stagepick{gap:7px}
  .sp{padding:9px 13px;font-size:14px}

  .dtrow{gap:8px}
  .dtf label{font-size:14px}
  .dtf input{font-size:16px;padding:11px}
  .btnrow .btn{flex:1 1 auto;text-align:center;justify-content:center}
  .logadd{flex-wrap:wrap;gap:8px}
  .logadd input{flex:1 1 100%;order:1}
  .logadd select{order:2;flex:1}
  .logadd .btn{order:3}
  .newgrp{flex-wrap:wrap}
  .newgrp input{flex:1 1 100%}
  .irowhead{display:none}
  .irow{grid-template-columns:1fr 1fr;padding:11px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel-2);gap:7px}
  .irow input[data-k="memo"]{grid-column:1/-1}
  .irow .rdel{grid-column:2;justify-self:end}
  .howto li{font-size:15.5px}

  .fab{right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:28px}
  #toast{bottom:calc(90px + env(safe-area-inset-bottom));font-size:14.5px}
}
.hide{display:none !important}
/* ===== 성장노트 ===== */
.gx-pad{padding:15px 16px}
.gx-lb{display:block;font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:6px}
.gx-sub{font-weight:600;color:var(--muted);font-size:13px}
.gx-note{margin:9px 0 12px;font-size:13.5px;color:var(--muted);font-weight:600}
.gx-empty{color:var(--muted);font-size:14px;font-weight:600;padding:8px 0}
.gx-chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--panel-2);color:var(--text)}
.gx-btns{display:flex;flex-wrap:wrap;gap:8px}
.gx-out{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px;

.gx-scroll{overflow-x:auto}
.gx-d{font-weight:700}.gx-d.up{color:var(--ok)}.gx-d.dn{color:var(--danger)}
.gx-datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;

.gx-datebar b{font-size:16px;font-weight:700}
.gx-lv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gx-lvb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;
  font-size:14.5px;font-weight:700;color:var(--text)}
.gx-lvb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gx-hint{font-size:13.5px;font-weight:600;color:var(--muted);flex:1;min-width:180px}
.gx-mnav{float:right;display:flex;gap:6px}

/* 이름 상자 */
.gx-idbox{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 16px;margin-bottom:12px}
@media(max-width:560px){.gx-idbox{grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}}
.gx-idbox label{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;font-weight:700;color:var(--muted)}
.gx-idbox input,.gx-idbox select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--panel-2);
  font-family:'Gowun Batang',serif;font-weight:700;font-size:16px;color:var(--text);width:100%;min-width:0}

/* 히어로 */
.gx-hero{border-radius:16px;padding:22px 22px 20px;color:#F7EDF0;position:relative;overflow:hidden;
  background:linear-gradient(158deg,#33212A 0%,#4C2F3C 48%,#653D4C 100%);box-shadow:0 14px 34px -22px rgba(60,30,45,.7)}
.gx-why{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.gx-why span{font-size:13.5px;font-weight:700;letter-spacing:.06em;color:#F0D3DC}
.gx-why input{background:transparent;border:0;border-bottom:1px dashed rgba(224,190,203,.45);border-radius:0;
  color:#FFFFFF;font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(21px,4.8vw,29px);padding:5px 2px;width:100%}
.gx-why input:focus{outline:none;border-bottom-color:#E9BACB;border-bottom-style:solid}
.gx-meta{display:flex;flex-wrap:wrap;gap:20px;margin-top:18px}
.gx-meta .k{font-size:13px;font-weight:700;letter-spacing:.04em;color:#F0D3DC;display:block}
.gx-meta .v{font-family:'Gowun Batang',serif;font-size:24px;font-weight:700;color:#FFFFFF}
.gx-meta .v small{font-size:13px;color:#F0D3DC;margin-left:2px}
.gx-meta .bar{flex:1;min-width:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.gx-meta .tr{height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;display:block}
.gx-meta .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#B4778D,#EBBACB)}

/* 궤도 */
.gx-pinwrap{overflow-x:auto}
.gx-pins{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;min-width:560px}
.gx-pin{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 5px 5px;display:flex;flex-direction:column}
.gx-pin.now{background:var(--accent-soft);border-color:var(--accent)}
.gx-pin input{border:0;background:transparent;text-align:center;font-family:'Gowun Batang',serif;
  font-weight:700;font-size:17px;padding:2px;width:100%}
.gx-pin input:focus{outline:none}
.gx-pin span{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.gx-arrow{overflow-x:auto}
.gx-arrow svg{display:block;width:100%;min-width:620px;height:auto}
.gx-sub3{display:grid;grid-template-columns:18px 1fr;gap:7px;align-items:center;margin-top:6px}
.gx-sub3 span{font-family:'Gowun Batang',serif;font-size:14px;font-weight:700;color:var(--text);text-align:center}

/* 목표 */
.gx-goal{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gx-goal:last-child{border-bottom:0}
.gx-goal .n{font-size:15.5px;font-weight:700}
.gx-goal .s{font-size:13.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px}
.gx-goal .s input{width:64px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.gx-goal .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;position:relative}
.gx-goal .tr i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.gx-goal .tr u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--faint);opacity:.6}
.gx-goal .f{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;font-weight:600;color:var(--text)}
.gx-pace{font-weight:700;padding:2px 8px;border-radius:5px;font-size:13px}
.gx-pace.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.gx-pace.no{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--panel))}

/* 점수판 */
.gx-board{display:grid;grid-template-columns:minmax(210px,.8fr) 1fr;gap:12px;margin-bottom:14px}
@media(max-width:700px){.gx-board{grid-template-columns:1fr}}
.gx-ring{padding:16px;display:flex;align-items:center;gap:14px;position:relative}
.gx-ring .c{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:110px;text-align:center}
.gx-ring .c b{display:block;font-family:'Gowun Batang',serif;font-size:29px;line-height:1}
.gx-ring .c span{font-size:12.5px;font-weight:700;color:var(--muted)}
.gx-ring .s{margin-left:auto;text-align:right}
.gx-ring .s .k{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.gx-ring .s b{font-family:'Gowun Batang',serif;font-size:25px}
.gx-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}
.gx-tiles.gx-t4{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.gx-tiles,.gx-tiles.gx-t4{grid-template-columns:repeat(2,1fr)}}
.gx-tiles > div{min-width:0}
.gx-tiles .k{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.gx-tiles b{font-family:'Gowun Batang',serif;font-size:26px;line-height:1.15;display:block}
.gx-tiles b small{font-size:13px;color:var(--muted);font-family:inherit;font-weight:500}
.gx-tiles .d{font-size:13.5px;font-weight:600;color:var(--text)}
.gx-gS{color:var(--accent)}.gx-gA{color:var(--ok)}.gx-gB{color:var(--s4)}.gx-gD{color:var(--danger)}

/* 코어 입력 */
.gx-core{padding:14px 0;border-bottom:1px solid var(--line)}
.gx-core:first-child{padding-top:0}
.gx-core:last-child{border-bottom:0;padding-bottom:0}
.gx-ch{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.gx-ch .no{font-family:'Gowun Batang',serif;font-weight:700;font-size:14px;color:var(--accent);
  width:24px;height:24px;border-radius:6px;background:var(--accent-soft);display:grid;place-content:center}
.gx-ch b{font-size:16.5px}
.gx-ch small{color:var(--muted);font-size:13.5px;font-weight:600}
.gx-ch .st{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--text)}
.gx-ch .st.done{color:var(--accent)}
.gx-ch .mini{width:52px;height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:block}
.gx-ch .mini u{display:block;height:100%;background:var(--accent)}
.gx-core input[type=text],.gx-core select{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;background:var(--panel-2)}
.gx-pair{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1.8fr);gap:7px;align-items:center;margin-top:7px}
@media(max-width:600px){.gx-pair{grid-template-columns:20px 1fr}.gx-pair input:last-child{grid-column:2}}
.gx-pair span{text-align:center;font-family:'Gowun Batang',serif;font-size:14px;font-weight:700;color:var(--text)}
.gx-more{margin-top:9px;border:1px dashed var(--muted);background:transparent;border-radius:9px;
  padding:9px 16px;font-size:14px;font-weight:700;color:var(--text)}
.gx-add{display:flex;gap:7px;flex-wrap:wrap}
.gx-add input,.gx-add select{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel-2)}
.gx-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gx-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
  border-radius:8px;padding:5px 10px;font-size:14px;font-weight:700}
.gx-tag.miss{background:color-mix(in srgb,var(--danger) 12%,var(--panel));color:var(--danger)}
.gx-tag small{color:var(--muted);font-weight:600}
.gx-tag button{border:0;background:transparent;color:inherit;opacity:.55;padding:0 2px}
.gx-week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.gx-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:9px;
  border:1px solid transparent;background:var(--panel-2)}
.gx-day.on{border-color:var(--accent);background:var(--accent-soft)}
.gx-day.fut{opacity:.4}
.gx-day .w{font-size:12.5px;font-weight:700;color:var(--muted)}
.gx-day .n{font-size:14px;font-weight:700}
.gx-day .b{width:100%;height:44px;display:flex;align-items:flex-end;background:var(--panel);border-radius:5px;overflow:hidden}
.gx-day .b i{display:block;width:100%;border-radius:4px 4px 0 0}
.gx-day .s{font-size:13px;font-weight:700;color:var(--text)}
.gx-vow{display:flex;gap:12px;padding:13px 15px;border-radius:12px;background:var(--accent-soft);
  border:1px solid var(--accent);margin-bottom:12px}
.gx-vow .k{font-family:'Gowun Batang',serif;font-weight:700;font-size:13px;color:var(--accent);
  white-space:nowrap;border-right:1px solid var(--accent);padding-right:12px}
.gx-vow .q{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;margin-bottom:4px}
.gx-vow ol{margin:0;padding-left:17px;font-size:14px;font-weight:600;color:var(--text)}

/* 통계 */
.gx-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.gx-2col{grid-template-columns:1fr}}
.gx-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gx-cal .h{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.gx-cal .c{aspect-ratio:1/1;border-radius:6px;border:1px solid var(--line);display:grid;place-content:center;
  font-size:13px;font-weight:700;color:var(--text)}
.gx-cal .c.blank{border-color:transparent}
.gx-cal .c.today{outline:2px solid var(--accent);outline-offset:1px}
.gx-pb{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.gx-pb:last-child{border-bottom:0}
.gx-pb .t{font-size:15px;font-weight:700}
.gx-pb .n{font-size:13.5px;font-weight:600;color:var(--text);text-align:right}
.gx-pb .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.gx-pb .tr i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.gx-pb.mid .tr i{background:var(--s4)}.gx-pb.low .tr i{background:var(--danger)}
.gx-tb{width:100%;border-collapse:collapse}
.gx-tb th,.gx-tb td{text-align:right;padding:8px 5px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.gx-tb th:first-child,.gx-tb td:first-child{text-align:left}
.gx-tb thead th{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.gx-tb tbody tr:last-child td{border-bottom:0}
.gx-tb .mu{color:var(--muted)}
.gx-tb.gx-wide{min-width:660px}
.gx-tb input{border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--panel-2)}
.gx-adv{display:flex;gap:11px;padding:12px 14px;border-radius:11px;background:var(--accent-soft);
  border:1px solid var(--accent);margin-top:11px}
.gx-adv .k{font-family:'Gowun Batang',serif;font-weight:700;font-size:13px;color:var(--accent);
  white-space:nowrap;border-right:1px solid var(--accent);padding-right:11px}
.gx-adv p{margin:0;font-size:14.5px;font-weight:600;line-height:1.65}
.gx-adv.warn{background:var(--s4b);border-color:var(--s4)}
.gx-adv.warn .k{color:var(--s4);border-right-color:var(--s4)}
.gx-curve{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:9px;align-items:end}
.gx-cb{display:flex;flex-direction:column;align-items:center;gap:5px}
.gx-cb .v{font-size:13.5px;font-weight:700;color:var(--text)}
.gx-cb .t{width:100%;height:84px;background:var(--panel-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.gx-cb .t i{display:block;width:100%;border-radius:4px 4px 0 0}
.gx-cb .l{font-size:13px;font-weight:700;color:var(--muted)}
.gx-day-log{padding:11px 0;border-bottom:1px solid var(--line)}
.gx-day-log:last-child{border-bottom:0}
.gx-day-log .h{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.gx-day-log .h span{color:var(--muted)}
.gx-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gx-item{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:14px;font-weight:600}
.gx-leg{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--panel-2);margin-bottom:10px}
.gx-leg .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gx-leg .h b{font-family:'Gowun Batang',serif;font-size:17px}
.gx-leg .h small{color:var(--muted)}
.gx-leg .h .sc{margin-left:auto;font-family:'Gowun Batang',serif;font-size:19px;font-weight:700}
.gx-leg .bars{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel);margin:8px 0 7px}
.gx-leg .bars i{display:block;height:100%}
.gx-leg .mini{font-size:14px;font-weight:600;color:var(--text)}
.gx-goals4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.gx-goals4{grid-template-columns:repeat(2,1fr)}}
.gx-goals4 label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--text)}
.gx-goals4 input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel-2);width:100%}
.gx-mine{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-radius:11px;
  background:var(--accent-soft);border:1px solid var(--accent);flex-wrap:wrap}
.gx-mine .k{font-size:12.5px;color:var(--accent);font-weight:700}
.gx-mine b{font-family:'Gowun Batang',serif;font-size:26px;color:var(--accent)}
.gx-mine b small{font-size:13px;margin-left:1px}
.gx-mine .d{font-size:14px;font-weight:600;color:var(--text)}
.gx-tb tr.gx-me td{background:var(--accent-soft);font-weight:700}

/* 성장노트 메뉴는 푸른빛으로 구분 */
.tab[data-view^="g"]{color:var(--s2);font-weight:700}
.tab[data-view^="g"]:hover{color:var(--s2)}
.tab[data-view^="g"].on{color:var(--s2);border-bottom-color:var(--s2)}

.tabsep{flex:0 0 1px;align-self:center;height:18px;background:var(--line);margin:0 4px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>섬김성장노트</h1>
      <span class="sub" id="savedAt"></span>
      <span class="spacer"></span>
      <button class="btn sm ghost" id="btnZoomOut" title="글씨 작게">가－</button>
      <button class="btn sm ghost" id="btnZoomIn" title="글씨 크게">가＋</button>
      <button class="btn sm ghost" id="btnTheme" title="화면 밝기">◐</button>
      <button class="btn sm" id="btnData">데이터</button>
      <button class="btn sm primary" id="btnNew">+ 새 고객</button>
    </div>
    <div class="teamrow" id="teamBar"></div>
    <nav class="tabs">
      <button class="tab on" data-view="dash">🏠 홈</button>
      <button class="tab" data-view="list">고객 목록 <span class="cnt" id="cntList"></span></button>
      <button class="tab" data-view="acts">섬김활동 <span class="cnt" id="cntActs"></span></button>
      <button class="tab" data-view="groups">명단분류</button>
      <span class="tabsep"></span>
      <button class="tab" data-view="gvision">비전 · 목표</button>
      <button class="tab" data-view="gself">자기섬김</button>
      <button class="tab" data-view="ggrow">성장활동</button>
      <button class="tab" data-view="gstats">성장통계</button>
      <button class="tab" data-view="gteam">리더성장</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="view"></div>
</div>

<button class="fab" id="fabNew">+</button>
<div id="modal"></div>
<div id="toast"></div>

<script>
const APP_VER = '20260904-1600';   // 새 내용이 올라왔는지 알아보는 표시

/* ============================================================
   섬김노트 — 데이터
   ============================================================ */
const KEY = 'crm.amway.v1';
const KEY_TEAM = 'crm.amway.v1.team';   // 지금 보고 있는 팀 — 기기마다 따로 기억한다
const KEY_BAK = 'crm.amway.v1.bak';   // 같은 내용을 한 벌 더 — 하나가 깨져도 살린다
let LOAD_BROKEN = null;               // 읽지 못한 원본이 있으면 여기 담아 두고 덮어쓰지 않는다

// 이 기기에서 자료가 실제로 남는지 살펴본다 (사생활 보호 모드 등에서는 저장이 막힌다)
const STORAGE_OK = (() => {
  try{
    const k = '__chk';
    localStorage.setItem(k, '1');
    const v = localStorage.getItem(k);
    localStorage.removeItem(k);
    return v === '1';
  }catch(e){ return false; }
})();

const STAGES = [
  { id:'prospect', name:'예상고객',  desc:'아직 만나기 전 · 인연을 맺어갈 분',       c:'--s1', b:'--s1b' },
  { id:'consumer', name:'소비자',     desc:'제품을 한 번 경험해 보신 분',           c:'--s2', b:'--s2b' },
  { id:"learner",  name:"학습소비자", desc:"제품과 사업을 배워가고 있는 분",      c:"--s6", b:"--s6b" },
  { id:'loyal',    name:'애용자',     desc:'꾸준히 사용하며 신뢰를 주신 분',             c:'--s3', b:'--s3b' },
  { id:'partner',  name:'사업자',     desc:'함께 사업을 시작한 파트너',                   c:'--s4', b:'--s4b' },
  { id:'core',     name:'코어사업자', desc:'스스로 팀을 세워가는 핵심 파트너',            c:'--s5', b:'--s5b' },
];
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const stageIdx = id => Math.max(0, STAGES.findIndex(s => s.id === id));

// 명단분류 — 기본 목록. 사용자가 얼마든지 더 추가할 수 있다
const DEFAULT_GROUPS = ['친정식구','시댁식구','초등친구','중등친구','고등친구','대학친구',
                        '이전직장','현직장','이전이웃','현재이웃','자모모임'];
const NOGROUP = '미분류';

// 활동 기록 항목 — 나눠 놓지 않고 한 줄로 고른다
const LOG_KINDS = ['통화','제품첫구매','제품재구매','미팅참석','후기제공','후기나눔',
                   '자료제공','음원프로모션','문고리','만남'];

// 기록표에 붙는 색 — 자동으로 남는 것만 따로 보이게 한다
function kindColor(kind){
  if(kind === '완료') return '--s2';     // 다음 섬김을 마쳤을 때 저절로 남는 기록
  if(kind === '성장') return '--s3';     // 단계가 올랐을 때
  return '--accent';
}

// 섬김카드의 계절 질문 — 자연스럽게 가족·인맥 이야기를 여는 대화거리
// 대화거리 — 팀에서 함께 쓰는 문구. 바꾸시려면 이 목록만 고쳐 다시 올리면 됩니다.
const SEASON_QA = [
  { m:[1,2],   q:['설날에는 가족들이 많이 모이시나요?'] },
  { m:[3,4],   q:['꽃구경 다녀오셨나요?','누구랑 주로 다니세요?'] },
  { m:[5,6],   q:['어버이날에는 요즘 주로 뭐 하시나요?'] },

// 예전 버전(가족·인맥이 표 형태)에서 저장한 자료를 메모장 글로 바꿔 이어받는다
function migrate(d){
  if(!Array.isArray(d.groups) || !d.groups.length) d.groups = DEFAULT_GROUPS.slice();
  if(!Array.isArray(d.teams)) d.teams = [];
  // 예전 자료에 팀명이 적혀 있으면 목록으로 살려둔다
  (d.people || []).forEach(p => {
    if(p.team && !d.teams.includes(p.team)) d.teams.push(p.team);
  });
  (d.people || []).forEach(p => {
    // 예전에 '알게 된 경로'로 자유롭게 적어둔 값도 분류로 살려둔다
    if(p.source && !d.groups.includes(p.source)) d.groups.push(p.source);
    if(Array.isArray(p.family)){
      p.family = p.family.map(f =>
        [f.rel, f.name, f.age, f.job].filter(Boolean).join(' ') + (f.need ? ' — ' + f.need : '')
      ).join('\n');
    }
    if(Array.isArray(p.network)){
      p.network = p.network.map(n =>
        [n.rel, n.name].filter(Boolean).join(' ') + (n.memo ? ' — ' + n.memo : '')
      ).join('\n');
    }
    if(typeof p.family  !== 'string') p.family  = '';
    if(typeof p.network !== 'string') p.network = '';

    // 예전에 '시스템'으로 묻혀 있던 완료·성장 기록을 되살린다
    (p.logs || []).forEach(l => {
      if(l.kind !== '시스템') return;
      if(/^완료:\s*/.test(l.text)){
        l.kind = '완료';
        l.text = l.text.replace(/^완료:\s*/, '');
      }else if(/\s→\s/.test(l.text)){
        l.kind = '성장';
      }
    });
  });
  return d;
}

function today(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function toDate(s){
  if(!s) return null;
  const p = String(s).split('-').map(Number);
  if(p.length < 3 || isNaN(p[0])) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysFromToday(s){
  const d = toDate(s);
  if(!d) return null;
  return Math.round((d - today()) / 86400000);
}
function fmtDue(s){
  const n = daysFromToday(s);
  if(n === null) return { txt:'—', cls:'none' };
  if(n === 0)  return { txt:'오늘', cls:'today' };
  if(n === 1)  return { txt:'내일', cls:'today' };
  if(n < 0)    return { txt:`${-n}일 지남`, cls:'over' };
  if(n <= 7)   return { txt:`${n}일 후`, cls:'' };
  return { txt:s.slice(5).replace('-','/'), cls:'' };
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${String(d.getMonth()+1)}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function pad2(n){ return String(n).padStart(2, '0'); }
function fmtTimeK(t){
  if(!t) return '';
  const p = String(t).split(':').map(Number);
  if(isNaN(p[0])) return '';
  const ap = p[0] < 12 ? '오전' : '오후';
  const hh = p[0] % 12 === 0 ? 12 : p[0] % 12;
  return p[1] ? `${ap} ${hh}:${pad2(p[1])}` : `${ap} ${hh}시`;
}

// 캘린더 표준 파일 — 아이폰 · 구글 · 네이버 모두 읽는다
function icsText(p){
  const d = p.nextDate.replace(/-/g, '');
  let start, end, allDay = false;
  if(p.nextTime){
    const t = p.nextTime.split(':').map(Number);
    start = `${d}T${pad2(t[0])}${pad2(t[1])}00`;
    const e = (t[0] + 1) % 24;
    end   = `${d}T${pad2(e)}${pad2(t[1])}00`;
  }else{
    allDay = true;
    const nd = toDate(p.nextDate); nd.setDate(nd.getDate() + 1);
    start = d;
    end   = `${nd.getFullYear()}${pad2(nd.getMonth()+1)}${pad2(nd.getDate())}`;
  }
  const q = v => String(v || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//섬김노트//KO', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${p.id}-${d}@seomgim`,
    `DTSTAMP:${stamp}`,
    allDay ? `DTSTART;VALUE=DATE:${start}` : `DTSTART:${start}`,
    allDay ? `DTEND;VALUE=DATE:${end}`     : `DTEND:${end}`,
    `SUMMARY:${q(p.name + ' — ' + (p.nextAction || '섬김활동'))}`,
    `DESCRIPTION:${q(p.phone || '')}`,
    'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:섬김활동', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}

// 주는 월요일에 시작한다. 0 = 이번 주, 1 = 지난주, 2 = 지지난주 …
function weekStart(d){

  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;

function weekIndex(at){
  return Math.round((weekStart(new Date()) - weekStart(new Date(at))) / (7 * 86400000));
}
const DOW = ['일','월','화','수','목','금','토'];
// 주소는 광역시·도 + 시·군·구까지 (예: 경기도 남양주시). 적어주신 그대로 보여드린다.
const SIDO_LIST = [
  '서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시',
  '세종특별자치시','강원특별자치도','전북특별자치도','제주특별자치도',
  '경기도','강원도','충청북도','충청남도','전라북도','전라남도','경상북도','경상남도','제주도',
  '서울','부산','대구','인천','광주','대전','울산','세종','경기','강원',
  '충북','충남','전북','전남','경북','경남','제주',
].sort((a, b) => b.length - a.length);      // 긴 이름부터 맞춰본다

function shortAddr(a){
  if(!a) return '';
  let str = String(a).trim();
  // 붙여 쓴 주소도 갈라낸다: '경기도남양주시' → '경기도 남양주시'
  for(const p of SIDO_LIST){
    if(str.startsWith(p)){ str = p + ' ' + str.slice(p.length).trim(); break; }
  }
  const t = str.split(/\s+/).filter(Boolean);
  if(!t.length) return '';
  const out = [t[0]];
  // 시·군·구를 하나 더 붙인다. '남양주'처럼 '시'를 빼고 적으셔도 잡히도록,
  // 읍·면·동·리·로·길·번지 같은 아래 단위가 나오면 거기서 멈춘다.
  const LOWER = /(동|읍|면|리|로|길|가|번지|번길)$|^\d/;
  for(let i = 1; i < t.length && out.length < 2; i++){
    if(LOWER.test(t[i])) break;
    out.push(t[i]);
  }
  return out.join(' ');
}

function shortDay(at){
  const d = new Date(at);
  return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
}

// 숫자만 남기고 자동으로 - 를 넣는다
// 번호를 누르면 전화를 걸어보고, 동시에 번호를 복사해 둔다.
// 클로드 안에서 열린 페이지는 보안 때문에 전화 앱을 직접 못 열 수 있어서,
// 그때는 복사해 둔 번호를 전화 앱에 붙여넣으면 된다.
// mode: 'big' 상세화면 · 'row' 고객목록(아이콘 있음) · 그 외 아이콘 없이
function telLink(phone, mode){
  if(!phone) return '';
  const digits = String(phone).replace(/[^0-9+]/g, '');
  if(!digits) return esc(phone);
  const cls = mode === 'big' ? 'tel big' : (mode === 'row' ? 'tel row' : 'tel');
  const ic  = (mode === 'big' || mode === 'row') ? '📞 ' : '';
  return `<a class="${cls}" href="tel:${esc(digits)}"
            data-tel="${esc(digits)}" data-raw="${esc(phone)}">${ic}${esc(phone)}</a>`;
}

// 목록에서 번호를 누르면 전화만 걸리고 뒤의 줄은 열리지 않게
function tapPhone(e){ e.stopPropagation(); }

function fmtPhone(v){
  const d = String(v || '').replace(/[^0-9]/g, '').slice(0, 11);
  if(d.length < 4) return d;
  if(d.startsWith('02')){                                  // 서울 지역번호
    if(d.length <= 5) return d.slice(0,2) + '-' + d.slice(2);
    if(d.length <= 9) return d.slice(0,2) + '-' + d.slice(2,5) + '-' + d.slice(5);
    return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
  }
  if(d.length <= 7)  return d.slice(0,3) + '-' + d.slice(3);
  if(d.length <= 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
}
function initials(name){
  const n = String(name || '?').trim();
  return n.length <= 2 ? n : n.slice(-2);
}
function avatarColor(id){
  const palette = ['#8b5cf6','#0ea5e9','#10b981','#f59e0b','#e11d48','#6366f1','#14b8a6','#f97316'];
  let h = 0;
  for(const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}
// 브라우저 기본 확인창은 이 안에서 막히므로 화면 안에 직접 그린다

function filtered(){
  const q = Q.trim().toLowerCase();
  let out = people().filter(p => {
    if(FILTER !== 'all' && p.stage !== FILTER) return false;
    if(!q) return true;
    const hay = [p.name, p.phone, p.email, p.source, p.sponsor, p.memo, p.nextAction, (p.tags||[]).join(' ')]
      .join(' ').toLowerCase();
    return hay.includes(q);
  });
  out.sort((a,b) => {
    if(SORT === 'name')  return a.name.localeCompare(b.name, 'ko');
    if(SORT === 'stage') return stageIdx(b.stage) - stageIdx(a.stage) || a.name.localeCompare(b.name,'ko');
    if(SORT === 'new')   return (b.createdAt||'').localeCompare(a.createdAt||'');
    // next: 다음 할 일 빠른 순, 없는 건 뒤로
    const av = (a.nextDate || '9999-99-99') + (a.nextTime || '99:99');
    const bv = (b.nextDate || '9999-99-99') + (b.nextTime || '99:99');
    return av.localeCompare(bv) || a.name.localeCompare(b.name,'ko');
  });
  return out;
}
function todos(){
  return people()
    .filter(p => p.nextAction || p.nextDate)
    .sort((a,b) => ((a.nextDate||'9999-99-99') + (a.nextTime||'99:99'))
      .localeCompare((b.nextDate||'9999-99-99') + (b.nextTime||'99:99')));
}

    .filter(l => l.kind !== '시스템')
    .sort((a,b) => b.at.localeCompare(a.at));

  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => setTeam(b.dataset.t));
  const add = el.querySelector('[data-tadd]');
  if(add) add.onclick = openTeams;
}

/* ---------- 팀분류 관리 ---------- */
function openTeams(){
  document.getElementById('modal').innerHTML = `
  <div class="overlay" data-close>
    <div class="modal">
      <div class="mhead"><h2>팀분류</h2><button class="x" data-close>×</button></div>
      <div class="mbody">
        <div class="card" style="padding:14px 16px;margin-bottom:16px;font-size:13.5px;
          color:var(--muted);line-height:1.7;box-shadow:none;background:var(--panel-2)">
          레그별로 나눠 보시려면 팀을 만드세요. 보통 <b>그 레그의 중심 사업자 이름</b>으로 만듭니다.<br>
          팀을 고르면 그 팀의 고객 · 섬김일정만 보입니다. <b>전체</b>를 고르면 다 보입니다.
        </div>
        <div id="teamList"></div>
        <div class="newgrp" style="margin-top:12px">
          <input id="newTeam" placeholder="팀 이름 — 예: 김영희팀" autocomplete="off">
          <button type="button" class="btn sm primary" id="newTeamAdd">추가</button>
        </div>
      </div>
      <div class="mfoot"><button class="btn" data-close>닫기</button></div>
    </div>
  </div>`;

  const draw = () => {
    document.getElementById('teamList').innerHTML = (DB.teams || []).length
      ? DB.teams.map(t => `<div class="trow">
          <b>${esc(t)}</b><span class="n">${teamCount(t)}명</span>
          <button type="button" class="btn sm ghost" data-tren="${esc(t)}">이름 바꾸기</button>
          <button type="button" class="btn sm ghost" data-tdel="${esc(t)}">×</button>
        </div>`).join('')
      : `<div style="color:var(--faint);font-size:14.5px;padding:6px 0">아직 만든 팀이 없습니다.</div>`;
  };
  draw();

  document.getElementById('teamList').onclick = async e => {
    const del = e.target.closest('[data-tdel]');
    const ren = e.target.closest('[data-tren]');
    if(del){
      const t = del.dataset.tdel, n = teamCount(t);
      const ok = await askConfirm(
        n ? `'${t}'을(를) 지웁니다.\n이 팀의 고객 ${n}명은 지워지지 않고 '팀 없음'이 됩니다.`
          : `'${t}'을(를) 지울까요?`, '지우기');
      if(!ok) return;
      DB.people.forEach(p => { if(p.team === t) p.team = ''; });
      DB.teams = DB.teams.filter(x => x !== t);
      if(TEAM === t) setTeamQuiet('');
      save(); draw(); render();
      toast(`'${t}'을(를) 지웠습니다`);
    }
    if(ren){
      const t = ren.dataset.tren;
      const el = document.getElementById('newTeam');
      el.value = t; el.dataset.old = t; el.focus();
      document.getElementById('newTeamAdd').textContent = '이름 바꾸기';
    }
  };

  const commit = () => {
    const el = document.getElementById('newTeam');
    const name = el.value.trim();
    const old = el.dataset.old || '';
    if(!name){ toast('팀 이름을 적어주세요'); el.focus(); return; }
    if(name !== old && DB.teams.includes(name)){ toast('이미 있는 팀입니다'); return; }
    if(old){
      DB.teams = DB.teams.map(x => x === old ? name : x);
      DB.people.forEach(p => { if(p.team === old) p.team = name; });
      if(TEAM === old) setTeamQuiet(name);
      toast(`'${old}' → '${name}' 으로 바꿨습니다`);
    }else{
      DB.teams.push(name);
      toast(`'${name}' 팀을 만들었습니다`);
    }
    el.value = ''; delete el.dataset.old;
    document.getElementById('newTeamAdd').textContent = '추가';
    save(); draw(); render();
  };
  document.getElementById('newTeamAdd').onclick = commit;
  document.getElementById('newTeam').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
  });
}
function setTeamQuiet(t){
  TEAM = t || '';
  try{ localStorage.setItem(KEY_TEAM, TEAM); }catch(e){}
}

function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === VIEW));
  document.getElementById('cntList').textContent = people().length || '';
  // 뱃지 숫자 = 오늘까지 챙겨야 할 건수
  const td = todos().filter(p => !p.nextDate || daysFromToday(p.nextDate) <= 0).length;
  document.getElementById('cntActs').textContent = td || '';


  teamBar();

  const v = document.getElementById('view');
  if(window.GROWTH && GROWTH.has(VIEW)){
    v.innerHTML = GROWTH.html(VIEW);
    GROWTH.bind(VIEW, render);
    stamp();
    return;
  }
  if(VIEW === 'dash')      v.innerHTML = viewDash();
  else if(VIEW === 'list') v.innerHTML = viewList();
  else if(VIEW === 'groups') v.innerHTML = viewGroups();
  else                     v.innerHTML = viewActs();

  bindView();
  stamp();
}

/* ---------- 대시보드 ---------- */
function viewDash(){
  const total = people().length;
  if(!total) return TEAM ? emptyTeam() : emptyAll();

  const noAction = people().filter(p => !p.nextDate).length;
  const noNeeds  = people().filter(p => !p.needs).length;
  const bk = daysSinceBackup();

  const pipe = STAGES.map(s => {
    const n = countStage(s.id);
    const pct = total ? Math.round(n / total * 100) : 0;
    return `<button class="pstage" data-stage="${s.id}" title="${s.desc} · ${pct}%">
      <span class="bar" style="background:var(${s.c})"></span>
      <div class="nm">${s.name}</div>
      <div class="n">${n}<small>명</small></div>
    </button>`;
  }).join('');

  // 이번 주 안에 할 일 + 날짜를 아직 못 정한 할 일까지
  const soon = todos().filter(p => {
    const n = daysFromToday(p.nextDate);
    return n === null || n <= 7;
  });
  const soonTop = soon.slice(0, 6);

  const soonHtml = soon.length
    ? `<div class="minis">${soonTop.map(todoMini).join('')}</div>` +
      (soon.length > soonTop.length
        ? `<button class="btn sm ghost" id="moreSoon" style="margin-top:7px">+${soon.length - soonTop.length}명 더 보기 →</button>`
        : '')
    : `<div class="card" style="padding:26px;text-align:center;color:var(--faint);font-size:13.5px">
         이번 주 예정된 섬김활동이 없습니다
       </div>`;

  const checks = [];
  if(noAction) checks.push(`다음 섬김이 정해지지 않은 고객 <strong style="color:var(--text)">${noAction}명</strong>`);
  if(noNeeds)  checks.push(`불편한 점 · 니즈를 아직 못 적은 분 <strong style="color:var(--text)">${noNeeds}명</strong>`);

  return `
    <div class="pipeline">${pipe}</div>

    <div class="section-title">이번 주 섬김활동</div>
    ${soonHtml}

    <div class="section-title">이번 달 대화거리</div>
    ${seasonBox()}

    ${schedCard()}
    ${quoteCard()}

    ${checks.length ? `<div class="card" style="padding:13px 16px;font-size:14px;color:var(--muted)">
        ${checks.map(t => `<div class="chkline">${t}</div>`).join('')}
      </div>` : ''}
    ${!STORAGE_OK ? `<div class="card bkwarn" style="border-color:var(--danger);margin-top:16px"><div>
         <b>이 브라우저에서는 자료가 저장되지 않습니다.</b><br>
         사생활 보호 모드일 수 있어요. 일반 창에서 열어주세요.
       </div><button class="btn sm primary" id="goBackup2">백업하기</button></div>` : ''}
    ${LOAD_BROKEN ? `<div class="card bkwarn" style="border-color:var(--danger)"><div>
         <b>예전 자료를 읽지 못했습니다.</b><br>
         덮어쓰지 않고 그대로 두었습니다. 데이터 화면에서 되살리기를 해보세요.
       </div><button class="btn sm" id="goBackup">데이터 열기</button></div>` : ''}
    ${bk === null
      ? `<div class="card bkwarn"><div>
           <b>아직 백업한 적이 없습니다.</b><br>
           휴대폰 저장공간을 비우면 명단이 사라질 수 있습니다.
         </div><button class="btn sm" id="goBackup">지금 백업</button></div>`
      : bk >= 14
      ? `<div class="card bkwarn"><div>
           마지막 백업이 <b>${bk}일 전</b>입니다.
         </div><button class="btn sm" id="goBackup">지금 백업</button></div>`
      : ''}
  `;
}

/* ============================================================
   리더 메시지 — 올려둔 글이 있으면 열 때 한 번 띄운다
   ============================================================ */
const KEY_NTC = 'crm.amway.v1.notice';   // 이미 본 메시지 번호
let NTC_LAST = null;                     // 마지막으로 받아둔 메시지

async function checkNotice(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch('notice.json?v=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const n = await r.json();
    if(!n || !n.id || !n.body) return;
    if(n.until && n.until < todayStr()) return;      // 기한이 지난 메시지는 넘어간다
    NTC_LAST = n;
    let seen = '';
    try{ seen = localStorage.getItem(KEY_NTC) || ''; }catch(e){}
    if(seen === n.id) return;                        // 이미 본 것은 다시 안 띄운다
    showNotice(n, true);
  }catch(e){ /* 인터넷이 없으면 그냥 넘어간다 */ }
}

// 그림 한 장 크게 보기 — 눌러서 커진다
function showImage(src, title){
  const el = document.createElement('div');
  el.className = 'shotwrap';
  el.innerHTML = `
    <div class="shotbar">
      <b>${esc(title)}</b>
      <button type="button" class="btn sm" data-x>닫기</button>
    </div>
    <div class="shotbody"><img class="shotimg" src="${esc(src)}" alt=""></div>
    <div class="shothint" id="imHint">사진을 누르면 크게 보입니다</div>`;
  document.body.appendChild(el);
  el.querySelector('[data-x]').onclick = () => el.remove();
  const img = el.querySelector('.shotimg');
  const hint = el.querySelector('#imHint');
  let step = 0;
  img.onclick = () => {
    step = (step + 1) % 3;
    if(step === 0){ img.classList.remove('big'); img.style.width = ''; }
    else{
      img.classList.add('big');
      img.style.width = (img.naturalWidth * (step === 1 ? 1 : 2)) + 'px';
    }
    hint.textContent = step === 0 ? '사진을 누르면 크게 보입니다'
      : step === 1 ? '원래 크기 (눌러서 더 크게)' : '두 배 크기 · 눌러서 처음으로';
    el.scrollLeft = 0;
  };
}

function showNotice(n, markSeen){
  if(document.querySelector('.overlay.ntc')) return;
  const el = document.createElement('div');
  el.className = 'overlay ntc';
  el.innerHTML = `
    <div class="modal">
      <div class="ntc-top">
        <div class="kn">${esc(n.from || '리더 메시지')}</div>
        <h2>${esc(n.title || '')}</h2>
      </div>
      <div class="mbody" style="padding:0">
        <div class="ntc-body">${esc(n.body)}${n.image
          ? `<img class="ntc-img" src="${esc(n.image)}" alt="">
             <div class="ntc-tap">그림을 누르면 크게 보입니다</div>` : ''}</div>
        ${n.date ? `<div class="ntc-when">${esc(n.date)}</div>` : ''}
      </div>
      <div class="mfoot">
        ${n.link ? `<a class="btn" href="${esc(n.link)}" target="_blank" rel="noopener">
          ${esc(n.linkText || '자세히 보기')}</a>` : ''}
        <button class="btn primary" data-ok>확인했습니다</button>
      </div>
    </div>`;

  if(im) im.onclick = () => showImage(n.image, n.title || '');
}

/* ============================================================
   월별 일정표 — 올려둔 그림을 보여주기만 한다
   ============================================================ */
const SCHEDS = [
  { id:'jumping', name:'점핑팀일정',     ic:'🏃', c:'--s2', b:'--s2b' },
  { id:'winners', name:'전국위너스일정', ic:'🏆', c:'--s4', b:'--s4b' },
];
const schedUrl = (ym, id) => `sched/${ym}-${id}.jpg`;
let SH_YM = '';

function thisYM(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function shiftYM(ym, n){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function ymLabel(ym){
  const [y, m] = ym.split('-').map(Number);
  return `${y}년 ${m}월`;
}

// 홈 맨 아래 — 누르면 열리는 두 칸
function schedCard(){
  const ym = thisYM(), m = +ym.slice(5);
  return `<div class="slots">${SCHEDS.map(k => `
    <button type="button" class="sbtn" data-sc="${k.id}"
      style="background:var(${k.b});border-color:var(${k.c});color:var(${k.c})">
      ${m}월 ${k.name}
    </button>`).join('')}</div>`;
}

// 크게 보기 — 가로로 펼쳐 보고 눌러서 확대한다
function openSched(kind, ym){
  SH_YM = ym || thisYM();
  const k = SCHEDS.find(x => x.id === kind) || SCHEDS[0];
  const el = document.createElement('div');
  el.className = 'shotwrap';
  el.innerHTML = `
    <div class="shotbar">
      <button type="button" class="btn sm" data-prev>◀</button>
      <b id="shTitle"></b>
      <button type="button" class="btn sm" data-next>▶</button>
      <button type="button" class="btn sm" data-x>닫기</button>
    </div>
    <div class="shotbody" id="shBody"></div>
    <div class="shothint" id="shHint"></div>`;
  document.body.appendChild(el);

  const close = () => el.remove();
  el.querySelector('[data-x]').onclick = close;
  el.querySelector('[data-prev]').onclick = () => { SH_YM = shiftYM(SH_YM, -1); drawShot(el, k); };
  el.querySelector('[data-next]').onclick = () => { SH_YM = shiftYM(SH_YM,  1); drawShot(el, k); };
  drawShot(el, k);
}

function drawShot(el, k){
  const ym = SH_YM;
  el.querySelector('#shTitle').textContent = `${+ym.slice(5)}월 ${k.name}`;
  const body = el.querySelector('#shBody');
  const hint = el.querySelector('#shHint');
  body.innerHTML = `<div class="shotload">불러오는 중…</div>`;
  hint.textContent = '';
  el.scrollTop = 0;

  const img = new Image();
  img.className = 'shotimg';
  img.alt = `${ymLabel(ym)} ${k.name}`;
  img.onload = () => {
    body.innerHTML = '';
    body.appendChild(img);
    // 화면맞춤 → 원래크기 → 두 배, 누를 때마다 커진다
    let step = 0;
    const say = () => hint.textContent = step === 0
      ? '사진을 누르면 크게 보입니다'
      : step === 1
      ? '원래 크기 · 옆으로 밀어서 보세요 (눌러서 더 크게)'
      : '두 배 크기 · 눌러서 처음으로';
    say();
    img.onclick = () => {
      step = (step + 1) % 3;
      if(step === 0){ img.classList.remove('big'); img.style.width = ''; }
      else{
        img.classList.add('big');
        img.style.width = (img.naturalWidth * (step === 1 ? 1 : 2)) + 'px';
      }
      say();
      el.scrollLeft = 0;
    };
  };
  img.onerror = () => {
    body.innerHTML = `<div class="shotnone">
      <div style="font-size:34px;margin-bottom:8px">🗓️</div>
      <b>${ymLabel(ym)} ${k.name}은 아직 없습니다</b>
      <div style="margin-top:6px;opacity:.75">올라오면 여기에서 바로 보실 수 있습니다.</div>
    </div>`;
  };
  img.src = schedUrl(ym, k.id);
}

function todoMini(p){
  const d = fmtDue(p.nextDate);
  const st = stageOf(p.stage);
  return `<button class="mini" data-id="${p.id}">
    <span class="mdot" style="background:var(${st.c})"></span>
    <span class="mnm">${esc(p.name)}</span>
    <span class="mtx">${p.nextAction ? esc(p.nextAction) : '섬김 내용 없음'}</span>
    <span class="due ${d.cls}">${d.txt}</span>
  </button>`;
}

function todoRow(p){
  const d = fmtDue(p.nextDate);
  const s = stageOf(p.stage);
  const n = daysFromToday(p.nextDate);
  const cls = n === null ? '' : (n < 0 ? 'overdue' : (n === 0 ? 'today' : ''));
  return `<div class="todo ${cls}">
    <div class="body">
      <div class="who">
        ${esc(p.name)}
        <span class="badge" style="background:var(${s.b});color:var(${s.c})">${s.name}</span>
        <span class="due ${d.cls}" style="margin-left:auto">${d.txt}${p.nextTime ? ' ' + fmtTimeK(p.nextTime) : ''}</span>
      </div>
      <div class="what">${p.nextAction ? esc(p.nextAction) : '<span style="color:var(--faint)">섬김 내용 없음</span>'}</div>
      <div class="tacts">
        <button class="btn sm" data-open="${p.id}">수정</button>
        <button class="btn sm" data-done="${p.id}">완료</button>
      </div>
    </div>
  </div>`;
}

// 예정 — 앞으로 챙겨야 할 것
function planBody(){
  const list = todos();
  if(!list.length){
    return `<div class="card empty">
      <div class="big">✓</div><h3>예정된 섬김활동이 없습니다</h3>
      <p>고객을 열어 섬김활동 화면에서 '다음 섬김'을 정하면 여기에 모입니다.</p>
    </div>`;
  }
  const groups = [
    ['지난 일정',   p => p.nextDate && daysFromToday(p.nextDate) < 0],
    ['오늘',       p => p.nextDate && daysFromToday(p.nextDate) === 0],
    ['이번 주',    p => { const n = daysFromToday(p.nextDate); return n !== null && n > 0 && n <= 7; }],
    ['이후 예정',  p => { const n = daysFromToday(p.nextDate); return n !== null && n > 7; }],
    ['날짜 미정',  p => !p.nextDate],
  ];
  return groups.map(([label, fn]) => {
    const g = list.filter(fn);
    if(!g.length) return '';
    return `<div class="todo-group">
      <div class="todo-head"><h3>${label}</h3><span class="n">${g.length}</span></div>
      ${g.map(todoRow).join('')}
    </div>`;
  }).join('') || '';
}

/* ---------- 섬김활동 탭 — 예정 / 기록 ---------- */
function viewActs(){
  if(!people().length) return TEAM ? emptyTeam() : emptyAll();
  const nPlan = todos().length;
  const nDone = doneActs().length;
  const sw = `<div class="chips" style="margin:18px 0 14px">
    <button class="chip ${ATAB === 'plan' ? 'on' : ''}" data-atab="plan">예정된 섬김 ${nPlan}</button>
    <button class="chip ${ATAB === 'log'  ? 'on' : ''}" data-atab="log">완료된 섬김 ${nDone}</button>
  </div>`;
  return sw + (ATAB === 'plan' ? planBody() : logBody());
}

// 완료된 섬김 — 주 단위로 세어 본다
function logBody(){
  const logs = doneActs();

  if(!logs.length){
    return `<div class="card empty">
      <div class="big">✓</div>
      <h3>아직 완료한 섬김이 없습니다</h3>
      <p>고객을 열어 다음 섬김을 정하고, 마치시면 <b>완료</b>를 눌러주세요. 여기에 쌓입니다.</p>
    </div>`;
  }

  // 이번 주 / 지난주 / 지지난주 / 그 이전
  const wk = [[], [], [], []];
  logs.forEach(l => {
    const i = weekIndex(l.at);
    wk[Math.min(Math.max(i, 0), 3)].push(l);
  });
  const HEAD  = ['이번 주 완료', '지난주 완료', '지지난주 완료', '그 이전'];
  const SHORT = ['이번 주', '지난주', '지지난주'];

  const three = wk[0].concat(wk[1], wk[2]);
  const who   = new Set(three.map(l => l.pid)).size;
  const avg   = Math.round(three.length / 3 * 10) / 10;

  const cards = [0, 1, 2].map(i =>
    `<div class="gcard ${i === 0 ? 'on' : ''}" style="cursor:default">
       <div class="gn">${SHORT[i]}</div>
       <div class="gc">${wk[i].length}<small>건</small></div>
     </div>`).join('');

  const summary = `
    <div class="wcards">${cards}</div>
    <div class="card" style="padding:14px 16px;margin:8px 0 4px;font-size:14.5px;color:var(--muted)">
      최근 3주 동안 섬김을 <strong style="color:var(--text)">${three.length}건</strong> 마치셨고,
      <strong style="color:var(--text)">${who}분</strong>을 만나셨습니다
      &nbsp;·&nbsp; 주 평균 ${avg}건
    </div>`;

  const rows = list => list.map(l => {
    const sg = stageOf(l.stage);
    return `<div class="todo" data-id="${l.pid}">
      <div class="body">
        <div class="who">${esc(l.who)}
          <span class="badge" style="background:var(${sg.b});color:var(${sg.c})">${sg.name}</span>
        </div>
        <div class="what">${esc(l.text)}</div>
      </div>
      <div class="when" style="color:var(--faint);font-weight:600">${shortDay(l.at)}</div>
    </div>`;
  }).join('');

  const groups = wk.map((list, i) => {
    if(i < 3 && !list.length){
      return `<div class="todo-group">
        <div class="todo-head"><h3>${HEAD[i]}</h3><span class="n">0</span></div>
        <div class="card" style="padding:20px;text-align:center;color:var(--faint);font-size:14px">
          ${i === 0 ? '이번 주는 아직 없습니다' : '없습니다'}
        </div>
      </div>`;
    }
    if(!list.length) return '';
    return `<div class="todo-group">
      <div class="todo-head"><h3>${HEAD[i]}</h3><span class="n">${list.length}</span></div>
      ${rows(list)}
    </div>`;
  }).join('');

  return summary + groups;
}

/* ============================================================
   모달 — 섬김활동 상세
