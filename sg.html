function drawArrow(){
  const line = document.getElementById('gxLine');
  if(!line) return;
  const L = line.getTotalLength();
  const N = 72, up = [], dn = [];
  for(let i = 0; i <= N; i++){
    const t = i/N, len = L*t;
    const p = line.getPointAtLength(len);
    const a = line.getPointAtLength(Math.max(0, len-1.2));
    const b = line.getPointAtLength(Math.min(L, len+1.2));
    const m = Math.hypot(b.x-a.x, b.y-a.y) || 1;
    const nx = -(b.y-a.y)/m, ny = (b.x-a.x)/m;
    const w = 2 + 7*Math.pow(t, 1.4);
    up.push(`${(p.x+nx*w).toFixed(1)},${(p.y+ny*w).toFixed(1)}`);
    dn.push(`${(p.x-nx*w).toFixed(1)},${(p.y-ny*w).toFixed(1)}`);
  }
  document.getElementById('gxRibbon').setAttribute('d', `M${up.join(' L')} L${dn.reverse().join(' L')} Z`);
  const tip = line.getPointAtLength(L), pre = line.getPointAtLength(L-7);
  const ang = Math.atan2(tip.y-pre.y, tip.x-pre.x)*180/Math.PI;
  const PLANE = 'M28,0 C24,-3 18,-4.2 12,-4.4 L2,-4.4 L-16,-21 L-21.5,-21 L-11,-4.4 ' +
    'L-19,-4.2 L-24,-11 L-28,-11 L-27,-3 L-30.5,0 L-27,3 L-28,11 L-24,11 L-19,4.2 ' +
    'L-11,4.4 L-21.5,21 L-16,21 L2,4.4 L12,4.4 C18,4.2 24,3 28,0 Z';
  let out = `<g transform="translate(${tip.x.toFixed(1)} ${tip.y.toFixed(1)}) rotate(${ang.toFixed(2)}) scale(.92)">
    <path d="${PLANE}" fill="var(--accent)"></path>
    <ellipse cx="13" cy="0" rx="7" ry="2.4" fill="var(--panel)" opacity=".45"></ellipse></g>`;
  [0.012, 0.20, 0.385, 0.565, 0.75, 0.92].forEach((f,i) => {
    const p = line.getPointAtLength(L*f);
    const fy = FY + i - 1, last = i === 5;
    const raw = (i === 0 ? (G.vision.nowPin||'') : (G.vision.pins[fy]||'')).trim();
    const pin = raw ? (raw.length > 11 ? raw.slice(0,10)+'…' : raw) : (i === 0 ? '지금' : '핀 입력');
    const size = last ? 21 : 17.5;
    const lx = Math.min(Math.max(p.x, 92), 908);
    if(i === 0) out += `<circle cx="${p.x}" cy="${p.y}" r="17" fill="var(--accent)" opacity=".15"></circle>`;
    out += `<circle cx="${p.x}" cy="${p.y}" r="${last?11:8}" fill="var(--panel)" stroke="var(--accent)" stroke-width="${last?5:3.6}"></circle>`;
    if(last){
      const w = Math.max(116, pin.length*size*1.02+36);
      out += `<rect x="${(lx-w/2).toFixed(1)}" y="${(p.y-66).toFixed(1)}" width="${w.toFixed(1)}" height="50" rx="25"
        fill="var(--accent)" fill-opacity=".07" stroke="var(--accent)" stroke-opacity=".5" stroke-width="2"></rect>`;
    }
    out += `<text x="${lx}" y="${(p.y-(last?45:48)).toFixed(1)}" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1"
        fill="var(--text)">${i===0 ? yy(FY-1)+'.9 · 현재' : yy(fy)+'.9'}</text>
      <text x="${lx}" y="${(p.y-(last?23:25)).toFixed(1)}" text-anchor="middle" font-size="${size+1}" font-weight="700"
        fill="${raw ? (last?'var(--accent)':'var(--text)') : 'var(--muted)'}" style="font-family:'Gowun Batang',serif">${E(pin)}</text>`;
  });
  document.getElementById('gxNodes').innerHTML = out;
}

    }, 'oninput');
    root.querySelectorAll('[data-gpr]').forEach(row => {
      row.querySelectorAll('input').forEach(inp => inp.oninput = () => {
        const id = row.dataset.gpr, arr = [];
        root.querySelectorAll(`[data-gpr="${id}"]`).forEach(r => {
          const [a,b] = r.querySelectorAll('input');
          arr.push({n:a.value, m:b.value});
        });
        while(arr.length && !arr[arr.length-1].n.trim() && !arr[arr.length-1].m.trim()) arr.pop();
        put(SEL, id, arr);
      });
    });
    on('[data-gmore]', el => {
      const id = el.dataset.gmore;
      const arr = ((rec(SEL)||{})[id] || []).map(x => ({n:iname(x), m:imemo(x)}));
      arr.push({n:'', m:''});
      G.log[SEL] = G.log[SEL] || {}; G.log[SEL][id] = arr; gsave(); again();
    });
    on('[data-gaddbtn]', el => {
      const id = el.dataset.gaddbtn;
      const inp = root.querySelector(`[data-gnew="${id}"]`);
      const t = inp.value.trim(); if(!t) return;
      put(SEL, id, [...((rec(SEL)||{})[id] || []), t]); again();
    });
    root.querySelectorAll('[data-gnew]').forEach(inp => inp.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); root.querySelector(`[data-gaddbtn="${inp.dataset.gnew}"]`).click(); }
    });
    on('[data-gdel]', el => {
      const id = el.dataset.gdel, arr = ((rec(SEL)||{})[id] || []).slice();
      arr.splice(Number(el.dataset.i), 1); put(SEL, id, arr); again();
    });


    /* 리더성장 */
    const showErr = (id, msg) => { const el = document.getElementById(id); if(el) el.textContent = msg || ''; };
    const rgRole = document.getElementById('gxRgRole');
    if(rgRole) rgRole.onchange = () => {
      const t = document.getElementById('gxRgTarget');
      const src = rgRole.value === 'pt' ? 'gxPtOpts' : rgRole.value === 'jewel' ? 'gxJwOpts' : '';
      t.classList.toggle('hide', !src);
      t.innerHTML = '<option value="">목록에서 본인 이름 —</option>' + (src ? document.getElementById(src).innerHTML : '');
      if(src && !document.getElementById(src).innerHTML.trim()) t.innerHTML = '<option value="">총리더가 조직 등록을 먼저 해야 합니다</option>';
    };
    on('[data-glogin]', async el => {
      el.disabled = true; showErr('gxLiErr', '');
      try{ await leaderLogin(document.getElementById('gxLiEmail').value.trim(), document.getElementById('gxLiPw').value); }
      catch(e){ showErr('gxLiErr', fmtErr(e)); el.disabled = false; }
    });
    on('[data-gregister]', async el => {
      el.disabled = true; showErr('gxRgErr', '');
      const f = {name:document.getElementById('gxRgName').value.trim(), role:document.getElementById('gxRgRole').value,
        target:document.getElementById('gxRgTarget').value, email:document.getElementById('gxRgEmail').value.trim(), pw:document.getElementById('gxRgPw').value};
      try{ await leaderRegister(f); say('등록을 신청했습니다. 총리더 승인 후 볼 수 있습니다'); again(); }
      catch(e){ showErr('gxRgErr', fmtErr(e)); el.disabled = false; }
    });
    on('[data-glogout]', async () => { await leaderLogout(); again(); });
    on('[data-greload]', () => { TEAM.loaded = false; again(); });
    on('[data-gtmon]', el => {
      let {y,m} = TMON; m += Number(el.dataset.gtmon);
      if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
      if(y*12+m > T0.getFullYear()*12+T0.getMonth()) return;
      TMON = {y,m}; TEAM.loaded = false; again();
    });
    on('[data-gnotice]', el => copyOut('gxNotice', teamNotice(el.dataset.gnotice === '1')));
    on('[data-gpgsave]', async () => {
      const g = promo();
      root.querySelectorAll('[data-gpg]').forEach(el => { const k = el.dataset.gpg; g[k] = k === 'title' ? el.value.trim() : Math.max(0, parseInt(el.value,10) || 0); });
      ORG.promo = g; await saveOrg(); again();
    });
    on('[data-gapprove]', async el => {
      try{ await FS.collection('leaders').doc(el.dataset.gapprove).update({approved:true, approvedAt:SV()}); say('승인했습니다'); TEAM.loaded = false; again(); }
      catch(e){ say('실패 — ' + fmtErr(e)); }
    });
    on('[data-greject]', async el => {
      if(!confirm('이 리더의 권한을 해제할까요?')) return;
      try{ await FS.collection('leaders').doc(el.dataset.greject).update({approved:false}); TEAM.loaded = false; again(); }
      catch(e){ say('실패 — ' + fmtErr(e)); }
    });
    on('[data-gdelrow]', async el => {
      if(!confirm('이 자료를 지울까요? (같은 사람이 새로 올리면 다시 생깁니다)')) return;
      try{ await FS.collection('reports').doc(tKey()).collection('members').doc(el.dataset.gdelrow).delete(); TEAM.loaded = false; again(); }
      catch(e){ say('실패 — ' + fmtErr(e)); }
    });
    on('[data-gjw]', async () => {
      const v = document.getElementById('gxJw').value.trim();
      if(v && !ORG.jewels.includes(v)) ORG.jewels.push(v);
      await saveOrg(); again();
    });
    on('[data-gjwdel]', async el => { ORG.jewels.splice(Number(el.dataset.gjwdel),1); await saveOrg(); again(); });
    on('[data-gpt]', async () => {
      const v = document.getElementById('gxPt').value.trim();
      if(v && !ORG.pts.some(p => p.name === v)) ORG.pts.push({name:v, jewel:document.getElementById('gxPtJw').value});
      await saveOrg(); again();
    });
    on('[data-gptdel]', async el => { ORG.pts.splice(Number(el.dataset.gptdel),1); await saveOrg(); again(); });

    on('[data-gtscope]', el => { TSCOPE = el.dataset.gtscope; again(); });
    on('[data-gtitem]', el => { TITEM = el.dataset.gtitem; again(); });

    /* 주간계획 */
    on('[data-gwsel]', el => { WSEL = el.dataset.gwsel; again(); });
    on('[data-gwpick]', el => openPicker(el.dataset.gwpick, el.dataset.d));
    on('[data-gwdel]', el => { wkBucket(wkRange(WSEL).key, el.dataset.gwdel).splice(Number(el.dataset.i), 1); gsave(); again(); });
    on('[data-gwopen]', el => { if(typeof openDetail === 'function') openDetail(el.dataset.gwopen); });

    /* 성장활동 */
    on('[data-gtype]', el => { GSEL = el.dataset.gtype; again(); });
    on('[data-ggmon]', el => {
      let {y,m} = GMON; m += Number(el.dataset.ggmon);
      if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
      if(y*12+m > T0.getFullYear()*12+T0.getMonth()) return;
      GMON = {y,m}; again();
    });
    on('[data-ghcopy]', () => copyOut(null, gHistText()));
    on('[data-grsel]', el => { RSEL = el.dataset.grsel; again(); });
    on('[data-grepcopy]', () => { const el = document.getElementById('gxRep'); el.classList.remove('hide'); copyOut('gxRep', repText()); });

    if(v === 'gvision') setTimeout(drawArrow, 0);
  }
};
})();

</script>
</body>
</html>
