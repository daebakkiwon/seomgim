.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}

.cell{aspect-ratio:1;border-radius:6px;background:var(--cell0);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--soft);position:relative}

.cell.d{background:var(--cell2);color:#fff}
.cell .w{position:absolute;top:1px;right:3px;font-size:9px}

.q textarea{min-height:90px;margin-top:10px;background:var(--bg)}
.row{display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--faint);padding:40px 0}
.hint{font-size:13px;color:var(--faint)}
.scroll{overflow-x:auto}

async function load(){
  $('#view').innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const [p0, p1, q] = await Promise.all([FS.collection('agape1u').get().catch(() => ({docs:[]})), FS.collection('agape1').get(), FS.collection('agape1q').get()]);
    ACC = {}; p0.docs.forEach(d => ACC[d.id] = d.data().access || {});     // 승인은 agape1u 문서의 access 칸
    // 같은 사람(이름+번호)은 기기가 여럿이어도 하나로 합친다 — agape1u(기기 공유, 새 방식)가 먼저, agape1(기기별, 예전 방식)은 보태기만
    const by = {}, devs = {};
    [...p0.docs.map(d => ({d, u:true})), ...p1.docs.map(d => ({d, u:false}))].forEach(({d, u}) => {
      const x = Object.assign({}, d.data(), u ? {ukey: d.id} : {}), k = (x.phone || '') + '|' + (x.name || '').replace(/\s+/g, '');
      (devs[k] ||= new Set());
      Object.keys(x.devices || {}).forEach(u => devs[k].add(u)); if(!x.devices) devs[k].add(d.id);
      const cur = by[k];
      if(!cur){ by[k] = Object.assign({}, x); return; }
      if(x.ukey && !cur.ukey) cur.ukey = x.ukey;
      if(x.req) cur.req = Object.assign({}, cur.req, x.req);
      cur.done = [...new Set([...(cur.done || []), ...(x.done || [])])]; cur.doneN = cur.done.length;
      for(const f of ['heard', 'wrote', 'acts']){ cur[f] = Object.assign({}, cur[f]); for(const [id, v] of Object.entries(x[f] || {})) cur[f][id] = Math.max(cur[f][id] || 0, v); }
      cur.heardN = LESSONS.filter(l => (cur.heard[l.id] || 0) >= 90).length;
      for(const f of ['answers', 'memos', 'listenMin', 'days']) cur[f] = Math.max(cur[f] || 0, x[f] || 0);   // 같은 기록이 겹치므로 더하지 않고 큰 값
      if(ms(x.updated) > ms(cur.updated)) Object.assign(cur, {updated:x.updated, lastTitle:x.lastTitle, lastDay:x.lastDay, group:x.group || cur.group});
    });
    PEOPLE = Object.entries(by).map(([k, x]) => Object.assign(x, {devices: devs[k].size}));
    QS = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a, b) => (!a.answer - !b.answer) * -1 || ms(b.at) - ms(a.at));
    const open = QS.filter(x => !x.answer).length;
    $('#qCnt').hidden = !open; $('#qCnt').textContent = open;
    const waiting = PEOPLE.filter(p => p.ukey && Object.keys(p.req || {}).some(b => !(ACC[p.ukey] || {})[b])).length;
    $('#aCnt').hidden = !waiting; $('#aCnt').textContent = waiting;
    draw();
  }catch(e){
    $('#view').innerHTML = `<div class="card">자료를 불러오지 못했습니다 (${esc(e.code || e.message)}).<br><span class="hint">Firebase 보안 규칙에 agape1 · agape1q 부분을 추가했는지 확인해 주세요.</span></div>`;
  }
}
function draw(){ TAB === 'p' ? drawPeople() : TAB === 'q' ? drawQs() : drawAcc(); }

/* ---------- 승인: 1권은 누구나, 2권·심화편은 여기서 승인한 사람만 ---------- */
function drawAcc(){
  const LOCKED = BOOKS.filter(b => !b.free);
  const st = (p, b) => (ACC[p.ukey] || {})[b.id] ? 'ok' : (p.req || {})[b.id] ? 'req' : 'no';
  const rows = PEOPLE.slice().sort((a, b) => {
    const w = p => LOCKED.some(bk => st(p, bk) === 'req') ? 0 : 1;
    return w(a) - w(b) || String(a.name).localeCompare(String(b.name), 'ko'); });
  $('#view').innerHTML = `
    <p class="hint" style="margin-top:16px">1권은 누구나 공부할 수 있습니다. 2권과 심화편은 여기서 <b>승인</b>한 분만 열립니다. 주황 표시는 승인을 요청한 분입니다.</p>
    <div class="scroll"><table><thead><tr><th>이름</th><th>모임</th>${LOCKED.map(b => `<th>${esc(b.short)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rows.map(p => `<tr><td class="nm"><b>${esc(p.name)}</b><small>${esc(phoneF(p.phone))}</small></td><td>${esc(p.group || '-')}</td>
      ${LOCKED.map(b => { const s = st(p, b);
        return `<td>${!p.ukey ? '<span class="hint">앱 업데이트 필요</span>' : `<button class="btn ${s === 'ok' ? '' : 'ghost'}" style="padding:7px 12px;${s === 'req' ? 'border-color:var(--warn);color:var(--warn)' : ''}" data-acc="${p.ukey}" data-bk="${b.id}" data-v="${s === 'ok' ? 0 : 1}">${s === 'ok' ? '✓ 승인됨' : s === 'req' ? '요청 → 승인' : '승인'}</button>`}</td>`; }).join('')}
      <td>${p.ukey ? `<button class="btn ghost" style="padding:7px 12px" data-all="${p.ukey}">모두 승인</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="hint">승인한 분의 앱에는 다음에 열 때 “승인되었습니다” 알림이 뜨고 그 권이 열립니다. “✓ 승인됨”을 다시 누르면 승인이 취소됩니다.</p>`;
  const who = key => PEOPLE.find(p => p.ukey === key);
  const write = async (key, patch) => {
    const p = who(key);
    await FS.collection('agape1u').doc(key).set({access: patch, accessAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    ACC[key] = Object.assign({}, ACC[key], patch);
  };
  document.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await write(b.dataset.acc, {[b.dataset.bk]: b.dataset.v === '1'}); drawAcc(); }
    catch(e){ alert('저장하지 못했습니다: ' + (e.code || e.message)); b.disabled = false; }
  });
  document.querySelectorAll('[data-all]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await write(b.dataset.all, Object.fromEntries(LOCKED.map(x => [x.id, true]))); drawAcc(); }
    catch(e){ alert('저장하지 못했습니다: ' + (e.code || e.message)); b.disabled = false; }
  });
}

function drawPeople(){
  const groups = [...new Set(PEOPLE.map(p => p.group).filter(Boolean))].sort();
  const week = Date.now() - 7 * 86400000;
  const active = PEOPLE.filter(p => ms(p.updated) > week).length;
  const fins = BOOKS.map(b => ({b, n: PEOPLE.filter(p => doneIn(p, b) >= TOT(b)).length, on: PEOPLE.filter(p => doneIn(p, b) > 0).length}));
  let rows = PEOPLE.filter(p => (!FILTER.g || p.group === FILTER.g) && (!FILTER.q || (p.name + p.phone).includes(FILTER.q)));
  const key = {name:p => p.name, group:p => p.group || '', done:p => p.doneN || 0, heard:p => p.heardN || 0, ans:p => p.answers || 0, min:p => p.listenMin || 0, last:p => ms(p.updated)}[SORT.k];
  rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * SORT.d);
  const th = (k, t) => `<th data-s="${k}">${t}${SORT.k === k ? (SORT.d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  $('#view').innerHTML = `
    <div class="kpis"><div class="kpi"><b>${PEOPLE.length}</b><span>등록한 분</span></div><div class="kpi"><b>${active}</b><span>최근 7일 공부</span></div>
      ${fins.map(f => `<div class="kpi"><b>${f.n}<small style="font-size:14px;color:var(--soft);font-weight:400"> / ${f.on}명</small></b><span>${esc(f.b.short || f.b.no + '권')}${f.b.vv ? ' 66권을 다 읽은 분 / 읽는 중' : '을 다 마친 분 / 공부 중'}</span></div>`).join('')}</div>
    <div class="tools"><input type="search" id="fq" placeholder="이름·번호로 찾기" value="${esc(FILTER.q)}">
      <select id="fg"><option value="">모든 모임</option>${groups.map(g => `<option${g === FILTER.g ? ' selected' : ''}>${esc(g)}</option>`).join('')}</select>
      <button class="btn ghost" id="rf">새로고침</button><button class="btn ghost" id="csv">엑셀(CSV) 받기</button></div>
    <div class="scroll" style="margin-top:12px">${rows.length ? `<table><thead><tr>${th('name', '이름')}${th('group', '모임')}${th('done', '마친 과')}${th('heard', '끝까지 들은 과')}${th('ans', '적은 답')}${th('min', '들은 시간')}${th('last', '마지막 공부')}<th>공부 중인 과</th></tr></thead><tbody>
      ${rows.map((p, i) => { const late = ms(p.updated) < week; return `<tr class="p" data-i="${PEOPLE.indexOf(p)}">
        <td class="nm"><b>${esc(p.name)}</b><small>${esc(phoneF(p.phone))}${p.devices > 1 ? ` · 기기 ${p.devices}대` : ''}</small></td>
        <td>${esc(p.group || '-')}</td>
        <td>${BOOKS.map(b => { const d = doneIn(p, b), t = TOT(b) || 1; return `<div class="bar" style="margin:2px 0"><small style="width:62px;color:var(--soft)">${esc(b.short || b.no + '권')}</small><i><s style="width:${d / t * 100}%"></s></i>${d}</div>`; }).join('')}</td>
        <td>${p.heardN || 0}</td><td>${p.answers || 0}</td><td>${p.listenMin || 0}분</td>
        <td class="${late ? 'late' : ''}">${ago(ms(p.updated))}</td><td style="font-size:13px;color:var(--soft)">${esc(p.lastTitle || '-')}</td></tr>`; }).join('')}
      </tbody></table>` : '<div class="empty">아직 등록한 분이 없습니다</div>'}</div>
    <p class="hint">줄을 누르면 과별 진도를 볼 수 있습니다. 7일 넘게 공부하지 않은 분은 주황색으로 표시됩니다. 적은 글의 내용은 서버에 올라오지 않습니다.</p>
    <div id="detail"></div>`;
  $('#fq').oninput = e => { FILTER.q = e.target.value.trim(); const pos = e.target.selectionStart; drawPeople(); $('#fq').focus(); $('#fq').setSelectionRange(pos, pos); };
  $('#fg').onchange = e => { FILTER.g = e.target.value; drawPeople(); };
  $('#rf').onclick = load;
  $('#csv').onclick = () => csv(rows);
  document.querySelectorAll('th[data-s]').forEach(t => t.onclick = () => { const k = t.dataset.s; SORT = {k, d: SORT.k === k ? -SORT.d : (k === 'name' || k === 'group' ? 1 : -1)}; drawPeople(); });
  document.querySelectorAll('tr.p').forEach(r => r.onclick = () => { OPEN = +r.dataset.i; detail(); });
  if(OPEN != null) detail();
}
function detail(){
  const p = PEOPLE[OPEN]; if(!p) return;
  const done = new Set(p.done || []);
  const myQ = QS.filter(q => q.phone === p.phone && q.name === p.name).length;
  $('#detail').innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
      <div><b style="font-size:18px">${esc(p.name)}</b> <span class="hint">${esc(phoneF(p.phone))} · ${esc(p.group || '모임 없음')} · ${p.ua || ''}</span>
      <div class="hint" style="margin-top:4px">공부한 날 ${p.days || 0}일 · 들은 시간 ${p.listenMin || 0}분 · 묵상 노트 ${p.memos || 0}개 · 보낸 질문 ${myQ}개 · 마지막 ${esc(p.lastDay || '-')}</div></div>
      <div style="display:flex;gap:6px"><button class="btn ghost" id="ddel">기록 지우기</button><button class="btn ghost" id="dx">닫기</button></div></div>
    ${BOOKS.map(b => b.vv ? `<div style="margin-top:14px;font-weight:600">${esc(b.title)} <span class="hint">읽은 장 ${p.vvRead || 0}/${b.total}${p.vvLast ? ' · 마지막 ' + esc(p.vvLast) : ''}</span></div>` : `<div style="margin-top:14px;font-weight:600">${esc(b.title)} <span class="hint">${doneIn(p, b)}/${LB(b).length}과</span></div>
    <div class="grid">${LB(b).map(l => { const d = done.has(l.id), h = (p.heard?.[l.id] || 0) >= 90, w = p.wrote?.[l.id];
      return `<div class="cell${d ? ' d' : h ? ' h' : ''}" title="${esc(b.short || b.no + '권')} 제${l.no}과 ${esc(l.title)}${p.heard?.[l.id] ? ' · 들음 ' + p.heard[l.id] + '%' : ''}${w ? ' · 적은 답 ' + w : ''}">${l.no}${w ? '<span class="w">✎</span>' : ''}</div>`; }).join('')}</div>`).join('')}
    <div class="legend"><span><i style="background:var(--cell2)"></i>마침</span><span><i style="background:var(--cell1)"></i>끝까지 들음</span><span><i style="background:var(--cell0)"></i>아직</span><span>✎ 답을 적음</span></div></div>`;
  $('#dx').onclick = () => { OPEN = null; $('#detail').innerHTML = ''; };
  $('#ddel').onclick = async () => {
    if(!confirm(`${p.name}님의 진도 기록을 서버에서 지울까요? (보낸 질문도 함께 지웁니다)`)) return;
    try{
      const [a, u, b] = await Promise.all([FS.collection('agape1').where('phone', '==', p.phone).get(), FS.collection('agape1u').where('phone', '==', p.phone).get().catch(() => ({docs:[]})), FS.collection('agape1q').where('phone', '==', p.phone).get()]);
      await Promise.all([...a.docs, ...u.docs, ...b.docs].filter(d => d.data().name === p.name).map(d => d.ref.delete()));
      OPEN = null; load();
    }catch(e){ alert('지우지 못했습니다: ' + (e.code || e.message)); }
  };
  $('#detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function csv(rows){
  const head = ['이름', '휴대폰', '모임', ...BOOKS.map(b => (b.short || b.no + '권') + ' 마친 과'), '끝까지 들은 과', '적은 답', '묵상 노트', '들은 시간(분)', '공부한 날', '마지막 공부', '공부 중인 과', ...LESSONS.map(l => (LBY[l.id] ? (BOOKS.find(b => b.id === l.bk).short || '') + ' ' : '') + '제' + l.no + '과')];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')].concat(rows.map(p => { const done = new Set(p.done || []);
    return [p.name, phoneF(p.phone), p.group, ...BOOKS.map(b => doneIn(p, b)), p.heardN || 0, p.answers || 0, p.memos || 0, p.listenMin || 0, p.days || 0, p.lastDay, p.lastTitle,
      ...LESSONS.map(l => done.has(l.id) ? '마침' : (p.heard?.[l.id] || 0) >= 90 ? '들음' : '')].map(q).join(','); }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = `아가페성경공부_진도_${new Date().toLocaleDateString('sv')}.csv`; a.click();
}

function drawQs(){
  if(!QS.length){ $('#view').innerHTML = '<div class="empty">아직 들어온 질문이 없습니다</div>'; return; }
  const open = QS.filter(x => !x.answer).length;
  $('#view').innerHTML = `<div class="tools" style="margin-top:16px"><span style="flex:1">답을 기다리는 질문 <b>${open}</b>개 · 전체 ${QS.length}개</span><button class="btn ghost" id="rf">새로고침</button></div>
    ${QS.map(x => { const at = x.at?.toDate?.(), aat = x.answeredAt?.toDate?.();
      return `<div class="q${x.answer ? '' : ' open'}" data-id="${x.id}">
        <div class="meta"><b>${esc(x.name)}</b> · ${esc(phoneF(x.phone))}${x.group ? ' · ' + esc(x.group) : ''} · ${esc(x.lessonTitle || '전체 질문')} · ${at ? at.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : ''}</div>
        <div class="txt">${esc(x.text)}</div>
        ${x.answer ? `<div class="ans">${esc(x.answer)}</div><div class="hint" style="margin-top:6px">${aat ? aat.toLocaleDateString('ko-KR') + ' 답변' : ''} · <a href="#" data-edit>고치기</a></div>` : ''}
        <div class="rep"${x.answer ? ' hidden' : ''}><textarea placeholder="답변을 적어 주세요">${esc(x.answer || '')}</textarea>
          <div class="row"><button class="btn ghost" data-del>질문 지우기</button><button class="btn" data-send>답변 보내기</button></div></div></div>`; }).join('')}`;
  $('#rf').onclick = load;
  document.querySelectorAll('.q').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('[data-edit]')?.addEventListener('click', e => { e.preventDefault(); el.querySelector('.rep').hidden = false; });
    el.querySelector('[data-send]').onclick = async e => {
      const t = el.querySelector('textarea').value.trim(); if(!t) return;
      e.target.disabled = true;
      try{ await FS.collection('agape1q').doc(id).update({answer:t, answeredAt:firebase.firestore.FieldValue.serverTimestamp()}); await load(); }
      catch(err){ alert('보내지 못했습니다: ' + (err.code || err.message)); e.target.disabled = false; }
    };
    el.querySelector('[data-del]').onclick = async () => {
      if(!confirm('이 질문을 지울까요? 되돌릴 수 없습니다.')) return;
      try{ await FS.collection('agape1q').doc(id).delete(); await load(); }catch(err){ alert('지우지 못했습니다: ' + (err.code || err.message)); }
    };
  });
}
</script>
</body>
</html>
