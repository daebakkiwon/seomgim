let S = {notes:{}, last:null, fs:19, rate:1, auto:false, theme:'', pos:{}, heard:{}, listenSec:0, days:[], profile:null};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); }catch(e){}
let saveT;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장 공간이 부족합니다'); } SYNC.later(); }, 250); };
const markDay = () => { const d = new Date().toLocaleDateString('sv'); if(!S.days.includes(d)){ S.days.push(d); if(S.days.length > 400) S.days.shift(); } };
const N = id => (S.notes[id] ||= {q:{}, act:{}, copy:'', memo:'', marks:[], done:false});
const hasNote = n => n && (Object.values(n.q||{}).some(v => v.trim()) || (n.copy||'').trim() || (n.memo||'').trim());
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
function applyPrefs(){
  document.documentElement.style.setProperty('--fs', S.fs + 'px');
  if(S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme');
}
applyPrefs();

/* ---------- 화면 ---------- */
const label = it => it.kind === 'lesson' ? `제${it.no}과` : it.kind === 'part' ? `제${it.part}부` : it.kind === 'appendix' ? '부록' : '여는 글';
function route(){
  const h = location.hash.slice(1);
  window.scrollTo(0, 0);
  if(!S.profile) return viewRegister();
  ['#bAsk', '#bNotes', '#bSet'].forEach(s => $(s).hidden = false);
  if(h.startsWith('/l/') && BYID[h.slice(3)]) return viewItem(BYID[h.slice(3)]);
  if(h === '/notes') return viewNotes();
  if(h.startsWith('/ask')) return viewAsk(h.slice(5));
  viewHome();
}
addEventListener('hashchange', route);

function viewRegister(){
  $('#hTitle').textContent = '사랑이 생명입니다';
  ['#bAsk', '#bNotes', '#bSet'].forEach(s => $(s).hidden = true);
  $('#bBack').style.visibility = 'hidden';
  $('#view').innerHTML = `<section class="hero"><div class="series">${esc(DATA.book.series)}</div><h2>${esc(DATA.book.title)}</h2>
    <div class="by">함께 공부하는 분들의 진도를 살피기 위해<br>처음 한 번만 등록해 주세요.</div></section>
    <div class="list" style="padding:18px">
      <label class="t" style="display:block;font-size:14px;color:var(--soft);margin-bottom:6px">이름</label>
      <input class="search" style="margin:0 0 14px" id="rName" placeholder="홍길동" autocomplete="name">
      <label class="t" style="display:block;font-size:14px;color:var(--soft);margin-bottom:6px">휴대폰 번호</label>
      <input class="search" style="margin:0 0 14px" id="rPhone" inputmode="tel" placeholder="010-1234-5678" autocomplete="tel">
      <label class="t" style="display:block;font-size:14px;color:var(--soft);margin-bottom:6px">소속 모임 <span style="color:var(--faint)">(없으면 비워 두세요)</span></label>
      <input class="search" style="margin:0 0 6px" id="rGroup" placeholder="예: 화요 성경공부반">
      <button class="btn" id="rGo">시작하기</button>
      <div class="hint" style="font-size:13px;color:var(--faint);margin-top:12px;line-height:1.6">서버에는 <b>공부 진도</b>(마친 과, 들은 분량, 답을 적은 개수, 마지막 공부 날짜)만 올라갑니다. 직접 적으신 글의 내용은 이 기기에만 저장되고 올라가지 않습니다.</div>
    </div><div style="height:40px"></div>`;
  $('#rGo').onclick = () => {
    const name = $('#rName').value.trim(), phone = $('#rPhone').value.replace(/\D/g, ''), group = $('#rGroup').value.trim();
    if(name.length < 2) return toast('이름을 넣어 주세요');
    if(phone.length < 10 || phone.length > 11) return toast('휴대폰 번호 10~11자리를 넣어 주세요');
    S.profile = {name, phone, group, at: new Date().toISOString()}; save(); SYNC.now();
    toast(`${name}님, 환영합니다 🌿`); route();
  };
}

function viewHome(){
  $('#hTitle').textContent = '사랑이 생명입니다';
  $('#bBack').style.visibility = 'hidden';
  const done = LESSONS.filter(x => S.notes[x.id]?.done).length;
  const last = S.last && BYID[S.last];
  const nextUp = last || ITEMS[0];
  let html = `<section class="hero">
    <div class="series">${esc(DATA.book.series)}</div>
    <h2>${esc(DATA.book.title)}</h2>
    <div class="by">이상구 박사 건강강의와 함께 읽는 40과</div>
    <div class="prog"><div class="bar"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="lbl"><span>마친 과 ${done} / ${LESSONS.length}</span><span>${Math.round(done/LESSONS.length*100)}%</span></div></div>
  </section>
  <button class="cont" data-go="${nextUp.id}">${IC.play}<div><b>${last ? '이어서 공부하기' : '처음부터 시작하기'}</b><span>${esc(label(nextUp))} · ${esc(nextUp.title)}</span></div></button>
  <div class="homeTools"><button data-href="#/notes">✏️ 내 노트</button><button data-href="#/ask">💬 질문하기</button><button id="hSearch">🔍 본문 찾기</button></div>
  <div id="searchArea"></div>`;
  let cur = null, rows = '';
  const flush = () => { if(cur !== null) html += `<div class="list">${rows}</div></div>`; rows = ''; };
  for(const it of ITEMS){
    const grp = it.kind === 'part' ? 'p' + it.part : it.kind === 'appendix' ? 'ap' : it.kind === 'page' ? 'intro' : null;
    if(grp && grp !== cur){
      flush(); cur = grp;
      const cnt = it.kind === 'part' ? LESSONS.filter(l => l.inPart === it.part) : [];
      const d = cnt.filter(l => S.notes[l.id]?.done).length;
      html += `<div class="part"><h3>${it.kind === 'part' ? `제${it.part}부 · ${esc(it.title)}<small>${d}/${cnt.length}</small>` : it.kind === 'appendix' ? '부록' : '시작하며'}</h3>`;
    }
    const n = S.notes[it.id];
    const num = it.kind === 'lesson' ? it.no : it.kind === 'part' ? '부' : it.kind === 'appendix' ? '록' : '글';
    rows += `<button class="row${n?.done ? ' done' : ''}" data-go="${it.id}"><span class="n">${n?.done ? '✓' : num}</span>
      <span class="tt"><b>${esc(it.kind === 'part' ? '제' + it.part + '부 들어가며' : it.title)}</b>${it.sub ? `<span>${esc(it.sub)}</span>` : ''}</span>
      <span class="ic">${hasNote(n) ? '✏️' : ''}</span></button>`;
  }
  flush();
  html += '<div style="height:40px"></div>';
  $('#view').innerHTML = html;
  $('#hSearch').onclick = showSearch;
  hidePlayerIfIdle();
}

function showSearch(){
  const a = $('#searchArea');
  if(a.innerHTML){ a.innerHTML = ''; return; }
  a.innerHTML = `<input class="search" id="sq" type="search" placeholder="낱말로 찾기 (예: 탕자, 용서, 유전자)"><div id="sres"></div>`;
  const q = $('#sq'); q.focus();
  q.oninput = () => {
    const w = q.value.trim(); const r = $('#sres');
    if(w.length < 2){ r.innerHTML = ''; return; }
    const out = [];
    for(const it of ITEMS){
      const texts = [it.title, it.sub, it.key?.text, ...it.blocks.map(b => b.text)].filter(Boolean);
      const hit = texts.find(t => t.includes(w));
      if(hit){
        const i = hit.indexOf(w), s = Math.max(0, i - 24);
        out.push(`<button class="row hit" data-go="${it.id}"><span class="n">${it.no || '·'}</span><span class="tt"><b>${esc(it.title)}</b>
          <span>${s ? '…' : ''}${esc(hit.slice(s, i))}<mark>${esc(w)}</mark>${esc(hit.slice(i + w.length, i + w.length + 40))}…</span></span></button>`);
      }
    }
    r.innerHTML = out.length ? `<div class="list" style="margin-top:8px">${out.join('')}</div>` : '<div class="empty" style="padding:20px">찾는 낱말이 없습니다</div>';
  };
}

function viewItem(it){
  S.last = it.id; markDay(); save();
  $('#hTitle').textContent = label(it);
  $('#bBack').style.visibility = 'visible';
  const n = N(it.id), isL = it.kind === 'lesson';
  let h = `<section class="lhead"><div class="kicker">${esc(label(it))}${it.kind === 'lesson' ? ` · 제${it.inPart}부` : ''}</div>
    <h2>${esc(it.title)}</h2>${it.sub ? `<div class="sub">${esc(it.sub)}</div>` : ''}</section>`;
  if(it.key) h += `<blockquote class="keyv"><cite>${esc(it.key.ref)}</cite>${esc(it.key.text)}</blockquote>`;
  h += '<article class="body">';
  let pi = 0, inLead = false;
  for(const b of it.blocks){
    if(b.t === 'h2'){
      if(inLead){ h += '</details>'; inLead = false; }
      if(b.text === '인도자 도움말'){ h += `<details class="lead"><summary>인도자 도움말 (모임을 이끄는 분께)</summary>`; inLead = true; continue; }
      h += `<h2>${esc(b.text)}</h2>`;
      if(b.text === '함께 나누기') h += `<p style="font-size:.85em;color:var(--soft)">생각을 적어 보세요. 🎤를 누르면 말로 적을 수 있습니다.</p>`;
      continue;
    }
    if(b.t === 'h3'){ h += `<h3>${esc(b.text)}</h3>`; continue; }
    if(b.t === 'verse'){ h += `<div class="verse"><cite>${esc(b.ref)}</cite>${esc(b.text)}</div>`; continue; }
    if(b.t === 'q'){
      h += `<div class="note"><div class="qt">${esc(b.text)}</div>${box('q' + b.i, n.q[b.i] || '', '나의 생각')}</div>`; continue;
    }
    if(b.t === 'act'){
      const on = !!n.act[b.i];
      h += `<label class="act${on ? ' on' : ''}"><input type="checkbox" data-act="${b.i}"${on ? ' checked' : ''}><span>${esc(b.text)}</span></label>`; continue;
    }
    if(b.t === 'memory'){
      h += `<div class="memory" id="memBox"><cite>${esc(b.ref)}</cite><div class="mt">${esc(b.text)}</div></div>
        <div class="mtools"><button class="chip" id="mHide">말씀 가리고 쓰기</button><button class="chip" id="mSpeak">🔈 한 번 더 듣기</button></div>
        ${box('copy', n.copy || '', '말씀을 따라 적거나, 외워서 말해 보세요')}
        <div class="score" id="mScore"></div>`;
      continue;
    }
    h += `<p data-pi="${pi}"${n.marks.includes(pi) ? ' class="mk"' : ''}>${esc(b.text)}</p>`; pi++;
  }
  if(inLead) h += '</details>';
  h += `<section class="memo"><h2>나의 묵상 노트</h2>${box('memo', n.memo || '', '오늘 마음에 남은 것, 기도, 질문을 자유롭게 적어 보세요', 140)}
    <button class="speakMine" id="rdMemo">🔈 내가 쓴 글 읽어 주기</button>
    <div style="font-size:13px;color:var(--faint);margin-top:4px">문단을 두 번 톡톡 누르면 밑줄(형광펜)이 그어집니다.</div></section>`;
  if(isL) h += `<button class="donebtn${n.done ? ' on' : ''}" id="bDone">${n.done ? '✓ 이 과를 마쳤습니다' : '이 과를 마쳤어요'}</button>`;
  h += `<button class="askLink" data-href="#/ask/${it.id}">💬 이 과에 대해 질문하기</button>`;
  const idx = ITEMS.indexOf(it), pv = ITEMS[idx - 1], nx = ITEMS[idx + 1];
  h += `</article><div class="nav2"><button ${pv ? `data-go="${pv.id}"` : 'disabled'}><small>이전</small>${pv ? esc(pv.title) : ''}</button>
    <button ${nx ? `data-go="${nx.id}"` : 'disabled'}><small>다음</small>${nx ? esc(nx.title) : ''}</button></div>`;
  $('#view').innerHTML = h;
  bindItem(it);
  loadAudio(it);
}
function box(key, val, ph, minH){
  return `<div class="box"><textarea data-k="${key}" placeholder="${esc(ph)}"${minH ? ` style="min-height:${minH}px"` : ''}>${esc(val)}</textarea>
    <button class="mic" data-mic="${key}" aria-label="말로 적기">${IC.mic}</button></div><div class="interim" data-int="${key}"></div>`;
}
function bindItem(it){
  const n = N(it.id);
  const mem = it.blocks.find(b => b.t === 'memory');
  $('#view').querySelectorAll('textarea[data-k]').forEach(ta => {
    ta.addEventListener('input', () => {
      const k = ta.dataset.k;
      if(k[0] === 'q' && k !== 'q') n.q[k.slice(1)] = ta.value; else n[k] = ta.value;
      save();
      if(k === 'copy') scoreCopy(mem);
    });
  });
  $('#view').querySelectorAll('[data-mic]').forEach(b => b.onclick = () => VOICE.toggle(b, $(`textarea[data-k="${b.dataset.mic}"]`)));
  $('#view').querySelectorAll('[data-act]').forEach(c => c.onchange = () => { n.act[c.dataset.act] = c.checked; c.closest('.act').classList.toggle('on', c.checked); save(); });
  $('#view').querySelectorAll('p[data-pi]').forEach(p => p.ondblclick = () => {
    const i = +p.dataset.pi, at = n.marks.indexOf(i);
    at < 0 ? n.marks.push(i) : n.marks.splice(at, 1);
    p.classList.toggle('mk', at < 0); save();
  });
  const bd = $('#bDone');
  if(bd) bd.onclick = () => { n.done = !n.done; save(); bd.classList.toggle('on', n.done); bd.textContent = n.done ? '✓ 이 과를 마쳤습니다' : '이 과를 마쳤어요'; if(n.done) toast('수고하셨습니다 🌿'); };
  if(mem){
    $('#mHide').onclick = e => { const on = $('#memBox').classList.toggle('hid'); e.target.classList.toggle('on', on); };
    $('#mSpeak').onclick = () => speak(mem.ref + '. ' + mem.text);
    scoreCopy(mem);
  }
  $('#rdMemo').onclick = () => { const t = (n.memo || '').trim(); t ? speak(t) : toast('아직 적은 글이 없습니다'); };
}

/* 따라쓰기 비교: 띄어쓰기·문장부호는 빼고 글자 단위로 맞춰 본다 */
function scoreCopy(mem){
  const el = $('#mScore'); if(!el || !mem) return;
  const norm = s => s.replace(/[\s.,!?'"“”‘’·…:;()\-]/g, '');
  const a = norm(mem.text), b = norm(N(S.last).copy || '');
  if(!b){ el.innerHTML = ''; return; }
  const m = a.length, n = b.length, dp = Array.from({length: m + 1}, () => new Uint16Array(n + 1));
  for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++) dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const keep = new Array(m).fill(false);
  for(let i = m, j = n; i > 0 && j > 0;){ if(a[i-1] === b[j-1]){ keep[i-1] = true; i--; j--; } else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--; }
  const pct = Math.round(dp[m][n] / Math.max(m, n) * 100);
  let miss = ''; if(pct >= 50 && pct < 100){ let c = 0; for(let i = 0; i < m; i++) if(!keep[i]){ miss += `<span class="miss">${esc(a[i])}</span>`; if(++c > 30) break; } }
  el.innerHTML = pct >= 100 ? '<b>✓ 말씀과 똑같이 적으셨습니다!</b>' : `말씀과 <b>${pct}%</b> 같습니다${miss ? ` · 빠진 글자: ${miss}` : ''}`;
}

/* ---------- 질문하기 ---------- */
function viewAsk(lid){
  $('#hTitle').textContent = '질문하기';
  $('#bBack').style.visibility = 'visible';
  const opts = ['<option value="">전체 · 과와 상관없는 질문</option>'].concat(ITEMS.map(it => `<option value="${it.id}"${it.id === lid ? ' selected' : ''}>${esc(label(it))} ${esc(it.title)}</option>`)).join('');
  $('#view').innerHTML = `<div style="margin-top:18px">
      <p style="color:var(--soft);font-size:15px;line-height:1.7;margin:0 0 12px">공부하다 궁금한 것, 마음에 걸리는 것을 편하게 물어 보세요. 인도자가 읽고 답을 드립니다.</p>
      <select class="sel" id="aLesson">${opts}</select>
      ${box('ask', S.askDraft || '', '질문을 적거나 🎤를 눌러 말씀해 주세요', 120)}
      <button class="btn" id="aSend">질문 보내기</button>
    </div>
    <h3 style="font:600 15px var(--sans);color:var(--acc);margin:30px 0 4px">내 질문과 답변</h3><div id="aList"><div class="empty" style="padding:30px 0">불러오는 중…</div></div><div style="height:40px"></div>`;
  const ta = $('textarea[data-k="ask"]');
  ta.oninput = () => { S.askDraft = ta.value; save(); };
  $('[data-mic="ask"]').onclick = e => VOICE.toggle(e.currentTarget, ta);
  $('#aSend').onclick = async () => {
    const text = ta.value.trim(); if(text.length < 2) return toast('질문을 적어 주세요');
    const b = $('#aSend'); b.disabled = true; b.textContent = '보내는 중…';
    try{ await SYNC.ask($('#aLesson').value, text); ta.value = ''; S.askDraft = ''; save(); toast('질문을 보냈습니다. 답이 오면 알려 드릴게요'); drawAsk(); }
    catch(e){ toast(e.message); }
    b.disabled = false; b.textContent = '질문 보내기';
  };
  drawAsk();
}
async function drawAsk(){
  const el = $('#aList'); if(!el) return;
  let list;
  try{ list = await SYNC.myQuestions(); }catch(e){ el.innerHTML = `<div class="empty" style="padding:30px 0">${esc(e.message)}</div>`; return; }
  if(!list.length){ el.innerHTML = '<div class="empty" style="padding:30px 0">아직 보낸 질문이 없습니다</div>'; return; }
  const seen = S.askSeen || 0;
  el.innerHTML = list.map(q => {
    const it = BYID[q.lessonId], at = q.at?.toDate ? q.at.toDate() : null, aat = q.answeredAt?.toDate ? q.answeredAt.toDate() : null;
    return `<div class="qa${aat && aat.getTime() > seen ? ' new' : ''}"><div class="meta">${it ? esc(label(it) + ' ' + it.title) + ' · ' : ''}${at ? at.toLocaleDateString('ko-KR') : '보내는 중'}</div>
      <div class="qtext">${esc(q.text)}</div>
      ${q.answer ? `<div class="ans"><b>답변${aat ? ' · ' + aat.toLocaleDateString('ko-KR') : ''}</b>${esc(q.answer)}</div>
        <button class="speakMine" data-say="${esc(q.answer)}">🔈 답변 읽어 주기</button>` : '<div class="wait">답변을 기다리는 중입니다</div>'}</div>`;
  }).join('');
  el.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
  S.askSeen = Date.now(); save(); $('#askDot').hidden = true;
}

/* ---------- 내 노트 ---------- */
function viewNotes(){
  $('#hTitle').textContent = '내 노트';
  $('#bBack').style.visibility = 'visible';
  let h = `<div class="homeTools" style="margin-top:18px"><button id="nExport">📄 글로 내보내기</button><button id="nShare">📤 보내기·공유</button></div>`;
  let any = false;
  for(const it of ITEMS){
    const n = S.notes[it.id]; if(!hasNote(n)) continue; any = true;
    h += `<div class="nlesson"><h4>${esc(label(it))} ${esc(it.title)}<button data-go="${it.id}">열기 ›</button></h4>`;
    for(const b of it.blocks) if(b.t === 'q' && (n.q[b.i] || '').trim()) h += `<div class="qq">${esc(b.text)}</div><div class="aa">${esc(n.q[b.i])}</div>`;
    if((n.copy || '').trim()) h += `<div class="qq">말씀 따라쓰기</div><div class="aa">${esc(n.copy)}</div>`;
    if((n.memo || '').trim()) h += `<div class="qq">묵상 노트</div><div class="aa">${esc(n.memo)}</div>`;
    h += '</div>';
  }
  if(!any) h += '<div class="empty">아직 적은 노트가 없습니다.<br>각 과의 “함께 나누기”와 “나의 묵상 노트”에 적어 보세요.</div>';
  h += '<div style="height:40px"></div>';
  $('#view').innerHTML = h;
  $('#nExport').onclick = () => download(`아가페1권_나의노트_${today()}.txt`, notesText(), 'text/plain');
  $('#nShare').onclick = async () => {
    const t = notesText();
    if(navigator.share){ try{ await navigator.share({title:'아가페 성경공부 나의 노트', text:t}); }catch(e){} }
    else { try{ await navigator.clipboard.writeText(t); toast('복사했습니다. 붙여넣어 보내세요'); }catch(e){ toast('이 기기에서는 공유가 안 됩니다'); } }
  };
  hidePlayerIfIdle();
}
const today = () => new Date().toISOString().slice(0, 10);
function notesText(){
  let t = `아가페 성경공부 제1권 「사랑이 생명입니다」 — 나의 노트 (${today()})\n`;
  for(const it of ITEMS){
    const n = S.notes[it.id]; if(!hasNote(n)) continue;
    t += `\n━━━━━━━━━━\n${label(it)} ${it.title}${n.done ? ' ✓' : ''}\n`;
    for(const b of it.blocks) if(b.t === 'q' && (n.q[b.i] || '').trim()) t += `\n· ${b.text}\n${n.q[b.i].trim()}\n`;
    const acts = it.blocks.filter(b => b.t === 'act');
    if(acts.some(b => n.act[b.i])) t += `\n[한 주 실천]\n` + acts.map(b => `${n.act[b.i] ? '☑' : '☐'} ${b.text}`).join('\n') + '\n';
    if((n.copy || '').trim()) t += `\n[말씀 따라쓰기]\n${n.copy.trim()}\n`;
    if((n.memo || '').trim()) t += `\n[묵상 노트]\n${n.memo.trim()}\n`;
  }
  return t;
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: type + ';charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- 듣기: 녹음 재생 ---------- */
const aud = $('#aud'); let curAud = null;
const RATES = [0.8, 1, 1.2, 1.5];
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';
function setBar(on){ $('#player').classList.toggle('hide', !on); document.documentElement.style.setProperty('--barH', on ? $('#player').offsetHeight + 'px' : '0px'); }
function loadAudio(it){
  if(!it.audio){ if(aud.paused) setBar(false); return; }
  if(curAud !== it.id){
    const playing = !aud.paused;
    if(playing && curAud) return setBar(true);     // 다른 과를 듣는 중이면 계속 듣게 둔다
    curAud = it.id; aud.src = it.audio; aud.playbackRate = S.rate;
    aud.addEventListener('loadedmetadata', () => { const p = S.pos[it.id]; if(p && p < aud.duration - 3) aud.currentTime = p; }, {once:true});
    $('#pTitle').textContent = `${label(it)} · ${it.title}`;
    if('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: `${label(it)} ${it.title}`, artist: '아가페 성경공부 제1권', album: DATA.book.title, artwork:[{src:'icon-512.png', sizes:'512x512', type:'image/png'}]});
  }
  setBar(true); paintPlay();
}
function hidePlayerIfIdle(){ if(aud.paused) setBar(false); else setBar(true); }
function paintPlay(){ $('#pPlay').innerHTML = aud.paused ? IC.play : IC.pause; $('#pPlay').setAttribute('aria-label', aud.paused ? '재생' : '일시정지'); }
$('#pPlay').onclick = () => { if(!aud.src) return; speechSynthesis?.cancel(); aud.paused ? aud.play().catch(() => toast('녹음 파일을 열 수 없습니다')) : aud.pause(); };
$('#pBack').onclick = () => aud.currentTime = Math.max(0, aud.currentTime - 15);
$('#pFwd').onclick = () => aud.currentTime = Math.min(aud.duration || 0, aud.currentTime + 15);
$('#pRate').onclick = () => { S.rate = RATES[(RATES.indexOf(S.rate) + 1) % RATES.length]; aud.playbackRate = S.rate; paintRate(); save(); };
$('#pAuto').onclick = () => { S.auto = !S.auto; paintRate(); save(); toast(S.auto ? '다 들으면 다음 과로 이어집니다' : '이어 듣기를 껐습니다'); };
function paintRate(){ $('#pRate').textContent = S.rate.toFixed(1) + '×'; $('#pAuto').style.color = S.auto ? 'var(--acc)' : 'var(--faint)'; }
paintRate();
aud.onplay = () => { lastT = null; markDay(); paintPlay(); };
aud.onpause = () => { lastT = null; paintPlay(); save(); };
aud.onloadedmetadata = () => { $('#tDur').textContent = fmt(aud.duration); };
let posT = 0, lastT = null;
aud.ontimeupdate = () => {
  const t = aud.currentTime, d = t - (lastT ?? t); lastT = t;
  if(!aud.paused && d > 0 && d < 3) S.listenSec += d;
  if(aud.duration && curAud){ const pc = Math.min(100, Math.round(t / aud.duration * 100)); if(pc > (S.heard[curAud] || 0)) S.heard[curAud] = pc; }
  if(!seeking) $('#pSeek').value = aud.duration ? aud.currentTime / aud.duration * 1000 : 0;
  $('#tCur').textContent = fmt(aud.currentTime);
  if(Date.now() - posT > 3000){ posT = Date.now(); S.pos[curAud] = aud.currentTime; save(); }
};
aud.onended = () => {
  S.pos[curAud] = 0; S.heard[curAud] = 100; lastT = null; markDay(); save(); SYNC.now();
  if(!S.auto) return paintPlay();
  const i = ITEMS.findIndex(x => x.id === curAud), nx = ITEMS.slice(i + 1).find(x => x.audio);
  if(!nx) return;
  const follow = location.hash === '#/l/' + curAud;
  curAud = null; aud.pause();
  if(follow) location.hash = '/l/' + nx.id; else loadAudio(nx);
  setTimeout(() => aud.play().catch(() => {}), 150);
};
let seeking = false;
$('#pSeek').oninput = () => { seeking = true; $('#tCur').textContent = fmt($('#pSeek').value / 1000 * (aud.duration || 0)); };
$('#pSeek').onchange = () => { aud.currentTime = $('#pSeek').value / 1000 * (aud.duration || 0); seeking = false; };
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('seekbackward', () => $('#pBack').click());
  navigator.mediaSession.setActionHandler('seekforward', () => $('#pFwd').click());
}

/* 내가 쓴 글·암송 구절은 기기 목소리로 읽어 준다 */
function speak(t){
  if(!('speechSynthesis' in window)) return toast('이 기기는 읽어 주기를 지원하지 않습니다');
  speechSynthesis.cancel(); aud.pause();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = Math.min(1.2, S.rate);
  const v = speechSynthesis.getVoices().find(v => /ko/i.test(v.lang) && /Yuna|유나/.test(v.name)) || speechSynthesis.getVoices().find(v => /ko/i.test(v.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- 음성으로 적기 ----------
   1) 브라우저 음성 인식(크롬·사파리)  2) 아이폰 홈 화면 앱: 녹음 → Whisper(키가 있을 때)  3) 둘 다 안 되면 키보드 받아쓰기 안내 */
const VOICE = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = IOS && navigator.standalone === true;
  let cur = null;
  const key = () => (localStorage.getItem('voice.sttKey') || '').trim();
  const insert = (ta, text) => {
    text = text.trim(); if(!text) return;
    const v = ta.value, s = ta.selectionStart ?? v.length, e = ta.selectionEnd ?? v.length;
    const pre = v.slice(0, s), sep = pre && !/\s$/.test(pre) ? ' ' : '';
    ta.value = pre + sep + text + v.slice(e);
    const p = (pre + sep + text).length; ta.setSelectionRange?.(p, p);
    ta.dispatchEvent(new Event('input'));
  };
  const intEl = ta => document.querySelector(`[data-int="${ta.dataset.k}"]`);
  function stop(){ if(cur){ cur.stop(); } }
  function toggle(btn, ta){
    if(cur){ const same = cur.btn === btn; stop(); if(same) return; }
    aud.pause(); speechSynthesis?.cancel();
    if(SR && !standalone) return live(btn, ta);
    if(key() && navigator.mediaDevices?.getUserMedia && window.MediaRecorder) return record(btn, ta);
    ta.focus();
    toast(IOS ? '키보드의 🎤(받아쓰기) 버튼을 눌러 말씀해 주세요' : '이 브라우저는 음성 인식을 지원하지 않습니다. 크롬이나 사파리를 써 주세요');
  }
  function live(btn, ta){
    const r = new SR(); r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true;
    const ie = intEl(ta); let stopped = false;
    cur = {btn, stop: () => { stopped = true; try{ r.stop(); }catch(e){} }};
    btn.classList.add('on'); btn.innerHTML = IC.stop; toast('말씀하세요. 다 하시면 ■를 누르세요');
    r.onresult = e => {
      let tmp = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const x = e.results[i]; x.isFinal ? insert(ta, x[0].transcript) : tmp += x[0].transcript;
      }
      ie.textContent = tmp;
    };
    r.onerror = e => { if(e.error === 'not-allowed') toast('마이크 사용을 허용해 주세요'); else if(e.error !== 'no-speech' && e.error !== 'aborted') toast('음성 인식 오류: ' + e.error); };
    r.onend = () => {
      if(!stopped && cur?.btn === btn){ try{ return r.start(); }catch(e){} }   // 잠시 쉬어도 끊기지 않게
      ie.textContent = ''; btn.classList.remove('on'); btn.innerHTML = IC.mic; if(cur?.btn === btn) cur = null;
    };
    try{ r.start(); }catch(e){ toast('음성 인식을 시작할 수 없습니다'); cur = null; btn.classList.remove('on'); btn.innerHTML = IC.mic; }
  }
  async function record(btn, ta){
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ return toast('마이크 사용을 허용해 주세요'); }
    const mt = ['audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
    const rec = new MediaRecorder(stream, mt ? {mimeType: mt} : undefined), chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    cur = {btn, stop: () => rec.state !== 'inactive' && rec.stop()};
    btn.classList.add('on'); btn.innerHTML = IC.stop; intEl(ta).textContent = '녹음 중… 다 말씀하시면 ■를 누르세요';
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); cur = null;
      btn.classList.remove('on'); btn.classList.add('busy'); btn.innerHTML = IC.mic; intEl(ta).textContent = '글로 바꾸는 중…';
      try{
        const k = key(), groq = k.startsWith('gsk_');
        const fd = new FormData();
        const blob = new Blob(chunks, {type: rec.mimeType || 'audio/mp4'});
        fd.append('file', blob, blob.type.includes('webm') ? 'v.webm' : 'v.m4a');
        fd.append('model', groq ? 'whisper-large-v3' : 'whisper-1'); fd.append('language', 'ko');
        const res = await fetch(groq ? 'https://api.groq.com/openai/v1/audio/transcriptions' : 'https://api.openai.com/v1/audio/transcriptions',
          {method:'POST', headers:{Authorization:'Bearer ' + k}, body: fd});
        if(!res.ok) throw new Error(res.status);
        insert(ta, (await res.json()).text || '');
      }catch(e){ toast('글로 바꾸지 못했습니다 (' + e.message + '). 키를 확인해 주세요'); }
      btn.classList.remove('busy'); intEl(ta).textContent = '';
    };
    rec.start();
  }
  return {toggle, stop};
})();

/* ---------- 서버에 진도 올리기 (Firebase · 섬김성장노트와 같은 프로젝트) ----------
   컬렉션 agape1/{기기 uid}: 이름·번호·모임 + 진도 요약. 적은 글의 내용은 올리지 않는다. */
const SYNC = (() => {
  let FS = null, UID = null, T = null, last = null, err = '', dirty = true;
  function init(){
    if(FS || !window.firebase || !window.FB_CONFIG) return;
    try{
      firebase.initializeApp(window.FB_CONFIG);
      FS = firebase.firestore();
      firebase.auth().onAuthStateChanged(u => {
        if(!u){ firebase.auth().signInAnonymously().catch(e => { err = e.code || e.message; }); return; }
        UID = u.uid; now(); checkAnswers();
      });
    }catch(e){ err = e.message; }
  }
  function summary(){
    const done = LESSONS.filter(l => S.notes[l.id]?.done).map(l => l.id);
    const wrote = {}; let answers = 0, memos = 0;
    for(const [id, n] of Object.entries(S.notes)){
      const a = Object.values(n.q || {}).filter(v => v.trim()).length + ((n.copy || '').trim() ? 1 : 0) + ((n.memo || '').trim() ? 1 : 0);
      if(a){ wrote[id] = a; answers += Object.values(n.q || {}).filter(v => v.trim()).length; if((n.memo || '').trim()) memos++; }
    }
    const heard = {}; for(const [id, p] of Object.entries(S.heard || {})) if(p >= 5) heard[id] = p;
    const acts = {}; for(const [id, n] of Object.entries(S.notes)){ const c = Object.values(n.act || {}).filter(Boolean).length; if(c) acts[id] = c; }
    const lastIt = BYID[S.last];
    return {name:S.profile.name, phone:S.profile.phone, group:S.profile.group || '',
      done, doneN:done.length, heard, heardN:LESSONS.filter(l => (S.heard[l.id] || 0) >= 90).length,
      wrote, answers, memos, acts, listenMin:Math.round((S.listenSec || 0) / 60), days:S.days.length, lastDay:S.days[S.days.length - 1] || '',
      lastId:S.last || '', lastTitle:lastIt ? label(lastIt) + ' ' + lastIt.title : '',
      ua:/iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'PC',
      updated:firebase.firestore.FieldValue.serverTimestamp()};
  }
  async function now(){
    clearTimeout(T); init();
    if(!FS || !UID || !S.profile || !dirty) return;
    dirty = false;
    try{ await FS.collection('agape1').doc(UID).set(summary(), {merge:true}); last = new Date(); err = ''; }
    catch(e){ dirty = true; err = e.code === 'permission-denied' ? '서버 권한 설정이 아직 안 되었습니다' : (e.code || e.message); }
  }
  const ready = async () => {
    init();
    for(let i = 0; i < 40 && !(FS && UID); i++) await new Promise(r => setTimeout(r, 250));
    if(!FS || !UID) throw new Error(navigator.onLine ? '서버에 연결하지 못했습니다. 잠시 뒤 다시 해 주세요' : '인터넷에 연결되어 있지 않습니다');
  };
  async function ask(lessonId, text){
    await ready();
    const it = BYID[lessonId];
    await FS.collection('agape1q').add({uid:UID, name:S.profile.name, phone:S.profile.phone, group:S.profile.group || '',
      lessonId:lessonId || '', lessonTitle:it ? label(it) + ' ' + it.title : '', text, answer:'', at:firebase.firestore.FieldValue.serverTimestamp()});
  }
  async function myQuestions(){
    await ready();
    const snap = await FS.collection('agape1q').where('uid', '==', UID).get();
    const ms = x => x?.toMillis ? x.toMillis() : Date.now();
    return snap.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a, b) => ms(b.at) - ms(a.at));
  }
  async function checkAnswers(){
    try{
      const list = await myQuestions();
      const seen = S.askSeen || 0;
      const fresh = list.filter(q => q.answer && q.answeredAt?.toMillis && q.answeredAt.toMillis() > seen);
      $('#askDot').hidden = !fresh.length;
      if(fresh.length && !location.hash.startsWith('#/ask')) toast(`질문에 답변이 ${fresh.length}개 왔습니다 💬`);
    }catch(e){}
  }
  const later = () => { dirty = true; clearTimeout(T); T = setTimeout(now, 15000); };
  const status = () => err ? '서버 저장 안 됨 — ' + err : last ? `서버에 진도 저장됨 · ${last.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}` : (navigator.onLine ? '서버 연결 중…' : '인터넷에 연결되면 진도가 서버에 올라갑니다');
  addEventListener('online', () => { dirty = true; now(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') now(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && UID) checkAnswers(); });
  return {init, now, later, status, ask, myQuestions};
