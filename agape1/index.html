<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사랑이 생명입니다</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아가페 1권">
<meta name="theme-color" content="#f7f2e8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2e8; --paper:#fffdf8; --ink:#2b2621; --soft:#6b6259; --faint:#9c9287; --line:#e6ddcd;
  --acc:#7a4e2d; --acc2:#3f6b4f; --accbg:#f1e6d8; --verse:#f4ecdf; --mark:#fbe7a6; --ok:#3f6b4f; --rec:#c0392b;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --fs:19px; --barH:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1916; --paper:#242120; --ink:#ece5da; --soft:#b3a999; --faint:#857b6f; --line:#3a3530;
  --acc:#d9a878; --acc2:#8fc0a0; --accbg:#352c24; --verse:#2d2823; --mark:#5c4a1c; --ok:#8fc0a0;
}}
:root[data-theme="dark"]{
  --bg:#1b1916; --paper:#242120; --ink:#ece5da; --soft:#b3a999; --faint:#857b6f; --line:#3a3530;
  --acc:#d9a878; --acc2:#8fc0a0; --accbg:#352c24; --verse:#2d2823; --mark:#5c4a1c; --ok:#8fc0a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{padding-bottom:calc(var(--barH) + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:6px;height:54px}
header.top h1{font:600 17px var(--sans);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:none;min-width:40px;height:40px;border-radius:10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.ib:active{background:var(--accbg)}
.ib svg{width:22px;height:22px}

/* 홈 */
.hero{padding:34px 0 22px;text-align:center}
.hero .series{font-size:14px;color:var(--acc);letter-spacing:.08em}
.hero h2{font:700 34px/1.3 var(--serif);margin:8px 0 6px}
.hero .by{color:var(--soft);font-size:15px}
.prog{margin:22px auto 0;max-width:360px}
.prog .bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--acc2);border-radius:8px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:6px}
.cont{display:flex;align-items:center;gap:12px;width:100%;margin:22px 0 8px;padding:16px 18px;border-radius:16px;border:0;
  background:var(--acc);color:#fff;text-align:left}
.cont b{display:block;font-size:17px}
.cont span{font-size:13px;opacity:.85}
.cont svg{width:28px;height:28px;flex:0 0 auto}
.homeTools{display:flex;gap:8px;margin:8px 0 6px}
.homeTools button{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px}
.part{margin-top:26px}
.part h3{font:600 14px var(--sans);color:var(--acc);margin:0 0 8px;letter-spacing:.02em}
.part h3 small{color:var(--faint);font-weight:400;margin-left:6px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--accbg)}
.row .n{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  background:var(--accbg);color:var(--acc)}
.row.done .n{background:var(--acc2);color:#fff}
.row .tt{flex:1;min-width:0}
.row .tt b{display:block;font-weight:500;font-size:16px}
.row .tt span{display:block;font-size:13px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{font-size:12px;color:var(--faint);white-space:nowrap}

/* 본문 */
.lhead{padding:30px 0 10px}
.lhead .kicker{font-size:14px;color:var(--acc);font-weight:600}
.lhead h2{font:700 29px/1.35 var(--serif);margin:6px 0 8px}
.lhead .sub{color:var(--soft);font-size:16px}
.keyv{margin:22px 0 8px;padding:18px 20px;border-radius:14px;background:var(--verse);font:calc(var(--fs) * .98)/1.8 var(--serif)}
.keyv cite,.verse cite,.memory cite{display:block;font:500 13px var(--sans);color:var(--acc);font-style:normal;margin-bottom:4px}
.body{font:var(--fs)/1.9 var(--serif);word-break:keep-all}
.body h2{font:700 1.2em var(--sans);margin:2.2em 0 .6em;padding-top:1.2em;border-top:1px solid var(--line);color:var(--acc)}
.body h3{font:600 1.02em/1.5 var(--sans);margin:1.7em 0 .5em}
.body p{margin:0 0 1em;border-radius:6px;transition:background .2s}
.body p.mk{background:var(--mark);box-shadow:0 0 0 4px var(--mark)}
.verse{margin:1.2em 0;padding:14px 18px;border-left:3px solid var(--acc);background:var(--verse);border-radius:0 10px 10px 0}
details.lead{margin:2em 0 1em;border:1px solid var(--line);border-radius:12px;padding:0 16px;background:var(--paper)}
details.lead summary{font:600 15px var(--sans);padding:14px 0;cursor:pointer;color:var(--soft)}
details.lead p{font-size:.92em}

/* 적기 */
.note{margin:1.1em 0 1.6em}
.note .qt{margin-bottom:8px}
.box{position:relative}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);
  font:16px/1.7 var(--sans);padding:12px 54px 12px 14px;outline:none}
textarea:focus{border-color:var(--acc)}
.mic{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--accbg);color:var(--acc);
  display:flex;align-items:center;justify-content:center}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--rec);color:#fff;animation:pulse 1.2s infinite}
.mic.busy{opacity:.6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}70%{box-shadow:0 0 0 12px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
.interim{font-size:14px;color:var(--faint);min-height:0;margin-top:4px;font-style:italic}
.speakMine{border:0;background:none;color:var(--soft);font-size:13px;padding:6px 2px}
.act{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:.6em 0;border-radius:12px;background:var(--paper);border:1px solid var(--line);cursor:pointer;font-size:.95em}
.act input{width:22px;height:22px;margin-top:5px;flex:0 0 auto;accent-color:var(--acc2)}
.act.on{opacity:.65}
.act.on span{text-decoration:line-through;text-decoration-color:var(--faint)}
.memory{margin:1em 0;padding:16px 18px;border-radius:12px;background:var(--verse)}
.memory .mt{transition:filter .2s}
.memory.hid .mt{filter:blur(7px);user-select:none}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font:14px var(--sans)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.score{font:14px var(--sans);color:var(--soft);margin-top:6px}
.score b{color:var(--ok)}
.score .miss{color:var(--rec);text-decoration:underline wavy}
.memo{margin:2.6em 0 1em;padding-top:1.4em;border-top:1px solid var(--line)}
.memo h2{border:0!important;padding:0!important;margin-top:0!important}
.donebtn{display:block;width:100%;margin:1.6em 0 .6em;padding:15px;border-radius:14px;border:1px solid var(--acc2);background:none;color:var(--acc2);font:600 16px var(--sans)}
.donebtn.on{background:var(--acc2);color:#fff}
.nav2{display:flex;gap:10px;margin:10px 0 40px}
.nav2 button{flex:1;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px;text-align:left}
.nav2 button:last-child{text-align:right}
.nav2 small{display:block;color:var(--faint);font-size:12px}
.nav2 button:disabled{visibility:hidden}

/* 재생 막대 */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.player.hide{display:none}
.player .wrap{display:flex;flex-direction:column;gap:4px}
.seek{display:flex;align-items:center;gap:8px;font:12px var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}
.seek input{flex:1;accent-color:var(--acc)}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:4px}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.play svg{width:26px;height:26px}
.ctrls .ib{font-size:13px;font-weight:600}
.ptitle{font:13px var(--sans);color:var(--soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 시트 */
.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 14px;font:600 18px var(--sans)}
.sheet .grp{margin:16px 0}
.sheet label.t{display:block;font-size:14px;color:var(--soft);margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:11px 4px;font-size:15px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--acc);color:#fff}
.sheet input[type=text],.sheet input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px var(--sans)}
.sheet .hint{font-size:13px;color:var(--faint);margin-top:6px;line-height:1.6}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#fff;font:600 15px var(--sans);margin-top:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

/* 내 노트 */
.nlesson{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.nlesson h4{margin:0 0 10px;font:600 16px var(--sans)}
.nlesson h4 button{border:0;background:none;color:var(--acc);font-size:13px;float:right}
.nlesson .qq{font-size:14px;color:var(--soft);margin-top:10px}
.nlesson .aa{white-space:pre-wrap;font:15px/1.7 var(--serif);margin-top:2px}
.empty{text-align:center;color:var(--faint);padding:60px 0}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:16px var(--sans);margin:16px 0 4px}
.hit mark{background:var(--mark);color:inherit}

.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--rec);border:2px solid var(--bg)}
.qa{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.qa .meta{font-size:12px;color:var(--faint);margin-bottom:6px}
.qa .qtext{white-space:pre-wrap;font-size:16px;line-height:1.7}
.qa .ans{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--verse);white-space:pre-wrap;font:15px/1.8 var(--serif)}
.qa .ans b{display:block;font:600 13px var(--sans);color:var(--acc);margin-bottom:4px}
.qa .wait{margin-top:10px;font-size:13px;color:var(--faint)}
.qa.new{border-color:var(--acc)}
.sel{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:15px var(--sans);margin:4px 0 10px}
.askLink{display:block;width:100%;margin:0 0 .6em;padding:14px;border-radius:14px;border:1px dashed var(--acc);background:none;color:var(--acc);font:600 15px var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(var(--barH) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="ib" id="bBack" aria-label="목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="hTitle">사랑이 생명입니다</h1>
  <button class="ib" id="bAsk" aria-label="질문하기" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><i id="askDot" class="dot" hidden></i></button>
  <button class="ib" id="bNotes" aria-label="내 노트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
  <button class="ib" id="bSet" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div></header>
<main class="wrap" id="view"></main>

<div class="player hide" id="player"><div class="wrap">
  <div class="ptitle" id="pTitle"></div>
  <div class="seek"><span id="tCur">0:00</span><input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="재생 위치"><span id="tDur">0:00</span></div>
  <div class="ctrls">
    <button class="ib" id="pRate" aria-label="속도">1.0×</button>
    <button class="ib" id="pBack" aria-label="15초 뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">15</text></svg></button>
    <button class="play" id="pPlay" aria-label="재생"></button>
    <button class="ib" id="pFwd" aria-label="15초 앞으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v4h-4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">15</text></svg></button>
    <button class="ib" id="pAuto" aria-label="다음 과 이어 듣기">이어듣기</button>
  </div>
</div></div>
<audio id="aud" preload="metadata"></audio>
<div class="toast" id="toast"></div>

<script>
const DATA = {"book":{"title":"사랑이 생명입니다","series":"아가페 성경공부 제1권"},"items":[{"id":"00","kind":"page","no":null,"part":null,"title":"머리말, 처음 오신 분께","sub":null,"key":null,"blocks":[{"t":"p","text":"이 책을 펴신 당신이 어떤 분인지 저는 모릅니다. 교회에 한 번도 가 본 적이 없는 분일 수도 있고, 어릴 때 다니다가 발을 끊은 분일 수도 있습니다. 누군가의 손에 이끌려 마지못해 첫 장을 넘기셨을 수도 있습니다. 어느 쪽이든 괜찮습니다. 이 책은 당신에게 무엇을 믿으라고 다그치려고 쓴 책이 아닙니다."},{"t":"p","text":"사람들과 하나님 이야기를 나누다 보면 자주 듣는 말이 있습니다. \"하나님이 계시다면 무서운 분일 것 같아요.\" \"벌받을까 봐 교회는 못 가겠어요.\" \"나 같은 사람은 자격이 없지요.\" 그 말을 들을 때마다 마음이 아팠습니다. 많은 분이 하나님을 만나 보기도 전에 하나님에 대한 소문부터 들었고, 그 소문이 대개 무서운 것이었기 때문입니다."},{"t":"p","text":"이 책이 전하려는 것은 하나입니다. 하나님은 사랑이시고, 그 사랑에는 조건이 없다는 것입니다. 잘해야 받는 사랑이 아니고, 못하면 거두어 가는 사랑이 아닙니다. 성경은 그 사랑을 '아가페'라고 부릅니다."},{"t":"p","text":"이 책은 성경에서 시작하지 않고 몸에서 시작합니다. 의사인 이상구 박사는 오랫동안 아픈 사람들 곁에서, 사람의 몸이 사랑받을 때와 두려울 때 어떻게 달라지는지를 이야기해 왔습니다. 제1부는 그 이야기를 따라갑니다. 내 몸 안에 나를 살리려고 애쓰는 생명이 있다는 것, 그 생명이 어디서 오는지를 묻는 데서 출발합니다. 그다음에 천천히, 하나님이 어떤 분이신지, 무엇이 잘못되었는지, 예수님이 누구신지, 십자가가 무엇인지, 믿는다는 것이 무엇인지를 한 걸음씩 걸어갑니다."},{"t":"p","text":"부탁이 하나 있습니다. 서두르지 마십시오. 믿어지지 않는 대목은 믿어지지 않는다고 말씀해 주십시오. 의심은 이 자리에서 환영받습니다. 마흔 주가 지난 뒤에도 여전히 모르겠다고 하셔도 괜찮습니다. 다만 그동안 한 가지만은 마음에 남기를 바랍니다. 당신은 사랑받고 있다는 것, 지금 그 모습 그대로 그렇다는 것입니다."},{"t":"p","text":"마흔 주의 길을 함께 걷게 되어 기쁩니다."},{"t":"p","text":"이 교재를 쓰는 법."},{"t":"h2","text":"모임의 기본"},{"t":"p","text":"한 주에 한 과씩, 마흔 주 동안 걷는 길입니다. 한 번 모임은 70분에서 90분이 알맞습니다. 서너 명에서 여덟 명 정도가 둘러앉으면 모두가 말할 수 있습니다. 둘이서 마주 앉아 읽어도 좋고, 혼자 읽으며 질문에 답을 적어 가도 됩니다."},{"t":"h2","text":"한 번 모임의 흐름"},{"t":"p","text":"첫째, 안부 나누기(10분). 지난주 한 주 실천이 어땠는지 가볍게 나눕니다. 못 했어도 괜찮습니다."},{"t":"p","text":"둘째, 마음 열기(10분). 한 사람이 소리 내어 읽습니다. 떠오르는 자기 이야기가 있으면 짧게 나눕니다."},{"t":"p","text":"셋째, 말씀 속으로(30분). 소제목 단위로 돌아가며 읽습니다. 성경 인용은 가능하면 각자 성경을 펴서 앞뒤 문맥과 함께 읽습니다."},{"t":"p","text":"넷째, 아가페로 읽기(5분). 함께 소리 내어 읽습니다."},{"t":"p","text":"다섯째, 함께 나누기(25분). 네 질문을 다 다루지 않아도 됩니다. 한 질문에 오래 머물러도 좋습니다."},{"t":"p","text":"여섯째, 마음에 새기기와 한 주 실천(5분). 암송 구절을 함께 읽고, 이번 주에 해 볼 한 가지를 각자 고릅니다."},{"t":"h2","text":"나눔의 약속"},{"t":"p","text":"여기서 들은 이야기는 여기에 둡니다."},{"t":"p","text":"남의 이야기를 고쳐 주거나 가르치지 않습니다. 듣습니다."},{"t":"p","text":"말하고 싶지 않을 때는 \"오늘은 듣겠습니다\"라고 하면 됩니다."},{"t":"p","text":"정답을 찾는 자리가 아닙니다. 모르겠다는 말, 믿어지지 않는다는 말도 환영합니다."},{"t":"p","text":"다른 교회, 다른 종교, 그 자리에 없는 사람을 깎아내리지 않습니다."},{"t":"h2","text":"인도하는 분께"},{"t":"p","text":"인도자는 가르치는 사람이 아니라 자리를 지키는 사람입니다. 준비는 그 과를 미리 한 번 읽고, 인도자 도움말을 보고, 모일 분들의 이름을 떠올리며 기도하는 것으로 충분합니다. 질문에 답하지 못해도 괜찮습니다. \"저도 잘 모르겠습니다. 같이 찾아봅시다\"는 말은 인도자가 할 수 있는 가장 좋은 말 가운데 하나입니다."},{"t":"p","text":"침묵을 두려워하지 마십시오. 질문을 던진 뒤 열을 세는 동안 기다려 보십시오. 한 사람이 오래 말하면 \"고맙습니다, 다른 분 이야기도 들어 볼까요\" 하고 부드럽게 건넵니다. 누군가 깊은 아픔을 꺼내면 진도를 멈추고 들으십시오. 그날은 그것이 공부입니다. 몸이나 마음의 병으로 힘들어하는 분에게는 치료를 계속 받도록 격려하고, 필요하면 전문가의 도움을 받도록 권해 주십시오."},{"t":"p","text":"무엇보다, 겁을 주어 믿게 하지 마십시오. 이 교재가 전하려는 하나님은 두려움으로 사람을 움직이지 않으시는 분입니다. 전하는 방법이 전하는 내용과 같아야 합니다."},{"t":"p","text":"일러두기."},{"t":"p","text":"이 교재는 이상구 박사(뉴스타트센터)의 성경강의와 건강강의를 오랫동안 듣고 정리한 자료를 바탕으로, 소그룹에서 함께 읽고 나누기 위해 엮은 것입니다. 바탕이 된 자료는 성경강의 제205기부터 제314기까지의 인용 성구와 해설을 성경 순서로 정리한 성구 해설 독본, 그리고 건강강의를 주제별로 묶은 건강강의 통합본(원리편, 질병편)입니다."},{"t":"p","text":"이 책의 관점 이 교재는 \"하나님은 사랑이시라\"(요한일서 4장 16절)는 한 문장을 성경 전체를 읽는 렌즈로 삼습니다. 하나님의 사랑은 조건이 없는 사랑, 곧 아가페라는 것이 이 책의 출발점이자 도착점입니다. 그래서 어떤 대목은 독자가 지금까지 들어 온 설명과 다를 수 있습니다. 이 책의 풀이가 유일한 정답이라고 주장하지 않습니다. 성경 본문을 직접 펴서 읽고, 스스로 살피고, 함께 묻는 자리로 삼아 주시기 바랍니다."},{"t":"p","text":"인용에 대하여 성경 본문은 개역개정판을 따랐습니다. \"박사님은 이렇게 설명합니다\"라고 적은 대목은 정리 자료에서 확인한 강의 내용을 옮긴 것이고, 그런 표시가 없는 대목은 엮은이가 교재의 목소리로 풀어 쓴 것입니다. 각 과 끝의 자료에는 그 과가 기댄 강의 기수를 적었습니다. 강의를 글로 옮기는 과정에서 생긴 잘못이 있다면 그것은 박사님이 아니라 엮은이의 몫입니다."},{"t":"p","text":"건강 이야기에 대하여 이 책에는 마음과 몸, 사랑과 생명의 관계를 다룬 건강강의 내용이 실려 있습니다. 이 내용은 의학적 진단이나 치료를 대신하지 않습니다. 이 책은 \"믿으면 병이 낫는다\"고 약속하지 않으며, 받고 있는 치료나 약을 스스로 중단하라고 권하지 않습니다. 치료에 관한 결정은 반드시 담당 의료진과 상의하시기 바랍니다."},{"t":"p","text":"한 과의 짜임 마음 열기(이야기로 시작) ,  말씀 속으로(본문 읽기) ,  아가페로 읽기(핵심 정리) ,  함께 나누기(질문 넷) ,  마음에 새기기(한 절) ,  한 주 실천 ,  인도자 도움말 순입니다."}],"inPart":0,"audio":"audio/00.m4a"},{"id":"01","kind":"part","no":null,"part":1,"title":"내 몸이 들려주는 이야기","sub":null,"key":null,"blocks":[{"t":"p","text":"하나님 이야기를 꺼내기 전에, 먼저 우리 몸 이야기부터 하려 합니다. 몸은 누구에게나 있고, 아파 본 경험도 누구에게나 있기 때문입니다. 아플 때 우리는 묻습니다. 왜 하필 나일까, 내가 무엇을 잘못했을까."},{"t":"p","text":"제1부는 의사인 이상구 박사가 건강강의에서 들려준 이야기를 따라갑니다. 병은 유전자가 없어진 것이 아니라 꺼져 있는 상태라는 것, 유전자에는 스위치가 있고 물려받은 유전자가 운명은 아니라는 것, 그 스위치를 켜는 힘이 값없이 주어지고 있다는 것, 마음에 품은 뜻이 몸에 가 닿는다는 것, 그리고 그 생명 앞에서 우리에게 선택이 맡겨져 있다는 것입니다."},{"t":"p","text":"성경은 과마다 한두 구절만 조심스럽게 펼쳐 볼 것입니다. 다 믿지 않으셔도 괜찮습니다. 이 책은 병원 치료를 대신하려는 책이 아니며, 누구를 탓하려는 책도 아닙니다. 다만 다섯 과를 지나는 동안 한 가지는 느끼시면 좋겠습니다. 내 몸은 지금도 나를 살리려고 애쓰고 있고, 그 뒤에는 나를 돌보는 손길이 있다는 것입니다."}],"inPart":1,"audio":"audio/01.m4a"},{"id":"02","kind":"lesson","no":1,"part":null,"title":"나는 왜 아픈가","sub":"병은 어디에서 시작되고, 생명이란 무엇일까요","key":{"ref":"잠언 17장 22절","text":"마음의 즐거움은 양약이라도 심령의 근심은 뼈를 마르게 하느니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"옛 어른들은 서로 만나면 \"속이 편하십니까\" 하고 인사를 나누었습니다. 뱃속이 편한지를 묻는 말 같지만, 마음이 편한지를 묻는 말이기도 했습니다. 우리말에서 '속'은 몸의 속이면서 동시에 마음의 속입니다. 그래서 마음이 상했을 때 우리는 \"속상하다\"고 말합니다."},{"t":"p","text":"이상구 박사는 건강강의에서 이런 장면을 이야기합니다. 오랜만에 만난 친구의 얼굴이 몰라보게 상해 있어서, 지난 일 년 동안 어떻게 그렇게 늙었느냐고 묻게 되는 때가 있습니다. 사정을 들어 보면 그 일 년 동안 그 사람에게 있었던 일은 대개 속상한 일이었다는 것입니다. 마음에서 일어난 일이 어느새 얼굴에, 몸에 나타난 것입니다."},{"t":"p","text":"몸이 아플 때 우리는 먼저 병의 이름을 묻습니다. 그리고 곧 이렇게 묻게 됩니다. 왜 하필 나일까, 내가 무엇을 잘못했을까. 이 책의 첫 과는 그 물음에서 출발하려 합니다. 병은 어디에서 시작되는 것일까요. 그리고 지금 이 순간 나를 살아 있게 하는 생명이란 무엇일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"병의 이름은 많아도 뿌리는 하나입니다"},{"t":"p","text":"우리 몸은 세포로 이루어져 있습니다. 세포 하나하나가 제 할 일을 하면 건강한 것이고, 그러지 못하면 병이 난 것입니다. 이상구 박사는 병의 이름이 수백 가지인 까닭을, 병의 종류가 그만큼 많아서가 아니라 어느 세포가 제 기능을 잃었느냐가 다르기 때문이라고 설명합니다."},{"t":"p","text":"그런데 세포가 무슨 일을 할지를 정하는 것은 그 세포 안에 들어 있는 유전자입니다. 박사님은 이것을 컴퓨터에 빗대어 말합니다. 세포는 컴퓨터이고, 유전자는 그 안에 깔린 프로그램입니다. 위장 세포에는 음식을 소화시키는 물질을 만드는 프로그램이 있고, 뇌세포에는 마음을 기쁘게 하는 엔도르핀을 만드는 프로그램이 있습니다. 면역세포인 T세포에는 암세포와 바이러스를 없애는 물질을 만드는 프로그램이 들어 있습니다."},{"t":"p","text":"기계가 멀쩡해도 프로그램이 제대로 돌아가지 않으면 컴퓨터는 고장 난 것처럼 움직입니다. 위장의 프로그램이 멈추면 소화가 되지 않고, 뇌세포의 프로그램이 멈추면 마음이 가라앉습니다. 그래서 박사님은 병 앞에서 던지는 질문을 바꾸어 보자고 권합니다. \"무슨 병입니까\"만 묻지 말고 \"내 몸의 어느 프로그램이, 왜 멈추었습니까\"를 함께 묻자는 것입니다. 병명은 치료의 이름을 알려 주지만, 원인을 알아야 돌아갈 길이 보이기 때문입니다."},{"t":"p","text":"박사님은 병의 이름이 바뀐 일도 예로 듭니다. 예전에는 나이가 들면 으레 걸리는 병이라고 해서 '성인병'이라 불렀습니다. 그런데 젊은 사람도 같은 병에 걸리는 일이 많아지면서 이제는 '생활습관병'이라고 부릅니다. 병이 나이나 운수의 문제가 아니라 날마다 쌓이는 삶의 문제라는 것을 그 이름이 말해 주고 있습니다."},{"t":"h3","text":"없어진 것이 아니라 꺼져 있는 것입니다"},{"t":"p","text":"여기서 반가운 소식이 하나 있습니다. 박사님의 설명에 따르면, 병이 났다는 것은 대개 그 유전자가 사라졌다는 뜻이 아닙니다. 그대로 있는데 꺼져 있다는 뜻입니다. 전구는 멀쩡한데 전기가 끊겨 불이 나간 것과 같습니다. 그렇다면 필요한 일은 전구를 갈아 끼우는 것이 아니라 다시 불이 들어오게 하는 것입니다."},{"t":"p","text":"강의에 자주 나오는 예가 산돼지와 집돼지입니다. 둘은 유전자 검사를 해 보면 똑같은 돼지라고 합니다. 그런데 산돼지에게는 길게 뻗은 송곳니가 있고 집돼지에게는 없습니다. 우리 안에서 주는 먹이만 받아먹고 살다 보니 땅을 파헤칠 일도, 다툴 일도 없어져서 송곳니를 만드는 유전자가 꺼진 것입니다. 없어진 것이 아니라는 증거가 있습니다. 집돼지를 산으로 돌려보내면 몇 세대 지나지 않아 송곳니가 다시 자라난다는 것입니다."},{"t":"p","text":"박사님은 여기서 한 가지를 더 짚습니다. 산돼지가 집돼지로 바뀌는 데는 오랜 세월이 걸리지만, 집돼지가 산돼지로 돌아가는 데는 훨씬 짧은 시간이면 된다는 것입니다. 당겨 놓은 고무줄을 놓으면 힘들이지 않아도 제자리로 돌아가는 것과 같습니다. 우리 몸은 망가지는 쪽보다 본래대로 돌아가는 쪽으로 더 쉽게 기울도록 지어져 있다는 이야기입니다. 아픈 분에게 이것은 작지 않은 위로입니다."},{"t":"h3","text":"속이 상하면 몸도 상합니다"},{"t":"p","text":"그러면 무엇이 멀쩡하던 프로그램을 꺼 버리는 것일까요. 잘못된 음식이나 생활 습관도 한몫을 합니다. 그러나 박사님은 더 깊은 곳을 가리킵니다. 처음에 나눈 '속상하다'는 말로 돌아가 보겠습니다. 사람의 속은 곧 세포의 속이고, 세포의 속 한가운데에 유전자가 있습니다. 그래서 박사님은 마음이 상한다는 말이 실제로는 세포 속의 유전자가 상한다는 말과 통한다고 풀이합니다. \"기가 막힌다\", \"억장이 무너진다\"는 말도 그렇습니다. 믿었던 사람에게 배신을 당하면 정말로 온몸에서 힘이 빠져나갑니다. 우리말은 마음과 몸이 하나로 이어져 있다는 것을 오래전부터 알고 있었던 셈입니다."},{"t":"p","text":"성경에도 같은 통찰이 있습니다. 성경은 아주 오래전에 기록된 책인데, 그 가운데 잠언은 삶의 지혜를 짧은 문장으로 모아 놓은 책입니다."},{"t":"verse","ref":"잠언 17장 22절","text":"마음의 즐거움은 양약이라도 심령의 근심은 뼈를 마르게 하느니라"},{"t":"p","text":"'양약'은 좋은 약, '심령'은 마음 깊은 곳을 뜻하는 옛말입니다. 박사님은 이 구절을 설명하면서 노먼 커즌스라는 사람의 이야기를 듭니다. 편집국장 출신인 그는 심한 관절염으로 가망이 없다는 말을 들었습니다. 그는 자기 병의 원인이 웃음 없이 살아온 데 있다고 판단하고, 찰리 채플린의 영화를 하루 종일 보면서 웃었습니다. 그리고 회복된 경험을 질병의 해부라는 책으로 남겼습니다. 웃으면 어떤 병이든 낫는다는 말이 아닙니다. 병원의 치료를 가볍게 여겨도 된다는 말도 아닙니다. 다만 마음에서 일어나는 일이 몸과 따로 떨어져 있지 않다는 것, 그것 하나는 기억해 둘 만합니다."},{"t":"h3","text":"지금 나를 살리고 있는 것"},{"t":"p","text":"박사님은 '무지'를 새롭게 정의합니다. 무지란 지식이 모자란 것이 아니라 생명이 있다는 사실을 모르는 것이라고 합니다. 박사님의 설명에 따르면 우리 몸에서는 암세포가 매일 생겨나지만, 건강할 때에는 T세포가 그때그때 찾아내어 처리합니다. 내가 부탁한 적도 없고, 그런 일이 있는 줄조차 몰랐는데, 잠든 사이에도 누군가 내 몸을 돌보고 있었던 것입니다. 상처가 아물고, 먹은 밥이 소화되고, 아침이면 눈이 떠지는 일도 모두 그렇습니다."},{"t":"p","text":"이 돌봄에 무슨 이름을 붙여야 할까요. 박사님은 돌본다는 말을 한 단계 높이면 사랑한다는 말이 된다고 합니다. 성경은 그 생명을 주시는 분이 계시다고 말합니다. 예수님은 자신이 세상에 온 까닭을 이렇게 밝히셨습니다."},{"t":"verse","ref":"요한복음 10장 10절 하반절","text":"내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라"},{"t":"p","text":"이 말씀을 지금 다 받아들이지 않으셔도 괜찮습니다. 이 책은 몸의 이야기에서 시작해서, 그 생명이 어디에서 오는지를 천천히 따라가 보려 합니다. 오늘은 한 가지만 마음에 담아 두시면 좋겠습니다. 아픈 것은 벌이 아닙니다. 그리고 내 몸 안에는 지금도 나를 살리려는 힘이 쉬지 않고 일하고 있습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"병은 하늘이 내린 벌도, 팔자도 아닙니다. 이상구 박사는 병을 켜져 있어야 할 유전자가 꺼진 상태로 설명하며, 꺼진 것은 다시 켜질 수 있다고 말합니다. 내가 알지 못하는 사이에도 내 몸을 돌보아 온 생명이 있습니다. 그 돌봄의 다른 이름이 사랑이라는 것을, 이 책은 앞으로 한 걸음씩 확인해 가려 합니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 요즘 \"속이 편하십니까\"라는 인사를 받는다면 무엇이라고 대답하시겠습니까?"},{"t":"q","i":1,"text":"둘째, 속상한 일을 겪은 뒤에 몸이 먼저 반응했던 경험이 있다면 나누어 주십시오."},{"t":"q","i":2,"text":"셋째, 아팠을 때 \"왜 하필 나일까\" 하고 물었던 적이 있습니까? 그때 스스로 어떤 대답을 내렸습니까?"},{"t":"q","i":3,"text":"넷째, 유전자가 없어진 것이 아니라 꺼져 있을 뿐이라는 말이 지금의 나에게 어떻게 들립니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"잠언 17장 22절","text":"마음의 즐거움은 양약이라도 심령의 근심은 뼈를 마르게 하느니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"잠자리에 들기 전, 오늘 하루 내가 시키지 않았는데도 내 몸이 해 준 일 세 가지를 떠올리고 \"고맙다\"고 말해 봅니다."},{"t":"act","i":1,"text":"이번 주에 속상한 일이 생기면 혼자 삭이지 말고, 종이에 적거나 믿을 만한 사람에게 이야기해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"첫 모임입니다. 내용을 다 전하려 하기보다 서로 얼굴을 익히고 편안해지는 데 시간을 넉넉히 쓰십시오. 투병 중인 분이 계시면 \"내 마음이 잘못되어서 병이 났다는 말이냐\"고 받아들일 수 있습니다. 이 과의 뜻은 탓하는 것이 아니라 돌아갈 길이 있다는 소식이라는 점을 분명히 해 주십시오. 또한 이 교재는 병원 치료나 약을 대신하지 않습니다. 치료를 받고 계신 분은 그대로 이어 가시도록 권해 주십시오. 하나님 이야기가 낯선 분에게는 동의를 구하지 말고, 그런 시각도 있다는 정도로 가볍게 지나가면 충분합니다."}],"inPart":1,"audio":"audio/02.m4a"},{"id":"03","kind":"lesson","no":2,"part":null,"title":"유전자에는 스위치가 있습니다","sub":"물려받은 유전자는 바꿀 수 없는 운명일까요","key":{"ref":"고린도후서 3장 3절","text":"너희는 우리로 말미암아 나타난 그리스도의 편지니 이는 먹으로 쓴 것이 아니요 오직 살아 계신 하나님의 영으로 쓴 것이며 또 돌판에 쓴 것이 아니요 오직 육의 마음판에 쓴 것이라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"건강검진 문진표에는 가족 가운데 암이나 당뇨, 고혈압을 앓은 분이 있는지 묻는 칸이 있습니다. 그 칸에 표시를 하다 보면 마음 한구석이 무거워집니다. 아버지도 그러셨는데, 어머니 쪽이 다 그렇다는데, 나도 결국 그 길을 가게 되는 것은 아닐까. \"우리 집안 내력이야\"라는 말은 때로 팔자라는 말처럼 들립니다. 닮고 싶지 않았던 부모님의 모습을 거울 속 내 얼굴에서 발견할 때에도 비슷한 마음이 듭니다. 피는 못 속인다는 옛말이 괜히 생긴 것이 아니구나 싶어집니다."},{"t":"p","text":"지난 과에서 우리는 병이란 유전자가 없어진 것이 아니라 꺼져 있는 상태라는 설명을 들었습니다. 산으로 돌아간 집돼지에게 송곳니가 다시 자라난다는 이야기도 나누었습니다. 그렇다면 자연스럽게 다음 질문이 떠오릅니다. 꺼지고 켜진다면 어딘가에 스위치가 있다는 말인데, 그 스위치는 어디에 있고 어떻게 움직이는 것일까요. 그리고 부모에게서 물려받은 유전자는 정말 내 앞날을 정해 놓은 운명일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"유전자는 운명이 아닙니다"},{"t":"p","text":"이상구 박사는 1967년에 의과대학을 졸업했습니다. 박사님의 회고에 따르면, 그 무렵까지 의학은 유전자가 태어날 때 정해져서 평생 변하지 않는다고 가르쳤습니다. 이 생각을 뒤집은 학문이 후성유전학입니다. '후성'은 '후천성'을 줄인 말입니다. 유전자의 글자는 그대로인데, 그 유전자가 켜지고 꺼지는 일은 태어난 뒤에도 달라진다는 것을 밝힌 학문입니다."},{"t":"p","text":"박사님이 강의에서 자주 보여 주는 자료가 있습니다. 2010년 1월 18일자 타임지 표지입니다. 표지의 제목은 \"왜 당신의 DNA는 당신의 운명이 아닌가\"였고, 그 아래에는 \"당신이 하는 선택이 당신의 유전자를 바꿀 수 있다\"는 뜻의 문장이 실려 있었다고 합니다. 박사님은 이렇게 풀이합니다. 부모에게서 병과 관련된 유전자를 물려받았다 해도 그것은 가능성이지 운명이 아니라는 것입니다."},{"t":"p","text":"집안 내력이라는 말에 눌려 지내 온 분에게 이것은 가볍지 않은 소식입니다. 물론 이것이 아무 병도 걸리지 않는다는 보증은 아닙니다. 그러나 적어도 내 앞날이 태어날 때 이미 다 정해져 버린 것은 아니라는 말입니다. 오늘 내가 무엇을 먹고, 어떻게 움직이고, 어떤 마음으로 사느냐가 내 몸에 실제로 새겨진다는 뜻이기도 합니다."},{"t":"h3","text":"스위치는 어디에 있을까요"},{"t":"p","text":"박사님은 스위치가 있는 자리를 이렇게 설명합니다. 세포 안에 핵이 있고, 핵 안에 실뭉치처럼 생긴 염색체가 있습니다. 그 실 한 가닥 한 가닥이 유전자입니다. 이 실은 히스톤이라는 둥근 단백질에 감겨 있는데, 바로 그 자리에 유전자를 켜고 끄는 스위치가 있다는 것입니다."},{"t":"p","text":"그 스위치를 누르는 것은 메틸기라고 부르는 아주 작은 물질입니다. 탄소 하나에 수소 셋이 붙은 단순한 화학물질입니다. 메틸기가 스위치에 달라붙으면 유전자가 꺼지고, 떨어져 나가면 켜집니다. 강당 입구의 전등 스위치를 손가락으로 눌러야 불이 들어오는 것과 비슷합니다."},{"t":"p","text":"놀라운 것은 그 정확함입니다. 박사님의 설명에 따르면 세포 하나에는 2만 가지가 넘는 유전자가 들어 있습니다. 몸속에 암세포가 생기면 T세포 안에서 암세포를 없애는 물질을 만드는 유전자가 켜지고, 일이 끝나면 다시 꺼집니다. 필요한 때에, 필요한 자리에서, 필요한 유전자만 골라 켜고 끄는 일이 온몸에서 쉬지 않고 일어납니다. 우리는 그런 일이 벌어지는 줄도 모르고 밥을 먹고 잠을 잡니다. 살아 있다는 것은 이 일이 지금도 계속되고 있다는 뜻입니다."},{"t":"h3","text":"똑똑한 것은 자동차가 아닙니다"},{"t":"p","text":"여기서 박사님은 한 가지 물음을 던집니다. 메틸기는 생각하는 힘이 없는 화학물질입니다. 그런데 어떻게 그 많은 유전자 가운데 지금 꼭 필요한 하나를 찾아가 붙고, 때가 되면 정확히 떨어지는 것일까요."},{"t":"p","text":"박사님은 시골에서 올라오신 할머니 이야기를 합니다. 손자가 리모컨으로 장난감 자동차를 이리저리 몰고 있습니다. 손자 손에 들린 리모컨을 보지 못한 할머니는 \"서울 오니 장난감도 참 똑똑하다\" 하고 감탄하십니다. 그러나 똑똑한 것은 자동차가 아닙니다. 신호를 보내는 손이 따로 있습니다. 박사님은 메틸기가 전기를 띠고 있다는 점에 주목합니다. 전기를 띠고 있다는 것은 신호를 받을 준비가 되어 있다는 뜻이고, 그렇다면 어디선가 신호를 보내는 이가 있다는 것입니다."},{"t":"p","text":"그 신호가 무엇인지를 짐작하게 해 주는 실험을 박사님은 소개합니다. 새끼를 품고 자주 핥아 주는 어미 쥐 밑에서 자란 새끼와, 새끼를 내버려 두는 어미 밑에서 자란 새끼는 같은 먹이를 먹여도 유전자의 상태와 면역력이 서로 달랐다고 합니다. 과학자들이 어미를 서로 바꾸어 보았더니, 방치되던 새끼도 보살피는 어미에게 옮겨지자 유전자가 켜졌다고 합니다. 먹이는 같았습니다. 달라진 것은 보살핌이었습니다. 박사님은 이런 연구들을 모아, 꺼진 유전자가 켜지려면 사랑이라는 힘이 필요하다고 말합니다. 그 힘이 무엇인지는 다음 과에서 더 자세히 살펴보겠습니다."},{"t":"h3","text":"내 몸에 쓰인 편지"},{"t":"p","text":"유전자는 네 가지 글자로 쓰여 있다고 합니다. 박사님은 글자에 대해 이런 이야기를 합니다. 글을 모르는 사람에게 책을 주며 무엇이냐고 물으면 종이 뭉치라고 대답합니다. 틀린 말은 아닙니다. 그러나 글을 아는 사람은 거기서 글자를 보고, 한 걸음 더 나아간 사람은 글자에 담긴 쓴 이의 뜻을 읽습니다. 사람의 몸도 그렇습니다. 겉으로 보면 세포 덩어리이지만, 세포의 성질은 유전자가 정하고, 유전자가 글자라면 사람은 누군가의 뜻이 적힌 글이라는 것입니다."},{"t":"p","text":"성경에는 사람을 편지라고 부르는 구절이 있습니다. 예수님의 제자 바울이 고린도라는 도시의 교회에 보낸 편지의 한 대목입니다."},{"t":"verse","ref":"고린도후서 3장 3절","text":"너희는 우리로 말미암아 나타난 그리스도의 편지니 이는 먹으로 쓴 것이 아니요 오직 살아 계신 하나님의 영으로 쓴 것이며 또 돌판에 쓴 것이 아니요 오직 육의 마음판에 쓴 것이라"},{"t":"p","text":"'그리스도'는 예수님을 높여 부르는 이름이고, '육의 마음판'은 살아 있는 사람의 마음을 가리킵니다. 바울이 살던 때에는 유전자라는 말이 없었습니다. 박사님은 이 구절을 읽으며, 사람의 몸 안에 하나님의 마음이 기록되어 있다는 뜻으로 받아들입니다. 그리고 유전자 하나하나를 약속으로 읽습니다. 종양을 억제하는 유전자는 세포가 변질되지 않게 지켜 주겠다는 약속이고, 세로토닌을 만드는 유전자는 우울함에서 건져 주겠다는 약속이라는 것입니다. 그 약속들을 한 문장으로 줄이면 \"네가 어려움에 빠질 때 내가 반드시 회복시켜 주겠다. 너를 사랑하기 때문이다\"가 된다고 박사님은 말합니다."},{"t":"p","text":"아직 하나님을 잘 모르는 분에게는 낯선 이야기일 수 있습니다. 다만 이렇게 한번 생각해 보시면 좋겠습니다. 내 몸은 우연히 굴러다니는 물질 덩어리가 아니라, 누군가 정성 들여 쓴 편지일 수 있습니다. 그리고 그 편지에는 나를 살리려는 약속이 빼곡히 적혀 있습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"물려받은 유전자는 내 앞날을 가두는 판결문이 아닙니다. 유전자에는 스위치가 있고, 그 스위치는 오늘도 나를 살리는 쪽으로 쉼 없이 움직이고 있습니다. 이상구 박사는 유전자를 하나님이 사람의 몸에 써 두신 사랑의 편지로 읽습니다. 나는 누군가의 실수로 생긴 존재가 아니라, 사랑으로 쓰인 글입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 부모님에게서 물려받은 것 가운데 마음에 드는 것과 그렇지 않은 것을 하나씩 말해 봅시다."},{"t":"q","i":1,"text":"둘째, \"우리 집안 내력이야\"라는 말 때문에 걱정하거나 미리 포기했던 일이 있습니까?"},{"t":"q","i":2,"text":"셋째, 누군가의 보살핌을 받고 몸과 마음에 힘이 났던 기억이 있다면 나누어 주십시오."},{"t":"q","i":3,"text":"넷째, 내 몸이 누군가 나에게 쓴 편지라면, 거기에는 어떤 말이 적혀 있으면 좋겠습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"고린도후서 3장 2절","text":"너희는 우리의 편지라 우리 마음에 썼고 뭇 사람이 알고 읽는 바라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"집안 내력 때문에 걱정해 온 병이 있다면, 이번 주에는 \"그것은 가능성이지 운명이 아니다\"라고 소리 내어 말해 봅니다."},{"t":"act","i":1,"text":"가족이나 가까운 사람 한 명에게 따뜻한 말 한마디나 손길을 건네 봅니다. 보살핌이 사람을 살린다는 것을 주는 쪽에서 느껴 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"메틸기, 히스톤 같은 낱말이 어렵게 들릴 수 있습니다. 용어를 외우게 하지 말고 \"스위치가 있다\", \"물려받은 유전자는 운명이 아니다\", \"신호를 보내는 손이 있다\" 이 세 가지만 남게 해 주십시오. 과학 설명은 이상구 박사의 강의를 옮긴 것이며, 모임은 의학 토론 자리가 아니라는 점을 편안하게 밝혀도 좋습니다. 가족력으로 불안해하는 분이 있으면 검진과 진료는 그대로 받으시도록 권하십시오. 성경을 처음 접하는 분에게는 고린도후서가 편지글이라는 것만 알려 주면 충분합니다."}],"inPart":1,"audio":"audio/03.m4a"},{"id":"04","kind":"lesson","no":3,"part":null,"title":"생기, 유전자를 켜는 힘","sub":"꺼진 유전자를 다시 켜는 힘은 어디에서 올까요","key":{"ref":"창세기 2장 7절","text":"여호와 하나님이 땅의 흙으로 사람을 지으시고 생기를 그 코에 불어넣으시니 사람이 생령이 되니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사의 건강강의에는 금붕어 이야기가 나옵니다. 문학평론가 이어령 선생이 생명이 자본이다라는 책에 적은 일화라고 합니다. 1950년대, 난방이 되지 않는 단칸 셋방에서 신혼살림을 하던 부부가 금붕어를 길렀습니다. 몹시 추운 겨울밤, 어항이 통째로 꽝꽝 얼어붙었습니다. 부부는 금붕어가 죽은 줄 알았습니다. 저녁에 얼음이 녹으면 꺼내서 묻어 주려고 했습니다. 그런데 퇴근해서 돌아와 보니, 녹은 물속에서 금붕어가 다시 헤엄치고 있었습니다."},{"t":"p","text":"얼어붙은 금붕어와 다시 헤엄치는 금붕어 사이에 달라진 것이 무엇일까요. 몸은 그대로입니다. 비늘도 지느러미도 그대로입니다. 그런데 한쪽은 죽은 듯 멈춰 있고 한쪽은 살아서 움직입니다. 지난 과에서 우리는 유전자에 스위치가 있고, 그 스위치에 신호를 보내는 이가 있다는 이야기를 들었습니다. 오늘은 그 신호에 실려 오는 힘에 대해 생각해 보려 합니다. 멈춘 것을 다시 움직이게 하고, 꺼진 유전자를 다시 켜는 힘은 어디에서 오는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"'저절로'라는 말은 설명이 아닙니다"},{"t":"p","text":"전등은 전기가 들어와야 켜집니다. 쇠붙이에게 아무리 열을 내라고 말해도 쇠는 스스로 달아오르지 못합니다. 밖에서 열을 받아야 합니다. 이상구 박사는 유전자도 마찬가지라고 말합니다. 메틸기가 스위치에 붙었다 떨어졌다 하려면 반드시 힘이 있어야 한다는 것입니다."},{"t":"p","text":"의학도 우리 몸에 스스로 낫는 힘, 곧 자연치유력이 있다는 것은 인정합니다. 상처가 아물고 감기가 낫는 것을 누구나 보아 왔기 때문입니다. 그런데 그 힘의 정체가 무엇이냐고 물으면 \"저절로 낫는다\"는 대답이 돌아옵니다. 박사님은 '저절로'는 설명이 아니라 모른다는 고백이라고 말합니다. 방전된 휴대전화가 저절로 충전되는 일은 없기 때문입니다."},{"t":"p","text":"첫 과에서 세포는 컴퓨터이고 유전자는 그 안에 깔린 프로그램이라고 했습니다. 프로그램은 깔려 있기만 해서는 열리지 않습니다. 누군가 눌러 주어야 창이 뜹니다. 그런데 컴퓨터가 제 안의 프로그램을 스스로 누르는 일은 없습니다. 박사님은 누르는 일은 언제나 주인의 몫이라고 말합니다. 우리는 지금 내 몸속에서 어느 프로그램이 필요한지 알지 못합니다. 그런데도 꼭 필요한 그 프로그램이 열립니다."},{"t":"p","text":"박사님은 강의 초기에 이 힘을 '스파크'라고도 하고 우스갯소리처럼 '찌지직'이라고도 불렀다고 합니다. 그리고 그 힘을 보내는 이를 '제3자'라고 불렀습니다. 하나님을 믿지 않는 분들이 마음 상할까 조심스러웠기 때문입니다. 몸 어딘가에 암세포가 생겼다는 것을 나도 모르고 의사도 아직 모르는데, 누군가는 그것을 알고 T세포를 그리로 보냅니다. 그것을 아는 이가 있어야만 성립하는 일이라고 박사님은 생각했습니다. 강의를 듣던 분들이 그 제3자가 누구인지를 스스로 깨달아 갔다고 합니다."},{"t":"h3","text":"흙에 불어넣으신 숨"},{"t":"p","text":"박사님은 그 힘의 이름을 성경에서 찾았습니다. 성경의 첫 번째 책인 창세기에는 사람이 처음 지어지던 장면이 이렇게 적혀 있습니다."},{"t":"verse","ref":"창세기 2장 7절","text":"여호와 하나님이 땅의 흙으로 사람을 지으시고 생기를 그 코에 불어넣으시니 사람이 생령이 되니라"},{"t":"p","text":"'여호와'는 성경이 하나님을 부르는 이름이고, '생령'은 살아 있는 존재라는 뜻입니다. 박사님은 이 구절을 이렇게 읽습니다. 흙은 물질입니다. 얼굴과 피부와 유전자까지 다 갖추어도 그것만으로는 눈을 뜨지 못합니다. 거기에 생기가 들어올 때 비로소 살아 있는 사람이 됩니다. 물질에 생기가 더해져야 생명이라는 것입니다."},{"t":"p","text":"박사님이 즐겨 드는 예가 계란입니다. 계란은 온도가 올라갈수록 더 빨리 상합니다. 그런데 어미 닭의 체온인 38도에 이르면 이상한 일이 일어난다고 합니다. 가장 빨리 썩어야 할 그 온도에서 계란은 3주 동안 썩지 않고, 21일째에 병아리가 되어 나옵니다. 박사님은 물질 바깥의 무엇인가가 들어왔다고밖에 설명할 수 없다고 말합니다. 같은 온도에서도 무정란은 그대로 썩습니다."},{"t":"p","text":"우리말은 이 힘을 이미 알고 있었습니다. 너무 억울한 일을 당하면 \"기가 막힌다\"고 합니다. 충격이 크면 '기절'합니다. 기가 끊어진다는 뜻입니다. 반대로 활기가 도는 사람을 보면 \"생기가 돈다\"고 말합니다. 박사님은 이 '기'가 곧 유전자를 켜는 힘이며, 기가 막히면 유전자가 꺼지고 생기가 넘치면 유전자가 켜진다고 설명합니다. 그리고 이 힘은 몸 안에 쌓아 둔 것이 아니라 처음 그날처럼 지금도 밖에서 들어오는 것이라고 말합니다."},{"t":"h3","text":"생기는 알아보는 사람에게 옵니다"},{"t":"p","text":"그러면 생기는 어떤 길로 우리에게 올까요. 박사님은 생기가 참된 것, 선한 것, 아름다운 것에 담겨 온다고 말합니다. 한자로는 진, 선, 미입니다."},{"t":"p","text":"무언가를 깨닫고 \"아, 그렇구나\" 하는 순간 힘이 납니다. 아는 것이 힘이라는 속담 그대로입니다. 숨이 차도록 산을 올라 정상에서 경치를 내려다보며 탄성이 나올 때에도 힘이 납니다. 박사님은 여기서 '선'을 도덕이 아니라 감사로 풀이합니다. 선을 안다는 것은 누군가 나에게 베푼 것을 알아보는 일이라는 것입니다. 장미를 보고 아름답다고 느끼는 데서 한 걸음 더 나아가 \"오늘 나에게 기쁨을 주려고 이렇게 피었구나, 고맙다\" 하고 말하면 그 자리에 선이 더해진다고 합니다."},{"t":"p","text":"중요한 것은 이 힘이 알아볼 때에만 전해진다는 점입니다. 아내가 꽃을 사 왔는데 \"쓸데없이 비싼 걸 왜 샀느냐\"고 하는 남편은 눈앞에 있는 아름다움을 하나도 받지 못합니다. 강의에는 이런 이야기도 나옵니다. 일곱 시간을 운전해서 친구를 요세미티 폭포 앞에 데려갔는데, 친구는 \"바위에서 물 떨어지는 것 보여 주려고 여기까지 왔느냐\"며 화를 냈습니다. 같은 폭포 앞에서 한 사람은 생기를 받고 한 사람은 기가 막혔습니다."},{"t":"h3","text":"가장 귀한 것에는 값이 없습니다"},{"t":"p","text":"박사님은 생기에 관해 한 가지 관찰을 되풀이합니다. 우리에게 중요한 것일수록 값이 없다는 것입니다. 음식은 한동안 먹지 못해도 견딥니다. 물은 며칠만 끊겨도 위험합니다. 공기는 몇 분을 넘기지 못합니다. 그리고 생기가 끊기면 그 자리에서 쓰러집니다. 그런데 값은 정반대입니다. 공기는 값이 없고, 물은 거의 값이 없습니다. 생기는 돈으로 살 길이 아예 없습니다. 박사님은 오십 년 된 산삼이 수천만 원을 한다지만 산삼을 못 먹어서 죽었다는 사람은 없다고 말합니다."},{"t":"p","text":"값이 없다는 것은 누구에게나 주어졌다는 뜻입니다. 생기는 자격을 따지지 않습니다. 착하게 살았는지, 하나님을 믿는지를 묻지 않습니다. 오늘 아침 눈을 떴다면 이미 생기를 받고 있는 것입니다. 창세기의 그 장면에서도 흙은 아무 자격을 내놓지 않았습니다. 하나님이 먼저 숨을 불어넣으셨습니다."},{"t":"p","text":"박사님은 참됨과 선함과 아름다움을 하나로 합하면 사랑이 된다고 말합니다. 생기의 정체가 결국 사랑이라는 것입니다. 그 사랑이 어떤 사랑인지는 제2부에서 천천히 살펴보겠습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"사람은 흙에 하나님의 숨이 더해져 살아 있는 존재가 되었습니다. 이상구 박사는 그 숨, 곧 생기가 지금도 밖에서 우리에게 오고 있으며 꺼진 유전자를 켜는 힘이라고 설명합니다. 생기는 자격을 묻지 않고 값없이 주어집니다. 우리가 할 일은 그 힘을 만들어 내는 것이 아니라, 참되고 선하고 아름다운 것 안에 담겨 오는 그 힘을 알아보고 받는 것입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 최근에 \"아, 좋다\" 하고 저절로 감탄이 나왔던 순간은 언제였습니까?"},{"t":"q","i":1,"text":"둘째, \"기가 막혔던\" 경험과 \"생기가 돌았던\" 경험을 하나씩 떠올려 봅시다. 그때 몸은 어떻게 반응했습니까?"},{"t":"q","i":2,"text":"셋째, 아름다운 것이나 고마운 일이 곁에 있었는데도 알아보지 못하고 지나친 적이 있습니까?"},{"t":"q","i":3,"text":"넷째, 나에게 가장 귀한 것이 값없이 주어지고 있다는 말을 들으면 어떤 마음이 듭니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"창세기 2장 7절","text":"여호와 하나님이 땅의 흙으로 사람을 지으시고 생기를 그 코에 불어넣으시니 사람이 생령이 되니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루에 한 번, 하늘이나 나무나 꽃을 일 분 동안 바라보며 소리 내어 \"아름답다, 고맙다\"고 말해 봅니다."},{"t":"act","i":1,"text":"이번 주에 누군가 나에게 베푼 작은 호의를 하나 찾아내어 그 사람에게 고맙다는 말을 전합니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"'기'라는 말 때문에 기 수련이나 기 치료를 떠올리는 분이 있을 수 있습니다. 여기서 말하는 생기는 사람이 훈련으로 모으거나 남에게 넣어 주는 힘이 아니라, 생명을 지으신 분이 값없이 주시는 힘이라는 점을 짚어 주십시오. 창세기 이야기를 사실로 믿느냐를 두고 논쟁할 필요는 없습니다. 이 과에서는 \"생명은 밖에서 선물로 온다\"는 한 가지만 나누면 됩니다. 계란이나 금붕어 이야기는 박사님이 강의에서 든 예화이지 과학 논문이 아니므로, 증명하려 들지 말고 이야기로 나누십시오."}],"inPart":1,"audio":"audio/04.m4a"},{"id":"05","kind":"lesson","no":4,"part":null,"title":"마음이 몸을 바꿉니다","sub":"마음에서 일어난 일이 어떻게 몸에까지 닿을까요","key":{"ref":"잠언 4장 23절","text":"모든 지킬 만한 것 중에 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"휴대전화에 문자 한 통이 도착합니다. 화면에 찍힌 것은 검은 글자 몇 줄뿐입니다. 그런데 그 글자를 읽는 순간 가슴이 철렁 내려앉기도 하고, 얼굴이 환해지기도 합니다. \"검사 결과 이상 없습니다\"라는 한 줄에 며칠 동안 굳어 있던 어깨가 풀립니다. \"우리 그만 만나자\"는 한 줄에 밥맛이 사라지고 잠이 달아납니다."},{"t":"p","text":"글자에는 무게가 없습니다. 글자가 내 몸을 건드린 것도 아닙니다. 내 몸을 움직인 것은 글자에 실린 뜻입니다. 이상구 박사도 강의에서 이 예를 듭니다. 누군가 보낸 문자는 화면의 글자로 오지만, 그 속에 실린 뜻에 따라 내 유전자가 켜지기도 하고 꺼지기도 한다는 것입니다."},{"t":"p","text":"지난 과에서 우리는 꺼진 유전자를 켜는 힘, 곧 생기가 참되고 선하고 아름다운 것에 담겨 온다는 이야기를 나누었습니다. 그런데 마음으로 받은 것이 어떻게 세포 속 유전자에까지 가 닿을까요. 오늘은 마음과 몸을 잇는 그 길을 따라가 보겠습니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"우리 몸에는 결이 있습니다"},{"t":"p","text":"병원에서 심전도를 찍어 본 분이 있을 것입니다. 심장에 전기가 흐르고 있기 때문에 그 파동을 종이에 그릴 수 있습니다. 뇌에도 전기가 흐릅니다. 그 파동을 뇌파라고 부릅니다. 이상구 박사는 사람의 몸을 전기가 흐르는 제품에 빗대어 설명합니다. 그리고 두 번째 과에서 본 것처럼, 유전자의 스위치를 누르는 메틸기는 전기를 띠고 있어서 이 파동의 신호에 반응한다고 말합니다."},{"t":"p","text":"박사님은 파동을 우리말로 '결'이라고 부릅니다. 물결, 소리결, 마음결 할 때의 그 결입니다. 결에는 고운 결이 있고 거친 결이 있습니다. 마음이 평안하고 고마운 마음이 들 때 뇌에는 부드럽고 고른 파동이 흐르는데, 이것을 알파파라고 합니다. 불안하고 짜증이 나고 걱정이 많을 때에는 촘촘하고 날카로운 파동이 흐릅니다. 이것이 베타파입니다. 박사님은 고운 결이 흐를 때 유전자가 켜지고, 거친 결이 흐를 때 유전자가 꺼진다고 설명합니다."},{"t":"p","text":"여기서 박사님은 물과 바람의 비유를 듭니다. 물은 스스로 파도를 만들지 못합니다. 바람이 불어야 물이 움직입니다. 잔잔한 바람이 불면 고운 물결이 일고, 사나운 바람이 불면 같은 물이 성난 파도가 됩니다. 뇌파도 그렇습니다. 뇌가 제 마음대로 뇌파를 만드는 것이 아니라, 마음에 어떤 뜻이 불어오느냐에 따라 뇌파의 결이 달라진다는 것입니다."},{"t":"p","text":"그래서 박사님은 말 한마디의 무게를 자주 이야기합니다. 한마디 말이 천금보다 낫다는 옛말이 빈말이 아니라는 것입니다. 음식과 약이 쓸모없다는 뜻은 아닙니다. 그것들은 몸이 살아갈 바탕을 갖추어 주는 귀한 것들입니다. 다만 유전자의 스위치 가까이까지 가 닿는 것은 마음에 들어온 뜻이라고 박사님은 말합니다. 따뜻한 말을 들으면 몸이 풀리고 모진 말을 들으면 몸이 굳는 것을 우리는 이미 겪어서 알고 있습니다."},{"t":"h3","text":"같은 일, 다른 뜻"},{"t":"p","text":"박사님이 여러 기수의 강의에서 되풀이해 들려주는 이야기가 있습니다. 일란성 쌍둥이 이야기입니다. 두 아이는 유전자가 똑같습니다. 같은 집에서 같은 방을 쓰고, 같은 어머니가 지어 준 같은 밥을 먹고 자랐습니다. 어릴 적에는 남들이 구별하지 못할 만큼 생김새도 성격도 같았다고 합니다."},{"t":"p","text":"그런데 어느 때부터 한 아이만 웃음을 잃고 깊은 우울에 빠졌습니다. 갈림길이 된 일이 있었습니다. 어머니가 몹시 앓아누워서 한동안 아이들을 제대로 돌보지 못한 것입니다. 아이들은 아침을 굶는 날이 많았습니다. 한 아이는 그 일을 이렇게 받아들였습니다. \"엄마가 정말 많이 아프셨구나. 아픈 중에도 우리를 걱정하셨구나.\" 다른 아이는 같은 일을 이렇게 새겼습니다. \"엄마는 밥해 주기 싫어서 꾀병을 부린 거야. 엄마는 우리를 사랑하지 않아.\""},{"t":"p","text":"박사님은 여기서 사실과 진실을 구별합니다. 어머니가 밥을 차려 주지 못했다는 것은 사실입니다. 어머니가 아이들을 사랑한다는 것은 진실입니다. 한 아이는 사실 뒤에 있는 진실을 보았고, 한 아이는 사실만 보고 거기에 다른 뜻을 붙였습니다. 박사님은 유전자가 사건 자체에 반응하는 것이 아니라 그 사건에 내가 붙인 뜻에 반응한다고 말합니다. 그리고 \"나는 사랑받지 못한다\"는 뜻이 마음에 자리 잡는 순간, 곧 신뢰가 무너지는 순간에 마음을 기쁘게 하는 물질을 만드는 유전자가 꺼진다고 설명합니다."},{"t":"p","text":"이 이야기는 우울한 사람을 탓하려는 이야기가 아닙니다. 어린아이가 일부러 그렇게 생각하려 한 것이 아닙니다. 그 아이에게는 정말 그렇게 보였습니다. 우리도 그렇습니다. 어린 날 받은 상처 하나가 \"나는 사랑받을 만한 사람이 못 된다\"는 뜻으로 굳어져, 오랫동안 몸과 마음을 누르고 있을 수 있습니다. 마음이 깊이 가라앉아 있는 분은 혼자 견디지 말고 의사와 가까운 사람들의 도움을 받으시기 바랍니다. 그러면서 이 질문도 함께 품어 보시면 좋겠습니다. 나는 내 삶에 일어난 일들에 어떤 뜻을 붙이며 살아왔을까."},{"t":"h3","text":"마음을 지킨다는 것"},{"t":"p","text":"성경의 잠언에는 이런 말이 있습니다."},{"t":"verse","ref":"잠언 4장 23절","text":"모든 지킬 만한 것 중에 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라"},{"t":"p","text":"박사님은 뇌파와 유전자의 관계를 설명한 다음 이 구절을 읽어 주면서 거듭 당부합니다. 무엇을 지켜야 하느냐, 마음을 지켜야 한다고 말입니다. 생명의 근원이 마음에서 난다는 옛 지혜를, 마음이 유전자에 닿는다는 오늘의 설명과 나란히 놓고 읽는 것입니다."},{"t":"p","text":"그런데 마음을 지키라는 말을 나쁜 생각이 들지 않도록 스스로를 단속하라는 말로 들으면 오히려 더 힘들어집니다. 박사님은 짜증을 한 번 내면 몸의 결이 흐트러져서 한동안 이어진다고 말합니다. 그렇다고 짜증이 날 때마다 자신을 나무란다면 거친 결 위에 거친 결을 하나 더 얹는 셈입니다. 물이 스스로 잔잔해질 수 없듯이, 마음도 이를 악문다고 고와지지 않습니다."},{"t":"p","text":"마음을 지킨다는 것은 내 마음에 어떤 바람이 불어오게 할 것인가의 문제입니다. 쌍둥이 가운데 한 아이를 지켜 준 것은 그 아이의 굳센 의지가 아니었습니다. \"엄마는 나를 사랑한다\"는 믿음이었습니다. 그 믿음이 있었기에 굶는 아침도 그 아이의 마음을 무너뜨리지 못했습니다. 그래서 마음을 지키는 일은 결국 이 물음으로 이어집니다. 나는 사랑받고 있는가. 어떤 일이 닥쳐도 흔들리지 않을 만큼 믿을 만한 사랑이 나에게 있는가."},{"t":"p","text":"사람의 사랑은 귀하지만 흔들릴 때가 있습니다. 어머니도 아플 수 있고, 친구도 떠날 수 있습니다. 이 책이 제2부부터 소개하려는 것은 흔들리지 않는 사랑입니다. 박사님은 뜻을 다른 말로 하면 말씀이라고 합니다. 나를 조건 없이 사랑하시는 분의 말씀이 마음에 들어올 때, 그것이 고운 바람이 되어 몸의 결을 바꾼다는 것입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"우리 몸은 사건에 반응하기보다 그 사건에 붙인 뜻에 반응한다고 이상구 박사는 설명합니다. \"나는 사랑받지 못한다\"는 뜻은 몸을 닫고, \"나는 사랑받고 있다\"는 뜻은 몸을 엽니다. 마음을 지킨다는 것은 자신을 다그치는 일이 아니라, 흔들리지 않는 사랑을 마음에 들이는 일입니다. 성경은 그런 사랑이 있다고 말합니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 최근에 받은 문자나 말 한마디 가운데 하루의 기분을 바꾸어 놓은 것이 있었습니까?"},{"t":"q","i":1,"text":"둘째, 같은 일을 겪고도 가족이나 친구와 전혀 다르게 받아들였던 경험이 있다면 나누어 주십시오."},{"t":"q","i":2,"text":"셋째, 오랫동안 마음에 품어 온 \"나는 이런 사람이야\"라는 생각이 있습니까? 그 생각은 어디에서 시작되었을까요?"},{"t":"q","i":3,"text":"넷째, 힘든 일이 닥쳐도 \"그래도 나는 사랑받고 있다\"고 믿게 해 준 사람이 있었습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"잠언 4장 23절","text":"모든 지킬 만한 것 중에 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"짜증이나 불안이 올라올 때 자신을 나무라지 말고, 잠시 멈추어 천천히 심호흡을 다섯 번 합니다."},{"t":"act","i":1,"text":"이번 주에 속상했던 일 하나를 골라, 그 일에 내가 붙인 뜻이 무엇이었는지 적어 보고 다르게 읽을 길은 없는지 생각해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"긍정적으로 생각하면 된다\"는 이야기로 흘러가지 않게 해 주십시오. 이 과의 중심은 생각을 억지로 바꾸는 기술이 아니라, 사랑받고 있다는 믿음이 마음을 지켜 준다는 데 있습니다. 쌍둥이 이야기를 들으며 \"내가 마음을 잘못 먹어서 병이 났구나\" 하고 자책하는 분이 있을 수 있습니다. 탓이 아니라 이해를 위한 이야기임을 거듭 말해 주십시오. 우울증이나 불안으로 치료를 받는 분에게는 치료를 계속 받도록 권하고, 모임이 그 곁에서 함께하는 자리가 되게 하십시오. 셋째 질문은 깊은 이야기가 나올 수 있으니 서두르지 말고 들어 주십시오."}],"inPart":1,"audio":"audio/05.m4a"},{"id":"06","kind":"lesson","no":5,"part":null,"title":"선택이 유전자를 바꿉니다","sub":"값없이 오는 생명 앞에서 내가 할 수 있는 일은 무엇일까요","key":{"ref":"신명기 30장 19절","text":"내가 오늘 하늘과 땅을 불러 너희에게 증거를 삼노라 내가 생명과 사망과 복과 저주를 네 앞에 두었은즉 너와 네 자손이 살기 위하여 생명을 택하고"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사는 1943년에 태어났습니다. 먹을 것이 귀하던 어린 시절, 콩을 프라이팬에 볶아 간식으로 먹었고 콩을 모아 엿장수에게 가져가 엿으로 바꾸어 먹기도 했다고 합니다. 그래서 호주머니에도, 책상 서랍에도, 방바닥에도 콩이 굴러다녔습니다."},{"t":"p","text":"어린 상구는 이상한 점을 발견했습니다. 서랍 속의 콩은 일 년이 지나도, 삼 년이 지나도 싹이 트지 않았습니다. 썩지도 않았습니다. 그런데 같은 콩을 흙에 살짝 묻고 물을 주면 곧 싹이 텄습니다. 콩이 자기가 지금 서랍 속에 있는지 흙 속에 있는지를 아는 것만 같았습니다. 아이는 콩이 참 똑똑하다고 생각했습니다."},{"t":"p","text":"훗날 박사님은 그 기억을 이렇게 다시 읽습니다. 콩에게 지능이 있을 리 없습니다. 콩이 땅에 심겼다는 것을 아시는 분이 그때부터 생기를 보내시는 것입니다. 지난 과들에서 우리는 유전자에 스위치가 있고, 그 스위치를 켜는 힘은 값없이 주어지는 생기라는 이야기를 나누었습니다. 그렇다면 그 선물 앞에서 우리가 할 일은 무엇일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"콩나물이 될까요, 콩나무가 될까요"},{"t":"p","text":"생기는 값없이 누구에게나 옵니다. 그런데 서랍 속의 콩에는 싹이 트지 않습니다. 박사님은 여기서 '기본여건'이라는 말을 꺼냅니다. 생기는 공짜이지만 아무 자리에나 내려앉지는 않는다는 것입니다."},{"t":"p","text":"콩을 흙에 심지 않고 물만 주면 어떻게 될까요. 죽지는 않습니다. 뿌리와 떡잎까지는 나옵니다. 그러나 거기서 멈춥니다. 콩나물이 되는 것입니다. 줄기와 가지와 꽃과 열매를 내는 유전자는 켜지지 않습니다. 콩 한 알이 나무처럼 자라 수백 알을 맺으려면 흙과 물과 햇빛과 공기가 있어야 하고, 거름도 지나치지 않아야 합니다. 비싼 비료를 왕창 부은 콩은 오히려 썩습니다. 씨앗이 모자란 것이 아닙니다. 씨앗 안에는 이미 다 들어 있습니다. 모자란 것은 여건입니다."},{"t":"p","text":"그래서 박사님은 건강을 위해 우리가 하는 일을 이렇게 정리합니다. 그것은 생명을 만들어 내는 기술이 아니라, 이미 오고 있는 생기가 내려앉을 자리를 마련하는 일이라는 것입니다."},{"t":"h3","text":"여덟 글자, 뉴스타트"},{"t":"p","text":"박사님은 그 기본여건을 영어 낱말 여덟 개의 첫 글자를 따서 뉴스타트(NEWSTART)라고 부릅니다. 영양(Nutrition), 운동(Exercise), 물(Water), 햇빛(Sunlight), 절제(Temperance), 공기(Air), 휴식(Rest), 그리고 신뢰(Trust)입니다. 앞의 일곱 가지는 모두 귀에 익은 것들입니다. 골고루 먹고, 몸을 움직이고, 물을 마시고, 볕을 쬐고, 지나치지 않고, 맑은 공기를 마시고, 잘 쉬는 것입니다. 하나같이 돈이 들지 않거나 거의 들지 않습니다."},{"t":"p","text":"박사님은 이것을 지키지 않으면 벌을 받는 규칙으로 여기지 말라고 당부합니다. 강의에는 기린 이야기가 나옵니다. 땅의 미네랄이 부족해지자, 본래 뼈를 먹지 않던 기린이 뼈를 씹어 모자란 성분을 채우는 모습이 관찰되었다고 합니다. 그런데 \"나는 잎만 먹는 동물이니 뼈는 먹을 수 없다\"고 버티는 기린이 있다면 어떨까요. 박사님은 그런 기린을 '율법주의에 걸린 기린'이라고 부릅니다. 율법주의란 규칙을 지키는 것 자체를 목적으로 삼는 태도를 말합니다. 원칙보다 앞서는 것은 나를 살리려는 사랑이라는 것입니다."},{"t":"p","text":"또 하나 기억할 것이 있습니다. 박사님은 현미밥이 병을 낫게 하는 것이 아니라고 분명히 말합니다. 음식과 운동은 주인공이 아니라 바탕입니다. 그리고 뉴스타트를 시작했다고 해서 먹던 약을 곧바로 끊어서는 안 된다고 강조합니다. 약은 몸이 실제로 좋아지는 만큼 의사와 상의해 가며 조절할 일이라는 것입니다. 생활을 고치는 일과 치료를 받는 일은 서로 맞서지 않습니다."},{"t":"h3","text":"사람에게만 있는 여덟 번째"},{"t":"p","text":"식물에게는 영양과 물과 햇빛과 공기와 절제, 다섯 가지면 됩니다. 동물에게는 운동과 휴식이 더해집니다. 그런데 사람에게는 하나가 더 있습니다. 신뢰입니다. 박사님은 신뢰가 여덟 번째 항목이 아니라 앞의 일곱 가지를 살아 있게 만드는 항목이라고 말합니다."},{"t":"p","text":"신뢰가 왜 몸의 문제일까요. 박사님은 파블로프의 개 실험으로 설명합니다. 종을 치고 먹이를 주는 일을 되풀이하자, 개는 종소리에 담긴 뜻을 알아차렸습니다. 나중에는 종소리만 들어도 침을 흘리며 꼬리를 흔들었습니다. 믿음이 쌓일수록 반응은 더 빠르고 강해져서, 실험하는 사람이 방에 들어서기만 해도 몸이 먼저 반응했다고 합니다."},{"t":"p","text":"그런데 어느 날 종을 치고도 먹이를 주지 않았습니다. 그 순간 열려 있던 몸이 닫혔습니다. 박사님은 개가 겪은 것은 배고픔이 아니라 배신이라고 말합니다. 그런 날이 거듭되자 개는 종소리에 으르렁거리기 시작했습니다. 종소리는 처음부터 끝까지 똑같았습니다. 달라진 것은 그 소리를 믿을 수 있느냐였습니다. 박사님은 여기서 결론을 끌어냅니다. 몸은 신뢰 위에서 열립니다. 그리고 믿지 않는 것을 선택할 수는 없습니다."},{"t":"h3","text":"생명을 택하십시오"},{"t":"p","text":"두 번째 과에서 본 타임지 표지의 문장을 기억하실 것입니다. \"당신이 하는 선택이 당신의 유전자를 바꿀 수 있다.\" 박사님은 이 문장을 성경의 오래된 한 구절과 나란히 읽습니다. 모세라는 지도자가 백성에게 남긴 마지막 당부입니다."},{"t":"verse","ref":"신명기 30장 19절","text":"내가 오늘 하늘과 땅을 불러 너희에게 증거를 삼노라 내가 생명과 사망과 복과 저주를 네 앞에 두었은즉 너와 네 자손이 살기 위하여 생명을 택하고"},{"t":"p","text":"얼핏 으름장처럼 들릴 수 있습니다. 그러나 박사님은 이 구절에서 강요하지 않으시는 하나님을 봅니다. 콩이나 동물에게는 묻지 않고 생기를 보내시지만, 알아듣고 믿을 수 있는 사람에게는 선택을 맡기고 기다리신다는 것입니다. 억지로 시키는 것은 사랑이 아니기 때문입니다. 그래서 \"생명을 택하라\"는 말은 명령이라기보다, 자녀가 살기를 바라는 부모의 간절한 권유에 가깝습니다."},{"t":"p","text":"선택은 거창한 데서 시작되지 않습니다. 박사님은 물이 반쯤 남은 잔을 예로 듭니다. \"반밖에 없네\"와 \"반이나 남았네\"는 둘 다 선택입니다. 박사님 자신도 반밖에 없다고 보던 습관을 고치기로 마음먹고 연습했다고 합니다. 누가 남겨 둔 물을 보고 \"나를 생각해서 이만큼 남겨 놓았구나, 고맙다\"고 읽는 것도 선택입니다. 많은 사람이 자기에게 그런 선택권이 있는 줄을 모르고 산다고 박사님은 말합니다."},{"t":"p","text":"이제 물음이 하나 남습니다. 신뢰가 그렇게 중요하다면, 무엇을, 누구를 믿으라는 것일까요. 믿을 만한 분인지 알아야 믿을 수 있습니다. 이 책의 제2부는 바로 그 물음에서 시작합니다. 내 몸에 생기를 보내시는 그분은 어떤 분이실까요."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"생명은 값없이 오지만 억지로 밀고 들어오지는 않습니다. 이상구 박사는 뉴스타트의 여덟 가지를 생기가 내려앉을 자리를 마련하는 일로 설명하며, 그 마지막이자 중심이 신뢰라고 말합니다. 하나님은 사람에게 선택을 맡기고 기다리십니다. 강요하지 않는 것, 그것이 조건 없는 사랑의 모습이기 때문입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 뉴스타트 여덟 가지 가운데 지금 나에게 가장 잘 갖추어진 것과 가장 모자란 것은 무엇입니까?"},{"t":"q","i":1,"text":"둘째, 몸에 좋다는 것을 규칙처럼 지키다가 오히려 지치거나 마음이 무거워진 적이 있습니까?"},{"t":"q","i":2,"text":"셋째, 믿었던 사람에게 실망해서 몸과 마음이 닫혔던 경험이 있다면, 나눌 수 있는 만큼만 나누어 주십시오."},{"t":"q","i":3,"text":"넷째, 요즘 내 삶에서 \"반밖에 없네\"를 \"반이나 남았네\"로 바꾸어 읽어 보고 싶은 일은 무엇입니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"신명기 30장 19절 하반절","text":"너와 네 자손이 살기 위하여 생명을 택하고"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"여덟 가지 가운데 가장 모자란 것 하나를 골라, 하루 십 분 걷기나 물 한 잔 더 마시기처럼 아주 작은 것으로 시작해 봅니다."},{"t":"act","i":1,"text":"하루에 한 번, 불평이 나오려는 순간에 \"그래도 이만큼은 있구나, 고맙다\"고 바꾸어 말해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"건강 정보에 관심이 쏠려 무엇을 먹어야 하느냐는 질문이 이어질 수 있습니다. 음식과 운동은 바탕이고 중심은 신뢰라는 점으로 조용히 되돌려 주십시오. 구체적인 식단이나 약에 관한 질문은 모임에서 답하려 하지 말고 의사와 상의하도록 권하십시오. \"선택이 유전자를 바꾼다\"는 말이 \"병은 네가 잘못 선택한 탓\"이라는 말로 들리지 않게 살펴 주십시오. 셋째 질문은 아픈 기억을 건드릴 수 있으니 말하지 않을 자유를 먼저 알려 주십시오. 제1부를 마치며 다음 주부터 하나님이 어떤 분이신지를 살펴본다고 안내하면 좋습니다."}],"inPart":1,"audio":"audio/06.m4a"},{"id":"07","kind":"part","no":null,"part":2,"title":"하나님은 어떤 분이신가","sub":null,"key":null,"blocks":[{"t":"p","text":"제1부에서 우리는 몸이 들려주는 이야기를 들었습니다. 사랑을 받을 때 몸이 살아나고, 두려움과 미움 속에서는 몸이 움츠러든다는 이야기였습니다. 그렇다면 그 사랑은 어디에서 옵니까. 우리 몸을 이렇게 지으신 분은 어떤 분이십니까."},{"t":"p","text":"많은 분들이 하나님을 잘하면 복을 주고 못하면 벌을 주는 분으로 알고 있습니다. 그래서 무서워하거나 아예 멀리합니다. 제2부에서는 그 그림을 잠시 내려놓고 성경이 직접 하는 말을 들어 봅니다. 성경은 하나님을 '사랑'이라고 부릅니다(제6과). 그 사랑에는 아무 조건이 붙지 않습니다(제7과). 그 사랑이 맨 처음 하신 일이 사람을 지으신 일입니다(제8과). 그리고 예수님이 들려주신 이야기 속에서 떠난 자식을 기다리는 아버지(제9과)와, 잃은 것을 찾을 때까지 찾는 목자와 여인(제10과)을 만납니다."},{"t":"p","text":"무엇을 믿어야 한다고 재촉하지 않겠습니다. 다만 내가 알던 하나님과 성경이 소개하는 하나님이 얼마나 같고 다른지 천천히 견주어 보시기 바랍니다."}],"inPart":2,"audio":"audio/07.m4a"},{"id":"08","kind":"lesson","no":6,"part":null,"title":"하나님은 사랑이십니다","sub":"하나님은 어떤 분이실까요. 성경은 그분을 한마디로 무엇이라 말합니까?","key":{"ref":"요한일서 4장 16절","text":"하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 하나님은 사랑이시라 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그의 안에 거하시느니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"\"하나님\" 하면 어떤 얼굴이 떠오르십니까. 많은 분들이 높은 곳에서 내려다보며 잘잘못을 적고 계신 분을 떠올립니다. 이상구 박사는 우리가 어릴 때부터 \"울면 하나님이 이놈 하신다\"는 식으로 배워 온 탓에 하나님을 무서워하게 되었다고 말합니다. 잘하면 복을 주고 못하면 벌을 주는 분. 그래서 어떤 분은 하나님을 믿는 일이 늘 조마조마하고, 어떤 분은 아예 그런 분이라면 없는 편이 낫겠다고 생각합니다."},{"t":"p","text":"박사님 자신이 그랬습니다. 의과대학 시절 그는 확고한 무신론자였습니다. 그런데 훗날 돌아보니 그 이유가 뜻밖이었다고 고백합니다. 하나님이 계시다면 나 같은 사람은 가만두지 않으실 것 같아서, 차라리 안 계시기를 바랐다는 것입니다. 하나님이 없다고 믿은 것이 아니라, 무서운 하나님이 싫었던 것입니다."},{"t":"p","text":"지난 제1부에서 우리는 몸이 들려주는 이야기를 들었습니다. 유전자를 켜는 힘이 있고, 그 힘은 사랑과 깊이 이어져 있다는 이야기였습니다. 이제 그 사랑이 어디서 오는지를 물을 차례입니다. 성경은 하나님을 어떤 분이라고 소개할까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"사랑을 \"하신다\"가 아니라 사랑\"이시다\""},{"t":"p","text":"성경은 예순여섯 권의 책을 묶은 두꺼운 책입니다. 그 가운데 예수님의 제자 요한이 노년에 쓴 짧은 편지가 있습니다. 요한일서입니다. 요한은 예수님 곁에서 가장 가까이 지낸 사람이었고, 그래서 '사랑의 사도'라고 불립니다. 사도는 예수님이 세상에 보내신 제자를 가리키는 말입니다. 그가 평생 보고 듣고 겪은 하나님을 한 문장으로 줄여 놓았습니다."},{"t":"verse","ref":"요한일서 4장 8절","text":"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"},{"t":"p","text":"이상구 박사가 이 구절에서 거듭 짚는 것은 문법입니다. 성경은 하나님이 사랑을 \"하신다\"고 쓰지 않고 사랑\"이시다\"라고 썼습니다. 사랑을 하는 분이라면 어떤 날은 하고 어떤 날은 안 하실 수 있습니다. 상대에 따라 달라질 수도 있습니다. 그러나 사랑이 그분 자신이라면 이야기가 다릅니다. 물이 젖지 않을 수 없듯이, 하나님은 사랑하지 않으실 수가 없습니다."},{"t":"p","text":"박사님은 이 말을 이렇게도 풉니다. \"하나님은 아무도 미워하지 못하신다. 왜냐하면 하나님은 미워할 줄을 모르시고, 하나님은 사랑이시기 때문이다.\" 사랑은 하나님이 가지신 여러 성품 가운데 하나가 아닙니다. 그래서 \"이번만은 사랑하지 않으시는 하나님\"은 있을 수 없습니다. 이 한 문장이 앞으로 우리가 성경을 읽어 갈 때 늘 돌아올 출발점입니다."},{"t":"h3","text":"사랑은 줄 대상을 찾습니다"},{"t":"p","text":"그러면 그런 분이 왜 세상을 만드시고 사람을 지으셨을까요. 박사님은 창조에서 '어떻게'보다 '왜'가 더 중요하다고 말합니다. 그리고 그 답을 같은 구절에서 찾습니다. 하나님은 사랑이시고, 사랑은 주는 것이 행복입니다. 주려면 받을 대상이 있어야 합니다. 그래서 지으셨다는 것입니다."},{"t":"p","text":"아기를 기다리는 부모를 떠올려 보시면 됩니다. 아기가 집안일을 거들어 줄 것이라서 기다리는 부모는 없습니다. 부어 줄 사랑이 이미 가득해서, 그 사랑을 받을 아이를 기다리는 것입니다. 사람은 하나님께 쓸모가 있어서 지어진 존재가 아니라, 사랑을 받으라고 지어진 존재입니다. 이 이야기는 제8과에서 조금 더 자세히 살펴보겠습니다."},{"t":"p","text":"박사님은 진실함과 선함과 아름다움을 한데 합한 것이 사랑이라고도 말합니다. 진실을 알게 될 때 마음이 놓이고, 선한 일을 볼 때 마음이 따뜻해지고, 아름다운 것 앞에서 절로 웃음이 나는 것은 그 안에 사랑이 담겨 있기 때문입니다. 꽃 한 송이, 저녁노을 하나에도 \"내가 너를 사랑한다\"는 뜻이 실려 있는 셈입니다."},{"t":"p","text":"여기서 제1부의 이야기와 길이 만납니다. 박사님은 요한이 즐겨 쓰는 낱말들, 곧 사랑과 생명과 빛과 진리가 서로 다른 것이 아니라 한 가지 실재를 가리키는 여러 이름이라고 정리합니다. 하나님의 사랑이 우리에게 들어오면 그것이 생기가 되고, 그 생기가 곧 생명이라는 것입니다. 이 책의 제목이 사랑이 생명입니다인 까닭이 여기에 있습니다."},{"t":"h3","text":"그분이 먼저 사랑하셨습니다"},{"t":"p","text":"요한은 같은 편지에서 한 걸음 더 나아갑니다."},{"t":"verse","ref":"요한일서 4장 19절","text":"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"},{"t":"p","text":"'먼저'라는 낱말을 눈여겨보시기 바랍니다. 우리가 하나님을 찾기 전에, 하나님을 알기도 전에, 그분이 먼저 사랑하셨다는 뜻입니다. 박사님은 이것을 이렇게 풀어 줍니다. 우리가 엄마 배 속에 있을 때부터 하나님은 이미 우리의 유전자를 돌보며 사랑하고 계셨고, 그 사실을 알게 되면 애쓰지 않아도 저절로 그분을 믿고 사랑하게 된다는 것입니다."},{"t":"p","text":"박사님이 들려주는 토끼 이야기가 있습니다. 딸이 생일 선물로 받은 토끼를 낮에는 뒷마당에 풀어 놓고, 밤에는 들짐승에게서 지키려고 우리에 넣으려 했습니다. 그런데 토끼는 주인의 마음을 알 길이 없으니 잡으려 할 때마다 달아났습니다. 박사님은 토끼가 좋아하는 당근과 옥수수를 날마다 손수 먹였습니다. 며칠이 지나자 토끼가 먼저 다가오기 시작했고, 나중에는 부르면 스스로 우리로 들어왔다고 합니다. 토끼가 달라지려고 애쓴 것이 아닙니다. 주인이 자기를 아낀다는 것을 알게 되자 믿음이 저절로 생긴 것입니다. 하나님을 피해 다니는 우리 모습이 그 토끼와 닮았습니다."},{"t":"p","text":"그렇다면 신앙은 하나님의 마음을 얻어 내려는 노력이 아닙니다. 이미 나에게 와 있는 사랑을 뒤늦게 알아차리는 일입니다. 잘 보여야 사랑받는 관계가 아니라, 사랑받고 있음을 알아 가는 관계입니다. 무서운 하나님이 싫어서 등을 돌렸던 한 의대생이 돌아설 수 있었던 것도, 자기가 달라져서가 아니라 하나님이 자기가 알던 그런 분이 아니심을 알게 되었기 때문입니다."},{"t":"h3","text":"들어서 아는 사랑, 맛보아 아는 사랑"},{"t":"p","text":"그런데 \"하나님은 사랑이시다\"라는 말을 백 번 듣는다고 마음이 곧 따뜻해지지는 않습니다. 박사님도 그 점을 솔직하게 인정합니다. 기운이 빠진 친구에게 \"힘내\"라고 말한다고 힘이 나지 않는 것과 같습니다. 그럴 때는 친구가 좋아하는 곳에 함께 가서 맛있는 것을 사 주고, 좋아하는 팥빙수를 사 주고, 곁에서 이야기를 들어 주며 시간을 보내야 합니다. 사랑은 말로 전해지기보다 몸으로 받아서 알게 됩니다."},{"t":"p","text":"박사님은 수박에도 빗댑니다. 먹어 보지 않고도 수박은 달다고 말할 수는 있습니다. 그러나 먹어 보고 하는 말은 다릅니다. 오늘 읽은 요한일서 4장 16절에도 두 낱말이 나란히 놓여 있습니다. 하나님의 사랑을 \"알고 믿었노니\". 배워서 아는 것이 있고, 그 사랑에 기대어 보는 것이 있습니다. 앞으로 이어질 과들은 하나님이 실제로 하신 일들을 하나씩 살펴보며 그 사랑을 맛보는 길이 될 것입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"성경은 하나님이 사랑을 하신다고 하지 않고 사랑이시라고 말합니다. 사랑이 그분 자신이기에, 하나님이 나를 사랑하지 않으시는 순간은 있을 수 없습니다. 그 사랑은 내가 무엇을 하기 전에 먼저 와 있었습니다. 신앙은 그 사랑을 얻어 내는 일이 아니라, 이미 받고 있음을 알아 가는 일입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 적 \"하나님\" 또는 \"신\"이라는 말을 들으면 어떤 모습이 떠올랐습니까? 그 모습은 어디에서 생겼을까요?"},{"t":"q","i":1,"text":"둘째, 말로 하는 위로보다 곁에 있어 준 누군가의 행동에서 사랑을 느낀 적이 있다면 들려주십시오."},{"t":"q","i":2,"text":"셋째, \"하나님은 사랑을 하시는 분이 아니라 사랑이시다\"라는 말을 들으니 어떤 생각이 드십니까? 선뜻 받아들이기 어려운 점이 있다면 그것도 나누어 주십시오."},{"t":"q","i":3,"text":"넷째, 내가 무엇을 하기도 전에 누군가 나를 먼저 사랑했다는 것을 뒤늦게 알게 된 경험이 있습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한일서 4장 19절","text":"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아침에 눈을 뜨면 \"하나님은 사랑이십니다. 오늘도 저를 먼저 사랑하십니다\" 하고 한 번 소리 내어 말해 봅니다."},{"t":"act","i":1,"text":"기운이 빠져 보이는 사람 한 명을 떠올리고, 말 대신 작은 행동(차 한 잔, 함께 걷기, 이야기 들어 주기)으로 곁에 있어 줍니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 제2부의 문을 여는 과입니다. 설명하려 하기보다 참석자가 품고 있던 하나님의 모습을 편히 꺼내 놓게 해 주십시오. 무서운 하나님, 무관심한 하나님, 없는 하나님 어떤 대답이 나와도 고쳐 주지 말고 들어 주시면 됩니다. \"그러면 성경에 나오는 벌과 심판은 무엇입니까?\" 하는 질문이 나올 수 있습니다. 좋은 질문이라고 받아 주시고, 제3부와 그 뒤에서 하나씩 살펴볼 것이라고 안내하시면 충분합니다. 오늘은 \"하나님은 사랑이시다\"라는 한 문장을 출발점으로 삼는 데까지만 가면 됩니다. 몸이 아픈 분이 계시다면, 사랑을 아는 것이 치료를 대신한다는 뜻으로 들리지 않도록 살펴 주십시오."}],"inPart":2,"audio":"audio/08.m4a"},{"id":"09","kind":"lesson","no":7,"part":null,"title":"조건 있는 사랑, 조건 없는 사랑","sub":"하나님의 사랑은 우리가 아는 사랑과 무엇이 다를까요?","key":{"ref":"마태복음 5장 45절","text":"이같이 한즉 하늘에 계신 너희 아버지의 아들이 되리니 이는 하나님이 그 해를 악인과 선인에게 비추시며 비를 의로운 자와 불의한 자에게 내려주심이라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 \"하나님은 사랑이시다\"라는 한 문장을 출발점으로 삼았습니다. 그런데 '사랑'이라는 말만큼 흔하면서도 사람마다 뜻이 다른 말도 드뭅니다. 사랑 때문에 웃기도 하지만, 사랑 때문에 가장 많이 울기도 합니다."},{"t":"p","text":"이상구 박사는 집에서 있었던 작은 일을 들려줍니다. 그는 생각에 잠기면 화장실 불 끄는 것을 자꾸 잊었고, 아내는 전기세를 들어 그때마다 한마디씩 했습니다. 어느 날 또 불을 켜 둔 채 나왔는데, 아내가 아무 말 없이 대신 끄고 나왔습니다. 야단을 각오했던 자리에 침묵이 놓이자, 이상하게도 앞으로 더 잘 끄고 싶은 마음이 생겼다고 합니다. 그 뒤로는 애쓰지 않아도 저절로 끄게 되었습니다. 지적을 받을 때는 고치고 싶은 마음이 생기지 않았는데, 말없이 감싸 주니 더 잘하고 싶어졌다는 것입니다."},{"t":"p","text":"사랑에도 종류가 있는 것 같습니다. 사람을 움츠러들게 하는 사랑이 있고, 사람을 살아나게 하는 사랑이 있습니다. 하나님의 사랑은 어느 쪽일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"우리가 아는 사랑에는 \"~때문에\"가 붙습니다"},{"t":"p","text":"성경 가운데 예수님이 오신 뒤의 일을 적은 뒷부분을 신약성경이라고 하는데, 이 부분은 본래 그리스 말로 기록되었습니다. 박사님의 설명에 따르면 옛 그리스 사람들은 사랑을 여러 낱말로 나누어 불렀습니다. 남녀의 사랑은 에로스, 친구 사이의 사랑은 필리아, 가족의 사랑은 스토르게입니다. 친구이기 때문에, 가족이기 때문에 하는 사랑입니다. 그래서 그 조건이 무너지면 사랑도 함께 흔들립니다."},{"t":"p","text":"박사님은 우리의 정직한 얼굴을 이렇게 그립니다. 식당 배식 줄에서 나도 모르게 가장 굵은 딸기를 고르고 있는 자신을 발견한다는 것입니다. 부부싸움도 실은 사랑 때문에 일어납니다. 내가 준 만큼 돌아오지 않아서 서운한 것입니다. 나에게 잘해 주는 사람을 사랑하는 것은 결국 나를 위한 사랑이고, 그래서 사람의 사랑에는 유효기간이 있다고 박사님은 말합니다."},{"t":"p","text":"사람이 아는 가장 큰 사랑은 어머니의 사랑일 것입니다. 그 사랑은 참으로 귀합니다. 그러나 박사님은 그 사랑에도 '내 아이'라는 조건이 붙어 있다고 조심스럽게 짚습니다. 옆집 아이를 내 아이처럼 사랑하기는 어렵습니다. 이것은 누구를 탓하려는 말이 아닙니다. 사람의 사랑이 본래 여기까지라는 것을 정직하게 인정하자는 말입니다."},{"t":"h3","text":"조건 없는 사랑, 아가페"},{"t":"p","text":"그리스 말에는 낱말이 하나 더 있었습니다. 아가페입니다. 아무 조건이 붙지 않은 사랑을 가리키는 말입니다. 박사님은 그리스 사람들이 이 이름은 지어 놓고도 그 실체는 찾지 못했다고 설명합니다. 그들의 신화에 나오는 신들은 서로 질투하고 다투는, 조건을 따지는 존재들이었기 때문입니다. 우리말에도 조건 없는 사랑을 한 낱말로 부르는 말은 따로 없습니다."},{"t":"p","text":"성경이 \"하나님은 사랑이시라\"고 쓸 때 그 자리에 놓인 낱말이 바로 아가페입니다. 그러니까 지난 과의 문장은 이렇게 다시 읽을 수 있습니다. 하나님은 조건 없는 사랑이시다. 교회에서는 이런 사랑을 '은혜'라고 부릅니다. 받을 자격을 묻지 않고 거저 주는 사랑이라는 뜻입니다."},{"t":"p","text":"박사님은 두 사랑을 가르는 기준을 '섬김의 방향'이라고 정리합니다. 조건 있는 사랑은 상대를 내 뜻대로 움직여 내가 섬김을 받으려 합니다. 그래서 \"시킨 대로 하면 주고, 안 하면 안 준다\"는 방식이 되고, 상대의 마음에 두려움을 심습니다. 조건 없는 사랑은 정반대로 철저히 상대방 중심입니다. 조건 있는 사랑 안에서는 쉴 수가 없습니다. 사랑을 잃지 않으려고 늘 잘하고 있는지 확인해야 하기 때문입니다. 조건 없는 사랑 안에서는 비위를 맞추지 않아도 되고, 어리광을 부려도 그 사랑이 변하지 않습니다."},{"t":"h3","text":"해와 비는 사람을 가리지 않습니다"},{"t":"p","text":"예수님은 이 사랑을 누구나 매일 보는 것으로 설명하셨습니다."},{"t":"verse","ref":"마태복음 5장 44절","text":"나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 박해하는 자를 위하여 기도하라"},{"t":"p","text":"그리고 바로 이어서 그 이유를 말씀하십니다. 하늘 아버지가 그런 분이시기 때문이라는 것입니다. 오늘의 핵심 성구가 그 말씀입니다. 하나님은 해를 악한 사람과 선한 사람에게 똑같이 비추시고, 비를 옳은 사람과 옳지 못한 사람에게 똑같이 내리십니다."},{"t":"p","text":"박사님은 이 그림을 이렇게 풉니다. 해는 생명입니다. 땅 위의 어떤 생명도 햇빛 없이는 살 수 없습니다. 하나님은 그 생명의 빛을 사람을 가려 가며 주지 않으십니다. 비도 그렇습니다. \"너는 착하니 많이 주고, 너는 나쁘니 안 주겠다\" 하고 나누지 않으십니다. 아침마다 떠오르는 해가, 하나님의 사랑이 조건을 따지지 않는다는 것을 날마다 보여 주고 있는 셈입니다."},{"t":"p","text":"박사님이 드는 예화가 하나 더 있습니다. 다섯 살 난 딸을 데리고 강가에 나온 엄마가 \"강물에 들어가지 마라\" 하고 당부했습니다. 그런데 잠시 눈을 뗀 사이 아이가 물에 들어갔다가 물살에 휩쓸립니다. 엄마는 나뭇가지에 찢기고 다치면서도 뛰어들어 딸을 건져 냅니다. 그 순간 \"너는 내 말을 어겼으니 네가 알아서 해라\" 하고 따지는 엄마는 없습니다. 박사님은 하나님이 사람을 건지시는 것도 이와 같다고 말합니다. 말을 잘 들었느냐를 먼저 묻지 않으시고, 사랑하시기 때문에 뛰어드신다는 것입니다."},{"t":"p","text":"여기서 한 가지가 분명해집니다. 박사님은 원수를 미워하는 것이 사람의 본성이라면 원수를 사랑하는 것은 하나님의 본성이라고 말합니다. 그리고 묻습니다. 원수까지 사랑하라고 하신 분이, 정작 자신은 말을 안 듣는 사람을 미워하고 벌주실 수 있겠느냐는 것입니다. 앞뒤가 맞지 않습니다. 원수를 사랑하시는 하나님은 나도 사랑하십니다. 내가 잘하는 날에도, 그렇지 못한 날에도 똑같이 그러십니다."},{"t":"h3","text":"그러면 아무렇게나 살아도 됩니까"},{"t":"p","text":"이쯤에서 자연스러운 물음이 생깁니다. 무엇을 해도 사랑하신다면 마음대로 살아도 되는 것 아닙니까. 박사님도 이 질문을 자주 받는다고 합니다. 그의 대답은 이렇습니다. 조건 없는 사랑을 정말로 알게 된 사람은 그렇게 되지 않습니다. 오히려 자기 돈을 들여 버스를 타고 봉사를 다니면서도 그것을 힘들어하지 않고 기쁨으로 여기게 된다는 것입니다."},{"t":"p","text":"박사님은 두 사랑을 가르는 또 하나의 잣대로 품는 넓이를 듭니다. 조건 있는 사랑은 상대가 나에게 잘해 주어야만 이어지므로 품이 좁습니다. 조건 없는 사랑은 상대가 나를 밀어내도 계속 품으므로 품이 한없이 넓습니다. 그런 품을 만난 사람은 제멋대로 살고 싶어지기보다, 저런 분이라면 곁에 머물고 싶다는 마음이 듭니다."},{"t":"p","text":"화장실 불 이야기를 다시 떠올려 보십시오. 사람을 바꾼 것은 지적이 아니라 말없이 감싸 준 사랑이었습니다. 박사님은 이런 비유도 듭니다. 여행 경비가 이미 다 치러져 있고 참가가 확정된 사람은 준비가 고되어도 즐겁게 합니다. 그러나 \"체력 시험에 붙으면 보내 주겠다\"고 하면 힘들어지는 순간 그만두게 됩니다. 끝까지 가게 하는 힘은 겁을 주는 데서 나오지 않고, 먼저 보장해 주는 사랑에서 나옵니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"사람의 사랑에는 \"~때문에\"가 붙지만, 하나님의 사랑 아가페에는 아무 조건이 붙지 않습니다. 해와 비가 사람을 가리지 않듯, 하나님은 선한 사람과 악한 사람을 똑같이 사랑하십니다. 그 사랑은 나를 부리려는 사랑이 아니라 나를 섬기려는 사랑입니다. 그래서 그 안에서는 잘 보이려 애쓰지 않고 쉴 수 있습니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가의 잔소리보다 말없는 배려가 나를 움직였던 기억이 있습니까?"},{"t":"q","i":1,"text":"둘째, 내가 받아 본 사랑 가운데 조건 없는 사랑에 가장 가까웠던 것은 누구의 사랑이었습니까? 그때 내 마음은 어떠했습니까?"},{"t":"q","i":2,"text":"셋째, 사랑을 잃을까 봐 늘 애쓰고 긴장했던 관계가 있었다면, 그때의 몸과 마음 상태를 나누어 주십시오."},{"t":"q","i":3,"text":"넷째, \"하나님은 악한 사람에게도 해를 비추신다\"는 말씀이 반갑게 들립니까, 불편하게 들립니까? 그 까닭은 무엇일까요?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"마태복음 5장 44절","text":"나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 박해하는 자를 위하여 기도하라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아침에 햇빛을 볼 때 잠시 멈추어 \"이 햇빛은 오늘 나에게도 조건 없이 비칩니다\" 하고 마음속으로 말해 봅니다."},{"t":"act","i":1,"text":"이번 주에 가족이나 동료의 실수를 한 번, 지적하지 않고 말없이 대신 감당해 줍니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"어머니의 사랑에도 조건이 있다는 대목에서 마음이 상하는 분이 있을 수 있습니다. 부모의 사랑을 낮추려는 말이 아니라, 그 귀한 사랑보다 더 넓은 사랑이 있음을 말하려는 것이라고 풀어 주십시오. 반대로 조건적인 사랑 속에서 상처받은 기억이 올라오는 분도 있습니다. 서둘러 위로하거나 결론을 내려 주지 말고 충분히 들어 주십시오. \"원수를 사랑하라\"는 말씀은 이 과에서 우리가 지켜야 할 숙제로 다루지 않습니다. 하나님이 어떤 분이신지를 보여 주는 창으로만 읽어 주십시오. \"그러면 악한 사람은 어떻게 됩니까?\" 하는 질문은 제3부에서 다룬다고 안내하시면 됩니다."}],"inPart":2,"audio":"audio/09.m4a"},{"id":"10","kind":"lesson","no":8,"part":null,"title":"흙에 입 맞추신 분","sub":"나는 왜 이 세상에 있을까요. 사람은 무엇을 위해 지어졌습니까?","key":{"ref":"창세기 2장 7절","text":"여호와 하나님이 땅의 흙으로 사람을 지으시고 생기를 그 코에 불어넣으시니 사람이 생령이 되니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"첫아이를 기다리는 집을 떠올려 보십시오. 아기는 아직 태어나지도 않았는데 집 안은 벌써 분주합니다. 볕이 잘 드는 방을 비우고, 작은 이불을 빨아 널고, 모서리마다 부딪혀도 다치지 않게 손을 봅니다. 아기가 무엇을 해 주어서가 아닙니다. 아기는 아직 아무것도 한 것이 없습니다. 그저 올 것이기 때문에, 그리고 이미 사랑하기 때문에 준비하는 것입니다."},{"t":"p","text":"이상구 박사는 첫아이를 품에 안는 순간을 사람이 맛보는 가장 높은 행복의 자리로 꼽습니다. 긴 진통 끝에 갓 태어난 아이를 품에 안겨 줄 때, 어머니의 마음에는 \"이 아기를 위하여 산다\"는 생각밖에 없다는 것입니다. 아이는 나와 다른 생명이면서도 나와 하나입니다. 박사님은 그 마음에서 하나님이 사람을 지으신 까닭을 읽어 냅니다."},{"t":"p","text":"지난 두 과에서 우리는 하나님이 사랑이시며, 그 사랑에는 조건이 없다는 것을 살펴보았습니다. 오늘은 성경의 첫 장을 펴 봅니다. 그 사랑이 맨 처음 하신 일은 무엇이었을까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"집을 먼저 지으시고"},{"t":"p","text":"성경의 첫 책 창세기는 하나님이 세상을 지으신 이야기로 시작합니다. 첫 장을 찬찬히 읽으면 순서가 눈에 들어옵니다. 빛이 먼저 있고, 하늘과 바다와 땅이 나뉘고, 풀과 나무가 돋고, 해와 달이 자리를 잡고, 물고기와 새와 짐승이 채워집니다. 사람은 맨 마지막에 등장합니다. 모든 것이 갖추어진 뒤입니다."},{"t":"p","text":"아기 방을 먼저 꾸미는 부모와 같은 순서입니다. 하나님은 사람에게 \"네가 살 곳은 네가 마련해라\" 하지 않으셨습니다. 숨 쉴 공기와 마실 물, 먹을 열매와 바라볼 꽃을 다 차려 놓으신 뒤에 사람을 부르셨습니다. 사람은 눈을 뜨자마자 이미 준비된 선물 한가운데 서 있었습니다. 창조 이야기의 첫 장면에서 하나님은 받으시는 분이 아니라 주시는 분으로 등장하십니다."},{"t":"p","text":"박사님은 창조에서 '어떻게'보다 '왜'가 더 중요하다고 말합니다. 그리고 이렇게 답합니다. 하나님은 사랑이시고, 사랑은 주는 것이 기쁨이므로, 그 사랑을 받을 대상이 필요하셨다는 것입니다. 사람은 부려 먹을 일꾼으로 지어진 것이 아니라 사랑을 부어 줄 자녀로 지어졌습니다."},{"t":"p","text":"하나님은 갓 지으신 사람에게 복을 주시며 자녀를 낳아 땅에 가득하라고 하셨습니다(창세기 1장 28절). 박사님은 이 말씀도 사랑의 논리로 풉니다. 자녀가 많아질수록 사랑을 나누어 줄 대상이 많아집니다. 사랑이신 하나님은 그 사랑을 받을 사람이 더 많아지기를 바라셨다는 것입니다. 복이라는 말도 박사님은 돈이나 자리가 아니라 생명 그 자체, 살아서 자라나게 하는 힘으로 읽습니다."},{"t":"h3","text":"\"심히 좋았더라\""},{"t":"p","text":"엿새에 걸친 창조가 끝났을 때 성경은 이렇게 적습니다."},{"t":"verse","ref":"창세기 1장 31절","text":"하나님이 지으신 그 모든 것을 보시니 보시기에 심히 좋았더라 저녁이 되고 아침이 되니 이는 여섯째 날이니라"},{"t":"p","text":"박사님은 이 \"좋았더라\"를 \"사랑을 줄 대상이 생겨서 좋으셨다\"는 뜻으로 읽습니다. 사람이 무엇을 좋아할 때에는 갖고 싶은 마음이 섞이기 마련입니다. 그러나 하나님이 좋아하실 때에는 주고 싶은 마음뿐이라는 것입니다. 사람을 향한 하나님의 첫 말씀은 요구도 평가도 아니었습니다. 기쁨이었습니다."},{"t":"p","text":"이 구절을 나에게 옮겨 보시기 바랍니다. 아직 아무것도 해 놓은 것이 없는 사람, 잘한 일도 없고 증명한 것도 없는 사람을 보시며 하나님은 \"심히 좋다\"고 하셨습니다. 우리는 흔히 무엇인가를 해내야 비로소 존재할 자격이 생긴다고 여기며 삽니다. 성경의 첫 장은 그 순서를 뒤집습니다. 기뻐하심이 먼저이고, 그다음에 삶이 시작됩니다."},{"t":"p","text":"성경은 또 하나님이 사람을 \"자기 형상\"대로 지으셨다고 말합니다."},{"t":"verse","ref":"창세기 1장 27절","text":"하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고"},{"t":"p","text":"'형상'은 닮은 모습이라는 뜻입니다. 박사님은 이것을 얼굴 생김새가 아니라 성품으로 풉니다. 조건 없는 사랑을 좋아하도록 지어진 마음이라는 것입니다. 그래서 사람은 조건 없이 사랑받을 때 살아나고, 조건을 따지는 사랑 속에서는 시들어 갑니다. 제1부에서 몸이 들려준 이야기가 바로 이것이었습니다. 우리 몸은 처음부터 그렇게 지어졌습니다."},{"t":"p","text":"박사님은 병아리를 지켜본 이야기를 들려줍니다. 알에서 나온 지 이틀밖에 안 된 병아리들이 벌써 큰 먹이를 혼자 차지하려고 다투더라는 것입니다. 지금 우리 안에도 그런 마음이 있습니다. 그러나 박사님은 하나님이 처음 사람을 지으실 때 그런 욕심을 심어 놓으셨을 리 없다고 말합니다. 지금의 모습은 오랜 세월 조건을 따지며 살아오는 동안 달라진 모습이고, 본래의 우리는 사랑을 닮은 존재였다는 것입니다. 무엇이 어떻게 달라졌는지는 제3부에서 살펴보겠습니다."},{"t":"h3","text":"흙, 그리고 숨"},{"t":"p","text":"창세기 2장은 사람을 지으신 장면을 가까이에서 다시 보여 줍니다. 오늘의 핵심 성구입니다. 하나님은 땅의 흙으로 사람을 빚으시고, 그 코에 생기를 불어넣으셨습니다. '생령'은 어려운 말인데, 박사님은 '살아 있는 존재'라는 뜻에 가깝다고 설명합니다."},{"t":"p","text":"박사님이 주목하는 것은 숨이 들어가기 전의 모습입니다. 얼굴과 살갗까지 다 빚어 놓아도 생기가 들어가기 전까지 그 사람은 흙일 뿐이었습니다. 모든 것이 갖추어져 있었지만 아무것도 움직이지 않았습니다. 생기가 들어가는 순간 비로소 살아났습니다. 박사님은 그 생기의 본질이 곧 사랑이라고 말합니다. 사랑을 받음으로써 흙덩어리가 살아 있는 존재가 되었다는 것입니다."},{"t":"p","text":"이 장면을 천천히 그려 보시기 바랍니다. 말씀 한마디로 빛을 있게 하신 분이, 사람을 지으실 때에는 손수 흙을 빚으셨습니다. 그리고 코에 숨을 불어넣으셨습니다. 누군가의 코에 숨을 불어넣으려면 얼굴을 맞대야 합니다. 흙 묻은 얼굴에 당신의 얼굴을 가까이 대신 것입니다. 그래서 우리는 이 과의 제목을 '흙에 입 맞추신 분'이라고 붙였습니다. 사람이 세상에서 처음 받은 것은 명령이 아니라 하나님의 숨결이었습니다."},{"t":"h3","text":"받는 것으로 시작된 삶"},{"t":"p","text":"흙은 아무것도 하지 않았습니다. 빚어 달라고 청하지도 않았고, 숨을 받을 자격을 갖추지도 않았습니다. 하나님이 흙에게 자격을 묻지 않으셨기 때문입니다. 생명은 벌어들인 것이 아니라 받은 것입니다. 사람의 삶은 처음부터 받는 것으로 시작되었습니다."},{"t":"p","text":"박사님은 이 생기가 한 번 주고 끝난 것이 아니라 지금도 밖에서 들어오는 힘이라고 설명합니다. 방전된 휴대전화가 스스로 충전되지 못하듯, 사람도 자기 안에서 생명을 만들어 내지 못합니다. 그렇다면 하나님을 알아 가는 것, 곧 그분의 사랑을 받아들이는 것이 생기를 받는 길이 됩니다. 몸과 마음의 회복도 하나님을 잘 섬겨서 얻어 내는 보상이 아니라, 처음 창조 때처럼 조건 없이 부어지는 사랑을 다시 받아들이는 일입니다. 이것은 병원 치료를 밀어내는 이야기가 아닙니다. 치료를 받는 몸 안에서 실제로 일하는 생명이 어디에서 오는가에 대한 이야기입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님은 사람이 살 집을 먼저 다 차려 놓으시고, 손수 흙을 빚어 얼굴을 맞대고 숨을 불어넣으셨습니다. 흙에게는 아무 자격도 묻지 않으셨습니다. 그리고 아직 아무것도 하지 않은 사람을 보시며 \"심히 좋다\"고 하셨습니다. 나는 쓸모가 있어서 지어진 존재가 아니라 사랑받으라고 지어진 존재입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가 나를 위해 미리 준비해 둔 것을 보고 마음이 뭉클했던 적이 있습니까?"},{"t":"q","i":1,"text":"둘째, \"무엇인가를 해내야 내가 가치 있다\"고 느끼며 살아온 때가 있었습니까? 그때 몸과 마음은 어떠했습니까?"},{"t":"q","i":2,"text":"셋째, 아직 아무것도 하지 않은 나를 보시고 \"심히 좋다\" 하시는 하나님을 떠올리면 어떤 느낌이 드십니까?"},{"t":"q","i":3,"text":"넷째, 요즘 내가 기운을 받는 곳은 어디입니까? 그 기운이 바닥날 때 나는 주로 어떻게 합니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"창세기 1장 31절","text":"하나님이 지으신 그 모든 것을 보시니 보시기에 심히 좋았더라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루 한 번 조용히 앉아 숨을 천천히 들이쉬며 \"이 숨은 받은 것입니다\" 하고 마음속으로 말해 봅니다."},{"t":"act","i":1,"text":"집 밖에 나가 나무나 하늘이나 꽃 한 가지를 1분 동안 바라보며, 나를 위해 먼저 차려 놓으신 선물로 받아 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서는 창조와 진화를 둘러싼 논쟁으로 시간이 흘러가기 쉽습니다. 그 질문이 나오면 중요한 질문이라고 인정해 주시되, 오늘은 '어떻게'보다 '왜 지으셨는가'에 머물자고 부드럽게 이끌어 주십시오. 제3과에서 생기를 몸의 관점에서 이미 다루었으므로, 오늘은 같은 구절을 하나님의 마음 쪽에서 읽는다고 알려 주시면 좋습니다. 태어난 것 자체가 환영받지 못했다고 느끼며 자란 분이 있을 수 있습니다. 둘째 질문과 셋째 질문에서 그런 이야기가 나오면 말을 보태지 말고 들어 주십시오. 아픈 분에게는 마지막 소제목 '받는 것으로 시작된 삶'의 뜻, 곧 치료를 그만두라는 말이 아님을 분명히 해 주십시오."}],"inPart":2,"audio":"audio/10.m4a"},{"id":"11","kind":"lesson","no":9,"part":null,"title":"기다리는 아버지","sub":"내가 하나님을 떠나 있는 동안, 하나님은 나를 어떻게 대하고 계실까요?","key":{"ref":"누가복음 15장 20절","text":"이에 일어나서 아버지께로 돌아가니라 아직도 거리가 먼데 아버지가 그를 보고 측은히 여겨 달려가 목을 안고 입을 맞추니"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"집을 나간 자식을 둔 부모는 대문을 잠그지 못한다고 합니다. 밤늦게 골목에서 발소리가 나면 저도 모르게 귀를 기울입니다. 밥때가 되면 한 그릇을 더 풀까 말까 망설입니다. 자식이 무슨 말을 하고 나갔든, 얼마나 속을 썩였든 그 마음은 달라지지 않습니다. 돌아오기만 하면 됩니다."},{"t":"p","text":"지난 과에서 우리는 하나님이 사람을 사랑받을 자녀로 지으셨다는 것을 살펴보았습니다. 그렇다면 그 자녀가 등을 돌리고 떠났을 때 하나님은 어떻게 하실까요. 화를 내실까요. 돌아와서 잘못을 빌 때까지 문을 닫아걸고 계실까요."},{"t":"p","text":"예수님은 이 물음에 이야기 하나로 답하셨습니다. 흔히 '돌아온 탕자(재산을 탕진한 아들)의 비유'라고 부르는 이야기입니다. 그런데 이상구 박사는 이 이야기의 주인공이 아들이 아니라 아버지라고 말합니다. 예수님이 하신 말씀 어디에도 '탕자'라는 이름은 없고, \"잃었다가 다시 얻었다\"는 아버지의 말만 있다는 것입니다. 오늘은 그 아버지를 따라가 봅니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"떠나는 아들에게 재산을 내주다"},{"t":"p","text":"이야기는 이렇게 시작합니다."},{"t":"verse","ref":"누가복음 15장 11절에서 12절","text":"또 이르시되 어떤 사람에게 두 아들이 있는데 그 둘째가 아버지에게 말하되 아버지여 재산 중에서 내게 돌아올 분깃을 내게 주소서 하는지라 아버지가 그 살림을 각각 나눠 주었더니"},{"t":"p","text":"'분깃'은 자기 몫이라는 뜻입니다. 유산은 부모가 세상을 떠난 뒤에 받는 것입니다. 그러니 아버지가 멀쩡히 살아 계신데 유산을 달라는 것은, 박사님의 설명대로 아버지에게 어서 돌아가시라고 하는 말과 같습니다. 나에게 필요한 것은 아버지가 아니라 돈이라는 선언이고, 부자 관계를 끊겠다는 통고입니다. 당시 그 사회의 법으로는 동네 사람들이 돌로 쳐도 할 말이 없는 패륜이었다고 박사님은 설명합니다."},{"t":"p","text":"그런데 아버지는 재산을 나누어 줍니다. 아들이 그것을 들고 나가 다 써 버릴 것을 뻔히 알면서 그렇게 합니다. 박사님은 이 행동에 담긴 뜻을 이렇게 읽습니다. 유산은 아들에게만 주는 것입니다. 그러니 재산을 내준다는 것은 \"네가 나와 인연을 끊어도 나는 끊지 않는다. 너는 여전히 내 아들이다\"라는 뜻입니다. 그리고 그 말 없는 허락 속에는 \"언제든지 돌아오너라\"는 전갈이 함께 들어 있습니다. 만일 아버지가 \"다시는 내 앞에 나타나지 마라\" 했다면 아들에게는 돌아올 길이 없었을 것입니다."},{"t":"p","text":"박사님은 여기서 사랑과 자유의 관계를 짚습니다. \"떠나지 못하게 막는 사랑은 조건적 사랑이고...  막아 놓고 사랑하면 그것은 사육입니다.\" 조건 없는 사랑은 떠날 자유까지 줍니다. 관계가 끊어진 것은 아들 쪽의 일방적인 선언이었을 뿐, 아버지 쪽에서는 아무것도 끊어지지 않았습니다."},{"t":"h3","text":"아들이 준비한 대사"},{"t":"p","text":"아들은 먼 나라에 가서 재산을 다 써 버립니다. 마침 그 나라에 큰 흉년이 들고, 아들은 돼지를 치는 신세가 됩니다. 돼지가 먹는 열매로 배를 채우려 해도 주는 사람이 없었습니다. 그제야 아들은 집을 떠올립니다. 아버지 집에는 품꾼들도 배불리 먹는데 나는 여기서 굶어 죽는구나."},{"t":"p","text":"박사님은 이 장면을 감동적인 뉘우침으로 읽지 않습니다. 아들이 돌아선 까닭은 살기 위해서였습니다. 그래서 대사를 준비합니다. \"아들이라 불릴 자격이 없으니 품꾼의 하나로 써 주십시오.\" 품꾼은 일한 만큼 삯을 받는 사람입니다. 아들은 끝까지 아버지를 조건을 따지는 분으로 알고 있었습니다. 박사님은 이것을 밥을 얻기 위한 \"작전상 사과\"라고 부릅니다."},{"t":"p","text":"그리고 이것이 우리 모두의 모습이라고 말합니다. \"이 정도 착하게 살면 받아 주시지 않을까\" 하는 생각이 바로 품꾼의 생각입니다. 그런데 눈여겨볼 것이 있습니다. 아버지는 아들이 돌아오는 동기가 순수한지를 검사하지 않습니다. 배가 고파서 오든, 면목이 없어서 쭈뼛거리며 오든, 돌아오는 방향 하나만 보십니다."},{"t":"h3","text":"아직도 거리가 먼데"},{"t":"p","text":"이제 오늘의 핵심 성구입니다. 박사님은 이 한 절을 이야기 전체의 절정으로 꼽습니다. \"아직도 거리가 먼데\" 아버지가 먼저 아들을 보았습니다. 아들이 아버지를 찾아낸 것이 아닙니다. 아버지가 먼저 보았다는 것은 날마다 그 길을 바라보며 기다리고 있었다는 뜻입니다."},{"t":"p","text":"그리고 아버지는 달려갑니다. 박사님은 여기 쓰인 낱말이 그냥 뛰었다는 뜻이 아니라, 경기장에서 선수가 있는 힘을 다해 질주한다는 뜻이라고 설명합니다. 그 시대에 나이 든 어른이 옷자락을 걷고 뛰는 것은 체면을 다 버리는 일이었습니다. 왜 그렇게 달렸을까요. 너무 오래 기다렸기 때문입니다. 그리고 박사님은 더 중요한 까닭을 듭니다. 동네 사람들이 거지꼴의 아들을 먼저 알아보면 돌을 들 수 있었습니다. 아버지가 먼저 달려가 끌어안고 입을 맞추면 아무도 그 아들에게 손을 댈 수 없습니다. 아버지의 품이 아들의 방패가 된 것입니다."},{"t":"p","text":"아들은 그때까지 잘못했다는 말을 한마디도 꺼내지 못했습니다. 돼지우리에서 지내 씻지도 못한 몸이었습니다. 아버지는 그 몸을 먼저 끌어안았습니다. 박사님은 이렇게 정리합니다. 뉘우친 다음에 받아 주신 것이 아니라, 받아 주신 것이 먼저이고 뉘우침은 그다음이라는 것입니다."},{"t":"verse","ref":"누가복음 15장 22절에서 24절","text":"아버지는 종들에게 이르되 제일 좋은 옷을 내어다가 입히고 손에 가락지를 끼우고 발에 신을 신기라 그리고 살진 송아지를 끌어다가 잡으라 우리가 먹고 즐기자 이 내 아들은 죽었다가 다시 살아났으며 내가 잃었다가 다시 얻었노라 하니 그들이 즐거워하더라"},{"t":"p","text":"아들은 준비한 대사를 읊기 시작하지만, \"품꾼으로 써 주십시오\"라는 마지막 말은 꺼내지도 못합니다. 아버지가 말을 끊고 종들을 부르기 때문입니다. 좋은 옷은 \"이 아이는 거지가 아니라 내 아들\"이라는 표시입니다. 가락지는 집안의 도장이어서, 온 동네 앞에 아들의 신분을 선포하는 것입니다. 종은 신을 신지 않았으니 신발도 아들의 표시입니다. 씻기지도 않은 몸에 곧바로 제일 좋은 옷을 입혔습니다. 얼마 동안 지켜본 뒤에 받아 주겠다는 말은 없었습니다."},{"t":"p","text":"아버지의 말에도 귀를 기울여 보십시오. 제 발로 나간 것은 아들입니다. 그런데 아버지는 \"저 녀석이 이제야 돌아왔다\"고 하지 않고 \"내가 잃었다가 다시 얻었다\"고 말합니다. 박사님은 잘못의 책임을 상대에게 돌리지 않고 자기 쪽으로 끌어안는 이 말투가 조건 없는 사랑의 말투라고 말합니다. 아들의 참된 뉘우침은 바로 이때, 아버지 품 안에서 나옵니다. \"아버지가 나를 이렇게 사랑하시는 줄 몰랐습니다.\""},{"t":"h3","text":"밭에서 돌아온 큰아들"},{"t":"p","text":"이야기는 여기서 끝나지 않습니다. 밭에서 일하다 돌아온 큰아들이 잔치 소리를 듣고 화가 나서 집에 들어가지 않습니다. 여러 해 아버지를 섬기며 명을 어긴 적이 없는 자기에게는 염소 새끼 한 마리 주신 적이 없다는 것입니다. 박사님은 큰아들도 아버지의 마음을 몰랐다고 짚습니다. 일을 잘하면 더 많이 주시겠지 하는 계산으로, 아들의 자리에서 품꾼처럼 살았다는 것입니다."},{"t":"p","text":"아버지는 이번에도 먼저 밖으로 나갑니다."},{"t":"verse","ref":"누가복음 15장 31절에서 32절","text":"아버지가 이르되 얘 너는 항상 나와 함께 있으니 내 것이 다 네 것이로되 이 네 동생은 죽었다가 살아났으며 내가 잃었다가 얻었기로 우리가 즐거워하고 기뻐하는 것이 마땅하다 하니라"},{"t":"p","text":"멀리 떠난 아들에게도, 곁에 있으면서 마음이 먼 아들에게도 아버지는 먼저 다가가십니다. 큰아들이 잔치에 들어갔는지 성경은 말해 주지 않습니다. 박사님은 이것을 예수님이 일부러 남겨 두신 여백이라고 봅니다. 듣는 사람이 스스로 답하도록 열어 두신 것입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"아버지는 떠나는 아들에게 재산을 내주며 \"너는 여전히 내 아들\"이라고 말했고, 날마다 길을 바라보다가 아들이 입을 열기도 전에 달려가 안았습니다. 뉘우침이 사랑을 불러온 것이 아니라 사랑이 뉘우침을 낳았습니다. 하나님 쪽에서는 나와의 관계를 끊으신 적이 한 번도 없습니다. 돌아오는 방향 하나면 됩니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 집에 돌아왔을 때 누군가 나를 기다리고 있어 마음이 놓였던 기억이 있습니까?"},{"t":"q","i":1,"text":"둘째, 둘째 아들과 큰아들 가운데 지금의 나는 누구와 더 닮았다고 느끼십니까? 어떤 점에서 그렇습니까?"},{"t":"q","i":2,"text":"셋째, 잘못한 뒤에 \"품꾼으로라도 받아 달라\"는 식으로 대사를 준비해 본 적이 있습니까? 상대의 반응은 어떠했습니까?"},{"t":"q","i":3,"text":"넷째, 아들이 말을 꺼내기도 전에 달려와 안는 아버지의 모습이 내가 알던 하나님의 모습과 어떻게 다릅니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"누가복음 15장 24절","text":"이 내 아들은 죽었다가 다시 살아났으며 내가 잃었다가 다시 얻었노라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"누가복음 15장 11에서 32절을 하루에 한 번, 아버지의 표정과 몸짓을 그려 보며 천천히 읽습니다."},{"t":"act","i":1,"text":"나와 사이가 멀어진 사람 한 명을 떠올리고, 따지는 말 없이 짧은 안부를 먼저 전해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"아버지에게 상처받은 분에게는 '아버지'라는 말 자체가 걸림돌이 될 수 있습니다. 이 이야기의 아버지는 우리가 겪은 아버지가 아니라, 우리가 늘 바랐던 아버지의 모습이라고 말해 주십시오. \"그래도 아들이 돌아왔으니 받아 주신 것 아닙니까?\"라는 질문이 나올 수 있습니다. 아버지의 사랑은 아들이 떠나던 날에도, 먼 나라에 있던 날에도 같았다는 점을 본문에서 함께 확인해 보십시오. 달라진 것은 아들의 자리이지 아버지의 마음이 아닙니다. 둘째 질문에서 큰아들과 닮았다고 답하는 분을 나무라는 분위기가 되지 않도록 살펴 주십시오. 아버지는 큰아들에게도 먼저 나가셨습니다."}],"inPart":2,"audio":"audio/11.m4a"},{"id":"12","kind":"lesson","no":10,"part":null,"title":"찾을 때까지 찾으시는 분","sub":"돌아갈 힘도 없고, 내가 길을 잃은 줄도 모를 때에는 어떻게 됩니까?","key":{"ref":"누가복음 15장 4절","text":"너희 중에 어떤 사람이 양 백 마리가 있는데 그 중의 하나를 잃으면 아흔아홉 마리를 들에 두고 그 잃은 것을 찾아내기까지 찾아다니지 아니하겠느냐"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"붐비는 시장에서 아이 손을 놓친 엄마를 떠올려 보십시오. 그 순간 엄마에게는 장바구니도, 체면도, 다른 볼일도 없습니다. 이름을 부르며 골목마다 뛰어다닙니다. 한 시간쯤 찾아보다가 \"이만하면 됐다\" 하고 집에 가는 엄마는 없습니다. 아이가 제 발로 딴 데 구경을 갔든, 엄마가 잠깐 한눈을 팔았든 그것도 나중 일입니다. 찾을 때까지 찾습니다."},{"t":"p","text":"지난 과에서 우리는 집 나간 아들을 기다리는 아버지를 만났습니다. 그 이야기를 듣고 이런 생각이 드는 분이 있을 것입니다. 그 아들은 그래도 제 발로 돌아올 힘이 있었습니다. 돌아갈 힘조차 없는 사람은 어떻게 됩니까. 돌아가야 한다는 것조차 모르는 사람은 어떻게 됩니까."},{"t":"p","text":"예수님은 기다리는 아버지 이야기에 앞서 짧은 이야기 두 편을 먼저 들려주셨습니다. 기다리시는 하나님은 동시에 찾아 나서시는 하나님이라는 이야기입니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"맨 앞줄에 앉은 사람들"},{"t":"p","text":"먼저 이 이야기들이 어떤 자리에서 나왔는지 보아야 합니다. 누가복음 15장은 세리와 죄인들이 예수님의 말씀을 들으러 가까이 나아왔다는 말로 시작합니다. 세리는 세금을 걷는 사람입니다. 이상구 박사의 설명에 따르면, 당시 이스라엘은 로마의 지배를 받고 있었고 세리는 동족에게서 세금을 걷어 로마에 바치며 중간에서 제 몫을 챙기던 사람들이었습니다. 돈은 많았지만 이웃들에게는 사람 취급을 받지 못했습니다. 예배 처소에도 발을 들이지 못했습니다."},{"t":"p","text":"박사님이 더 아프게 짚는 것은 그들의 속마음입니다. 그들은 남에게만 손가락질을 받은 것이 아니라 스스로도 \"우리 같은 사람은 가망이 없다\"고 믿었습니다. 하나님이 자기들을 벌하시는 것이 마땅하다고 여기며 살았습니다. 그런데 예수님이 전하시는 하나님은 자기들 같은 사람도 미워하지 않으시는 분이었습니다. 그래서 예수님이 오셨다 하면 맨 앞줄에 앉아 들었다는 것입니다."},{"t":"p","text":"그 모습을 못마땅하게 본 사람들이 있었습니다."},{"t":"verse","ref":"누가복음 15장 2절","text":"바리새인과 서기관들이 수군거려 이르되 이 사람이 죄인을 영접하고 음식을 같이 먹는다 하더라"},{"t":"p","text":"바리새인과 서기관은 당시에 성경을 가장 많이 알고 가장 바르게 산다고 존경받던 사람들입니다. 그들의 생각은 우리의 상식과 크게 다르지 않습니다. 나쁜 사람은 멀리하고 따끔하게 가르쳐야지, 어떻게 한 상에서 밥을 먹느냐는 것입니다. 예수님은 그들에게 화를 내지 않으시고 이야기로 답하셨습니다. 박사님은 에둘러 말하는 이 방식 자체가 그들의 마음이 다치지 않게 하시려는 배려였다고 말합니다."},{"t":"h3","text":"제 발로 나간 양"},{"t":"p","text":"첫째 이야기가 오늘의 핵심 성구입니다. 양 백 마리를 치는 사람이 한 마리를 잃으면 아흔아홉 마리를 두고 그 한 마리를 찾아 나서지 않겠느냐는 것입니다."},{"t":"p","text":"박사님은 양이 어떤 짐승인지부터 설명합니다. 양은 겁이 많습니다. 날카로운 이빨도 발톱도 없고 빨리 달아나지도 못합니다. 그래서 목자 곁을 떠날 줄 모릅니다. 그런 양이 없어졌다면 제 발로 나갔다는 뜻입니다. 박사님은 젊은 날 산속에서 여러 해 양을 쳤던 폴란드 출신 노목사에게 들은 이야기를 전합니다. 양 떼에는 드물게 유별난 녀석이 있어서, 풀 냄새에 끌려 목자가 안 보는 틈에 무리를 벗어난다는 것입니다. 영어로는 그런 말썽꾸러기를 '검은 양'이라고 부른다고 합니다."},{"t":"p","text":"그러니 이 이야기의 양은 가엾게 길을 잃은 순한 양이 아닙니다. 속을 썩이는 양입니다. 그런데 성경은 \"양이 도망갔다\"고 쓰지 않고 목자가 \"잃었다\"고 씁니다. 지난 과의 아버지가 \"내가 잃었다\"고 말한 것과 같은 말투입니다. 박사님은 아흔아홉 마리를 하늘의 천사들로, 속 썩이는 한 마리를 이 땅의 우리로 읽습니다. 예수님이 이 땅에 오신 것은 그 한 마리 때문이었다는 것입니다."},{"t":"p","text":"박사님이 가장 감탄하는 표현은 \"찾아내기까지\"입니다. 이 말의 반대말은 \"찾아보다가 만다\"입니다. 사람은 하도 애를 먹이면 \"그만 찾자, 말 잘 듣는 녀석들만 있으면 되지\" 하고 돌아섭니다. 그렇게 하신다면 하나님이 아니라고 박사님은 말합니다. 찾을 때까지 포기하지 않는다는 것, 그것이 곧 조건이 없다는 말의 뜻입니다."},{"t":"p","text":"그리고 목자는 찾아낸 양을 꾸짖지 않습니다. 성경은 \"찾아낸즉 즐거워 어깨에 메고\" 돌아온다고 적습니다(누가복음 15장 5절). 몇 시간을 헤매어 다리가 아플 텐데 양을 걷게 하지 않고 메고 옵니다. 박사님은 이런 대화를 그려 봅니다. 감동한 양이 다시는 도망가지 않겠다고 하자, 목자는 너는 아마 일주일쯤 지나면 또 나가겠지만 그때에도 내가 또 찾아 주겠다고 대답한다는 것입니다."},{"t":"h3","text":"잃어버린 줄도 모르는 동전"},{"t":"p","text":"둘째 이야기는 더 짧습니다."},{"t":"verse","ref":"누가복음 15장 8절","text":"어떤 여자가 열 드라크마가 있는데 하나를 잃으면 등불을 켜고 집을 쓸며 찾아내기까지 부지런히 찾지 아니하겠느냐"},{"t":"p","text":"드라크마는 은으로 만든 동전으로, 박사님의 설명으로는 당시 일꾼의 하루 품삯에 해당했습니다. 은행이 없던 시절 한 닢 한 닢 모은 돈이니 그 여인에게는 생명 같은 돈입니다. 그 가운데 하나가 굴러 어두운 집 안 어디론가 사라졌습니다. 여인은 등불을 켜고, 비로 쓸고, 구석구석을 뒤집니다."},{"t":"p","text":"박사님은 이 이야기가 짧지만 양 이야기보다 더 깊다고 말합니다. 양은 알고서 나갔습니다. 그러나 동전은 아무것도 모릅니다. 자기가 주인 손을 떠났다는 것도, 지금 어두운 구석에 떨어져 있다는 것도 모릅니다. 스스로 돌아갈 수도 없습니다. 박사님은 이것이 사람의 실상이라고 말합니다. 우리는 하나님을 떠나겠다고 작정한 적이 없습니다. 태어나 보니 이미 멀리 있었고, 멀리 있다는 사실조차 모르고 살았습니다."},{"t":"p","text":"박사님 자신이 그랬다고 고백합니다. 대학 시절 누가 하나님 이야기를 해도 전혀 와닿지 않았는데, 돌아보니 하나님이 먼저 자기를 찾아내셨다는 것입니다. 동전이 먼지 속에 떨어져 있어도 은전의 값은 그대로입니다. 그리고 주인이 찾는 까닭은 동전이 무엇을 잘해서가 아니라 주인에게 소중하기 때문입니다."},{"t":"h3","text":"찾으면 잔치가 열립니다"},{"t":"p","text":"두 이야기는 똑같이 끝납니다. 찾아낸 사람이 벗과 이웃을 불러 모으고 \"나와 함께 즐기자\" 하고 잔치를 엽니다."},{"t":"verse","ref":"누가복음 15장 10절","text":"내가 너희에게 이르노니 이와 같이 죄인 한 사람이 회개하면 하나님의 사자들 앞에 기쁨이 되느니라"},{"t":"p","text":"'회개'는 마음을 돌이킨다는 뜻이고, '하나님의 사자들'은 천사들을 가리킵니다. 그런데 양은 찾아 달라고 빌지 않았고 동전은 빌 수도 없었습니다. 박사님은 여기서 순서를 바로잡습니다. 마음을 고쳐먹으면 찾아 주시는 것이 아닙니다. 먼저 찾아내신 그 사랑을 알고 감격하면, 그다음에 저절로 마음이 돌아선다는 것입니다."},{"t":"p","text":"이 잔치가 말해 주는 것이 하나 더 있습니다. 나를 되찾는 일은 하나님께 귀찮은 의무가 아니라 기쁨입니다. 그래서 박사님은 \"나 같은 사람을 하나님이 사랑하실 수 있을까\" 하는 생각이야말로 하나님을 가장 크게 오해하는 것이라고 말합니다. 이렇게 제2부에서 우리는 하나님이 어떤 분이신지를 살펴보았습니다. 그런데 이런 분을 우리는 왜 그토록 무서워하게 되었을까요. 그 이야기가 다음 제3부에서 이어집니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님은 기다리기만 하시는 분이 아니라 찾아 나서시는 분입니다. 제 발로 나간 양도, 자기가 떨어진 줄도 모르는 동전도 \"찾아내기까지\" 찾으십니다. 찾으시는 까닭은 내가 잘해서가 아니라 내가 그분께 소중하기 때문입니다. 그리고 나를 찾으신 날, 하늘에서는 꾸중이 아니라 잔치가 열립니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 아끼던 것을 잃어버렸다가 되찾은 적이 있습니까? 찾는 동안, 그리고 찾은 순간의 마음을 들려주십시오."},{"t":"q","i":1,"text":"둘째, 나는 알고서 무리를 벗어난 양에 가깝습니까, 떨어진 줄도 모르는 동전에 가깝습니까?"},{"t":"q","i":2,"text":"셋째, \"나 같은 사람을 사랑하실 수 있을까\" 하는 생각이 든 적이 있습니까? 그 생각은 어디에서 왔을까요?"},{"t":"q","i":3,"text":"넷째, 돌아보면 누군가 나를 찾고 있었다고 느껴지는 인생의 순간이 있습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"누가복음 15장 5절","text":"또 찾아낸즉 즐거워 어깨에 메고"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"잠자리에 들기 전 \"오늘도 저를 찾고 계셨군요\" 하고 짧게 말해 보고, 오늘 하루 그렇게 느껴진 순간이 있었는지 돌아봅니다."},{"t":"act","i":1,"text":"모임에서 늘 혼자 있는 사람, 연락이 끊긴 사람 한 명에게 이유를 묻지 않고 먼저 연락합니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"그러면 끝까지 돌아오지 않는 사람은 어떻게 됩니까?\"라는 질문이 나올 수 있습니다. 오늘 본문이 말하는 것은 찾으시는 분의 마음이며, 그 마음에는 포기가 없다는 데까지 나누어 주십시오. 사람의 선택에 관한 이야기는 제3부에서 다룹니다. 세리와 바리새인을 나쁜 사람과 위선자로 나누어 말하지 않도록 조심해 주십시오. 예수님은 두 부류 모두에게 이 이야기를 들려주셨습니다. '죄인', '회개' 같은 말이 낯설거나 거북한 분이 있으면 '길을 잃은 사람', '마음을 돌이킴'으로 풀어 주시면 됩니다. 이 과로 제2부가 끝납니다. 마치기 전에 제2부에서 가장 마음에 남은 장면 하나씩을 돌아가며 말해 보는 시간을 가지면 좋습니다."}],"inPart":2,"audio":"audio/12.m4a"},{"id":"13","kind":"part","no":null,"part":3,"title":"무엇이 잘못되었을까","sub":null,"key":null,"blocks":[{"t":"p","text":"제2부에서 우리는 하나님이 조건 없이 사랑하시는 분, 기다리시고 찾으시는 아버지라는 이야기를 나누었습니다. 그렇게 좋은 분이라면 세상은 왜 이렇게 아프고, 사람들은 왜 하나님을 무서워하게 되었을까요."},{"t":"p","text":"제3부는 성경의 첫 책 창세기 3장을 천천히 걸어가며 이 물음에 답해 봅니다. 많은 분들이 이 대목을 '죄를 짓고, 벌을 받고, 쫓겨난 이야기'로 알고 있습니다. 그러나 가만히 읽으면 다른 것이 보입니다. 한 마디 질문에서 시작된 오해가 있고, 두려워 숨은 사람을 찾아와 \"네가 어디 있느냐\" 하고 부르시는 목소리가 있고, 손수 지어 입히신 옷이 있습니다."},{"t":"p","text":"이어서 교회 밖에 계신 분들이 가장 불편해하는 두 낱말, '죄'와 '죽음'을 살펴봅니다. 죄는 나쁜 짓의 목록이 아니라 끊어진 생명줄이고, 죽음은 벌이 아니라 그 결과임을 함께 보게 될 것입니다."},{"t":"p","text":"잘못된 것은 하나님의 마음이 아니라 하나님을 바라보는 우리의 눈이었습니다."}],"inPart":3,"audio":"audio/13.m4a"},{"id":"14","kind":"lesson","no":11,"part":null,"title":"오해의 시작","sub":"사람은 언제부터, 왜 하나님을 무서운 분으로 알게 되었을까요","key":{"ref":"창세기 3장 1절","text":"그런데 뱀은 여호와 하나님이 지으신 들짐승 중에 가장 간교하니라 뱀이 여자에게 물어 이르되 하나님이 참으로 너희에게 동산 모든 나무의 열매를 먹지 말라 하시더냐"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"서로 아끼며 잘 지내는 연인이 있다고 해 보겠습니다. 어느 날 한 친구가 다가와 지나가듯 묻습니다. \"그 사람, 정말로 너를 사랑하는 것 맞아?\" 친구는 나쁜 말을 한 마디도 하지 않았습니다. 그저 물었을 뿐입니다. 그런데 그날부터 마음이 달라집니다. 어제까지는 반갑기만 하던 연락이 오늘은 이상하게 읽힙니다. 답장이 조금 늦으면 '역시 그런가' 싶고, 선물을 받아도 '무슨 속셈이 있나' 하고 살피게 됩니다. 상대는 하나도 변하지 않았는데, 내 눈이 변한 것입니다."},{"t":"p","text":"이상구 박사는 성경의 첫 책 창세기 3장에 나오는 뱀의 말을 바로 이런 친구의 화법에 빗대어 설명합니다. 사랑하는 사람을 의심하게 만드는 데에는 큰 거짓말이 필요 없습니다. 질문 하나면 충분합니다."},{"t":"p","text":"우리는 제2부에서 하나님이 조건 없이 사랑하시는 분이라는 이야기를 나누었습니다. 그렇다면 이런 물음이 생깁니다. 그렇게 좋은 분을 사람들은 왜 무서워하게 되었을까요. 그 오해는 어디에서 시작되었을까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"처음 들려주신 말은 \"마음대로 먹어라\"였습니다"},{"t":"p","text":"뱀의 말을 살피기 전에, 하나님이 사람에게 처음 하신 말씀부터 보아야 합니다."},{"t":"verse","ref":"창세기 2장 16절에서 17절","text":"여호와 하나님이 그 사람에게 명하여 이르시되 동산 각종 나무의 열매는 네가 임의로 먹되 선악을 알게 하는 나무의 열매는 먹지 말라 네가 먹는 날에는 반드시 죽으리라 하시니라"},{"t":"p","text":"많은 분들이 이 구절에서 \"먹지 말라\"만 기억합니다. 그런데 박사님은 말씀의 순서에 주목합니다. 하나님은 먼저 \"동산의 모든 나무 열매를 네 마음대로 먹어라\" 하고 선언하셨습니다. '임의로'라는 말은 허락을 받을 필요 없이 자유롭게 먹으라는 뜻입니다. 그다음에야 한 나무에 대해 \"그것만은 먹지 않았으면 좋겠다, 그것은 죽음이다\" 하는 당부가 따라옵니다."},{"t":"p","text":"박사님은 이것을 배낭여행을 떠나는 아들에게 여비를 쥐여 주는 아버지에 빗댑니다. \"어느 나라를 가든 전적으로 네 선택이다. 다만 위험한 그곳만은 가지 않았으면 좋겠다. 그러나 그것도 결국 네가 정할 일이다.\" 이 말을 협박으로 듣는 아들은 없을 것입니다. 낭떠러지 앞에 세워 둔 표지판과 같습니다. 선택할 수 없다면 사랑받는 쪽은 로봇이 될 뿐입니다. 그래서 하나님은 당신이 원하지 않는 선택까지 할 수 있는 자유를 사람에게 주셨습니다. 하나님의 첫 말씀은 금지가 아니라 \"너는 자유다\"였습니다."},{"t":"p","text":"이 자유는 말뿐이 아니었습니다. 창세기 2장을 보면 하나님은 동산을 사람에게 맡겨 돌보게 하시고, 손수 지으신 동물들의 이름까지 사람이 짓게 하셨습니다. 박사님은 아기의 이름은 아버지가 짓는 법인데, 하나님은 당신이 만드신 것들의 이름을 아담에게 맡기셨다고 말합니다. 맡긴다는 것은 믿는다는 것입니다. 성경이 처음 소개하는 하나님은 감시하는 신이 아니라 믿어 주는 아버지입니다."},{"t":"h3","text":"질문 하나로 심은 의심"},{"t":"p","text":"이제 뱀의 말을 다시 읽어 보겠습니다. \"하나님이 참으로 너희에게 동산 모든 나무의 열매를 먹지 말라 하시더냐.\" 하나님은 모든 나무를 마음대로 먹으라고 하셨는데, 뱀은 그것을 정반대로 뒤집어 묻습니다. 정말로 아무것도 못 먹게 하시더냐는 것입니다."},{"t":"p","text":"박사님은 뱀이 주장하지 않고 질문했다는 점을 눈여겨봅니다. 만약 \"하나님은 너희에게 자유를 전혀 주지 않았다\"고 대놓고 말했다면 곧바로 \"아닙니다\" 하고 반박당했을 것입니다. 그러나 질문은 다릅니다. \"하나님은 나쁘다\"는 말을 한 마디도 하지 않으면서, 하나님은 까다로운 분, 무엇이든 일일이 허락을 받아야 하는 분이라는 인상을 슬며시 남깁니다. 성경이 뱀을 '간교하다'고 한 것은 이 화법 때문입니다."},{"t":"p","text":"여기서 중요한 사실 하나가 보입니다. 뱀의 첫 공격은 나쁜 짓을 하라고 부추기는 것이 아니었습니다. 하나님이 어떤 분인지에 대한 인상을 바꾸는 것이었습니다. 넉넉히 주시는 분을 인색한 분으로, 믿고 맡기시는 분을 감시하는 분으로 보이게 한 것입니다."},{"t":"h3","text":"달라진 말, 달라진 마음"},{"t":"p","text":"여자의 대답을 들어 보면 의심이 이미 마음에 스며든 것을 알 수 있습니다."},{"t":"verse","ref":"창세기 3장 2절에서 3절","text":"여자가 뱀에게 말하되 동산 나무의 열매를 우리가 먹을 수 있으나 동산 중앙에 있는 나무의 열매는 하나님의 말씀에 너희는 먹지도 말고 만지지도 말라 너희가 죽을까 하노라 하셨느니라"},{"t":"p","text":"박사님은 하나님의 원래 말씀과 여자의 말을 한 단어씩 나란히 놓고 읽습니다. 먼저 '모든'이 빠졌습니다. '임의로 먹되'는 '먹을 수 있으나'로 바뀌었습니다. 마음대로 먹는 자유가, 허락이 떨어져야 먹는 허가로 낮아진 것입니다. 박사님은 밥을 다 차려 놓고도 \"먹어도 좋다\"는 말이 떨어질 때까지 숟가락을 들지 못하는 군대 식사에 빗댑니다. 또 하나님이 하지 않으신 \"만지지도 말라\"가 덧붙었습니다. \"반드시 죽으리라\"는 \"죽을까 하노라\"로 흐려졌습니다."},{"t":"p","text":"작은 차이 같지만, 이 네 가지가 그리는 하나님은 처음의 하나님과 전혀 다른 분입니다. 자유를 주시는 아버지가 아니라 조건을 걸고 단속하는 주인입니다. 그래서 박사님은 이렇게 정리합니다. 여자는 뱀의 거짓말에 속기 전에 자기가 한 말에 먼저 걸려 넘어졌다고 말입니다. 열매에 손을 대기 전에, 하나님을 향한 믿음이 마음속에서 먼저 무너졌습니다."},{"t":"h3","text":"열매보다 먼저 삼킨 것"},{"t":"p","text":"여자가 넘어온 것을 확인하자 뱀은 더 돌려 말하지 않습니다. \"너희가 결코 죽지 아니하리라.\" 하나님이 거짓말을 하셨다는 뜻입니다. 그리고 덧붙입니다. 그것을 먹으면 하나님처럼 될 터인데, 하나님이 그것을 아시고 막으신 것이라고 말입니다. 하나님을 좋은 것을 혼자 쥐고 내놓지 않는 분으로 그려 낸 것입니다."},{"t":"p","text":"박사님은 이 대목에서 의과대학 시절을 떠올립니다. 해부를 하며 신경과 혈관과 심장을 알아 가고 몸속의 화학 작용을 배우다 보니, 자기가 만들지도 않은 몸을 마치 만든 사람처럼 느끼게 되더라는 것입니다. 많이 알면 하나님처럼 될 수 있다는 유혹은 오늘도 여전합니다. 그러나 아무리 많이 알아도 생명은 사람이 스스로 만들어 낼 수 없습니다."},{"t":"p","text":"여자는 열매를 따 먹었고 곁에 있던 남편도 먹었습니다. 그러나 박사님의 설명대로라면 손이 움직인 것은 이미 일어난 마음의 변화가 밖으로 나온 결과일 뿐입니다. 사람이 열매보다 먼저 삼킨 것은 \"하나님은 조건을 거시는 분, 어기면 벌하시는 분\"이라는 생각이었습니다."},{"t":"p","text":"이 생각은 그날 에덴에서 끝나지 않았습니다. 일이 잘 풀리지 않으면 '내가 뭘 잘못해서 벌을 받나' 하는 마음이 먼저 드는 것, 신이라고 하면 우선 무섭고 눈치가 보이는 것이 우리에게 얼마나 익숙한지 모릅니다. 성경은 그 익숙한 느낌이 하나님에게서 온 것이 아니라 한 마디 질문에서 시작된 오해라고 말해 줍니다. 앞으로 성경이 들려줄 긴 이야기는 이 오해를 푸는 이야기입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님이 사람에게 하신 첫 말씀은 \"하지 마라\"가 아니라 \"마음대로 먹어라\"였습니다. 뱀이 한 일은 그 넉넉한 분을 인색하고 무서운 분으로 보이게 만든 것입니다. 잘못의 시작은 열매를 먹은 손이 아니라 하나님을 오해한 마음이었습니다. 그러므로 회복도 하나님에 대한 오해가 풀리는 데서 시작됩니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가의 말 한마디 때문에 가까운 사람을 괜히 의심했다가, 나중에 오해였음을 알게 된 적이 있습니까?"},{"t":"q","i":1,"text":"둘째, 어릴 때부터 지금까지 '하나님' 또는 '신'이라는 말을 들으면 어떤 느낌이 먼저 떠올랐습니까? 그 느낌은 어디에서 왔을까요?"},{"t":"q","i":2,"text":"셋째, \"마음대로 먹어라\"와 \"허락하면 먹어도 된다\"는 어떻게 다르게 들립니까? 내가 받아 본 사랑은 어느 쪽에 가까웠습니까?"},{"t":"q","i":3,"text":"넷째, 하나님의 첫 말씀이 \"너는 자유다\"였다는 설명을 듣고 어떤 생각이 드십니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한일서 4장 16절","text":"하나님은 사랑이시라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 '벌 받는 것 아닐까', '내가 뭘 잘못했나' 하는 생각이 들 때마다, 그 생각이 어디에서 왔는지 잠시 멈추어 물어봅니다."},{"t":"act","i":1,"text":"창세기 2장 16절에서 17절을 천천히 소리 내어 읽으며 \"임의로 먹되\"에 밑줄을 긋고, 그 말이 나에게 하시는 말이라면 어떻게 들리는지 한 줄 적어 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서는 \"그러면 그 나무는 왜 만드셨습니까\", \"뱀은 누구입니까\" 하는 질문이 자주 나옵니다. 나무에 대해서는 선택할 수 없는 사랑은 사랑이
