게 믿음을 재촉하지 않으시고, 믿어질 때까지 사랑을 보여 주십니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 처음에는 서먹하거나 무서웠는데 시간이 지나며 믿게 된 사람이나 동물이 있습니까? 무엇이 그 마음을 바꾸어 놓았습니까?"},{"t":"q","i":1,"text":"둘째, \"믿어 보려고 애썼지만 잘 안 되었던\" 경험이 있다면 나누어 주십시오. 그때 나는 하나님을 어떤 분으로 알고 있었습니까?"},{"t":"q","i":2,"text":"셋째, \"그런 사랑이 정말 있다면 얼마나 좋을까\" 하고 바랐던 순간이 있었습니까?"},{"t":"q","i":3,"text":"넷째, 이 책을 함께 공부하는 동안 \"이건 정말 사랑이구나\" 하고 마음에 닿았던 장면은 무엇이었습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"히브리서 11장 1절","text":"믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루에 한 번, \"하나님, 당신이 저를 사랑하신다는 것을 알고 싶습니다\" 하고 솔직하게 한 문장으로 말씀드려 봅니다."},{"t":"act","i":1,"text":"이번 주에 누군가에게서 조건 없이 받은 친절을 하나 찾아 수첩에 적어 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"저는 믿음이 없어요\"라고 말하는 분이 있으면 반가운 일로 받아 주십시오. 정직한 고백이기 때문입니다. \"더 믿으셔야죠\"라고 권하지 마시고, \"믿음은 사랑을 알게 되면 생기는 것이니 우리 천천히 같이 알아 가요\"라고 답해 주시면 좋습니다. 반대로 \"나는 의심 없이 믿는다\"고 힘주어 말하는 분이 계셔도 고쳐 주려 하지 마십시오. 이 과의 목적은 믿음의 크기를 재는 것이 아니라 믿음의 출발점을 사랑으로 옮기는 것입니다. 개와 토끼 이야기가 \"하나님이 사람을 동물 취급한다\"는 말로 들리지 않도록, 사랑받을 때 신뢰가 자란다는 점만 짚어 주십시오. 첫 번째 질문에 시간을 넉넉히 쓰면 뒤의 나눔이 쉬워집니다."}],"inPart":6,"audio":"audio/32.m4a"},{"id":"33","kind":"lesson","no":27,"part":null,"title":"값없이 받는 선물","sub":"이렇게 큰 것을 정말 그냥 받아도 됩니까","key":{"ref":"에베소서 2장 8절에서 9절","text":"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 믿음이 사랑을 알게 될 때 저절로 생기는 신뢰라는 것을 배웠습니다. 오늘은 그 믿음으로 받는 것이 무엇인지, 그리고 왜 '받는다'고 말하는지를 살펴봅니다."},{"t":"p","text":"우리는 공짜에 익숙하지 않습니다. 누가 이유 없이 큰 것을 건네면 고맙기보다 먼저 불안해집니다. \"이걸 왜 주지. 나중에 뭘 부탁하려는 걸까.\" 받고 나면 빚진 마음이 들어서 비슷한 값의 것으로 얼른 갚아야 마음이 놓입니다. 이상구 박사는 사람 사이의 선물이 어느새 조건이 붙은 '뇌물'처럼 되어 버렸다고 말합니다. 주는 쪽은 돌아올 것을 셈하고, 받는 쪽은 갚을 것을 셈합니다."},{"t":"p","text":"그래서 하나님의 선물 이야기를 들으면 우리는 저도 모르게 값을 찾습니다. 착하게 살아야 하나, 무엇을 바쳐야 하나, 어디에 열심히 나가야 하나. 박사님은 구원이 공짜이기 때문에 오히려 믿기 어렵다고 하면서, 믿음이란 결국 \"공짜를 공짜로 믿는 것\"이라고 말합니다. 정말 그래도 되는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"은혜, 자격을 묻지 않는 사랑"},{"t":"p","text":"오늘 말씀에는 낯선 말이 몇 개 나옵니다. 먼저 '구원'은 건져 낸다는 뜻입니다. 앞에서 우리는 사람이 생명의 근원이신 하나님에게서 끊어져 시들어 가는 것이 문제의 뿌리라고 배웠습니다. 구원은 그 끊어진 자리에서 건져져 생명에 다시 이어지는 일입니다."},{"t":"p","text":"'은혜'는 교회에서 자주 쓰는 말이지만 뜻은 분명합니다. 박사님은 은혜라는 단어 자체가 \"받을 자격이 없는 사람에게 베푸는 것\"이라는 뜻이며, 그래서 조건 없는 사랑과 같은 말이라고 설명합니다. 자격이 있어서 받는 것은 은혜가 아니라 보수입니다. 성경도 같은 말을 합니다. 일한 사람이 받는 삯은 은혜로 여겨지지 않고 마땅한 보수로 여겨진다는 것입니다(로마서 4장 4절)."},{"t":"p","text":"자격을 잃은 사람에게도 조건 없이 베푸신다는 말이 어떤 분에게는 억울하게 들릴 수 있습니다. 박사님도 그 점을 인정합니다. 그러면서도 그것이 바로 은혜의 본질이라고 말합니다. 하나님은 세상이 사랑스러워서 사랑하신 것이 아니라, 하나님이 사랑이시기 때문에 있는 그대로의 세상을 사랑하셨습니다. 강물에 빠진 딸에게 \"뉘우쳐야 건져 주겠다\"고 조건을 거는 부모는 없습니다. 박사님은 하나님도 그러하시다고 말합니다."},{"t":"h3","text":"백 퍼센트 선물입니다"},{"t":"verse","ref":"로마서 3장 23절에서 24절","text":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니 그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라"},{"t":"p","text":"'속량'은 값을 대신 치르고 되찾아 온다는 뜻입니다. 이 구절에서 눈여겨볼 말은 \"값 없이\"입니다. 값이 없다는 것은 싸구려라는 뜻이 아닙니다. 값을 매길 수 없이 귀한데, 그 값을 주시는 분이 다 치르셨다는 뜻입니다. 우리는 앞의 과들에서 십자가가 바로 그 자리였음을 보았습니다. 예수님은 \"다 이루었다\"고 하셨습니다. 다 이루어진 일에는 보탤 것이 없습니다."},{"t":"p","text":"오늘 말씀이 \"행위에서 난 것이 아니니\"라고 굳이 덧붙이는 까닭이 여기 있습니다. 박사님은 구원이 백 퍼센트 선물이어서 사람의 공로가 조금도 섞이지 않았고, 그래서 하늘나라에서는 아무도 자기 자랑을 할 수 없다고 설명합니다. 만일 구원의 구십 퍼센트가 선물이고 십 퍼센트가 내 몫이라면, 우리는 그 십 퍼센트를 놓고 서로 견주고, 모자랄까 봐 평생 불안해할 것입니다. 전부 선물이기에 견줄 것도 불안할 것도 없습니다."},{"t":"p","text":"박사님은 교회에 많은 것을 바친 공로를 구원의 근거로 삼는다면 그 공로는 많을수록 오히려 해롭다고까지 말합니다. 선물을 값 치른 물건으로 바꾸어 버리기 때문입니다. 하나님께 드리는 헌금이나 봉사도 구원의 조건이 될 수 없습니다. 혼날까 두려워 억지로 드리는 것은 하나님을 더 모르게 만들 뿐이며, 차라리 \"저는 아직 그럴 만한 믿음이 없습니다\" 하고 솔직히 말씀드리는 편이 낫다고 합니다. 그러면 하나님은 \"그러면 내가 너를 더 사랑해 주겠다\"고 하시는 분이라는 것입니다."},{"t":"h3","text":"선물은 받을 때 내 것이 됩니다"},{"t":"p","text":"그러면 사람이 할 일은 아무것도 없습니까. 하나 있습니다. 받는 것입니다. 박사님은 이렇게 비유합니다. 정부가 지원금을 주기로 해도 신청하지 않는 사람이 있듯이, 구원은 이미 모든 사람에게 값없이 주어져 있지만 받는 사람과 받지 않는 사람이 갈릴 뿐이라는 것입니다. 하나님은 선물을 억지로 안기지 않으십니다. 사랑은 상대의 선택을 존중하기 때문입니다."},{"t":"p","text":"받는 것은 공로가 아닙니다. 목마른 사람이 물그릇을 받아 든다고 해서 그 물을 자기가 만들었다고 말하지 않습니다. 믿음은 선물을 받는 빈손입니다. 손이 비어 있을수록 받기 좋습니다."},{"t":"verse","ref":"이사야 55장 1절","text":"오호라 너희 모든 목마른 자들아 물로 나아오라 돈 없는 자도 오라 너희는 와서 사 먹되 돈 없이, 값 없이 와서 포도주와 젖을 사라"},{"t":"p","text":"\"사라\"고 하시면서 \"돈 없이, 값 없이\" 사라고 하십니다. 박사님은 신학 공부로도 채워지지 않던 갈증이 기도하던 중 이 구절을 통해 풀렸다고 고백합니다. 하나님과 사람 사이의 거래는 돈이 아니라 사랑과 믿음으로 이루어진다는 것을 깨달았다는 것입니다. 초대받는 자격은 하나, 목마름입니다."},{"t":"p","text":"성경은 이 '받는 일'을 집에 손님을 맞아들이는 일에 견주어 '영접한다'고도 말합니다. \"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니\"(요한복음 1장 12절). 박사님은 이 구절에서 순서를 짚습니다. 맞아들임이 먼저이고, 자녀가 되는 것이 그다음이며, 달라진 삶은 그 뒤에 따라옵니다. 달라진 다음에야 자격을 얻어 자녀가 되는 것이 아닙니다. 문을 여는 데에는 자격이 필요하지 않습니다."},{"t":"h3","text":"선물이 사람을 바꿉니다"},{"t":"p","text":"이렇게 말하면 걱정하는 분이 계십니다. \"그러면 아무렇게나 살아도 된다는 말입니까.\" 박사님은 순서를 바로잡아 줍니다. 내가 나를 착하게 만들어서 구원을 얻으려는 시도는 결국 벌을 피하려는 위선이 되기 쉽고, 진짜 변화는 먼저 은혜를 받아들인 뒤에 자연스럽게 일어난다는 것입니다. 은혜가 먼저이고 달라진 삶은 그 열매입니다."},{"t":"p","text":"우리 경험도 그렇습니다. 조건을 걸고 사랑하는 사람 앞에서는 잘 보이려고 꾸미게 됩니다. 있는 그대로 받아 주는 사람 앞에서는 꾸밀 필요가 없어지고, 이상하게도 그 사람을 기쁘게 해 주고 싶은 마음이 속에서 올라옵니다. 값없이 받은 사람만이 값없이 줄 수 있습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"은혜는 받을 자격이 없는 사람에게 베푸는 사랑입니다. 구원은 하나님이 값을 다 치르고 건네시는 백 퍼센트 선물이어서 우리가 보탤 것도, 자랑할 것도, 모자랄까 불안해할 것도 없습니다. 우리가 할 일은 빈손으로 받는 것 하나이며, 그 받는 손을 성경은 믿음이라고 부릅니다. 달라진 삶은 선물의 값이 아니라 선물이 맺는 열매입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 지금까지 받은 선물 가운데 가장 기억에 남는 것은 무엇입니까? 그 선물이 특별했던 까닭은 무엇입니까?"},{"t":"q","i":1,"text":"둘째, 누가 아무 이유 없이 잘해 줄 때 나는 편하게 받는 편입니까, 빨리 갚아야 마음이 놓이는 편입니까?"},{"t":"q","i":2,"text":"셋째, 하나님께 사랑받으려면 무언가를 해야 한다고 느껴 왔다면, 그 '무언가'는 무엇이었습니까?"},{"t":"q","i":3,"text":"넷째, 구원이 전부 선물이라는 말을 들을 때 마음에 드는 느낌은 어떻습니까? 반갑습니까, 억울합니까, 믿기지 않습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"에베소서 2장 8절","text":"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 누가 베푸는 호의를 \"괜찮아요\" 하고 사양하지 말고 \"고맙습니다\" 하고 그대로 받아 봅니다."},{"t":"act","i":1,"text":"되돌려받을 생각 없이 작은 것 하나를 누군가에게 건네 봅니다. 주는 쪽의 마음이 어떤지 느껴 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서 가장 자주 나오는 반응은 두 가지입니다. 하나는 \"너무 쉬운 것 아니냐\"이고, 다른 하나는 \"그러면 막 살아도 되느냐\"입니다. 앞의 물음에는, 받는 쪽에는 쉽지만 주시는 쪽에서는 십자가만큼 값비싼 선물이었음을 상기시켜 주십시오. 뒤의 물음에는 논쟁하지 마시고, 조건 없이 사랑받아 본 경험이 자신을 어떻게 바꾸었는지 서로 나누게 하십시오. 성실하게 살아온 분이 억울함을 말하면 그 마음을 그대로 인정해 주십시오. 박사님도 그 억울함을 인정했습니다. 헌금이나 봉사 이야기가 나오더라도 특정 교회를 비판하는 쪽으로 흐르지 않게 하시고, \"두려움이 아니라 고마움에서 나올 때 기쁨이 된다\"는 데서 멈추십시오."}],"inPart":6,"audio":"audio/33.m4a"},{"id":"34","kind":"lesson","no":28,"part":null,"title":"다시 태어난다는 것","sub":"이 나이에, 이 모습으로도 새로 시작할 수 있을까요","key":{"ref":"요한복음 3장 3절","text":"예수께서 대답하여 이르시되 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님의 나라를 볼 수 없느니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 구원이 값없이 받는 선물임을 보았습니다. 그 선물을 받은 사람에게 일어나는 일을 성경은 '거듭난다', 곧 다시 태어난다고 표현합니다. 오늘은 이 말을 풀어 봅니다."},{"t":"p","text":"살다 보면 \"다시 태어나고 싶다\"는 말이 저절로 나올 때가 있습니다. 돌이킬 수 없는 말을 해 버린 날, 같은 실수를 또 저지른 날, 거울 속 얼굴이 낯설게 지쳐 보이는 날입니다. 새해마다 결심을 하고 사흘을 넘기지 못하는 자신을 보면서 우리는 압니다. 고쳐 쓰는 것으로는 안 되는 무언가가 내 안에 있다는 것을 말입니다."},{"t":"p","text":"그런데 교회에서 \"거듭나셨습니까\" 하는 물음을 받으면 당황스럽습니다. 무슨 뜻인지부터 모르겠습니다. 이상구 박사도 그랬다고 합니다. 처음 신앙생활을 시작했을 때 거듭난다는 말이 너무 막연하고 이상하게 느껴졌고, 오랫동안 여러 어른께 물어도 시원한 답을 듣지 못했다고 회고합니다. 이 말을 처음 들은 사람도 마찬가지였습니다. 어느 밤, 예수님을 찾아온 나이 지긋한 한 사람의 이야기입니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"밤에 찾아온 사람"},{"t":"p","text":"그의 이름은 니고데모입니다. 성경은 그를 바리새인이요 유대인의 지도자라고 소개합니다. 바리새인은 하나님의 법을 누구보다 철저히 지키려고 애쓰던 사람들입니다. 박사님의 표현으로는 종교심이 가장 강한 사람들이었습니다. 오늘로 치면 평생 흠 없이 살아왔고 모두에게 존경받는 어른입니다."},{"t":"p","text":"그런 그가 밤에 왔습니다. 박사님은 그 까닭을 이렇게 설명합니다. 동료 바리새인들은 자기들과 다르게 가르치는 예수님을 미워했고, 존경받는 지도자였던 니고데모는 남의 눈을 피해야 했습니다. 그래도 그는 왔습니다. 병든 사람을 고치시고 사람들을 대하시는 예수님의 모습에서 범상치 않은 무엇을 보았기 때문입니다. 박사님은 이 밤의 걸음 자체가 그의 마음속에서 일하신 하나님의 음성에 대한 반응이었다고 봅니다."},{"t":"p","text":"모든 것을 갖춘 사람이 밤에 몰래 누군가를 찾아간다면, 그에게는 채워지지 않은 것이 있는 것입니다. 열심히 지켰는데도 마음은 자유롭지 않았을 것입니다. 예수님은 밤에 온 그를 나무라지 않으시고 맞아 주셨습니다. 그리고 곧바로 핵심을 말씀하십니다. 사람이 거듭나지 않으면 하나님의 나라를 볼 수 없다고 말입니다."},{"t":"h3","text":"태어나는 일은 아기가 하는 일이 아닙니다"},{"t":"p","text":"니고데모는 알아듣지 못했습니다. \"사람이 늙으면 어떻게 날 수 있사옵나이까 두 번째 모태에 들어갔다가 날 수 있사옵나이까\"(요한복음 3장 4절). 엉뚱한 대답 같지만, 그는 자기가 아는 방식대로 물은 것입니다. 그는 평생 '내가 무엇을 해야 하는가'를 묻고 살아온 사람이었습니다. 그래서 다시 태어나라는 말도 '내가 어떻게 해내야 하는가'로 들었습니다."},{"t":"p","text":"그런데 예수님이 고르신 말은 '태어남'입니다. 태어나는 일에서 아기가 하는 일은 없습니다. 낳는 것은 어머니의 일이고, 아기는 태어날 뿐입니다. 성경은 하나님의 자녀가 된 사람들을 두고 혈통이나 사람의 뜻으로 난 것이 아니라 \"오직 하나님께로부터 난 자들\"이라고 말합니다(요한복음 1장 13절). 박사님은 이 구절이 하나님의 자녀가 되는 일이 사람의 노력에서 나오지 않고 전적으로 하나님의 은혜에서 비롯됨을 말해 준다고 설명합니다."},{"t":"p","text":"그러니 \"거듭나라\"는 말씀은 이룰 수 없는 숙제가 아닙니다. 박사님은 예수님의 이 말씀을 초청으로 읽습니다. 지금까지 네가 쌓은 것으로는 안 된다, 그러니 내가 너를 새로 낳아 주겠다는 초청입니다. 평생 쌓아 올린 종교적 성취가 아무것도 아니라는 말은 니고데모에게 아팠을 것입니다. 그러나 그 자리가 비워져야 선물이 들어올 틈이 생깁니다."},{"t":"h3","text":"거듭남, 하나님이 달리 보이는 것"},{"t":"p","text":"그러면 거듭남은 구체적으로 무엇입니까. 많은 분이 눈물이 쏟아지거나 가슴이 뜨거워지는 신비한 체험으로만 생각합니다. 박사님은 오랜 물음 끝에 얻은 자신의 답을 이렇게 내놓습니다. 거듭남이란 \"조건적인 하나님만 알다가 무조건적인 하나님의 사랑을 알게 되는 것\"입니다."},{"t":"p","text":"니고데모가 알던 하나님은 잘 지키면 받아 주시고 못 지키면 내치시는 분이었습니다. 그런 하나님 앞에서 사람은 평생 성적표를 들고 선 학생처럼 삽니다. 그런데 어느 날, 하나님은 성적과 상관없이 나를 사랑하시는 아버지라는 것을 알게 됩니다. 그 순간 세상이 달리 보입니다. 예수님은 거듭나야 하나님 나라를 '볼' 수 있다고 하셨습니다. 하나님 나라가 멀리서 새로 오는 것이 아니라, 내 눈이 새로 떠지는 것입니다."},{"t":"p","text":"이것은 앞의 두 과에서 배운 것과 하나로 이어집니다. 사랑을 알게 되면 믿음이 생기고, 그 믿음으로 선물을 받으며, 그렇게 받은 사람은 하나님의 자녀로 새로 태어납니다. 자녀는 품삯을 받으려고 일하는 일꾼과 다릅니다. 태어났기 때문에 이미 그 집 식구입니다."},{"t":"h3","text":"바람처럼 오는 새 마음"},{"t":"verse","ref":"요한복음 3장 8절","text":"바람이 임의로 불매 네가 그 소리는 들어도 어디서 와서 어디로 가는지 알지 못하나니 성령으로 난 사람도 다 그러하니라"},{"t":"p","text":"성령은 우리 마음에 찾아와 일하시는 하나님을 가리키는 말입니다. 박사님은 성경의 원어에서 성령을 뜻하는 말이 본래 '바람', '숨'이라는 뜻이라고 알려 줍니다. 바람은 보이지 않지만 나뭇잎이 흔들리는 것을 보고 바람이 지나갔음을 압니다. 새로 태어남도 그렇습니다. 언제 어떻게 시작되었는지 꼭 집어 말하지 못해도, 무섭기만 하던 하나님이 어느새 그리운 분이 되어 있다면 바람은 이미 분 것입니다."},{"t":"p","text":"하나님은 오래전부터 이 일을 약속하셨습니다."},{"t":"verse","ref":"에스겔 36장 26절","text":"또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며"},{"t":"p","text":"박사님은 '굳은 마음'을 벌이 무서워 의무감으로 움직이는 마음으로, '부드러운 마음'을 조건 없는 사랑을 받아들여 스스로 우러나는 마음으로 풉니다. 굳은 마음을 부드러운 마음으로 바꾸는 이 수술을 맡으신 분도 하나님이십니다. 다만 박사님은 정직하게 덧붙입니다. 새로 태어났다고 해서 옛 성질이 단번에 사라지지는 않는다는 것입니다. 갓 태어난 아기가 걷지 못한다고 자식이 아닌 것은 아닙니다. 넘어지는 날에도 우리는 여전히 자녀입니다."},{"t":"p","text":"성경은 니고데모의 뒷이야기를 전합니다. 예수님이 십자가에서 숨을 거두신 날, 제자들마저 흩어진 그때, 그는 값진 향품을 들고 나와 예수님의 장례를 치렀습니다(요한복음 19장 39절). 밤에 숨어서 왔던 사람이 환한 데로 걸어 나왔습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"다시 태어난다는 것은 내가 나를 뜯어고치는 일이 아니라, 하나님이 나를 새로 낳아 주시는 일입니다. 조건을 따지는 분으로만 알던 하나님이 조건 없이 사랑하시는 아버지로 보이기 시작할 때, 사람은 새 눈을 뜹니다. 태어나는 데 아기의 공로가 없듯이 거듭남도 선물입니다. 그리고 하나님은 나이도, 지나온 세월도 묻지 않으시고 누구에게나 이 새로운 시작을 주십니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, \"다시 태어난다면\" 하고 생각해 본 적이 있습니까? 무엇을 새로 시작하고 싶었습니까?"},{"t":"q","i":1,"text":"둘째, 결심으로 나를 바꾸어 보려다 잘 안 되었던 경험이 있다면 나누어 주십시오."},{"t":"q","i":2,"text":"셋째, 니고데모처럼 겉으로는 괜찮아 보이지만 속으로는 채워지지 않았던 때가 있었습니까?"},{"t":"q","i":3,"text":"넷째, 어릴 때부터 지금까지 내가 떠올려 온 하나님의 모습은 어떻게 달라져 왔습니까? 요즘 새로 보이기 시작한 것이 있습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"에스겔 36장 26절","text":"또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아침에 눈을 뜨면 \"오늘도 저는 하나님의 자녀로 하루를 시작합니다\" 하고 조용히 말해 봅니다."},{"t":"act","i":1,"text":"요한복음 3장 1절부터 17절까지를 천천히 소리 내어 읽고, 마음에 남는 한 구절에 밑줄을 긋습니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"저는 그런 체험이 없는데 거듭나지 못한 것입니까\" 하고 불안해하는 분이 있을 수 있습니다. 이 과는 거듭남을 특별한 감정 체험이 아니라 하나님을 보는 눈이 바뀌는 일로 설명합니다. 뜨거운 체험이 있는 분의 경험을 낮추지도 마시고, 없는 분을 모자란 사람으로 만들지도 마십시오. \"언제 거듭났느냐\"를 서로 캐묻는 분위기는 피해 주십시오. 또 \"거듭났는데 왜 나는 여전히 화를 냅니까\" 하는 물음에는, 아기가 태어난 것과 다 자란 것은 다른 일이며 넘어지는 날에도 자녀라는 사실은 바뀌지 않는다고 답해 주시면 됩니다. 연세 드신 분께는 니고데모도 \"사람이 늙으면\" 하고 물었던 사람임을 짚어 드리면 격려가 됩니다."}],"inPart":6,"audio":"audio/34.m4a"},{"id":"35","kind":"lesson","no":29,"part":null,"title":"명령이 아니라 약속입니다","sub":"십계명은 지키지 못하면 벌 받는 법이 아닙니까","key":{"ref":"출애굽기 20장 1절에서 2절","text":"하나님이 이 모든 말씀으로 말씀하여 이르시되 나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 네 하나님 여호와니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 새 마음을 주시는 분이 하나님이심을 보았습니다. 그런데 성경을 펴면 \"하라\", \"하지 말라\"는 말이 참 많습니다. 선물이라더니 결국 지킬 것이 이렇게 많은가 하고 마음이 무거워지는 분도 계실 것입니다. 오늘은 그 가운데 가장 널리 알려진 십계명을 함께 읽어 봅니다."},{"t":"p","text":"이상구 박사가 자주 드는 장면이 있습니다. 엄마가 갓난아기를 안고 \"자, 젖 먹어라\" 하고 말합니다. 글자로만 보면 명령입니다. 그러나 이 말을 듣고 아기가 제 힘으로 젖을 구해 와야 한다고 생각하는 사람은 없습니다. 아기는 아무것도 할 수 없습니다. \"젖 먹어라\"는 말은 실은 \"내가 너에게 젖을 먹여 주겠다\"는 엄마의 약속입니다."},{"t":"p","text":"같은 문장도 누가, 누구에게, 어떤 마음으로 하느냐에 따라 뜻이 달라집니다. 군대의 상관이 하는 말과 엄마가 아기에게 하는 말은 글자가 같아도 같은 말이 아닙니다. 그렇다면 십계명은 누가 누구에게 어떤 마음으로 하신 말씀일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"먼저 건져 내시고, 그다음에 말씀하셨습니다"},{"t":"p","text":"십계명은 \"하지 말라\"로 시작하지 않습니다. 오늘의 중심 말씀으로 시작합니다. \"나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 네 하나님 여호와니라.\" 애굽은 오늘의 이집트입니다. 이스라엘 백성은 그곳에서 오랜 세월 노예로 살았고, 하나님이 그들을 거기서 이끌어 내셨습니다. 박사님은 십계명을 읽을 때 반드시 이 서문부터 읽어야 한다고 강조합니다. 하나님이 계명을 주시기 전에 당신이 누구이신지부터 소개하신다는 점이 전체의 열쇠라는 것입니다."},{"t":"p","text":"핵심은 순서입니다. 하나님은 \"이 열 가지를 잘 지키면 노예살이에서 건져 주겠다\"고 하지 않으셨습니다. 아무 조건 없이 먼저 건져 내시고, 그다음에 말씀하셨습니다. 박사님은 그 백성이 착해서도, 하나님을 잘 섬겨서도 아니었다고 설명합니다. 이유는 하나, 내 백성이고 내 자식들이라는 것뿐이었습니다."},{"t":"p","text":"그러니 십계명은 구원받기 위한 조건일 수 없습니다. 이미 건짐받은 사람들에게 하신 말씀입니다. 앞의 과에서 배운 것과 같은 순서입니다. 선물이 먼저이고, 달라진 삶은 그 뒤에 옵니다."},{"t":"h3","text":"열 가지 '말씀'"},{"t":"p","text":"박사님은 원어 이야기도 들려줍니다. 구약성경이 쓰인 히브리어로 십계명은 '열 가지 말씀'이라는 뜻의 이름으로 불리며, '열 가지 명령'이 아니라고 합니다. 히브리어에는 명령을 뜻하는 낱말이 따로 있는데, 십계명 본문에는 그 낱말이 아니라 '말씀'을 뜻하는 낱말이 쓰였다는 것입니다. 그 돌판을 넣어 둔 상자도 흔히 '법궤'라고 부르지만 본래는 '언약궤', 곧 약속의 궤라고 박사님은 짚어 줍니다."},{"t":"p","text":"영화에 나오는 번개 치는 산과 무서운 음성의 장면 때문에 십계명은 오랫동안 \"어기면 벌하겠다\"는 경고로 여겨져 왔습니다. 그러나 말씀하시는 분이 누구인지를 기억하면 달리 들립니다. 방금 자식을 노예살이에서 건져 낸 아버지가 하시는 말씀입니다. 아기에게 젖을 물리는 엄마의 말과 같은 자리에 있습니다."},{"t":"p","text":"그래서 박사님은 십계명의 조항을 하나씩 약속의 문장으로 옮겨 읽습니다. \"살인하지 말라\"는 \"내가 너를 살인하지 않는 사람으로 만들어 주겠다\"입니다. \"도둑질하지 말라\"는 \"내가 너를 도둑질하지 않는 정직한 사람으로 만들어 주겠다\"입니다. 그렇게 옮긴 문장들을 하나로 묶으면 결국 \"내가 너를 죄로부터 구원해 주겠다\"는 한 문장이 된다고 합니다."},{"t":"p","text":"첫째 말씀 \"너는 나 외에는 다른 신들을 네게 두지 말라\"도 그렇게 읽습니다. 박사님은 이것을 하나님의 독점욕으로 읽지 않습니다. 박사님은 성경이 말하는 '다른 신들'의 특징을 조건에서 찾습니다. 복을 주는 대가로 무언가를 바치라고 요구한다는 것입니다. 조건 없이 먼저 건져 내신 분은 한 분뿐입니다. 그러니 이 말씀은 조건을 거는 신들에게 가서 두려움에 시달리지 말라는 아버지의 당부라는 것입니다."},{"t":"h3","text":"왜 약속이어야만 합니까"},{"t":"p","text":"\"살인하지 말라, 도둑질하지 말라 정도는 나도 지키고 삽니다\" 하고 말할 수 있습니다. 박사님은 옛 이스라엘 백성도 그렇게 여겼다고 말합니다. 그런데 예수님은 이 계명의 속뜻을 열어 보이셨습니다. 형제에게 노하는 것이 이미 살인과 같은 뿌리라는 것입니다(마태복음 5장 21절에서 22절). 박사님은 이렇게 묻습니다. 내 자식을 해친 원수를 미워하지 않을 수 있는 사람이 있습니까. 실제로 칼을 들지 않았어도 죽이고 싶은 마음이 있으면 그 마음이 먼저 자기를 상하게 합니다."},{"t":"p","text":"열 번째 말씀 \"탐내지 말라\"에 이르면 더 분명해집니다. 박사님은 앞의 계명들이 행동을 다룬다면 이 계명은 마음을 겨냥한다고 설명합니다. 좋은 것을 보면 갖고 싶어지는 마음은 누르려 해도 눌러지지 않습니다. 계명이 마음속까지 들어오면, 정직한 사람은 \"나는 지킬 수 없구나\" 하고 고백하게 됩니다."},{"t":"p","text":"여기서 길이 갈립니다. 이 말씀이 명령이라면 우리에게는 절망만 남습니다. 박사님은 명령이란 본래 할 수 있는 것을 시키는 것인데, 할 수 없는 것을 말씀하셨다면 그것은 명령이 아니라 약속으로 받아야 한다고 말합니다. 명령으로 읽으면 이룰 책임이 나에게 있고, 약속으로 읽으면 이룰 책임이 하나님께 있습니다."},{"t":"h3","text":"\"완전하라\"는 말씀도 그렇습니다"},{"t":"p","text":"성경에는 이보다 더 무겁게 들리는 말씀도 있습니다."},{"t":"verse","ref":"창세기 17장 1절","text":"아브람이 구십구 세 때에 여호와께서 아브람에게 나타나서 그에게 이르시되 나는 전능한 하나님이라 너는 내 앞에서 행하여 완전하라"},{"t":"p","text":"아흔아홉 살 노인에게 \"완전하라\"고 하십니다. 그런데 이 말씀 앞에 무엇이 놓여 있는지 보십시오. \"나는 전능한 하나님이라.\" 박사님은 전능하다는 말을 \"못할 것이 없다\"는 뜻으로 풀고, 이 선언이 뒤따르는 말씀의 근거라고 설명합니다. 그때 아브람과 아내는 사람의 힘으로는 자식을 가질 수 없는 나이였습니다. 아무것도 할 수 없는 사람에게 하신 \"완전하라\"는 말씀은, 못할 것이 없는 내가 너를 그렇게 만들어 주겠다는 약속입니다. 박사님은 여기서도 엄마와 아기의 비유를 듭니다."},{"t":"p","text":"하나님은 이 약속을 어떻게 이루십니까. 지난 과에서 읽은 에스겔서의 말씀이 이어서 답합니다. 하나님은 당신의 영을 우리 속에 두어 당신의 길을 걷게 하겠다고 하십니다(에스겔 36장 27절). 걷는 힘까지 하나님이 대십니다. 박사님은 십계명 전체를 한마디로 줄이면 '서로 사랑하라'이며, 하나님이 우리 마음에 조건 없는 사랑을 부어 주셔서 이루시겠다는 약속이라고 정리합니다. 사랑받은 사람이 사랑하게 됩니다. 계명은 우리가 오를 사다리가 아니라, 하나님이 우리를 데려가실 곳을 그려 보이신 그림입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"십계명의 첫마디는 \"하지 말라\"가 아니라 \"나는 너를 이미 건져 낸 네 하나님이다\"입니다. 구원이 먼저 있었고 말씀은 그 뒤에 왔습니다. 그러므로 열 가지 말씀은 \"지키면 사랑해 주겠다\"는 조건이 아니라 \"내가 너를 이런 사람으로 만들어 주겠다\"는 약속입니다. 명령으로 읽으면 짐이 되지만, 약속으로 읽으면 같은 말씀이 기다림과 소망이 됩니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 적 부모님이나 어른에게 자주 듣던 \"하지 마라\"는 말이 있었습니까? 지금 돌아보면 그 말은 어떤 마음에서 나온 것이었습니까?"},{"t":"q","i":1,"text":"둘째, 십계명이나 종교의 규칙들을 떠올리면 어떤 느낌이 먼저 듭니까?"},{"t":"q","i":2,"text":"셋째, 하지 않으려고 애써도 마음에서 자꾸 올라오는 것(미움, 부러움, 걱정 등)이 있습니까? 그것과 씨름해 본 경험을 나누어 주십시오."},{"t":"q","i":3,"text":"넷째, \"내가 너를 그런 사람으로 만들어 주겠다\"는 약속으로 듣는다면, 열 가지 말씀 가운데 지금 나에게 가장 반가운 약속은 무엇입니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"창세기 17장 1절","text":"나는 전능한 하나님이라 너는 내 앞에서 행하여 완전하라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"출애굽기 20장 1에서 17절을 읽으며 \"하지 말라\"를 \"내가 너를 ~하지 않는 사람으로 만들어 주겠다\"로 바꾸어 소리 내어 읽어 봅니다."},{"t":"act","i":1,"text":"이번 주에 미운 마음이 올라올 때 그 마음을 누르려 애쓰는 대신 \"하나님, 약속하신 대로 제 마음을 바꾸어 주십시오\" 하고 말씀드려 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"그러면 계명은 안 지켜도 된다는 말입니까\"라는 질문이 거의 반드시 나옵니다. 박사님도 이 오해를 경계합니다. 약속으로 받는다는 것은 계명을 가볍게 여기는 것이 아니라, 그 말씀이 내 안에서 이루어지기를 오히려 더 굳게 붙드는 것이라고 답해 주십시오. \"지켜야 한다\"와 \"이루어 주신다\" 가운데 어느 쪽이 실제로 사람을 바꾸었는지 각자의 경험을 나누게 하면 좋습니다. 히브리어 설명은 길게 하지 마시고 '열 가지 말씀'이라는 이름 하나만 기억하게 하십시오. 엄격한 종교 교육 속에서 상처받은 분이 있다면 충분히 말하도록 들어 주시되, 부모나 특정 교회를 탓하는 자리가 되지 않게 이끌어 주십시오."}],"inPart":6,"audio":"audio/35.m4a"},{"id":"36","kind":"lesson","no":30,"part":null,"title":"\"너는 내 것이라\"","sub":"내가 정말 받아들여졌다는 것을 어떻게 알 수 있을까요","key":{"ref":"이사야 43장 1절","text":"너는 두려워하지 말라 내가 너를 구속하였고 내가 너를 지명하여 불렀나니 너는 내 것이라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 성경의 \"하라\"는 말씀들이 짐이 아니라 약속이라는 것을 배웠습니다. 믿음, 선물, 새로 태어남, 약속. 여기까지 함께 걸어온 분의 마음에 마지막으로 남는 물음이 있습니다. \"그런데 저는 정말 괜찮은 걸까요. 이런 저도 받아들여진 게 맞습니까.\""},{"t":"p","text":"제21과에서 잠깐 들은 이상구 박사의 어릴 적 토끼 이야기에는 뒷이야기가 있습니다. 뒷마당에서 토끼 새끼 한 마리가 고양이에게 잡힐 뻔한 것을 구해 주었다고 합니다. 토끼가 무엇을 잘해 주어서가 아니었습니다. 그저 사랑했기에 구했습니다. 그런데 구해 준 뒤에도 토끼는 주인을 무서워했습니다. 이미 안전해졌는데도 여전히 떨면서 위험한 곳을 맴돌았습니다."},{"t":"p","text":"박사님은 사람도 그렇다고 말합니다. 이미 건짐받은 줄 모른 채 두려워하며 산다는 것입니다. 토끼에게 모자란 것은 안전이 아니었습니다. 안전하다는 사실을 아는 것이 모자랐습니다. 오늘은 제6부의 마지막 시간으로, 내가 받아들여졌다는 사실을 무엇에 기대어 알 수 있는지를 살펴봅니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"내가 아는 것보다, 나를 아시는 것"},{"t":"p","text":"우리는 확신을 내 안에서 찾으려 합니다. 내 믿음이 충분히 뜨거운지, 요즘 내 마음이 평안한지, 지난주에 얼마나 잘 살았는지를 살핍니다. 그런데 마음은 날씨와 같아서 맑은 날도 있고 흐린 날도 있습니다. 내 마음 상태에 기대는 확신은 흐린 날마다 무너집니다."},{"t":"p","text":"오늘 말씀은 확신의 자리를 옮겨 놓습니다. 이 구절의 주어는 처음부터 끝까지 하나님이십니다. 내가 너를 구속하였고, 내가 너를 지명하여 불렀고, 너는 내 것이라고 하십니다. '구속'은 값을 치르고 되찾아 온다는 뜻이고, '지명하여 불렀다'는 것은 이름을 불렀다는 뜻입니다. 하나님은 나를 여럿 가운데 하나로 아시는 것이 아니라 이름으로 아십니다. 예수님도 당신을 목자에, 우리를 양에 견주시며 목자는 자기 양을 알고 양은 그 음성을 안다고 하셨고, 아무도 그 양을 당신의 손에서 빼앗지 못한다고 하셨습니다(요한복음 10장 27절에서 29절)."},{"t":"p","text":"박사님은 이 구절의 \"두려워하지 말라\"를 \"내가 조건적일까 봐 두려워하지 말라\"는 뜻으로 읽습니다. 그리고 이렇게 견줍니다. 복권 당첨 발표는 사람이 하는 일이라 착오가 있을 수 있지만, 하나님이 \"너는 내 것\"이라고 하신 선언은 결코 취소되지 않는 사실이라는 것입니다. 구속이라는 말은 값이 이미 다 치러졌다는 뜻입니다. 확신은 내가 하나님을 얼마나 꽉 붙들고 있느냐가 아니라, 하나님이 나를 붙들고 계시다는 데에 놓입니다."},{"t":"h3","text":"마음이 나를 고발할 때"},{"t":"p","text":"그래도 마음 한쪽에서 소리가 들립니다. \"네가 한 일을 생각해 봐라. 너 같은 사람이 무슨 자격으로.\" 성경은 이 소리에 대해 분명히 말합니다."},{"t":"verse","ref":"로마서 8장 1절","text":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니"},{"t":"p","text":"'정죄'는 죄가 있다고 판결하는 것입니다. 이 구절을 쓴 바울은 바로 앞 장에서, 하고 싶은 선은 하지 못하고 하기 싫은 악을 행하고 마는 자기 속을 털어놓았습니다. 그 탄식 바로 다음에 나온 말이 이것입니다. 박사님은 여기서 이유를 분명히 가려 줍니다. 정죄가 없는 것은 우리가 죄를 짓지 않아서가 아닙니다. 예수님이 십자가에서 그 정죄를 이미 다 받으셨기 때문입니다. 그래서 \"여전히 넘어지는 나\"와 \"정죄가 없다\"는 말이 함께 설 수 있습니다."},{"t":"p","text":"박사님은 또 하나를 가려 줍니다. \"그리스도 예수 안에\" 있느냐를 가르는 것은 행실이 착하냐 나쁘냐가 아니라, 하나님을 조건 없이 사랑하시는 분으로 믿느냐는 것입니다. 그리고 \"네가 정말 구원받았다고 생각하느냐\" 하고 몰아세우는 소리와, 하나님이 마음에 들려주시는 음성을 구별해야 한다고 가르칩니다. 하나님의 음성은 잘못을 알려 주실 때에도 품으로 부르시는 소리입니다. 너는 끝났다고 밀어내는 소리는 하나님에게서 온 것이 아닙니다. 박사님은 그런 고발을 이미 다 갚은 빚을 다시 청구하는 일에 견줍니다. 청산된 빚의 청구서는 받을 까닭이 없습니다."},{"t":"h3","text":"종이 아니라 자녀입니다"},{"t":"verse","ref":"로마서 8장 15절에서 16절","text":"너희는 다시 무서워하는 종의 영을 받지 아니하고 양자의 영을 받았으므로 우리가 아빠 아버지라고 부르짖느니라 성령이 친히 우리의 영과 더불어 우리가 하나님의 자녀인 것을 증언하시나니"},{"t":"p","text":"박사님은 종과 아들의 차이를 이렇게 설명합니다. 종은 잘하면 상을 받고 못하면 벌을 받는 것으로 주인과의 관계가 정해집니다. 그래서 늘 무섭습니다. 아들은 다릅니다. 잘하든 못하든 아들이고, 그 집을 물려받을 사람입니다. 박사님은 이 자녀 됨이 앞으로 그렇게 될 수도 있다는 가능성이 아니라 지금 이미 확정된 사실이라고 강조합니다."},{"t":"p","text":"'아빠'는 당시 아이들이 집에서 아버지를 부르던 말입니다. 아이는 자격이 있어서 아빠를 부르는 것이 아닙니다. 박사님은 기도할 때마다 위엄 있는 호칭으로만 하나님을 부르는 것과, 하나님이 우리로 \"아빠 아버지\"라 부르게 하시는 것 사이의 거리를 짚어 줍니다. 그리고 이 확신은 내가 다짐해서 만드는 것이 아니라, 성령 곧 우리 안에 오신 하나님이 마음 깊은 곳에서 \"너는 내 자녀다\" 하고 일러 주실 때 아는 것이라고 말합니다."},{"t":"h3","text":"손에 쥔 카드 한 장"},{"t":"p","text":"박사님은 1970년대에 미국으로 건너가던 때를 이야기합니다. 가진 것은 영주권 카드 한 장이었습니다. 그 카드 한 장을 손에 쥔 것만으로 하와이를 거쳐 미국 땅을 밟을 수 있었다고 합니다. 문을 열어 준 것은 그의 형편이나 실력이 아니라 이미 주어진 신분이었습니다. 박사님은 예수님이 십자가에서 이미 우리를 하늘의 시민으로 삼아 주셨음을 믿는 믿음이 그 카드와 같다고 말합니다. 오늘 기분이 가라앉아 있어도, 내세울 종교적 실적이 없어도, 신분은 흔들리지 않습니다."},{"t":"p","text":"성경은 또 이렇게 약속합니다. \"너희 안에서 착한 일을 시작하신 이가 그리스도 예수의 날까지 이루실 줄을 우리는 확신하노라\"(빌립보서 1장 6절). 박사님은 하나님이 사람의 됨됨이를 낱낱이 조사해서 완벽해야 받아 주시는 분이 아니라, 당신이 시작하신 일을 끝까지 이루시는 분이라고 설명합니다. 바울은 로마서 8장을 맺으며 죽음도 삶도, 지금 일도 장래 일도, 그 어떤 것도 하나님의 사랑에서 우리를 끊을 수 없다고 확신한다고 적었습니다(로마서 8장 38절에서 39절). 끊을 수 있는 것들의 목록에 '나의 부족함'은 들어 있지 않습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"확신은 내 마음의 온도에서 나오지 않고, \"너는 내 것이라\" 하신 하나님의 말씀에서 나옵니다. 값은 이미 치러졌고, 정죄는 예수님이 이미 받으셨으며, 우리는 종이 아니라 자녀로 불렸습니다. 구해 준 주인 앞에서 아직 떨고 있는 토끼에게 필요한 것은 더 잘하려는 노력이 아니라, 이미 안전하다는 사실을 아는 것입니다. 하나님은 시작하신 일을 끝까지 이루시는 분입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 적 누군가 내 이름을 다정하게 불러 주던 기억이 있습니까? 그때 마음이 어땠습니까?"},{"t":"q","i":1,"text":"둘째, 이미 괜찮은데도 불안해서 자꾸 확인했던 경험이 있습니까? (잠근 문을 다시 확인하는 일처럼 작은 것도 좋습니다.)"},{"t":"q","i":2,"text":"셋째, 마음속에서 나를 몰아세우는 소리가 들릴 때 나는 보통 어떻게 합니까? 오늘 배운 것에 비추어 그 소리에 무엇이라 답할 수 있겠습니까?"},{"t":"q","i":3,"text":"넷째, 하나님을 \"아빠\"라고 불러 본다면 어떤 느낌이 들 것 같습니까? 어색하다면 무엇 때문일까요?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"로마서 8장 1절","text":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이사야 43장 1절의 \"너\" 자리에 내 이름을 넣어 하루에 한 번 소리 내어 읽습니다."},{"t":"act","i":1,"text":"자책하는 생각이 들 때 그 생각을 붙들고 씨름하지 말고, \"값은 이미 치러졌습니다\" 하고 한마디로 답해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서는 \"확신을 가지라\"는 말이 또 하나의 짐이 되지 않게 하는 것이 중요합니다. 확신이 없다고 말하는 분에게 확신을 재촉하지 마시고, 확신의 근거가 내 느낌이 아니라 하나님의 말씀과 십자가에 있음을 거듭 짚어 주십시오. \"그러면 한번 믿으면 마음대로 살아도 됩니까\"라는 물음에는 제27과의 답을 떠올리게 하십시오. 사랑 안에서 안전해진 사람이 오히려 달라집니다. 아버지에게 상처가 있어 '아버지'라는 말이 힘든 분이 계실 수 있습니다. 그럴 때는 호칭을 권하지 마시고, 그분의 이야기를 들어 주며 하나님은 우리가 만난 어떤 아버지와도 다른 분이심을 조용히 말씀해 주십시오. 제6부를 마치는 자리이니, 26과부터 걸어온 길을 한 문장씩 돌아보게 하는 것도 좋습니다."}],"inPart":6,"audio":"audio/36.m4a"},{"id":"37","kind":"part","no":null,"part":7,"title":"사랑 안에서 사는 하루","sub":null,"key":null,"blocks":[{"t":"p","text":"지금까지 우리는 긴 길을 걸어왔습니다. 몸이 들려주는 이야기에서 출발하여 예수님의 얼굴과 십자가에서 하나님의 사랑을 확인했고, 제6부에서는 그 사랑을 선물로 받는 손, 곧 믿음을 배웠습니다."},{"t":"p","text":"이제 물음이 하나 남습니다. 그래서 내일 아침은 무엇이 달라지는가 하는 것입니다. 사랑을 아는 것과 그 사랑 안에서 하루를 사는 것은 다른 일처럼 느껴집니다. 미운 사람은 여전히 밉고, 밤에는 여전히 잠이 오지 않습니다."},{"t":"p","text":"제7부는 그 평범한 하루 속으로 들어갑니다. 눈에 보이지 않지만 곁에 계시는 분을 만나고, 그분께 말을 거는 법을 배웁니다. 오래 묵은 응어리가 풀리는 길을 살피고, 고마움을 알아보는 눈을 뜨며, 마지막으로 지친 몸과 마음을 누이는 쉼에 이릅니다."},{"t":"p","text":"이 다섯 과는 새로 지켜야 할 숙제 목록이 아닙니다. 성령도, 기도도, 용서도, 감사도, 쉼도 우리가 해내는 일이기 전에 받는 선물입니다. 사랑받는 사람의 하루가 어떻게 조금씩 달라지는지, 함께 걸어가 보겠습니다."}],"inPart":7,"audio":"audio/37.m4a"},{"id":"38","kind":"lesson","no":31,"part":null,"title":"함께 계시는 분, 성령","sub":"예수님은 이천 년 전 분이신데, 오늘 내 곁에는 누가 계실까요","key":{"ref":"요한복음 14장 16절","text":"내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 영원토록 너희와 함께 있게 하리니"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"아이를 처음 어린이집에 맡기던 날을 기억하는 부모님이 많으실 것입니다. 아이는 현관에서 엄마 옷자락을 붙들고 놓지 않습니다. 엄마는 무릎을 굽히고 아이 눈을 보며 말합니다. \"엄마 꼭 다시 올게. 그리고 선생님이 엄마 대신 네 곁에 계실 거야.\" 아이에게 필요한 것은 긴 설명이 아닙니다. 혼자 남겨지지 않는다는 한 가지 사실입니다."},{"t":"p","text":"지난 과에서 우리는 \"내가 너를 안다\"고 하시는 분의 손에서 아무도 우리를 빼앗을 수 없다는 약속을 들었습니다. 그런데 이런 마음이 드실 수 있습니다. 예수님은 이천 년 전에 사셨던 분이고, 지금은 눈에 보이지도 않는데, 그 약속이 오늘 나의 하루와 무슨 상관이 있을까 하는 마음입니다."},{"t":"p","text":"예수님의 제자들도 같은 불안을 느꼈습니다. 십자가를 하루 앞둔 밤, 예수님이 곧 떠나신다는 말씀을 듣고 제자들의 마음은 무너졌습니다. 그 밤에 예수님은 현관에 선 엄마처럼 한 가지 약속을 남기셨습니다. 오늘은 그 약속을 함께 읽겠습니다. 눈에 보이지 않는 하나님이 어떻게 오늘 내 곁에 계시는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"고아처럼 버려두지 않겠습니다"},{"t":"p","text":"그 밤 예수님이 하신 말씀은 길지 않습니다."},{"t":"verse","ref":"요한복음 14장 18절","text":"내가 너희를 고아와 같이 버려두지 아니하고 너희에게로 오리라"},{"t":"p","text":"고아라는 말에 예수님의 마음이 담겨 있습니다. 제자들을 부하나 학생으로 보셨다면 이런 말을 쓰지 않으셨을 것입니다. 부모를 잃을까 봐 떨고 있는 아이로 보셨기에, 버려두지 않겠다고 먼저 말씀하신 것입니다."},{"t":"p","text":"그리고 그 방법을 알려 주셨습니다. 아버지께 구하여 '또 다른 보혜사'를 보내 주시겠다는 것입니다. 보혜사는 낯선 말입니다. 곁에 서서 돕는 이, 위로하는 이, 변호해 주는 이라는 뜻을 가진 말을 한자로 옮긴 것입니다. 교회에서는 이분을 성령이라고 부릅니다. 하나님의 영, 곧 눈에 보이지 않게 우리 곁에, 우리 안에 와 계시는 하나님이십니다."},{"t":"p","text":"이상구 박사는 이 구절에서 '또 다른'이라는 말에 주목합니다. 예수님이 첫 번째 '큰 위로자'이셨고, 뒤이어 오시는 성령은 '다른 위로자'라는 것입니다. 생각해 보면, 사람의 몸으로 오신 예수님은 한 번에 한 곳에만 계실 수 있었습니다. 갈릴리에 계실 때는 예루살렘의 병든 이 곁에 계실 수 없었습니다. 그러나 성령은 누구에게나, 어디서나, 그리고 말씀 그대로 '영원토록' 함께 계십니다. 떠나심은 버리심이 아니라 더 가까이 오시는 길이었습니다."},{"t":"h3","text":"감시자가 아니라 변호인입니다"},{"t":"p","text":"하나님이 늘 곁에 계신다는 말을 들으면 오히려 불편해지는 분들이 계십니다. 어릴 때 \"하나님이 다 보고 계신다\"는 말을 겁주는 말로 들었기 때문입니다. 늘 지켜보는 눈, 잘못을 적어 두는 손을 떠올리면 함께 계신다는 말은 위로가 아니라 부담이 됩니다."},{"t":"p","text":"그러나 예수님이 고르신 이름은 감시자가 아니었습니다. 보혜사, 곧 내 편에 서서 나를 변호해 주는 분이었습니다. 박사님은 성령이 오셔서 하시는 일을, 예수님의 십자가가 무슨 뜻인지 깨닫게 해 주시는 일이라고 설명합니다. 다시 말해 성령은 \"네가 무엇을 잘못했는지 보자\" 하고 오시는 분이 아니라, \"하나님이 너를 얼마나 사랑하시는지 알려 주마\" 하고 오시는 분입니다. 또 박사님은 보혜사를 '도움'이라는 말로도 풀이합니다. 사람은 조건 없는 사랑을 스스로는 다 믿지 못하는 존재이기에, 그 사랑을 믿을 수 있도록 도우러 오신다는 것입니다."},{"t":"p","text":"지난 과에서 읽은 사도 바울의 말을 다시 읽어 봅니다."},{"t":"verse","ref":"로마서 8장 15절에서 16절","text":"너희는 다시 무서워하는 종의 영을 받지 아니하고 양자의 영을 받았으므로 우리가 아빠 아버지라고 부르짖느니라 성령이 친히 우리의 영과 더불어 우리가 하나님의 자녀인 것을 증언하시나니"},{"t":"p","text":"종은 주인의 눈치를 봅니다. 잘하면 상을 받고 못하면 벌을 받기 때문입니다. 자녀는 다릅니다. 아이는 자격이 있어서 \"아빠\" 하고 부르는 것이 아닙니다. 박사님은 이 본문에서, 자녀가 앞으로 '될 것'이 아니라 이미 자녀'인 것'을 성령이 알려 주신다는 점을 강조합니다. 성령이 내 안에서 하시는 가장 중요한 일은 \"너는 이미 내 자녀다\" 하고 속삭여 주시는 일입니다."},{"t":"h3","text":"보이지 않는데 어떻게 알 수 있을까요"},{"t":"p","text":"그래도 물음은 남습니다. 보이지도 만져지지도 않는 분이 계신 줄을 어떻게 아느냐는 것입니다. 박사님도 같은 물음 앞에 섰던 사람입니다. 그는 건강강의에서 자신의 경험을 들려줍니다. 하나님이 계신지 사람에게 물어서는 답이 나오지 않으니, 일단 계시다고 가정하고 직접 여쭈어 보기로 했다는 것입니다. 삼십 분을 기다렸지만 아무 일도 일어나지 않았습니다."},{"t":"p","text":"실망해서 성경을 아무 데나 펼쳤더니, 노아가 구백오십 세까지 살았다는 대목이 나왔습니다. 이십 년 전 고등학생 때, 말도 안 된다며 그 장을 찢어 쓰레기통에 넣었던 바로 그 대목이었습니다. 그런데 그날은 같은 글을 보면서 \"살았는지 안 살았는지 나는 확정할 수 없다\"고 생각하고 있는 자신을 발견했습니다. 이십 년 굳은 생각이 삼십 분 사이에 바뀐 것입니다. 박사님은 그것이 증거였다고 말합니다. 하나님이 주시는 답은 하늘의 표적이 아니라 내 생각이 바뀌는 일일 때가 많다는 것입니다."},{"t":"p","text":"성령은 그렇게 조용히 일하십니다. 박사님은 신령 령 자에 비 우가 들어 있는 것을 짚으며, 성령이 이슬비처럼 내려 사람을 적시는 분이라고 설명합니다. 또 내가 잠든 사이에도 몸 안에서 망가진 곳이 고쳐지고 있는 일을, 사람을 위해 쉬지 않고 일하시는 하나님의 영의 일로 봅니다. 제1부에서 배운 생기, 곧 생명을 주는 그 힘이 멀리 있는 것이 아니라 지금 내 안에서 일하고 계신다는 말입니다. 미운 마음이 누그러질 때, 까닭 없이 고마운 마음이 들 때, 살고 싶다는 마음이 다시 일어날 때, 우리는 그분이 다녀가신 자리를 봅니다."},{"t":"h3","text":"구하면 주시는 선물입니다"},{"t":"p","text":"그러면 성령은 특별한 사람만 받는 것일까요. 예수님은 아주 쉬운 비유로 답하셨습니다."},{"t":"verse","ref":"누가복음 11장 13절","text":"너희가 악할지라도 좋은 것을 자식에게 줄 줄 알거든 하물며 너희 하늘 아버지께서 구하는 자에게 성령을 주시지 않겠느냐"},{"t":"p","text":"조건이 하나도 붙어 있지 않습니다. 오래 믿은 사람, 착하게 산 사람에게 주신다는 말이 없습니다. 구하는 사람에게 주십니다. 박사님은 이 구절을 설명하며, 마음을 비우려고 애쓰는 것이 아니라 구하여 채움을 받는 것이 성경의 길이라고 말합니다. 빈 마음은 그대로 비어 있지 못하고 걱정과 미움으로 다시 차기 쉽습니다. 그 자리를 사랑의 영이 채우시면 어둠은 저절로 물러갑니다."},{"t":"p","text":"그러니 어려운 기도가 필요하지 않습니다. \"하나님, 저와 함께 계셔 주십시오. 하나님이 저를 사랑하신다는 것을 믿도록 도와주십시오.\" 이 한마디면 충분합니다. 현관에서 엄마를 부르는 아이의 목소리를 엄마가 못 듣는 법은 없습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"예수님은 떠나시면서 우리를 고아처럼 두지 않겠다고 약속하셨고, 그 약속대로 성령을 보내셨습니다. 성령은 잘못을 찾아내는 감시자가 아니라, 곁에서 위로하고 편들어 주시는 분입니다. 그분이 하시는 가장 큰 일은 \"너는 이미 사랑받는 자녀\"라는 사실을 우리 마음이 믿도록 도우시는 일입니다. 이 선물에는 자격이 없고, 구하는 사람 누구에게나 주어집니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 혼자 남겨져 무서웠던 기억이 있습니까? 그때 누가 와 주었습니까?"},{"t":"q","i":1,"text":"둘째, \"하나님이 다 보고 계신다\"는 말을 들으면 어떤 느낌이 듭니까? 든든합니까, 불편합니까? 그 느낌은 어디에서 왔을까요?"},{"t":"q","i":2,"text":"셋째, 오래 굳어 있던 생각이나 미운 마음이 어느 날 스르르 바뀐 경험이 있다면 나누어 주십시오."},{"t":"q","i":3,"text":"넷째, 지금 내 곁에 '내 편'이 되어 주는 분이 계신다면, 가장 먼저 무슨 말을 하고 싶습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 14장 18절","text":"내가 너희를 고아와 같이 버려두지 아니하고 너희에게로 오리라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아침에 눈을 뜨면 자리에서 일어나기 전에 \"하나님, 오늘도 저와 함께 계셔 주십시오\" 하고 한마디로 말씀드립니다."},{"t":"act","i":1,"text":"하루에 한 번, 마음이 따뜻해지거나 생각이 바뀐 순간이 있었는지 돌아보고 수첩에 한 줄 적어 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"성령이라는 말에 방언이나 뜨거운 체험, 혹은 무속적인 느낌을 떠올리며 경계하는 분이 있을 수 있습니다. 이 과에서는 그런 현상을 다루지 않습니다. 성령을 '곁에 계시는 하나님', '내 편이 되어 주시는 분'으로 소개하는 데 집중해 주십시오. \"저는 아무것도 못 느끼는데요\" 하는 분께는 느낌이 기준이 아니라는 점을 알려 주시면 좋습니다. 박사님의 경험처럼 생각이 조용히 바뀌는 것, 미움이 누그러지는 것도 그분의 일입니다. 삼위일체 같은 교리 설명은 이 자리에서는 길게 하지 마시고, 질문이 나오면 \"한 분 하나님이 우리를 끝까지 돕기 위해 여러 모습으로 다가오신다\" 정도로 답하고 넘어가십시오. 둘째 질문에서 상처 섞인 이야기가 나오면 고쳐 주려 하지 말고 끝까지 들어 주십시오."}],"inPart":7,"audio":"audio/38.m4a"},{"id":"39","kind":"lesson","no":32,"part":null,"title":"기도, 아버지와 나누는 이야기","sub":"기도는 어떻게 하는 것일까요, 말을 잘해야 들어주실까요","key":{"ref":"마태복음 6장 9절","text":"그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"기도라는 말을 들으면 어떤 장면이 떠오르십니까. 새벽에 정화수를 떠 놓고 두 손을 비비시던 할머니, 입시 철마다 백일기도를 드리는 어머니들의 모습이 떠오르는 분이 많을 것입니다. 우리말에서 기도는 오랫동안 '비는 것'이었습니다. 높은 분의 마음을 움직이려면 정성을 쌓아야 하고, 정성이 모자라면 들어주지 않으신다고 여겼습니다."},{"t":"p","text":"그래서 교회에 처음 온 분들이 가장 어려워하는 것도 기도입니다. 다른 사람들은 막힘 없이 길게 기도하는데 나는 무슨 말을 해야 할지 모르겠다고 하십니다. 틀리게 말하면 어쩌나, 나 같은 사람의 말도 들으실까 걱정하십니다."},{"t":"p","text":"지난 과에서 우리는 성령이 오셔서 하나님을 \"아빠 아버지\"라 부르게 해 주신다는 말씀을 읽었습니다. 아버지가 계시다면 아버지와 나누는 이야기도 있을 것입니다. 예수님은 제자들에게 기도를 직접 가르쳐 주셨습니다. 그 기도를 천천히 들여다보면 기도가 무엇인지 보입니다. 기도는 비는 것일까요, 이야기하는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"골방에서, 있는 그대로"},{"t":"p","text":"예수님은 기도를 가르치시기 전에 먼저 기도하는 자리를 말씀하셨습니다."},{"t":"verse","ref":"마태복음 6장 6절","text":"너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라"},{"t":"p","text":"당시에는 사람들이 많이 다니는 길목에 서서 길게 기도하는 이들이 있었습니다. 남에게 경건해 보이고 싶었던 것입니다. 이상구 박사는 예수님이 골방을 말씀하신 까닭을, 사람의 시선을 의식하는 마음에서 벗어나 하나님과 솔직하고 은밀한 사귐을 갖게 하시려는 것이라고 설명합니다. 골방에서는 꾸밀 필요가 없습니다. 듣는 사람이 없으니 말솜씨도 필요 없습니다."},{"t":"p","text":"예수님은 이어서 말을 많이 해야 들으실 줄로 생각하지 말라고 하시며, 구하기 전에 우리에게 있어야 할 것을 아버지께서 이미 아신다고 말씀하셨습니다(마태복음 6장 7절에서 8절). 그렇다면 기도는 모르시는 분께 사정을 알리는 일이 아닙니다. 마음이 닫힌 분을 정성으로 설득하는 일도 아닙니다. 이미 다 아시고 이미 내 편이신 분 앞에 내 마음을 열어 놓는 일입니다. 아이가 학교에서 돌아와 엄마에게 오늘 있었던 일을 이야기할 때, 엄마가 몰라서 듣는 것이 아닌 것과 같습니다."},{"t":"h3","text":"\"아버지\" 하고 부르십시오"},{"t":"p","text":"예수님이 가르치신 기도의 첫마디는 \"하늘에 계신 우리 아버지여\"입니다. 박사님은 이 호칭 자체에 주목합니다. 신을 아버지라 부르게 하신 것은 파격이며, 하나님과 사람의 관계를 주인과 종이 아니라 부모와 자녀의 관계로, 나아가 친구의 관계로 정해 주신 것이라고 설명합니다. 박사님은 기도할 때마다 위엄 있는 호칭을 늘어놓는 것과 \"아빠 아버지\"라 부르는 것 사이의 거리도 짚습니다. 두려움이 남아 있으면 \"아빠\"라는 말이 입에서 나오지 않습니다."},{"t":"p","text":"그다음 구절은 조금 어렵게 들립니다. \"이름이 거룩히 여김을 받으시오며.\" 성경에서 이름은 그분의 성품을 뜻합니다. 박사님은 이 간구의 바탕에, 하나님의 이름이 지금 세상에서 오해받고 있다는 사실이 깔려 있다고 봅니다. 많은 사람이 하나님을 상과 벌로 사람을 다루는 조건적인 분으로 알고 있기 때문입니다. 그리고 하나님이 거룩하시다는 것은 우리와 달리 조건 없이 사랑하신다는 뜻이라고 풀이합니다."},{"t":"p","text":"그러니 이 기도는 이렇게 바꾸어 말할 수 있습니다. \"아버지, 아버지가 어떤 분이신지 제가 바로 알게 해 주십시오. 아버지의 사랑이 얼마나 다른 사랑인지 깨닫게 해 주십시오.\" 예수님이 가르치신 기도는 내 문제를 해결해 달라는 말보다 아버지를 바로 아는 것을 먼저 구합니다. 아버지를 바로 알면 나머지 걱정의 절반은 이미 풀리기 때문입니다."},{"t":"h3","text":"당당하게, 솔직하게"},{"t":"p","text":"이어지는 기도는 아주 소박합니다."},{"t":"verse","ref":"마태복음 6장 11절","text":"오늘 우리에게 일용할 양식을 주시옵고"},{"t":"p","text":"박사님은 여기서 흥미로운 점을 하나 짚습니다. 우리말 성경은 \"주시옵고\"라고 공손하게 옮겼지만, 원문과 영어 성경(Give us)은 \"주십시오\" 하는 명령형이라는 것입니다. 박사님은 이것을, 빌지 말고 당당히 구하라고 하시는 사랑의 표현으로 읽습니다. 세 살배기 아이가 엄마에게 배고프다고 말할 때 눈치를 보거나 정성을 쌓지 않는 것과 같습니다. 그리고 일용할 양식 가운데 가장 중요한 것은 날마다 새로 받는 생명의 말씀이라고 덧붙입니다."},{"t":"p","text":"예수님은 다른 자리에서 어린아이와 같이 되라고 하셨습니다(마태복음 18장 3절). 박사님은 이 말씀을 기도에 그대로 적용합니다. 아까우면 아깝다고, 힘들면 힘들다고 솔직하게 말하는 아이 같은 관계를 하나님은 오히려 기뻐하신다는 것입니다. 기도에 모범 답안은 없습니다. 고운 말만 골라서 올리는 기도보다 속상한 마음을 그대로 쏟아 놓는 기도가 아버지께는 더 반가운 이야기입니다."},{"t":"p","text":"기도의 끝에는 \"우리를 시험에 들게 하지 마시옵고 다만 악에서 구하시옵소서\"(마태복음 6장 13절)라는 구절이 있습니다. 이 구절 때문에 하나님이 사람을 시험하시는 분이라고 오해하기 쉽습니다. 박사님은 뒷부분에 열쇠가 있다고 설명합니다. 우리를 넘어뜨리려는 것은 악이며, 하나님은 거기서 건져 주시는 분이라는 것입니다. 아버지는 자녀를 떠보는 분이 아니라 자녀를 구해 내는 분이십니다."},{"t":"h3","text":"말이 나오지 않을 때"},{"t":"p","text":"살다 보면 기도조차 나오지 않는 날이 있습니다. 걱정과 두려움이 마음을 가득 채워 무슨 말을 해야 할지 모르는 날입니다. 성경은 그런 날을 위해서도 약속을 남겨 두었습니다."},{"t":"verse","ref":"로마서 8장 26절","text":"이와 같이 성령도 우리의 연약함을 도우시나니 우리가 마땅히 빌 바를 알지 못하나 오직 성령이 말할 수 없는 탄식으로 우리를 위하여 친히 간구하시느니라"},{"t":"p","text":"박사님은 이 구절을 들어, 말이 나오지 않으면 눈을 감고 두 손을 모으는 것만으로도 기도가 된다고 위로합니다. 하나님은 우리에게 무엇이 필요한지 이미 아시고, 성령이 우리 대신 아뢰어 주시기 때문입니다. \"하나님, 무슨 말을 할지도 모르겠습니다\" 하고 그대로 말하면 그것이 진짜 기도라고 합니다. 기도가 되지 않는다는 말은 실패가 아니라 솔직한 고백입니다."},{"t":"p","text":"박사님은 한 걸음 더 나아가, 답답할 때는 성경의 시편에서 다윗이 억울함을 쏟아 놓은 대목을 소리 내어 읽으며 왜 이 문제가 풀리지 않느냐고 따져도 된다고 말합니다. 중요한 것은 그렇게 해도 미워하지 않으실 분이라는 것을 아는 일입니다. 부모에게 투정을 부릴 수 있는 아이는 부모의 사랑을 믿는 아이입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"기도는 높은 분의 마음을 돌리려고 정성을 쌓는 일이 아니라, 이미 나를 사랑하시는 아버지와 나누는 이야기입니다. 아버지는 구하기 전에 이미 아시고, 말솜씨를 보지 않으시며, 투정도 들어 주십니다. 말이 막히는 날에는 성령이 대신 아뢰어 주십니다. 그러므로 기도에서 가장 중요한 것은 무엇을 말하느냐가 아니라 누구에게 말하고 있느냐입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 부모님이나 할머니께 무엇을 사 달라고 졸랐던 기억이 있습니까? 그때 어떻게 말했습니까?"},{"t":"q","i":1,"text":"둘째, 지금까지 기도를 어떤 것으로 생각해 오셨습니까? 기도해 본 적이 있다면 그때 마음이 어땠습니까?"},{"t":"q","i":2,"text":"셋째, 누군가에게 속마음을 있는 그대로 털어놓고 나서 마음이 가벼워진 경험이 있습니까? 그 사람은 어떤 사람이었습니까?"},{"t":"q","i":3,"text":"넷째, 하나님께 꾸미지 않고 딱 한마디만 해도 된다면, 오늘 무슨 말을 하고 싶습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"마태복음 6장 8절","text":"구하기 전에 너희에게 있어야 할 것을 하나님 너희 아버지께서 아시느니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루에 3분, 혼자 있는 자리에서 \"아버지\" 하고 부른 다음 오늘 있었던 일을 친한 사람에게 말하듯 이야기해 봅니다."},{"t":"act","i":1,"text":"기도가 나오지 않는 날에는 눈을 감고 두 손만 모은 채 \"무슨 말을 할지 모르겠습니다\" 하고 1분간 머물러 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과의 목표는 기도를 '가르치는' 것이 아니라 기도의 문턱을 낮추는 것입니다. 모임에서 돌아가며 소리 내어 기도하게 하는 일은 처음 온 분께 큰 부담이 되니 피하십시오. 인도자가 짧고 평범한 말로 기도하는 모습을 보여 주는 것이 가장 좋은 교육입니다. \"기도했는데 안 들어주시던데요\" 하는 말이 나올 수 있습니다. 서둘러 변호하지 말고, 그때 얼마나 서운했는지 먼저 들어 주십시오. 그 서운함을 하나님께 그대로 말씀드리는 것도 기도라는 점만 알려 주시면 충분합니다. 주기도문 가운데 용서에 관한 구절은 다음 과에서 다루므로 오늘은 넘어가십시오. 아버지에게 상처가 있어 '아버지'라는 말이 힘든 분도 있습니다. 그런 분께는 가장 따뜻했던 어른을 떠올려 보시라고 권해 주십시오."}],"inPart":7,"audio":"audio/39.m4a"},{"id":"40","kind":"lesson","no":33,"part":null,"title":"응어리를 푸는 힘, 용서","sub":"도저히 용서가 안 되는 사람이 있는데, 어떻게 해야 할까요","key":{"ref":"마태복음 18장 21절에서 22절","text":"그 때에 베드로가 나아와 이르되 주여 형제가 내게 죄를 범하면 몇 번이나 용서하여 주리이까 일곱 번까지 하오리이까 예수께서 이르시되 네게 이르노니 일곱 번뿐 아니라 일곱 번을 일흔 번까지라도 할지니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사는 건강강의에서 실험실 배양접시 이야기를 들려줍니다. 건강한 세포를 접시에 놓고 기르면, 자라다가 서로 맞닿을 때 멈춘다고 합니다. 박사님의 표현을 빌리면 한쪽이 '내가 아래로 갈 테니 당신은 위로 가라'는 식으로 서로 양보하며 반듯한 조직을 이룹니다. 그런데 암세포는 양보하지 않습니다. 서로 부딪치며 계속 자라 덩어리를 만듭니다. 박사님은 그 덩어리를 가리켜 '응어리'라고 부르며, 마음속에 응어리가 많은 사람의 상태가 이와 닮았다고 말합니다."},{"t":"p","text":"응어리. 우리말에는 참 정확한 말이 있습니다. 가슴에 맺혀서 풀리지 않는 덩어리입니다. 나를 속인 사람, 나를 버린 사람, 내 자식에게 상처를 준 사람. 세월이 흘러도 그 이름만 들으면 가슴 한쪽이 굳어집니다. 잊으려 해도 밤이면 다시 떠오릅니다."},{"t":"p","text":"지난 과에서 우리는 기도가 아버지와 나누는 솔직한 이야기라는 것을 배웠습니다. 그런데 예수님이 가르치신 기도 가운데 가장 걸리는 대목이 용서입니다. 용서해야 한다는 것은 알겠는데 되지 않습니다. 이 응어리는 어떻게 풀리는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"일곱 번이면 되겠습니까"},{"t":"p","text":"베드로의 질문은 인색한 질문이 아니었습니다. 박사님의 설명에 따르면 그 시대에는 대개 세 번을 용서의 기준으로 여겼습니다. 일곱 번은 그 두 배가 넘는 후한 제안이었습니다. 그런데 예수님은 일곱 번을 일흔 번까지라도 하라고 하셨습니다. 박사님은 이 숫자가 사백구십 번이라는 횟수가 아니라 '완전하고 완전하게', 곧 끝없는 용서를 뜻한다고 풀이합니다. 몇 번인지 세는 일 자체를 그만두라는 말씀입니다."},{"t":"p","text":"솔직히 이 말씀은 불편합니다. 박사님도 그 점을 짚습니다. 두 번 봐주고 세 번째는 끝내는 것이 합리적이라 여기는 것이 우리의 본성이라는 것입니다. 끝없이 용서만 하면 세상이 어떻게 되겠느냐는 생각이 먼저 듭니다. 그러나 이 말씀은 먼저 하나님이 어떤 분이신지를 알려 주는 말씀입니다. 예수님은 자신도 하지 않으시는 일을 제자에게 시키시는 분이 아닙니다. 세지 않고 용서하시는 분이 바로 하나님이시라는 것입니다."},{"t":"h3","text":"백억을 탕감받은 사람"},{"t":"p","text":"예수님은 곧바로 비유 하나를 들려주셨습니다. 어떤 임금에게 일만 달란트를 빚진 종이 있었습니다. 박사님은 이 액수를 오늘날로 치면 백억 원이 넘는, 한 사람이 평생 갚을 수 없는 돈이라고 설명합니다. 종은 엎드려 빌었습니다. 조금만 참아 주시면 다 갚겠다고 했습니다. 박사님은 바로 이 말이 문제의 급소라고 봅니다. 도저히 갚을 수 없는 빚인데도 자기 힘으로 갚을 수 있다고 여긴 것입니다."},{"t":"verse","ref":"마태복음 18장 27절","text":"그 종의 주인이 불쌍히 여겨 놓아 보내며 그 빚을 탕감하여 주었더니"},{"t":"p","text":"임금은 기한을 늘려 준 것이 아니라 빚 전체를 없애 주었습니다. 아무 조건이 없었습니다. 그런데 이 종은 나가서 자기에게 백 데나리온, 박사님의 계산으로 백만 원쯤을 빚진 동료를 만나 멱살을 잡고 옥에 가두었습니다. 박사님은 이것을 백억을 탕감받은 감격이 그에게 전혀 없었다는 증거로 읽습니다. 탕감을 통보는 받았지만 마음으로 받지는 못한 것입니다."},{"t":"p","text":"이 비유가 알려 주는 용서의 순서는 분명합니다. 용서는 내가 먼저 짜내는 것이 아닙니다. 성경은 서로 용서하기를 \"하나님이 그리스도 안에서 너희를 용서하심과 같이 하라\"(에베소서 4장 32절)고 말합니다. 먼저 받은 용서가 있고, 그것이 마음에 닿아 감격이 될 때 비로소 남에게 흘러갑니다. 용서가 되지 않아 괴롭다면, 그것은 내가 나쁜 사람이라는 뜻이 아니라 아직 내가 받은 사랑이 얼마나 큰지 마음으로 다 알지 못했다는 뜻입니다."},{"t":"h3","text":"용서가 되지 않던 닷새 밤"},{"t":"p","text":"박사님 자신이 이 길을 걸었습니다. 미국에서 수련의로 일하던 시절, 돌아가신 할아버지가 손자 몫으로 남겨 두신 울산 땅의 보상금이 나왔습니다. 당시 돈으로 5억, 지금 값으로는 오십억 원쯤 되는 큰돈이었습니다. 한국 사정을 몰랐던 그는 고등학교 때 가장 가까웠던 친구에게 일을 맡겼습니다. 친구는 그 돈을 들고 가 도박으로 다 잃었습니다."},{"t":"p","text":"그 뒤로 박사님은 잠을 이루지 못했습니다. 눈을 감으면 그 얼굴과 그 돈이 번갈아 지나갔습니다. 가슴이 두근거리고 입이 말라 물을 마시다 밤을 새웠습니다. 무릎을 꿇고 용서하게 해 달라고 세 번을 기도했지만 평화가 오지 않았습니다. 진심이 아니었기 때문입니다. 그래서 그는 기도를 바꾸었습니다. \"하나님, 용서하라고 그러지 마세요...  잠만 재워 주세요.\" 박사님 스스로 철없는 어린아이 같은 기도였다고 말합니다."},{"t":"p","text":"그리고 해군 군의관 시절 밤바다에서 부르던 찬송 '하늘 가는 밝은 길이'를 부르기 시작했습니다. 달빛 비친 바닷길을 떠올리며 되풀이해 부르다 보면 어느새 잠이 들었습니다. 닷새 밤을 그렇게 보낸 뒤 그에게 한 생각이 들어왔습니다. 억장이 무너진 채로도 단잠을 잔 이 닷새의 경험을 돈으로 살 수 있다면 사겠느냐는 물음이었습니다. 사겠다는 대답이 나왔습니다. 그러고 나서야 진심으로 용서하도록 도와 달라는 기도가 나왔고, 다음 날 아침 그 친구를 떠올려도 마음이 아무렇지 않았다고 합니다. 박사님은 정직하게 선을 긋습니다. 돈은 돌려받지 못했고 아직 사랑한다고는 말하지 못하지만, 그 이름을 꺼내도 마음이 상하지 않는 데까지는 왔다는 것입니다."},{"t":"p","text":"박사님은 이 경험에서 순서 하나를 건져 냅니다. 용서하고 나서 평안해져 잠이 오는 것이 아니라, 먼저 잠을 구하고, 몸이 회복되고, 그다음에 용서가 온다는 것입니다. 용서는 결심의 결과가 아니라 위에서 오는 힘을 받은 결과라는 말입니다."},{"t":"h3","text":"마음속 감옥의 문을 엽니다"},{"t":"p","text":"제22과에서 잠깐 살핀 대로 박사님은 용서를 두 가지로 나눕니다. 하나는 고소하지 않고 봐주는 용서입니다. 겉으로는 끝났지만 그 사람을 떠올릴 때마다 속이 다시 끓습니다. 다른 하나는 그 사람을 생각해도 더 이상 괴롭지 않은 용서입니다. 박사님은 뒤의 것이 사람의 뜻만으로는 되지 않고, 하나님이 조건 없는 사랑을 마음에 부어 주실 때 일어난다고 설명합니다."},{"t":"p","text":"한 사람을 용서하고 나자 박사님에게는 자기 마음속 지하에 감옥이 있다는 것이 보였다고 합니다. 평생 미워하기로 작정하고 가두어 둔 사람들이 있었습니다. 적어 보니 열네 명이었습니다. 박사님은 그 감옥에 유지 관리비가 든다고 말합니다. 미워하느라 밤잠을 설치면 그만큼 생명의 힘이 새어 나간다는 것입니다. 그래서 가장 덜 미운 사람부터 한 사람씩, 아침저녁으로 이름을 부르며 도와 달라고 기도했습니다. 용서는 상대를 봐주는 일이기 전에 나를 가둔 감옥의 문을 여는 일입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님은 몇 번째인지 세지 않고 용서하시는 분이며, 우리는 갚을 수 없는 빚을 이미 탕감받은 사람입니다. 용서는 \"해야 한다\"는 의무에서 나오지 않고, 내가 받은 사랑이 마음에 닿을 때 흘러나옵니다. 그래서 용서가 되지 않는 밤에는 억지로 짜내지 않아도 됩니다. 못 하겠다고 솔직히 말씀드리고 잠을 구하는 것, 거기서부터 하나님이 응어리를 풀기 시작하십니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 친구와 크게 싸우고 나서 다시 화해했던 기억이 있습니까? 누가 먼저 손을 내밀었습니까?"},{"t":"q","i":1,"text":"둘째, 누군가에게 큰 잘못을 했는데 조건 없이 용서받은 적이 있습니까? 그때 마음이 어땠습니까?"},{"t":"q","i":2,"text":"셋째, 이름은 말하지 않아도 좋습니다. 생각만 하면 가슴이 굳어지는 사람이 있습니까? 그 응어리는 내 몸과 생활에 어떤 영향을 주고 있습니까?"},{"t":"q","i":3,"text":"넷째, \"용서하라고 하지 마시고 잠만 재워 주세요\"라는 기도를 들으니 어떤 생각이 듭니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"에베소서 4장 32절","text":"서로 친절하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"마음속 감옥에 가두어 둔 사람의 이름을 혼자 보는 종이에 적어 보고, 그 가운데 가장 덜 미운 한 사람을 고릅니다. 아침저녁으로 \"하나님, 제 힘으로는 안 됩니다. 도와주십시오\" 하고 한마디만 말씀드립니다."},{"t":"act","i":1,"text":"미운 생각이 밀려와 잠이 오지 않는 밤에는 좋아하는 노래 한 곡을 정해 아름다운 장면을 떠올리며 조용히 불러 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서 가장 조심할 점은 용서를 또 하나의 짐으로 지우지 않는 것입니다. 깊은 상처를 입은 분에게 \"용서해야 낫는다\"는 말은 폭력이 될 수 있습니다. 박사님의 순서대로 '잠, 회복, 그다음이 용서'임을 강조해 주십시오. 용서는 피해를 없던 일로 하거나 위험한 관계로 돌아가는 것이 아닙니다. 지금도 폭력이나 학대를 겪는 분이 있다면 안전을 지키는 일이 먼저이며, 필요한 도움을 받도록 곁에서 도와주십시오. 미움과 몸의 관계는 박사님의 설명으로 소개하되 \"미워해서 병이 났다\"는 식으로 누구를 탓하는 말이 되지 않게 하십시오. 비유 끝에 종이 옥에 갇히는 장면을 묻는 분이 있으면, 박사님은 이것을 하나님이 실제로 벌을 집행하신다는 뜻이 아니라 비유적 표현으로 본다고 알려 주시면 됩니다. 셋째 질문에서는 자세한 사연을 캐묻지 마십시오."}],"inPart":7,"audio":"audio/40.m4a"},{"id":"41","kind":"lesson","no":34,"part":null,"title":"감사가 몸을 살립니다","sub":"감사할 일이 없는 날에도 감사할 수 있을까요","key":{"ref":"데살로니가전서 5장 16절에서 18절","text":"항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사가 건강강의에서 들려주는 오래된 기억이 있습니다. 1970년대 초, 미국에 수련의로 건너간 그는 월급을 모아 첫 차를 샀습니다. 차고가 없어 겨울에 길가에 세워 두고는, 차가 얼까 걱정되어 자다가도 일어나 창밖을 내다보았다고 합니다. 그렇게 아끼던 차가 어느 날 고속도로에서 타이어가 터졌습니다. 어쩔 줄 모르고 서 있는데 지나가던 미국인이 차를 세웠습니다. 영어가 짧아 말이 통하지 않자, 그 사람은 직접 트렁크를 열어 예비 타이어를 꺼내 갈아 끼워 주고는 괜찮다며 떠났습니다."},{"t":"p","text":"박사님은 그 사람의 이름도, 사는 곳도 모릅니다. 그런데 오십 년 안팎의 세월이 지난 지금도 그날을 생생히 기억하며 고마워합니다. 그리고 이렇게 말합니다. 내가 보내는 감사가 어디로 가야 할지 나는 몰라도 하나님은 아신다고 말입니다."},{"t":"p","text":"지난 과에서 우리는 미움이 마음에 응어리를 만든다는 것을 보았습니다. 감사는 그 반대편에 있습니다. 수십 년이 지나도록 사람의 마음을 따뜻하게 데워 주는 힘입니다. 오늘은 이 힘에 대해 이야기하겠습니다. 감사는 어디에서 오며, 감사할 일이 보이지 않는 날에는 어떻게 해야 할까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"감사는 알아보는 눈입니다"},{"t":"p","text":"박사님은 사람에게 생명의 힘을 주는 것을 진, 선, 미 세 가지로 설명합니다. 진실을 알 때, 선을 알 때, 아름다움을 알 때 힘을 받는다는 것입니다. 그런데 여기서 '선을 안다'는 말을 박사님은 독특하게 풉니다. 도덕적으로 옳은 것을 안다는 뜻이 아니라, 누가 나에게 무엇을 베풀었음을 알아본다는 뜻이라고 합니다. 곧 감사할 줄 아는 것입니다."},{"t":"p","text":"박사님이 드는 예는 장미입니다. 장미를 보고 아름답다고 느끼면 거기까지가 진과 미입니다. 거기에 \"오늘 네가 나에게 생기를 주려고 이렇게 피었구나, 고맙다\"는 한마디를 더하면 선이 더해진다고 합니다. 같은 꽃 앞에서도 돈 버는 일에만 마음이 가 있으면 아름다움이 느껴지지 않고 아무 힘도 받지 못한다고 박사님은 말합니다. 감사는 새로운 무엇을 얻어야 생기는 것이 아닙니다. 이미 받은 것을 알아보는 눈에서 생깁니다."},{"t":"p","text":"박사님은 이것을 몸의 언어로도 설명합니다. 감사를 느끼고 표현할 때 마음을 기쁘게 하는 물질을 만드는 유전자가 켜지고, 걱정으로 복잡하던 뇌파가 부드럽고 고른 뇌파로 바뀐다는 것입니다. 제1부에서 배운 대로 마음의 상태가 몸에 전해진다는 설명입니다. 감사가 약을 대신한다는 말이 아닙니다. 감사하는 마음이 몸이 회복되기 좋은 자리를 마련해 준다는 뜻으로 들으시면 됩니다."},{"t":"h3","text":"감사에는 받으실 분이 필요합니다"},{"t":"p","text":"박사님은 한 가지를 더 짚습니다. 날씨가 맑게 개었다는 것을 알아차리는 것만으로도 힘이 들어오지만, 누군가에게 \"감사합니다\" 하고 말할 때는 그 정도가 확연히 달라진다는 것입니다. 감사에는 대상이 필요합니다. 고마운 마음은 있는데 받을 사람이 없으면, 그 마음은 갈 곳을 몰라 머뭇거립니다."},{"t":"p","text":"아침에 눈이 떠진 것, 밤새 심장이 뛰어 준 것, 넘어졌는데 뼈는 부러지지 않은 것. 이런 일들은 누구에게 감사해야 할까요. 박사님은 하나님이라는 말이 아직 불편한 분에게는 '돌봄이님'이라 불러도 좋다고 말합니다. 이름이 문제가 아니라, 나를 돌보시는 분이 계시다는 것을 받아들이는 일이 중요하기 때문입니다. 받으실 분이 생기면 하루에도 몇 번씩 감사가 갈 곳을 찾습니다."},{"t":"p","text":"오늘의 성구는 \"범사에 감사하라\"고 말합니다. 범사는 모든 일이라는 뜻입니다. 이 말이 또 하나의 숙제처럼 들릴 수 있습니다. 그러나 박사님은 이 말씀을, 하나님이 이미 나를 받아 주셨다는 확신을 붙든 사람에게 주시는 권면으로 읽습니다. 감사는 하나님께 점수를 따려는 노력이 아니라 이미 받은 조건 없는 은혜에 대한 자연스러운 반응이라는 것입니다. 박사님은 회복의 길을 알다, 믿다, 소망을 갖다, 기뻐하다의 네 걸음으로 설명하기도 합니다. 사랑받고 있음을 알고 믿으면 소망이 생기고, 소망이 있으면 기쁨과 감사는 뒤따라 나옵니다."},{"t":"h3","text":"돌아온 한 사람"},{"t":"p","text":"성경에 감사에 관한 짧은 이야기가 있습니다. 예수님이 길을 가시다가 나병 환자 열 사람을 만나셨습니다. 나병은 오늘날 한센병이라 부르는 병으로, 그 시대에는 걸리면 가족과 마을에서 쫓겨나야 했습니다. 예수님은 열 사람을 모두 낫게 해 주셨습니다. 아무것도 묻지 않으시고 아무 조건도 달지 않으셨습니다."},{"t":"verse","ref":"누가복음 17장 15절에서 16절","text":"그 중의 한 사람이 자기가 나은 것을 보고 큰 소리로 하나님께 영광을 돌리며 돌아와 예수의 발 아래에 엎드리어 감사하니 그는 사마리아 사람이라"},{"t":"p","text":"사마리아 사람은 당시 유대 사회에서 사람 대접을 받지 못하던 이들입니다. 박사님은 왜 하필 이 사람만 돌아왔는지를 묻습니다. 나머지 아홉은 자기 정도면 나을 만하다고 여겼기에 당연한 일로 받아들였을 것이라고 봅니다. 그러나 이 사람은 자기가 나을 자격이 없다고 생각하던 사람이었습니다. 그래서 나은 순간에 깨달았습니다. 하나님은 자격을 따지지 않고 사랑하시는 분이라는 것입니다. 박사님은 자신을 구십구 점짜리로 여기는 사람은 참된 감사를 드리기 어렵고, 빵점임을 아는 사람이 참된 감사에 이른다고 말합니다."},{"t":"p","text":"예수님은 그 아홉은 어디 있느냐고 물으셨습니다. 박사님은 이 물음을 꾸짖음이 아니라 아픔으로 읽습니다. 열 명이 다 돌아왔다면 얼마나 좋았겠느냐는 마음입니다. 그리고 눈여겨볼 점이 있습니다. 예수님은 돌아오지 않은 아홉 사람의 병을 도로 거두지 않으셨습니다. 은혜는 감사를 받아야 유지되는 거래가 아닙니다. 다만 감사하며 돌아온 한 사람만이 몸의 나음을 넘어, 자기를 사랑하시는 분의 얼굴을 보았습니다."},{"t":"h3","text":"아픈 날의 감사"},{"t":"p","text":"그러면 병들고 힘든 날에도 감사해야 할까요. 박사님은 여기서 오해를 먼저 막습니다. 암에 걸린 것을 두고 감사한다는 말은, 하나님이 깨닫게 하시려고 일부러 병을 주셨다는 뜻이 아니라고 분명히 말합니다. 하나님은 병을 주시는 분이 아닙니다. 다만 그 아픈 자리마저 삶과 사랑과 생명을 새로 배우는 자리로 바꾸어 주신다는 뜻입니다."},{"t":"p","text":"그러므로 범사에 감사한다는 것은 아프지 않은 척하거나 슬픔을 덮어 두는 일이 아닙니다. 억지로 짜낸 감사는 오래가지 못합니다. 아픈 가운데서도 오늘 나를 찾아와 준 사람, 입에 맞았던 밥 한 술, 창으로 들어온 햇빛 한 줄기를 알아보는 일입니다. 그 작은 것들 뒤에 나를 돌보시는 분이 계심을 떠올리는 일입니다. 상황이 달라진 것이 없어도 그 상황을 바라보는 마음의 자리가 달라집니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"감사는 하나님께 드려야 하는 의무가 아니라, 이미 받은 사랑을 알아보는 눈입니다. 하나님은 열 사람을 조건 없이 고치셨고, 감사하지 않은 아홉에게서도 은혜를 거두지 않으셨습니다. 그분은 감사를 요구하시는 분이 아니라 당신의 사랑이 전해지기를 바라시는 분입니다. 그 사랑을 알아보는 순간 마음이 열리고, 열린 마음은 몸에도 쉼과 힘을 전해 줍니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 오래전 일인데 지금도 잊히지 않는 고마운 사람이 있습니까? 그 이야기를 들려주십시오."},{"t":"q","i":1,"text":"둘째, 최근 일주일 동안 \"고맙다\"는 말을 몇 번쯤 하셨습니까? 누구에게 가장 하기 어렵습니까?"},{"t":"q","i":2,"text":"셋째, 너무 당연해서 고마운 줄 몰랐다가, 잃거나 아프고 나서야 고마움을 알게 된 것이 있습니까?"},{"t":"q","i":3,"text":"넷째, 힘든 일을 지나고 돌아보니 그 속에서도 고마운 것이 있었던 경험이 있습니까? 없었다면 그것도 솔직하게 나누어 주십시오."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"데살로니가전서 5장 18절","text":"범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"잠들기 전에 오늘 고마웠던 일 세 가지를 공책에 적습니다. 아주 작은 것이어도 좋습니다. 적은 뒤에 \"하나님, 고맙습니다\" 하고 한마디 덧붙입니다."},{"t":"act","i":1,"text":"이번 주에 한 사람을 정해 고맙다는 말을 소리 내어 전합니다. 전화나 문자도 좋습니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 자칫 \"감사하지 않아서 아픈 것\"이라는 말로 들릴 위험이 있습니다. 그런 뜻이 전혀 아님을 분명히 해 주십시오. 투병 중이거나 큰 슬픔을 겪는 분에게 감사를 재촉하지 마십시오. 슬픔을 충분히 말하게 해 드리는 것이 먼저입니다. 몸과 마음의 연결에 대한 박사님의 설명은 '이렇게 설명한다'는 수준으로 전하시고, 치료를 그만두어도 된다는 말로 오해되지 않게 해 주십시오. 넷째 질문에서 \"고마운 것이 하나도 없었다\"는 대답이 나와도 그대로 받아 주십시오. 열 사람 이야기에서는 아홉을 나무라는 쪽으로 흐르지 않도록, 예수님이 아홉의 병도 그대로 고쳐 두셨다는 점에 무게를 두십시오. 모임을 마칠 때 서로에게 고마운 점을 한마디씩 나누면 좋습니다."}],"inPart":7,"audio":"audio/41.m4a"},{"id":"42","kind":"lesson","no":35,"part":null,"title":"\"내게로 와서 쉬십시오\"","sub":"쉬어도 쉰 것 같지 않은 나, 참된 쉼은 어디에 있을까요","key":{"ref":"마태복음 11장 28절","text":"수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"주말 내내 집에 누워 있었는데 월요일 아침이 더 피곤한 경험이 있으실 것입니다. 몸은 분명히 쉬었습니다. 그런데 누워서도 전화기를 들여다보았고, 눈을 감으면 밀린 일과 통장 잔고와 아이 걱정이 차례로 지나갔습니다. 이상구 박사는 건강강의에서 이것을 정확히 짚습니다. 몸은 누워 있어도 머릿속에서 복잡한 생각이 계속 돌아가고 있다면 그것은 참된 쉼이 아니라는 것입니다."},{"t":"p","text":"박사님은 쉼을 모르고 살아온 우리의 모습도 돌아봅니다. 1960년대에 미국에서 수련의 생활을 시작했을 때, 동료 의사들이 당연하게 휴가를 챙기는 것을 보고 놀랐다고 합니다. 그 시절 한국에는 휴가라는 생각 자체가 없어서 일밖에 몰랐다는 것입니다. '빨리빨리'로 세계에서 가장 효율적인 사람들이 되었지만 그 대가로 쉼을 누릴 줄 모르게 되었다고 박사님은 말합니다."},{"t":"p","text":"지난 네 과에서 우리는 곁에 계시는 성령, 아버지와 나누는 기도, 응어리를 푸는 용서, 몸을 살리는 감사를 차례로 살펴보았습니다. 오늘은 그 모든 것이 놓이는 자리, 쉼에 대해 이야기하겠습니다. 예수님은 쉬게 해 주겠다고 하셨습니다. 그 쉼은 어떤 쉼일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"믿는 구석이 있어야 쉽니다"},{"t":"p","text":"박사님은 참된 휴식이 몸이 아니라 마음의 쉼에서 온다고 말합니다. 걱정과 불안과 두려움이 가라앉아야 복잡하던 뇌파가 고요해지고, 그때에야 몸속 깊은 곳의 회복이 일어난다고 설명합니다. 그리고 그런 상태는 '믿는 구석'이 있을 때에만 가능하다고 합니다. 그래서 박사님은 휴식을 믿음의 문제라고 부릅니다."},{"t":"p","text":"박사님이 드는 그림은 아이입니다. 장난감 자동차를 빼앗길까 봐 두려워하던 아이가 엄마 품에 안기는 순간 곧바로 쉼을 얻습니다. 장난감 문제가 해결되어서가 아닙니다. 조건 없이 자기를 사랑하는 품 안에 있기 때문입니다. 어른도 같습니다. 문제가 다 풀려야 쉴 수 있다면 우리는 평생 쉬지 못합니다. 문제가 그대로 있어도 나를 붙들고 계신 분을 믿을 수 있을 때 마음은 비로소 내려앉습니다."},{"t":"p","text":"박사님은 쉴 휴 자도 풀어 줍니다. 사람이 나무 곁에 있는 글자입니다. 박사님은 나무를 생명의 상징으로 보며, 사람이 참으로 쉰다는 것은 생명이신 분 곁에 있는 것, 누군가 나를 조건 없이 사랑하고 있음을 느끼는 것이라고 설명합니다."},{"t":"h3","text":"무거운 짐의 정체"},{"t":"p","text":"예수님이 부르신 사람들은 '수고하고 무거운 짐 진 자들'입니다. 그 짐은 무엇이었을까요. 박사님의 설명에 따르면 당시 유대 사람들은 육백열세 가지 율법, 곧 종교 규칙을 다 지켜야 하나님께 받아들여진다고 믿으며 그 짐을 지고 살았습니다. 예수님의 제자 베드로는 훗날 그것을 가리켜 조상도 우리도 메지 못하던 멍에였다고 고백합니다(사도행전 15장 10절). 박사님은 '무거운 짐'을, 하나님의 말씀을 명령으로 오해하여 짊어진 부담이라고 정리합니다. 제29과에서 배운 대로, 약속을 명령으로 잘못 들을 때 그것은 짐이 됩니다."},{"t":"p","text":"오늘 우리에게는 그런 종교 규칙이 없을지 모릅니다. 그러나 짐의 모양은 닮았습니다. 잘해야 사랑받는다는 짐입니다. 좋은 자식, 좋은 부모, 쓸모 있는 직원이어야 내 자리가 있다는 생각입니다. 거기에 박사님이 말하는 또 다른 멍에가 얹힙니다. 분노와 증오와 두려움입니다. 이 짐들은 밤에 누워도 내려놓아지지 않습니다. 하나님마저 점수를 매기는 분으로 알고 있다면 쉴 곳은 어디에도 없습니다. 박사님은 이것을, 조건적인 하나님 앞에서는 딸이 엄마 눈치를 보듯 늘 불안할 수밖에 없다고 표현합니다."},{"t":"h3","text":"\"다\" 오라고 하셨습니다"},{"t":"p","text":"이 초대에서 눈여겨볼 낱말은 '다'입니다. 예수님은 짐을 어느 정도 덜어 낸 사람만 오라고 하지 않으셨습니다. 먼저 생활을 고치고 오라고도, 자격을 갖추고 오라고도 하지 않으셨습니다. 짐을 진 채로, 지친 그대로 오라고 하셨습니다. 초대에 붙은 조건이 하나도 없습니다."},{"t":"verse","ref":"마태복음 11장 29절에서 30절","text":"나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라 그리하면 너희 마음이 쉼을 얻으리니 이는 내 멍에는 쉽고 내 짐은 가벼움이라"},{"t":"p","text":"예수님은 자신을 마음이 온유하고 겸손한 분으로 소개하십니다. 찾아가면 혼날 것 같은 분이 아니라는 뜻입니다. 박사님은 이 말씀을 이렇게 풀어 읽습니다. 너희가 질 수 없는 짐을 내가 대신 져 주러 왔다는 것입니다. 쉼은 우리가 애써서 이루어 내는 성과가 아닙니다. \"내가 너희를 쉬게 하리라\" 하신 분이 주시는 선물입니다."},{"t":"p","text":"그런데 멍에를 메라는 말씀이 이상하게 들립니다. 쉬게 해 주신다면서 왜 멍에일까요. 멍에는 본래 두 마리 소가 나란히 메는 기구입니다. 혼자 끌던 수레를 곁에서 함께 끌어 주는 이가 생긴다는 뜻으로 들을 수 있습니다. 박사님은 예수님이 지워 주시는 멍에를 그분의 조건 없는 사랑이라고 설명하며, 그 멍에는 메는 순간 오히려 홀가분해진다고 말합니다. 사랑받아야 한다는 짐이 이미 사랑받고 있다는 사실로 바뀌기 때문입니다."},{"t":"h3","text":"누이시는 분"},{"t":"p","text":"옛 시인 다윗은 이 쉼을 이렇게 노래했습니다."},{"t":"verse","ref":"시편 23편 1절에서 2절","text":"여호와는 나의 목자시니 내게 부족함이 없으리로다 그가 나를 푸른 풀밭에 누이시며 쉴 만한 물 가로 인도하시는도다"},{"t":"p","text":"박사님은 이 시에서 누가 누워 있고 누가 서서 일하는지를 보라고 합니다. 누워 있는 쪽은 나이고, 서서 다니며 돌보는 쪽은 하나님이십니다. 양이 목자를 섬기는 것이 아니라 목자가 양을 섬깁니다. 내가 하나님을 위해 무엇을 해 드려야 하는 존재라면 나는 늘 모자라지만, 하나님이 나를 돌보시는 목자라면 내게 모자람이 없다는 것입니다."},{"t":"p","text":"성경이 이레에 하루를 쉬는 날로 정해 둔 것도 같은 뜻입니다. 박사님은 그것이 쉬라는 명령이기 전에 내가 너희를 쉬게 해 주겠다는 약속의 표시라고 설명합니다. 박사님 자신도 쉬는 날 예배 시간에조차 축구 중계 같은 다른 생각으로 마음이 흩어지던 경험을 고백하며, 사람은 스스로의 힘으로는 마음의 쉼을 만들어 내지 못한다고 말합니다. 그래서 쉼은 받는 것입니다."},{"t":"p","text":"박사님은 몸의 쉼도 소홀히 하지 않습니다. 피곤하면 하던 일을 멈추고 삼사십 분을 통째로 떼어 불을 끄고 눈을 감는다고 합니다. 쉬어야 할 때 쉬지 않고 일부터 끝내려는 습관이 몸을 상하게 한다고 말합니다. 몸을 누이는 일과 마음을 맡기는 일은 함께 갑니다. 오늘 밤 자리에 누울 때, 나를 누이시는 분이 계심을 떠올려 보십시오."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"예수님은 지친 사람을 꾸짖지 않으시고 \"다 내게로 오라\"고 부르십니다. 우리를 가장 무겁게 누르는 짐은 잘해야 사랑받는다는 생각인데, 그분은 그 짐을 대신 지시고 조건 없는 사랑을 주십니다. 참된 쉼은 문제가 다 풀린 뒤에 오는 것이 아니라 나를 돌보시는 분을 믿고 맡길 때 옵니다. 쉼은 우리가 이루는 것이 아니라 받는 선물입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 최근에 정말 잘 쉬었다고 느낀 때가 언제입니까? 어디에서, 누구와 있었습니까?"},{"t":"q","i":1,"text":"둘째, 누워도 내려놓아지지 않는 나의 '무거운 짐'은 무엇입니까? 말할 수 있는 만큼만 나누어 주십시오."},{"t":"q","i":2,"text":"셋째, 누군가의 곁에 있는 것만으로 마음이 놓였던 경험이 있습니까? 그 사람의 무엇이 나를 쉬게 했습니까?"},{"t":"q","i":3,"text":"넷째, \"잘해야 사랑받는다\"는 생각이 내 삶에 어떤 영향을 주어 왔습니까? 그 짐을 내려놓는다면 무엇이 달라질 것 같습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"마태복음 11장 28절","text":"수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루에 한 번, 15분을 통째로 떼어 전화기를 멀리 두고 눈을 감습니다. 천천히 숨을 쉬며 \"저를 쉬게 해 주십시오\" 하고 마음으로 말씀드립니다."},{"t":"act","i":1,"text":"이번 주에 하루를 정해 반나절은 해야 할 일의 목록을 내려놓고, 나무가 있는 곳을 천천히 걸어 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 제7부의 마무리입니다. 성령, 기도, 용서, 감사가 모두 '해야 할 일'의 목록이 아니라 쉼 안에서 받는 선물이었음을 되짚어 주십시오. 쉬지 못하는 것을 믿음이 없는 탓으로 돌리는 말은 삼가 주십시오. 생계와 돌봄 때문에 쉴 틈이 없는 분에게 \"쉬세요\"라는 말은 공허합니다. 그분들의 고단함을 먼저 알아주고, 5분의 쉼이라도 함께 찾아보십시오. 오랜 불면이나 깊은 우울로 힘들어하는 분에게는 의사의 도움을 받는 일이 하나님이 주시는 돌봄을 받는 길이기도 하다고 말씀해 주십시오. 일주일 중 어느 날에 예배해야 하느냐는 질문이 나오면, 이 과의 초점은 날짜가 아니라 쉬게 해 주시겠다는 약속이라고 답하고 넘어가십시오. 모임 끝에 2분쯤 함께 눈을 감고 조용히 쉬어 보면 좋습니다."}],"inPart":7,"audio":"audio/42.m4a"},{"id":"43","kind":"part","no":null,"part":8,"title":"사랑은 흘러갑니다","sub":null,"key":null,"blocks":[{"t":"p","text":"여기까지 오시느라 애쓰셨습니다. 우리는 내 몸이 들려주는 이야기에서 출발해, 사랑이신 하나님을 만나고, 십자가와 빈 무덤을 지나, 그 사랑 안에서 하루를 사는 법을 배웠습니다. 이제 마지막 다섯 걸음이 남았습니다."},{"t":"p","text":"받은 사랑은 나에게서 멈추지 않고 곁에 있는 사람에게로 흘러갑니다. 그래서 이 부의 첫 과는 \"누가 내 이웃입니까\"를 묻습니다. 그런데 막상 밖으로 나서려 하면 우리를 붙드는 것들이 있습니다. 설명되지 않는 고통이 있고, 마음 밑바닥의 두려움이 있습니다. 아플 때 하나님은 어디 계신지, 하나님을 생각하면 왜 무서운지, 피하지 않고 물어보려 합니다. 그다음에는 성경의 마지막 장면으로 가서, 이 긴 이야기가 어디에서 끝나는지를 함께 봅니다. 눈물을 닦아 주시는 손이 거기 있습니다."},{"t":"p","text":"그리고 마지막 과에서 우리는 지나온 길을 돌아보고 일상으로 돌아갑니다. 무엇을 해내야 하는 사람으로서가 아니라, 사랑받은 사람으로서입니다."}],"inPart":8,"audio":"audio/43.m4a"},{"id":"44","kind":"lesson","no":36,"part":null,"title":"누가 내 이웃입니까","sub":"사랑하며 살고 싶은데, 그 사랑은 어디에서 나오는 것일까요?","key":{"ref":"누가복음 10장 33절에서 34절","text":"어떤 사마리아 사람은 여행하는 중 거기 이르러 그를 보고 불쌍히 여겨 가까이 가서 기름과 포도주를 그 상처에 붓고 싸매고 자기 짐승에 태워 주막으로 데리고 가서 돌보아 주니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 \"내게로 와서 쉬라\"는 초대를 들었습니다. 쉼을 얻은 사람의 눈에는 그제야 곁에 있는 사람이 보이기 시작합니다. 이번 과부터는 그 사랑이 나를 지나 어디로 흘러가는지를 함께 살펴봅니다."},{"t":"p","text":"이상구 박사의 건강강의에는 뉴스타트 센터에서 설거지 봉사를 하는 한 분의 이야기가 나옵니다. 그분은 본래 위장이 몹시 좋지 않아 참가자로 센터에 왔던 분입니다. 그 뒤로 일 년 남짓 보수 없이 설거지를 맡아 왔는데, 강의는 그분의 얼굴이 환하고 웃는 낯이 어린아이 같다고 전합니다. 본인도 그 일이 즐겁고 몸 상태가 일생 중 가장 좋다고 말했다고 합니다."},{"t":"p","text":"대가도 없는 일인데 왜 기쁠까요. 쌓여 가는 그릇을 보면서 어떻게 콧노래가 나올까요. 우리도 한두 번은 겪어 보았습니다. 누군가를 돕고 돌아오는 길에 까닭 없이 마음이 흐뭇했던 날 말입니다. 반대로 \"도와야 하니까\" 억지로 한 일은 하고 나서도 마음이 무겁습니다. 같은 선행인데 무엇이 다를까요. 예수님이 들려주신 가장 유명한 이야기 하나가 이 질문에 답합니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"\"내 이웃이 누구입니까\""},{"t":"p","text":"어느 날 율법사 한 사람이 예수님을 찾아옵니다. 율법사는 당시 성경의 규정을 연구하고 가르치던 전문가입니다. 그가 묻습니다. 무엇을 해야 영원한 생명을 얻겠느냐고. 예수님이 율법에 무엇이라 적혀 있느냐고 되물으시자 그는 막힘 없이 대답합니다. 마음과 목숨과 힘과 뜻을 다해 하나님을 사랑하고, 이웃을 내 몸처럼 사랑하라는 것이라고. 예수님은 그 대답이 옳다고 하셨습니다."},{"t":"p","text":"그런데 성경은 그다음 장면을 이렇게 적습니다."},{"t":"verse","ref":"누가복음 10장 29절","text":"그 사람이 자기를 옳게 보이려고 예수께 여짜오되 그러면 내 이웃이 누구니이까"},{"t":"p","text":"박사님은 \"자기를 옳게 보이려고\"라는 성경 자체의 진단에 주목합니다. 그는 아마 형편껏 가난한 이웃 몇을 돕고 있었을 것입니다. 그러나 그것은 구원을 받아야 하니까 하는 일이었다고 박사님은 짚습니다. \"내 이웃이 누구입니까\"라는 질문은 결국 \"어디까지 사랑하면 합격입니까\"라는 질문입니다. 사랑의 범위를 정해 놓고, 그만큼은 했노라고 안심하고 싶은 마음입니다."},{"t":"p","text":"이 마음이 우리에게 낯설지 않습니다. 우리도 이만하면 괜찮은 사람이라고 스스로를 다독이며 삽니다. 하지만 \"마음을 다하고 목숨을 다하여\" 사랑하라는 말 앞에서 \"다 했습니다\"라고 말할 수 있는 사람은 없습니다. 예수님은 그를 꾸짖지 않으시고, 대신 이야기 하나를 들려주십니다."},{"t":"h3","text":"지나간 사람들, 멈춰 선 한 사람"},{"t":"p","text":"어떤 사람이 예루살렘에서 여리고로 내려가다가 강도를 만났습니다. 강도들은 옷을 벗기고 때려 거의 죽게 된 그를 버려두고 갔습니다. 마침 제사장이 그 길로 지나가다가 그를 보고 피해 갔고, 성전 일을 돕는 레위인도 그렇게 지나갔습니다. 두 사람 다 당시에 율법을 가장 잘 지킨다고 인정받던 사람들입니다."},{"t":"p","text":"박사님은 이들이 피해 간 까닭을 이렇게 설명합니다. 죽은 사람의 몸을 만지면 부정해진다는 정결 규정이 있었다는 것입니다. 규정을 지키느라 죽어 가는 사람을 두고 간 셈입니다. 나쁜 사람이어서가 아니라, 규정을 지키는 일이 사람을 살리는 일보다 앞에 놓여 있었던 것입니다."},{"t":"p","text":"그때 사마리아 사람 하나가 그 길을 지나갑니다. 사마리아 사람은 유대인들에게 사람대접을 받지 못하던 이들입니다. 그가 멈춰 섭니다. 다가가서 상처에 포도주와 기름을 붓고 싸맵니다. 피를 묻히고 죽어 가는 몸에 손을 댔으니 규정으로 보면 어긴 것입니다. 그러나 박사님은 말합니다. 진짜 율법, 곧 사랑을 지킨 사람은 오히려 규정을 어긴 이 사마리아 사람이었다고. 사랑이 가장 높은 법이기 때문입니다."},{"t":"h3","text":"우리는 먼저 강도 만난 사람이었습니다"},{"t":"p","text":"이 이야기를 우리는 보통 \"너희도 착한 사마리아 사람이 되라\"는 교훈으로 듣습니다. 틀린 말은 아닙니다. 그런데 박사님은 이 이야기를 한 겹 더 들어가 읽습니다. 천대받는 사마리아 사람의 모습으로 찾아와 조건 없는 사랑을 행한 분, 그분이 바로 예수님이라는 것입니다."},{"t":"p","text":"그렇게 읽으면 길가에 쓰러진 사람이 누구인지도 달라집니다. 율법사 자신이, 그리고 우리가 바로 강도 만난 사람입니다. 상처를 입고도 스스로 그런 줄 모른 채 쓰러져 있는 사람입니다. 제사장과 레위인이 지나간 것도, 그들 역시 같은 처지여서 남을 일으킬 힘이 없었기 때문이라고 박사님은 설명합니다."},{"t":"p","text":"박사님은 여기에 우리 몸 이야기를 잇습니다. 우리 세포 속에는 손상된 유전자를 알아서 찾아가 고치는 복구 효소가 있습니다. 우리가 부탁한 적도 없고, 고장이 난 줄도 모르는데, 자는 동안에도 찾아와 고칩니다. 하나님의 사랑이 그와 같다는 것입니다. 우리가 청하기도 전에, 값을 치르기도 전에 먼저 찾아와 싸매십니다."},{"t":"verse","ref":"누가복음 10장 35절","text":"그 이튿날 그가 주막 주인에게 데나리온 둘을 내어 주며 이르되 이 사람을 돌보아 주라 비용이 더 들면 내가 돌아올 때에 갚으리라 하였으니"},{"t":"p","text":"쓰러진 사람은 한 푼도 내지 않았습니다. 비용은 모두 사마리아 사람이 냈고, 더 들 비용까지 미리 떠맡았습니다. 박사님은 이 대목을 예수님이 우리의 빚을 대신 갚으신 일과 연결하고, \"돌아올 때\"라는 말에서 다시 오시겠다는 약속을 읽습니다."},{"t":"h3","text":"사랑은 받은 만큼 흘러갑니다"},{"t":"p","text":"예수님은 이야기를 마치고 \"가서 너도 이와 같이 하라\"고 하셨습니다. 박사님은 이 말씀을 \"이렇게 해야 구원받는다\"는 조건으로 읽지 말라고 당부합니다. 이웃에게 베푸는 선행은 구원의 조건이 아니라, 조건 없는 사랑으로 구원받은 사람에게서 자연스럽게 나오는 반응이라는 것입니다. 업혀서 주막까지 와 본 사람만이 남을 업을 수 있습니다."},{"t":"p","text":"처음의 질문으로 돌아가 봅니다. 봉사가 왜 기쁠까요. 건강강의는 이렇게 풉니다. 대가를 바라고 돕는 것은 일이지만, 아무 대가 없이 섬길 때는 자기도 모르게 행복해지고 그 순간 뇌파가 편안한 알파파로 바뀐다고 합니다. 도움이 필요한 사람에게 도움이 가기를 가장 바라시는 분은 하나님이시므로, 누군가 그 일을 할 때 가장 기뻐하시는 분도 하나님이십니다. 박사님은 그 기쁨이 생기, 곧 생명의 기운으로 되돌아와 돕는 사람의 유전자를 켠다고 설명합니다."},{"t":"p","text":"그러니 순서가 중요합니다. 사랑하려고 애쓰기 전에, 먼저 사랑받은 사람임을 아는 것입니다. 물이 가득 찬 그릇에서 물이 넘치듯, 사랑은 짜내는 것이 아니라 흘러넘치는 것입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"선한 사마리아인 이야기는 \"착하게 살라\"는 요구이기 전에, 길가에 쓰러진 나를 누군가 먼저 찾아와 싸매고 업어 주었다는 소식입니다. 우리는 사마리아 사람이 되기 전에 먼저 강도 만난 사람이었습니다. 이웃 사랑은 하나님께 합격하기 위한 숙제가 아니라, 값없이 받은 사랑이 나를 지나 곁의 사람에게 흘러가는 일입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가를 돕고 나서 까닭 없이 기분이 좋았던 기억이 있습니까? 반대로 억지로 도와서 마음이 무거웠던 적은 없었습니까?"},{"t":"q","i":1,"text":"둘째, 내가 길가에 쓰러진 사람 같았을 때, 멈춰 서서 나를 도와준 사람이 있었습니까? 그때 어떤 마음이 들었습니까?"},{"t":"q","i":2,"text":"셋째, \"어디까지 하면 되느냐\"고 선을 긋고 싶어지는 관계가 있습니까? 그 마음 밑에는 무엇이 있는 것 같습니까?"},{"t":"q","i":3,"text":"넷째, 이 이야기를 \"네가 먼저 업혀 온 사람이다\"라는 말로 들으면, 이웃을 대하는 마음이 어떻게 달라질 것 같습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한일서 4장 19절","text":"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 한 번, 아무에게도 알리지 않고 대가를 바라지 않는 작은 도움을 건네 봅니다. 하고 난 뒤 내 마음이 어떤지 가만히 살펴봅니다."},{"t":"act","i":1,"text":"지금까지 나를 '업어 준' 사람 한 분을 떠올리고, 짧은 안부나 감사의 말을 전합니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서 참석자들은 쉽게 \"나는 남을 너무 안 돕고 살았다\"는 자책으로 흐릅니다. 이야기의 무게를 \"더 착해지라\"에서 \"나는 먼저 도움받은 사람이다\"로 옮겨 주십시오. 둘째 질문에 시간을 넉넉히 쓰는 것이 좋습니다. 제사장과 레위인을 나쁜 사람으로 몰아가지 않도록 합니다. 그들도 쓰러진 사람이었다는 박사님의 설명을 나누면 서로를 판단하는 분위기를 피할 수 있습니다. 봉사와 건강의 연결은 \"봉사하면 병이 낫는다\"는 약속으로 들리지 않게, 사랑으로 하는 일이 마음과 몸을 편안하게 한다는 정도로 나누십시오."}],"inPart":8,"audio":"audio/44.m4a"},{"id":"45","kind":"lesson","no":37,"part":null,"title":"아플 때 하나님은 어디 계실까요","sub":"이 고통은 내가 무엇을 잘못해서 받는 벌일까요?","key":{"ref":"요한복음 9장 3절","text":"예수께서 대답하시되 이 사람이나 그 부모의 죄로 인한 것이 아니라 그에게서 하나님이 하시는 일을 나타내고자 하심이라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 길가에 쓰러진 사람을 찾아와 싸매 주는 사랑을 보았습니다. 그런데 막상 내가 쓰러져 있을 때에는 그 사랑이 잘 보이지 않습니다. 오히려 다른 목소리가 먼저 들립니다."},{"t":"p","text":"큰 병을 진단받은 날, 아이가 아픈 날, 하던 일이 무너진 날, 사람은 거의 본능처럼 묻습니다. \"내가 뭘 잘못했길래.\" 곁에 있는 사람들도 비슷하게 말합니다. 위로하려고 꺼낸 말인데, 듣다 보면 어딘가에 원인이 있을 거라는 이야기가 됩니다. 아픈 것도 서러운데, 죄인까지 된 기분이 듭니다."},{"t":"p","text":"이상구 박사도 오랫동안 아픈 사람이었습니다. 역류성 식도염, 위산과다, 십이지장궤양, 신경성 대장염, 류마티스 관절염을 비롯해 열다섯 가지 병을 앓았다고 고백합니다. 의사이면서 환자였던 그에게 길을 열어 준 것은 성경의 한 구절이었습니다. 그는 이 말씀을 통해 자신의 고통이 하나님의 벌이 아니었음을 깨닫고, 오히려 감사하게 되었다고 말합니다. 오늘은 그 구절을 함께 읽습니다. 아플 때 하나님은 어디에 계실까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"\"누구의 죄 때문입니까\""},{"t":"p","text":"예수님과 제자들이 길을 가다가 태어날 때부터 앞을 보지 못하는 사람을 만났습니다. 제자들이 묻습니다."},{"t":"verse","ref":"요한복음 9장 2절","text":"제자들이 물어 이르되 랍비여 이 사람이 맹인으로 난 것이 누구의 죄로 인함이니이까 자기니이까 그의 부모니이까"},{"t":"p","text":"제자들은 나쁜 뜻으로 물은 것이 아닙니다. 그 시대 사람들이 다 그렇게 생각했습니다. 건강강의에서 박사님은 병의 이름에까지 그 생각이 새겨져 있었다고 설명합니다. 중풍은 하나님이 몽둥이로 치신 것이고, 나병은 채찍으로 치신 것이라고 여겼다는 것입니다. 그런 병에 걸린 사람은 죄가 많아 이미 끝난 사람으로 취급받았습니다."},{"t":"p","text":"박사님은 제자들의 질문 자체가 \"죄를 지으면 벌을 받는다\"는 조건적인 사고방식의 증거라고 말합니다. 곁에서 따라다니던 제자들조차 하나님을 여전히 죄 많으면 병 주시는 분으로 알고 있었던 것입니다. 그리고 그 질문은 오늘 우리 입에서도 똑같이 나옵니다."},{"t":"p","text":"예수님의 대답은 짧고 분명합니다. 이 사람의 죄도, 부모의 죄도 아니라고 하셨습니다. 고통당하는 사람에게 \"네 죄 때문\"이라고 말하는 모든 목소리를 예수님이 직접 막아서신 것입니다. 박사님은 이 한 구절을 자신의 질병관 전체의 근거로 삼습니다. 질병은 하나님이 죄의 대가로 내리신 벌이 아닙니다."},{"t":"h3","text":"범인을 찾지 않으시고 곁으로 오십니다"},{"t":"p","text":"뒷부분, \"하나님이 하시는 일을 나타내고자 하심\"이라는 말은 조심해서 읽어야 합니다. 하나님이 자기를 드러내려고 일부러 한 사람을 앞 못 보게 만드셨다는 뜻일까요. 박사님은 그런 해석을 강하게 물리칩니다. 그것은 또 하나의 무서운 하나님을 만드는 일이기 때문입니다."},{"t":"p","text":"이 말씀의 뜻은 이렇습니다. 이 사람의 어둠은 하나님이 만드신 것이 아니지만, 하나님은 바로 그 어둠의 자리에서 당신이 어떤 분인지를 보여 주시겠다는 것입니다. 실제로 예수님은 원인을 따지는 토론을 거기서 끝내시고 곧바로 몸을 굽히셨습니다. 땅에 침을 뱉어 진흙을 이겨 그의 눈에 바르시고, 실로암 못에 가서 씻으라고 하셨습니다."},{"t":"p","text":"말씀 한마디로도 고치실 수 있는 분이 왜 굳이 손에 흙을 묻히셨을까요. 박사님은 평생 앞을 보지 못한 그 사람의 처지에 맞추어, 그가 알아들을 수 있는 방식으로 다가가신 배려라고 설명합니다. 누구 때문인지 묻는 자리가 있고, 고통 한가운데로 걸어 들어가는 자리가 있습니다. 예수님은 언제나 걸어 들어가시는 쪽이었습니다."},{"t":"h3","text":"욥이 몰랐던 것"},{"t":"p","text":"성경에는 고난을 정면으로 다룬 책이 있습니다. 욥기입니다. 욥은 누구나 인정하는 바르고 착한 사람이었습니다. 그런 그가 하루아침에 재산과 자녀를 잃고 온몸에 병까지 얻습니다."},{"t":"p","text":"이 책의 첫머리는 독자에게 욥이 모르는 사실 하나를 알려 줍니다. 재앙을 일으킨 손이 하나님의 손이 아니라는 것입니다. 하나님을 대적하는 자 사탄은 하나님께, 주의 손을 펴서 욥의 것을 치시라고 말합니다(욥기 1장 11절). 하나님더러 하시라는 것입니다. 그러나 하나님은 그 역할을 받지 않으십니다. 박사님은 이 대목에서 하나님이 허락하시는 것과 하나님이 행하시는 것은 다르며, 재앙의 손은 사탄의 손이라고 분명히 합니다. 하나님은 욥에게 고통을 주실 생각이 전혀 없으셨다는 것입니다."},{"t":"p","text":"그러나 욥은 이 사실을 몰랐습니다. 그래서 \"주신 이도 여호와시요 거두신 이도 여호와\"라고 말합니다. 흔히 믿음의 절정으로 꼽는 고백입니다. 그런데 박사님은 여기서 욥의 오해가 시작된다고 봅니다. 주신 분은 하나님이 맞지만, 거두어 간 것은 하나님이 아니었기 때문입니다. 박사님의 말입니다. \"하나님은 주어 놓고 빼앗은 적이 없습니다. 왜? 무조건적 사랑이니까.\""},{"t":"p","text":"찾아온 친구들은 처음 이레 동안 말없이 곁에 앉아 있었습니다. 그때가 가장 좋은 위로였습니다. 입을 열자 그들은 \"네가 죄가 있으니 이렇게 된 것이다, 털어놓으라\"고 몰아붙입니다. 욥은 억울함에 하나님을 향해 거친 말을 쏟아 냅니다. 박사님은 욥기의 주인공이 욥의 인내가 아니라, 그 모든 원망을 끝까지 들으시는 하나님의 인내라고 말합니다."},{"t":"h3","text":"귀로 듣던 하나님, 눈으로 뵙는 하나님"},{"t":"p","text":"긴 이야기 끝에 욥은 이렇게 고백합니다."},{"t":"verse","ref":"욥기 42장 5절","text":"내가 주께 대하여 귀로 듣기만 하였사오나 이제는 눈으로 주를 뵈옵나이다"},{"t":"p","text":"욥은 책 전체에서 자기 죄를 인정한 적이 없습니다. 그런데 마지막에 돌이킵니다. 무엇을 돌이켰을까요. 박사님은 하나님에 대한 오해를 돌이킨 것이라고 답합니다. 귀로만 들어 알던 하나님은 잘하면 복 주고 못하면 치시는 분이었습니다. 이제 눈으로 뵌 하나님은 까마귀 새끼까지 먹이시는, 조건 없이 돌보시는 분이었습니다. 욥의 진짜 회복은 재산이 돌아온 것이 아니라 하나님을 다시 알게 된 것이라고 박사님은 말합니다."},{"t":"p","text":"하나님은 마지막에 친구들을 향해, 너희가 나에 대해 한 말이 옳지 않다고 하셨습니다. 고통 앞에서 울부짖은 사람이 아니라, 고통을 죄의 대가라고 설명한 사람들이 틀렸다는 것입니다."},{"t":"p","text":"고난에는 우리가 끝내 다 알 수 없는 부분이 남습니다. 박사님도 어떤 분의 구체적인 고난을 두고 이것은 이래서 온 것이라고 단정하는 일은 당사자에게 짐이 될 수 있으니 삼가야 한다고 당부합니다. 다만 한 가지는 분명히 말할 수 있습니다. 아플 때 하나님은 매를 들고 맞은편에 서 계신 분이 아닙니다. 내 곁에서, 나보다 먼저 아파하시는 분입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"고통 앞에서 우리는 범인을 찾지만, 예수님은 \"누구의 죄도 아니다\" 하시고 곧바로 아픈 사람 곁에 몸을 굽히셨습니다. 하나님은 고통을 보내시는 분이 아니라 고통 속으로 찾아오시는 분입니다. 병과 불행은 내가 버림받았다는 증거가 아닙니다. 그 자리는 오히려 귀로만 듣던 하나님을 눈으로 뵙게 되는 자리가 될 수 있습니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 몸이 아프거나 힘들었을 때, 누군가의 어떤 말이나 행동이 가장 위로가 되었습니까?"},{"t":"q","i":1,"text":"둘째, 어려운 일을 겪으면서 \"내가 뭘 잘못해서 이런 일이 생겼나\" 하고 생각해 본 적이 있습니까? 그 생각은 나를 어디로 데려갔습니까?"},{"t":"q","i":2,"text":"셋째, 욥의 친구들처럼, 위로하려다 오히려 상처를 준 적이나 그런 말을 들은 적이 있습니까?"},{"t":"q","i":3,"text":"넷째, \"하나님은 주어 놓고 빼앗은 적이 없다\"는 말을 들으면 어떤 마음이 듭니까? 지금 겪는 어려움을 다르게 보게 하는 점이 있습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"욥기 42장 5절","text":"내가 주께 대하여 귀로 듣기만 하였사오나 이제는 눈으로 주를 뵈옵나이다"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아프거나 힘든 시간을 보내는 한 사람을 찾아가거나 연락합니다. 원인을 묻거나 조언하지 않고, 그저 곁에 있어 주고 들어 줍니다."},{"t":"act","i":1,"text":"\"내 탓이다, 벌 받는 거다\"라는 생각이 올라올 때마다 오늘의 핵심 성구를 소리 내어 읽습니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 실제로 아픈 분, 가족을 잃은 분이 함께 있을 수 있는 자리임을 기억하십시오. 설명보다 듣는 시간을 길게 잡습니다. \"그러면 왜 하나님은 막지 않으셨느냐\"는 질문이 나올 수 있습니다. 서둘러 답하려 하지 말고, 성경도 욥에게 이유를 다 설명하지 않았으며 다만 하나님이 어떤 분인지를 보여 주셨다고 나누면 됩니다. 특정한 사람의 병이나 불행을 두고 원인을 풀이하는 일은 피하십시오. 또한 이 과가 치료를 가볍게 여기라는 뜻으로 들리지 않게 합니다. 병원 치료를 받는 것과 하나님의 사랑을 신뢰하는 것은 함께 가는 일입니다."}],"inPart":8,"audio":"audio/45.m4a"},{"id":"46","kind":"lesson","no":38,"part":null,"title":"사랑 안에는 두려움이 없습니다","sub":"하나님을 생각하면 왜 마음 한구석이 무서울까요?","key":{"ref":"요한일서 4장 18절","text":"사랑 안에 두려움이 없고 온전한 사랑이 두려움을 내쫓나니 두려움에는 형벌이 있음이라 두려워하는 자는 사랑 안에서 온전히 이루지 못하였느니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 아픔이 하나님의 벌이 아니라는 것을 보았습니다. 그래도 마음 깊은 곳의 두려움은 쉽게 물러가지 않습니다. 머리로는 알겠는데 가슴은 여전히 움츠러듭니다."},{"t":"p","text":"이상구 박사는 많은 사람이 하나님을 무서워하게 된 까닭을 어린 시절에서 찾습니다. 어른들이 아이를 달래며 \"울면 하나님이 이놈 하신다\"고 말하던 것을 예로 듭니다. 그렇게 배운 아이는 자라서도 무슨 일이 잘못되면 먼저 움찔합니다. 종교가 없는 분들도 크게 다르지 않습니다. 나쁜 일이 겹치면 \"내가 무슨 죄를 지었나\" 싶고, 좋은 일이 이어지면 오히려 \"이러다 큰일 나지\" 하며 불안해합니다."},{"t":"p","text":"제6과에서 들은 박사님 자신의 고백도 같은 자리를 가리킵니다. 한때 확고한 무신론자였던 그는, 돌아보니 그 이유가 하나님이 계시면 벌을 받을까 봐, 아예 안 계시기를 바랐던 두려움 때문이었다고 말합니다. 믿는 사람도, 안 믿는 사람도 같은 두려움 위에 서 있었던 셈입니다. 이 두려움은 어디에서 왔고, 어떻게 하면 떠나갈까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"두려움은 어디에서 옵니까"},{"t":"p","text":"오늘의 성구는 예수님의 제자 요한이 노년에 쓴 편지에 나옵니다. 그는 \"하나님은 사랑이시라\"고 쓴 바로 뒤에 이 말을 적었습니다. 사랑 안에는 두려움이 없다고, 온전한 사랑이 두려움을 내쫓는다고."},{"t":"p","text":"박사님은 여기서 \"온전한 사랑\"을 완전한 사랑, 곧 조건 없는 사랑이라고 풉니다. 사람의 사랑에는 대개 조건이 붙습니다. 내 말을 들으면 예뻐하고 안 들으면 서운해합니다. 그래서 조건 있는 사랑 곁에는 늘 두려움이 따라다닙니다. 조건을 채우지 못하면 버림받을지 모른다는 두려움입니다. 그러나 조건이 없는 사랑에는 애초에 두려워할 이유가 없습니다."},{"t":"p","text":"\"두려움에는 형벌이 있음이라\"는 구절은 조금 어렵게 들립니다. 박사님은 여러 번역을 나란히 놓고 그 뜻을 이렇게 정리합니다. 두려움은 '하나님이 벌 주신다'고 생각할 때 생기는 것이라고. 그러니 하나님이 무섭다면, 그것은 내 죄가 남달리 커서가 아닙니다. 하나님을 아직 벌 주시는 분으로 오해하고 있다는 표시일 뿐입니다."},{"t":"p","text":"이 두려움의 시작을 우리는 제12과에서 보았습니다. 에덴동산에서 사람은 하나님을 두려워한 적이 없었습니다. 그런데 어느 날 숨었습니다. 박사님은 말합니다. 하나님이 달라지신 것이 아니라, 사람이 하나님을 조건적인 분으로 오해하기 시작한 것이라고. 두려움은 하나님 쪽에서 시작된 것이 아닙니다."},{"t":"h3","text":"두려움이 하는 일"},{"t":"p","text":"두려움은 마음에만 머물지 않습니다. 먼저 사람 사이를 상하게 합니다. 박사님은 그 사슬을 이렇게 그립니다. 조건적인 사랑이 있으면 상과 벌이 생기고, 벌이 있으면 두려움이 생기고, 두려움이 있으면 위선이 생깁니다. 벌이 무서우니 잘못을 숨기고, 괜찮은 척을 하게 됩니다. 성경에는 아브라함의 아내 사라가 속으로 웃고도 겁이 나서 \"웃지 않았다\"고 둘러대는 장면이 있는데, 박사님은 이를 두려움이 거짓을 낳는 예로 듭니다. 하나님이 바라시는 것은 겁에 질린 충성이 아니라 있는 그대로의 솔직한 대화입니다."},{"t":"p","text":"두려움은 몸에도 흔적을 남깁니다. 건강강의에서 박사님은 한 실험을 소개합니다. 실험동물에게 벚꽃 향기를 뿌려 주면서 동시에 전기 충격을 주기를 되풀이하자, 나중에는 향기만 맡아도 공포 반응을 보였습니다. 놀라운 것은 그다음입니다. 그 동물들에게서 태어난 새끼는 그 향기를 한 번도 맡아 본 적이 없는데도 똑같이 두려워했다고 합니다. 연구자들은 유전자 상태가 달라져 있다는 것까지 확인했습니다. 박사님은 두려움이 이렇게 몸 깊은 곳에 새겨지고 대물림될 수 있다고 설명합니다."},{"t":"p","text":"앞의 과들에서 배운 대로, 두려움과 걱정에 사로잡히면 뇌파가 빠른 베타파에 머물고, 평안할 때에는 느린 알파파로 바뀐다고 박사님은 설명합니다. 두려움이 좋은 유전자의 스위치를 끄는 쪽으로 일한다면, 평안은 켜는 쪽으로 일한다는 것입니다. 그래서 두려움을 내쫓는 일은 마음만이 아니라 몸을 위해서도 중요합니다."},{"t":"h3","text":"내쫓는 것은 빛입니다"},{"t":"p","text":"그러면 두려움을 어떻게 내쫓을까요. \"두려워하지 말자\"고 이를 악물면 될까요. 어두운 방에서 어둠을 퍼내려고 애쓰는 사람은 없습니다. 불을 켜면 됩니다. 박사님의 그림이 바로 이것입니다. 빛이 들어오면 어둠이 저절로 사라지듯, 조건 없는 사랑이 마음에 들어오면 두려움과 미움과 분노가 저절로 물러간다는 것입니다. 성경은 두려움을 '이기라'고 하지 않고, 사랑이 두려움을 '내쫓는다'고 말합니다. 주어가 내가 아니라 사랑입니다."},{"t":"p","text":"박사님은 엄마 품의 비유도 듭니다. 무서운 꿈을 꾼 아이는 엄마가 안아 주면 금세 진정됩니다. 그런데 진짜 강도를 만났다면 엄마 품에 안겨도 여전히 무섭습니다. 엄마가 강도를 이길 수 없다는 것을 알기 때문입니다. 하나님의 품은 다릅니다. 하나님은 우리의 마지막 강도인 죽음까지 이기신 분입니다. 제25과에서 본 빈 무덤이 그 증거입니다. 그래서 그 품에서는 두려움이 실제로 쫓겨납니다."},{"t":"h3","text":"현실은 그대로여도"},{"t":"p","text":"박사님에게는 부정맥이 있었습니다. 의사이니 자기 맥을 짚어 보면 상태가 얼마나 심각한지 압니다. 자다가 심장이 멎는 경험까지 했다고 합니다. 원인은 마음의 고통이었습니다. 병을 앓던 아들에게서 차마 듣기 힘든 말을 들어야 했던 시절입니다. 억장이 무너지는 그 시간에 박사님은 뜻밖의 것을 배웁니다. 젊은 날 자신이 하나님을 향해 할 말 못 할 말을 다 쏟아 냈을 때, 하나님이 얼마나 아프셨을까 하는 것입니다. 아들에게서 받은 아픔을 통해, 자신이 하나님께 드렸던 아픔을 하나님 편에서 헤아리게 된 것입니다."},{"t":"p","text":"그가 이른 결론은 이렇습니다. \"현실은 내가 변화시킬 수 없지만 이 두렵다는 것은 없앨 수 있다.\" 병이 하루아침에 사라진 것도, 아들의 형편이 곧 나아진 것도 아닙니다. 그러나 조건 없이 사랑받고 있다는 믿음이 두려움을 몰아내는 길이었고, 그 믿음이 마음을 지키고 몸의 회복에도 힘이 되었다고 박사님은 말합니다."},{"t":"p","text":"이것은 약을 끊으라는 이야기가 아닙니다. 치료는 치료대로 받되, 두려움에 끌려다니지 말자는 이야기입니다. 건강강의도 같은 말을 합니다. 큰 병 앞에서는 병 자체보다 공포가 사람을 더 상하게 할 수 있으니, 두려움을 이겨야 치료도 생활의 변화도 제대로 해낼 수 있다는 것입니다. 우리가 할 일은 두려움과 씨름하는 것이 아니라, 사랑의 불을 켜 두는 것입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님이 무섭게 느껴진다면 그것은 내가 나빠서가 아니라 하나님을 아직 벌 주시는 분으로 알고 있기 때문입니다. 두려움은 애써 눌러서 없어지지 않고, 조건 없는 사랑이 들어올 때 빛 앞의 어둠처럼 물러갑니다. \"두려워하지 말라\"는 말씀은 명령이 아니라, 사랑을 알면 자연히 그렇게 될 것이라는 약속입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 적에 무서워하던 것이 있었습니까? 그때 누가, 어떻게 안심시켜 주었습니까?"},{"t":"q","i":1,"text":"둘째, 하나님이나 신이라는 말을 들으면 맨 먼저 어떤 느낌이 떠오릅니까? 그 느낌은 어디에서, 누구에게서 배운 것 같습니까?"},{"t":"q","i":2,"text":"셋째, 두려워서 괜찮은 척하거나 솔직하지 못했던 경험이 있습니까? 반대로 있는 그대로 말해도 괜찮았던 사람이 있었습니까?"},{"t":"q","i":3,"text":"넷째, 요즘 나를 가장 움츠러들게 하는 두려움은 무엇입니까? 그 두려움 곁에 \"그래도 나는 조건 없이 사랑받고 있다\"는 말을 놓아 보면 무엇이 달라집니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한일서 4장 18절","text":"사랑 안에 두려움이 없고 온전한 사랑이 두려움을 내쫓나니"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"잠들기 전, 오늘 나를 불안하게 했던 일 하나를 떠올리고 \"하나님은 나를 조건 없이 사랑하십니다\" 하고 천천히 세 번 말해 봅니다."},{"t":"act","i":1,"text":"가족이나 가까운 사람에게 이번 주만큼은 \"그러면 안 돼\"라는 말 대신 \"괜찮아, 그래도 사랑해\"라는 말을 한 번 건넵니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"성경에는 하나님을 두려워하라는 말도 있지 않습니까\"라는 질문이 나올 수 있습니다. 박사님은 그때의 두려움을 벌 앞에서 떠는 공포가 아니라, 기대보다 훨씬 큰 사랑 앞에서 느끼는 놀라움과 경외로 풉니다. 길게 논쟁하지 말고 이 정도로 나누십시오. \"그럼 마음대로 살아도 됩니까\"라는 물음에는, 사랑받는 아이가 부모를 더 아프게 하려 들지 않듯 사랑은 방종이 아니라 솔직함과 변화를 낳는다고 답하면 됩니다. 두려움이 많다고 털어놓는 분을 믿음이 약하다고 판단하지 마십시오. 두려움을 꺼내 놓는 것 자체가 이미 사랑 안에서 일어나는 일입니다."}],"inPart":8,"audio":"audio/46.m4a"},{"id":"47","kind":"lesson","no":39,"part":null,"title":"눈물을 닦아 주실 날","sub":"이 모든 이야기는 결국 어디에서 끝납니까?","key":{"ref":"요한계시록 21장 4절에서 5절","text":"모든 눈물을 그 눈에서 닦아 주시니 다시는 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라 보좌에 앉으신 이가 이르시되 보라 내가 만물을 새롭게 하노라 하시고"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 사랑이 두려움을 내쫓는다는 것을 배웠습니다. 그런데 두려움이 물러간 자리에도 끝까지 남는 것이 있습니다. 눈물입니다."},{"t":"p","text":"살다 보면 누구에게나 닦이지 않는 눈물이 있습니다. 먼저 떠나보낸 사람, 되돌릴 수 없는 일, 낫지 않는 병. 시간이 약이라고들 하지만, 시간은 눈물을 말릴 뿐 닦아 주지는 못합니다. 어린아이는 넘어져 울다가도 엄마가 달려와 손으로 볼을 닦아 주면 울음을 그칩니다. 상처가 나아서가 아닙니다. 닦아 주는 손이 있기 때문입니다. 어른이 된 우리에게는 그런 손이 없는 것만 같습니다."},{"t":"p","text":"이상구 박사는 세상을 있는 그대로 봅니다. 이 지구가 아직 천국이 아니라고 말합니다. 온통 쓰레기로 덮인 태평양의 해변과, 바다 위에 떠 있는 거대한 쓰레기 섬 이야기를 하면서 지구도 앓고 있다고 말합니다. 사람도 아프고 땅도 아픕니다. 그렇다면 이 이야기는 어디에서 끝날까요. 성경의 맨 마지막 장면을 함께 읽습니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"성경의 마지막 장면"},{"t":"p","text":"성경의 맨 끝에 있는 책이 요한계시록입니다. 무서운 책으로 알려져 있지만, 이 책이 도착하는 곳은 무서운 곳이 아닙니다. 이 책을 쓴 사람은 지난 과의 편지를 쓴 바로 그 요한입니다. \"하나님은 사랑이시라\"고 적었던 사람이 마지막으로 본 장면이 이것입니다."},{"t":"verse","ref":"요한계시록 21장 1절","text":"또 내가 새 하늘과 새 땅을 보니 처음 하늘과 처음 땅이 없어졌고 바다도 다시 있지 않더라"},{"t":"p","text":"그리고 오늘의 핵심 성구가 이어집니다. 하나님이 사람들과 함께 계시면서 모든 눈물을 그 눈에서 닦아 주십니다. 다시는 죽음이 없고, 슬피 우는 일도, 아픈 것도 없습니다. 보좌에 앉으신 분이 말씀하십니다. \"보라 내가 만물을 새롭게 하노라.\""},{"t":"p","text":"성경은 창세기에서 시작했습니다. 흙에 입 맞추듯 숨을 불어넣으신 하나님, 두려워 숨은 사람을 \"네가 어디 있느냐\" 부르며 찾으시던 하나님이었습니다. 그 하나님이 마지막 장면에서 하시는 일은 장부를 펴 놓고 따지는 일이 아닙니다. 우는 사람의 얼굴에 손을 대시는 일입니다. 박사님의 말로 하면, 구원의 종착점은 정죄와 소멸이 아니라 만물을 새롭게 하심입니다."},{"t":"h3","text":"고쳐 쓰지 않고 새로 지으십니다"},{"t":"p","text":"왜 '새' 하늘과 '새' 땅일까요. 지금 것을 고쳐 쓰시면 안 될까요. 박사님은 삶은 계란의 비유를 듭니다. 열을 받아 굳어 버린 삶은 계란은 아무리 애써도 말랑한 날계란으로 되돌릴 수 없습니다. 조건을 따지고 비교하고 경쟁하는 쪽으로 굳어 버린 우리의 본성도 그와 같아서, 조금씩 고쳐서는 안 되고 새로 지어야 한다는 것입니다. 그래서 성경은 부활을 말합니다. 예수님이 다시 살아나신 것처럼, 우리도 새로운 몸을 입은 새 사람으로 다시 지어진다는 약속입니다."},{"t":"p","text":"그곳은 어떤 곳일까요. 박사님은 꽃을 예로 듭니다. 어느 꽃이 다른 꽃보다 더 아름답다고 말할 수 없습니다. 꽃은 저마다 제 모습으로 아름다움의 끝입니다. 새 세상의 사람들이 그와 같다고 합니다. 저마다 아름다워서 비교할 일도, 경쟁할 일도, 조건을 달 일도 없습니다. 천국이 좋은 까닭은 시설이 훌륭해서가 아닙니다. 아무도 아무와 비교되지 않기 때문입니다."},{"t":"p","text":"우리를 울게 한 것들을 떠올려 보면 이 말이 가볍지 않습니다. 비교당해서 울었고, 밀려나서 울었고, 모자란다는 말을 듣고 울었습니다. 그리고 마지막에는 죽음 앞에서 웁니다. 새 하늘과 새 땅은 그 눈물의 뿌리가 통째로 사라진 세상입니다."},{"t":"h3","text":"먼저 우신 분이 닦아 주십니다"},{"t":"p","text":"눈물을 닦아 주시는 그 손은 어떤 손일까요. 박사님은 성경 곳곳에서 하나님의 눈물을 읽어 냅니다. 옛날 온 땅을 덮은 홍수 이야기를 읽으면서도, 그 물을 하나님이 퍼부으신 무기가 아니라 떠나가는 사람들을 보며 흘리신 하나님의 눈물로 읽습니다. 마지막 날에도 하나님은 통곡하실 것이라고 말합니다."},{"t":"p","text":"사람이 하나님을 오해하고 등을 돌릴 때마다, 사람이 서로를 아프게 할 때마다, 한 사람이 병들어 누울 때마다 먼저 아파하신 분이 계십니다. 우리는 제37과에서 아플 때 하나님이 어디 계신지를 물었습니다. 그 답이 여기에서 완성됩니다. 우리의 눈물을 닦아 주실 그분은, 우리보다 먼저 우셨던 분입니다."},{"t":"p","text":"예수님은 세상을 떠나시기 전에 제자들에게 이렇게 약속하셨습니다."},{"t":"verse","ref":"요한복음 14장 3절","text":"가서 너희를 위하여 거처를 예비하면 내가 다시 와서 너희를 내게로 영접하여 나 있는 곳에 너희도 있게 하리라"},{"t":"p","text":"박사님은 이 말씀을 당시 유대의 결혼 풍습으로 풉니다. 신랑은 신부의 집에 찾아가 잔을 건네고, 신부가 그 잔을 받아 마시면 두 사람은 법적으로 부부가 됩니다. 그 뒤 신랑은 아버지 집으로 돌아가 함께 살 집을 짓고, 집이 다 되면 돌아와 신부를 데려가 잔치를 엽니다. 예수님이 \"거처를 예비하러 간다\"고 하신 것은, 받아 줄지 말지를 다시 심사하러 가신 것이 아니라 이미 맺어진 사람을 위해 집을 준비하러 가셨다는 뜻이라고 박사님은 설명합니다. 그러니 기다리는 시간은 불안한 시간이 아니라 설레는 시간입니다."},{"t":"h3","text":"그날은 오늘 시작됩니다"},{"t":"p","text":"이 소망은 먼 훗날의 이야기만은 아닙니다. 박사님은 이 나라가 나중에 갑자기 시작되는 것이 아니라, 조건 없는 사랑을 받아들인 마음 안에서 지금 세워지기 시작한다고 말합니다. 하나님의 영이 우리 마음속에 사랑의 나라, 생명의 나라를 먼저 지으신다는 것입니다."},{"t":"p","text":"그리고 한 가지를 더 일러 줍니다. 그 완성의 날이 오기 전에도, 하나님은 우리를 이미 완성된 사람이나 다름없이 여겨 주신다는 것입니다. 아직 덜 된 나, 여전히 넘어지는 나를 두고 하나님은 \"새것\"이라 부르십니다. 우리는 그 약속을 믿고 오늘을 삽니다."},{"t":"p","text":"이 책의 첫머리에서 우리는 '뉴스타트'라는 말을 만났습니다. 새로운 출발이라는 뜻입니다. 그때는 생활을 바꾸는 여덟 가지 원칙의 이름으로 배웠습니다. 그런데 박사님은 이 말을 훨씬 크게 씁니다. 이 우주도, 이 지구도, 사람도 마침내 모두 새롭게 출발하게 되며, 우리는 그 약속을 믿고 사는 사람들이라는 것입니다. 오늘 내 몸과 마음에서 일어나는 작은 회복은, 장차 만물이 새로워질 그날을 미리 맛보는 일인 셈입니다."},{"t":"p","text":"오늘도 눈물 날 일은 있습니다. 병상은 그대로이고, 빈자리는 여전히 비어 있습니다. 그러나 끝을 아는 사람은 같은 길을 다르게 걷습니다. 이 이야기의 마지막 장에 무엇이 적혀 있는지 알기 때문입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"성경의 마지막 장면은 벌주는 법정이 아니라, 우는 사람의 눈물을 손수 닦아 주시는 하나님의 모습입니다. 그 손은 우리보다 먼저 우셨던 분의 손입니다. 하나님의 사랑은 낡고 상한 것을 버리는 데서 끝나지 않고, 만물을 새롭게 하시는 데서 완성됩니다. 그날은 멀리 있지만, 그 사랑을 받아들인 마음 안에서는 오늘 이미 시작됩니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 울고 있는 나를 달래 주던 사람이 있었습니까? 그 손길에 대해 기억나는 것이 있습니까?"},{"t":"q","i":1,"text":"둘째, 지금도 마음 한편에 남아 있는, 아직 닦이지 않은 눈물이 있다면 나눌 수 있는 만큼 나누어 주십시오."},{"t":"q","i":2,"text":"셋째, \"아무도 아무와 비교되지 않는 세상\"을 상상해 보면 어떤 마음이 듭니까? 내 삶에서 비교가 사라진다면 무엇이 가장 먼저 달라질 것 같습니까?"},{"t":"q","i":3,"text":"넷째, 이야기의 끝이 \"눈물을 닦아 주심\"이라는 것을 안다면, 지금 지나고 있는 어려움을 대하는 마음이 어떻게 달라질 수 있겠습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한계시록 21장 5절","text":"보좌에 앉으신 이가 이르시되 보라 내가 만물을 새롭게 하노라 하시고"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 슬픔 가운데 있는 한 사람을 떠올리고, 말로 위로하려 하기보다 함께 있어 주는 시간을 한 번 냅니다."},{"t":"act","i":1,"text":"하루에 한 번 하늘을 올려다보며 \"보라 내가 만물을 새롭게 하노라\"는 말씀을 조용히 되뇌어 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 사별이나 큰 상실을 겪은 분에게 특히 깊이 닿습니다. 둘째 질문은 말하고 싶은 분만 말하게 하고, 침묵이나 눈물이 있어도 서둘러 넘어가지 마십시오. \"그러면 믿지 않고 돌아가신 우리 부모님은 어떻게 됩니까\" 같은 질문이 나올 수 있습니다. 단정하여 답하지 말고, 하나님은 그분을 우리보다 더 사랑하시며 끝까지 찾으시는 분이라는 것을 지금까지 배운 말씀으로 함께 기억하면 됩니다. 요한계시록의 상징이나 세상 끝의 순서에 대한 질문은 이 자리에서 다루지 말고, 마지막 장면이 어떤 하나님을 보여 주는지에 머무르십시오."}],"inPart":8,"audio":"audio/47.m4a"},{"id":"48","kind":"lesson","no":40,"part":null,"title":"이제, 사랑을 전하는 사람으로","sub":"받은 사랑을 가지고 나는 이제 어떻게 살아가면 될까요?","key":{"ref":"요한복음 13장 34절에서 35절","text":"새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라 너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인 줄 알리라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"마흔 번째 만남입니다. 지난 과에서 우리는 이 이야기의 끝, 눈물을 닦아 주실 날을 바라보았습니다. 오늘은 그 끝을 아는 사람으로서 내일 아침을 어떻게 맞을지를 이야기합니다."},{"t":"p","text":"이상구 박사의 건강강의에는 한 참가자의 이야기가 나옵니다. 그는 처음 왔을 때 강의실 뒷자리에 앉았습니다. 강의를 들어 가면서 확신이 생기자 자리를 앞으로 옮겼습니다. 그리고 다음 기수에는 봉사자로 오고 싶다고 했고, 센터는 그를 받아 주었습니다. 뒷자리에서 앞자리로, 앞자리에서 섬기는 자리로. 누가 시킨 것이 아닙니다."},{"t":"p","text":"한 봉사자의 이야기도 있습니다. 그는 조건 없이 사랑하시는 하나님을 처음 만났다고 하면서, 평생 기도를 해 본 적이 없는데 이제는 기도를 해 보고 싶어졌다고 고백했습니다. 사랑을 받아들인 사람 안에서는 이렇게 무언가가 저절로 움직이기 시작합니다. 첫 만남 때 우리도 뒷자리 어디쯤에 앉아 있었습니다. 지금 나는 어디에 앉아 있습니까. 그리고 여기서 어디로 가게 될까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"우리가 함께 걸어온 길"},{"t":"p","text":"잠시 뒤를 돌아봅니다. 우리는 내 몸 이야기에서 출발했습니다. 유전자에는 스위치가 있고, 그 스위치를 켜는 힘이 생기, 곧 생명의 기운이며, 마음이 몸을 바꾼다는 것을 배웠습니다. 그리고 그 생기의 근원을 찾아가다가 한 문장을 만났습니다. 하나님은 사랑이시라는 문장입니다. 조건이 붙지 않는 사랑, 돌아온 아들에게 달려가는 아버지, 찾을 때까지 찾으시는 분이었습니다."},{"t":"p","text":"그런 다음 무엇이 잘못되었는지를 살폈습니다. 문제의 뿌리는 하나님에 대한 오해였습니다. 사람은 두려워 숨었고, 하나님은 \"네가 어디 있느냐\" 부르며 찾아오셨습니다. 죄는 끊어진 생명줄이었고, 죽음은 벌이 아니라 그 결과였습니다. 그 오해를 풀려고 예수님이 오셨습니다. 정죄하지 않으시고, 우물가에 앉아 기다리시고, 병든 사람 곁에 서시고, 무릎을 꿇어 발을 씻기셨습니다."},{"t":"p","text":"십자가에서 우리는 그 사랑의 끝을 보았습니다. 못 박는 사람들을 위해 용서를 구하시고, 곁에 달린 강도에게 낙원을 약속하시고, \"다 이루었다\" 하셨습니다. 그리고 빈 무덤이 생명이 이겼음을 알렸습니다. 믿음은 그 선물을 받는 빈손이었습니다. 그 뒤로 우리는 기도와 용서와 감사와 쉼을, 그리고 이 마지막 부에서는 이웃과 고난과 두려움과 소망을 이야기했습니다. 마흔 번의 만남이 말한 것은 결국 하나입니다. 하나님은 나를 조건 없이 사랑하십니다."},{"t":"h3","text":"새 계명은 새 약속입니다"},{"t":"p","text":"오늘의 말씀은 예수님이 잡히시던 밤에 하신 말씀입니다. 제20과에서 본 대로, 제자들의 발을 씻기신 바로 그 저녁입니다. 발에 묻은 물기가 채 마르기도 전에 예수님은 서로 사랑하라고 하셨습니다."},{"t":"p","text":"이 말씀이 무겁게 들릴 수 있습니다. 미운 사람이 떠오르고, \"나는 그렇게 못 하는데\" 싶습니다. 더구나 기준이 \"내가 너희를 사랑한 것 같이\"입니다. 발을 씻기고 목숨을 내어 주는 사랑처럼 하라는 것이니, 누가 감당하겠습니까."},{"t":"p","text":"박사님은 이 새 계명을 명령이 아니라 약속으로 읽습니다. 우리 힘으로는 서로 그렇게 사랑할 수 없지만, 예수님이 나를 구원하셨음을 믿고 살아가면 하나님이 \"네 이웃을 사랑할 수 있게 만들어 주겠다\"고 하신 멋진 약속이라는 것입니다. 제29과에서 십계명을 열 가지 약속으로 읽었던 것과 같은 길입니다."},{"t":"p","text":"그래서 이 말씀의 무게중심은 뒤쪽이 아니라 앞쪽에 있습니다. \"너희도 서로 사랑하라\"보다 먼저 \"내가 너희를 사랑한 것 같이\"가 있습니다. 사랑은 명령으로 만들어지지 않습니다. 사랑받은 경험에서만 자라납니다. 박사님은 하나님의 조건 없는 사랑을 깊이 깨달을수록 오히려 미운 사람을 용서하게 된다고 말합니다. 그러니 사랑이 잘 안 되는 날에는 더 애쓸 것이 아니라, 내가 어떻게 사랑받았는지를 다시 떠올리면 됩니다."},{"t":"h3","text":"물동이를 두고 달려간 사람"},{"t":"p","text":"제18과에서 만난 우물가의 여인을 기억하실 것입니다. 사람들을 피해 한낮에 물을 길으러 나오던 사람입니다. 예수님과 이야기를 나눈 뒤 그 여인이 한 일을 성경은 이렇게 전합니다."},{"t":"verse","ref":"요한복음 4장 28절에서 29절","text":"여자가 물동이를 버려 두고 동네로 들어가서 사람들에게 이르되 내가 행한 모든 일을 내게 말한 사람을 와서 보라 이는 그리스도가 아니냐 하니"},{"t":"p","text":"박사님은 이 반전이 얼마나 큰지를 짚습니다. 이 여인이 세상에서 제일 가기 싫은 곳이 동네였습니다. 사람들을 만날까 봐서입니다. 그런데 그 동네로 스스로 뛰어 들어갑니다. 이유는 하나입니다. 자신의 과거를 다 아시면서도 묻지도 따지지도 않으신 분을 만났기 때문입니다."},{"t":"p","text":"이 여인은 전하는 법을 배운 적이 없습니다. 교리를 설명하지도 않았습니다. 그저 \"와서 보라\"고 했습니다. 정죄받지 않은 기쁨이 그를 달려가게 했습니다. 사랑을 전한다는 것은 이런 일입니다. 누구를 설득하거나 끌고 오는 일이 아니라, 내가 만난 사랑을 숨기지 못하는 일입니다."},{"t":"h3","text":"빛은 애쓰지 않고 비칩니다"},{"t":"verse","ref":"마태복음 5장 14절","text":"너희는 세상의 빛이라 산 위에 있는 동네가 숨겨지지 못할 것이요"},{"t":"p","text":"박사님은 여기서 말하는 빛을, 우리가 깨닫고 받아들인 하나님의 조건 없는 사랑의 빛이라고 풉니다. 그리고 빛은 강요가 아니라 그 사랑이 자연스럽게 퍼져 나가는 것이라고 강조합니다. 등불은 비추려고 힘을 쓰지 않습니다. 켜져 있으면 비칩니다."},{"t":"p","text":"그러니 사랑을 전하는 사람이 된다는 것은 대단한 일을 시작하는 것이 아닙니다. 아픈 사람에게 \"네 탓이 아니다\"라고 말해 주는 것, 실수한 자녀에게 \"괜찮다, 그래도 사랑한다\"고 말해 주는 것, 미운 사람을 위해 속으로 한 번 복을 빌어 주는 것입니다. 하나님을 무서워하는 누군가에게 \"내가 알게 된 하나님은 그런 분이 아니더라\"고 조용히 들려주는 것입니다. 제36과에서 보았듯, 그렇게 흘려보낼 때 기쁨은 생기가 되어 내게로 다시 돌아옵니다. 사랑은 흘러갈수록 마르지 않고 더 차오릅니다."},{"t":"p","text":"이 책은 여기서 끝나지만 이야기는 이제 시작입니다. 여러분은 사랑받는 사람입니다. 그 사실 하나를 품고 일상으로 돌아가십시오. 나머지는 그 사랑이 합니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"\"서로 사랑하라\"는 말씀은 지쳐 있는 사람에게 지우는 새 짐이 아니라, \"내가 너를 그렇게 사랑하는 사람으로 만들어 주겠다\"는 약속입니다. 먼저 있는 것은 언제나 \"내가 너희를 사랑한 것 같이\"입니다. 사랑을 전하는 일은 설득이 아니라, 받은 사랑이 나를 지나 곁의 사람에게 흘러가는 일입니다. 우리는 사랑받았고, 그래서 사랑하게 됩니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 마흔 번의 만남 가운데 가장 기억에 남는 과나 장면은 무엇입니까? 왜 그것이 마음에 남았습니까?"},{"t":"q","i":1,"text":"둘째, 이 공부를 시작할 때와 지금, 하나님에 대한 나의 느낌은 어떻게 달라졌습니까? 아직 풀리지 않은 물음이 있다면 그것도 나누어 주십시오."},{"t":"q","i":2,"text":"셋째, 우물가의 여인처럼 \"와서 보라\"고 말해 주고 싶은 사람이 있습니까? 그 사람에게 무엇을 가장 들려주고 싶습니까?"},{"t":"q","i":3,"text":"넷째, 이 모임이 끝난 뒤에도 사랑 안에 머물기 위해, 나에게 필요한 것은 무엇입니까? 서로 어떻게 도울 수 있겠습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 13장 35절","text":"너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인 줄 알리라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이 공부를 함께한 분들께 고마웠던 점을 한 가지씩 말이나 짧은 글로 전합니다."},{"t":"act","i":1,"text":"하나님을 두려운 분으로 알고 있거나 지금 힘든 시간을 지나는 한 사람을 떠올리고, 이번 주에 차 한 잔을 함께하며 내가 만난 사랑 이야기를 들려줍니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"마지막 모임입니다. 새 내용을 가르치기보다 돌아보고 나누는 데 시간을 쓰십시오. 첫째와 둘째 질문에 넉넉히 머물고, 한 분도 빠짐없이 말할 기회를 드립니다. \"아직 잘 모르겠다\", \"여전히 믿어지지 않는다\"는 고백도 귀하게 받아 주십시오. 결단을 재촉하거나 교회 출석을 조건처럼 내세우지 않습니다. 조건 없는 사랑을 전하는 모임이 조건을 달고 끝나서는 안 됩니다. \"전해야 한다\"는 부담을 느끼는 분께는, 우물가의 여인이 한 일은 \"와서 보라\" 한마디였음을 일러 주십시오. 모임을 이어 가기 원하는 분들이 있으면 이후의 만남을 가볍게 안내하고, 서로를 위해 복을 비는 짧은 기도로 마치면 좋습니다."}],"inPart":8,"audio":"audio/48.m4a"},{"id":"49","kind":"appendix","no":null,"part":null,"title":"사랑의 하나님을 전하는 이에게","sub":null,"key":null,"blocks":[{"t":"p","text":"이 교재를 들고 누군가를 만나러 가는 분께 드리는 글입니다. 무엇을 전할지는 마흔 과에 담았으니, 여기서는 어떻게 전할지를 적습니다."},{"t":"h2","text":"하나. 전하는 방법이 곧 전하는 내용입니다"},{"t":"p","text":"조건 없는 사랑을 조건을 달아 전할 수는 없습니다. \"안 믿으면 큰일 난다\"는 말로 시작한 전도는 끝까지 두려움의 하나님을 전하게 됩니다. 상대가 끝내 받아들이지 않아도 여전히 그를 아끼는 것, 그것이 아가페를 전하는 유일한 방법입니다. 사람들은 우리의 설명보다 우리가 자기를 어떻게 대하는지를 먼저 읽습니다."},{"t":"h2","text":"둘. 먼저 듣습니다"},{"t":"p","text":"사람마다 마음속에 이미 하나님의 초상화가 있습니다. 무서운 아버지 밑에서 자란 분에게 '하나님 아버지'는 반가운 말이 아닙니다. 교회에서 상처받은 분에게 성경 구절은 회초리처럼 들립니다. 그 초상화가 어떤 모습인지 듣기 전에는 무슨 말을 해도 그 그림 위에 덧칠이 될 뿐입니다. \"하나님 하면 어떤 느낌이 드세요?\" 이 질문 하나로 시작해서, 답을 고쳐 주지 말고 끝까지 들으십시오."},{"t":"h2","text":"셋. 몸의 이야기에서 시작해도 좋습니다"},{"t":"p","text":"아픈 분, 지친 분에게는 교리보다 몸의 이야기가 먼저 들립니다. 내 몸 안에 나를 살리려는 생명이 쉬지 않고 일하고 있다는 것, 사랑받을 때와 두려울 때 몸이 달라진다는 것은 믿음이 없는 분도 고개를 끄덕이는 이야기입니다. 다만 선을 지켜 주십시오. 낫는다고 약속하지 않습니다. 치료를 그만두라고 하지 않습니다. 병을 믿음의 성적표로 만들지 않습니다. 우리가 전하는 것은 치료법이 아니라, 낫든 낫지 않든 곁을 떠나지 않으시는 분입니다."},{"t":"h2","text":"넷. 논쟁에서 이기려 하지 않습니다"},{"t":"p","text":"논쟁에서 이기면 사람을 잃습니다. 특히 이미 신앙생활을 하는 분에게 \"그동안 잘못 배우셨습니다\"라고 말하지 마십시오. 그분의 신앙은 그 나름의 눈물과 세월로 지어진 집입니다. 집을 헐려고 들면 누구나 문을 잠급니다. 대신 창문 하나를 열어 드리면 됩니다. \"이 구절을 이렇게 읽는 분도 계시던데, 어떻게 생각하세요?\" 하고 본문을 같이 펴 보는 것으로 충분합니다. 다른 교회와 목회자를 깎아내리는 말은 한마디도 하지 마십시오."},{"t":"h2","text":"다섯. 어려운 질문 앞에서 정직합니다"},{"t":"p","text":"\"그럼 지옥은 없다는 말입니까?\" \"구약의 그 많은 죽음은 뭡니까?\" 이런 질문에 매끈한 답을 내놓으려 애쓰지 마십시오. 이 교재도 다 풀지 못한 대목은 다 풀지 못했다고 적었습니다. \"저도 그 구절이 어렵습니다. 다만 저는 예수님에게서 본 하나님의 얼굴을 기준으로 읽으려고 합니다\" 하고 말하는 편이 어설픈 확신보다 훨씬 믿음직합니다. 처음 오신 분에게 어려운 구절을 먼저 꺼낼 필요는 없습니다. 물어 오면 그때 제2권의 해당 과를 함께 읽으십시오."},{"t":"h2","text":"여섯. 상대의 속도를 존중합니다"},{"t":"p","text":"탕자의 아버지는 아들을 쫓아가 끌고 오지 않았습니다. 기다렸습니다. 결단을 재촉하지 마십시오. 모임에 빠져도 서운한 티를 내지 마십시오. 마흔 주를 다 마치고도 \"아직 잘 모르겠다\"고 하는 분이 있다면, 마흔 주 동안 함께 걸은 것으로 감사하십시오. 자라게 하시는 분은 하나님이십니다."},{"t":"h2","text":"일곱. 나부터 그 사랑 안에 머뭅니다"},{"t":"p","text":"전하는 사람이 지치는 까닭은 대개 자기 그릇은 비어 있는데 남의 그릇을 채우려 하기 때문입니다. 흘러넘쳐야 흘러갑니다. 사람을 만나러 가기 전에, 오늘 내가 먼저 조건 없이 사랑받고 있다는 사실 앞에 잠시 앉으십시오. 전도는 그 자리에서 이미 시작된 것입니다."},{"t":"h2","text":"처음 만남에서 써 볼 수 있는 말"},{"t":"p","text":"\"교회 이야기를 하려는 게 아니라, 제가 요즘 위로받은 이야기가 있어서요.\""},{"t":"p","text":"\"하나님이 계시다면 어떤 분일 것 같으세요?\""},{"t":"p","text":"\"그렇게 느끼실 만하네요. 저도 오래 그렇게 생각했습니다.\""},{"t":"p","text":"\"대답하지 않으셔도 됩니다. 그냥 같이 읽어만 봐요.\""},{"t":"p","text":"\"오늘 이야기 가운데 마음에 걸리는 데는 없으셨어요?\""},{"t":"h2","text":"피해야 할 말"},{"t":"p","text":"\"안 믿으면 지옥 갑니다.\" (두려움으로 시작하면 두려움으로 끝납니다)"},{"t":"p","text":"\"믿음이 부족해서 그래요.\" (아픈 사람에게 짐을 하나 더 얹는 말입니다)"},{"t":"p","text":"\"기도하면 다 나아요.\" (약속할 수 없는 것을 약속하지 않습니다)"},{"t":"p","text":"\"그 교회는 잘못 가르칩니다.\" (깎아내려서 세워지는 복음은 없습니다)"},{"t":"p","text":"\"다 하나님 뜻이에요.\" (슬픔 앞에서는 설명보다 곁에 있어 주는 것이 먼저입니다)"}],"inPart":0,"audio":"audio/49.m4a"},{"id":"50","kind":"appendix","no":null,"part":null,"title":"아가페로 성경을 읽는 일곱 가지 원칙","sub":null,"key":null,"blocks":[{"t":"p","text":"이 교재 전체를 받치고 있는 읽기 원칙을 일곱 문장으로 간추렸습니다. 어려운 본문을 만났을 때 이 자리로 돌아와 보십시오."},{"t":"h2","text":"1. 하나님은 아가페이십니다"},{"t":"p","text":"하나님은 조건 없는 사랑이십니다. \"하나님은 사랑이시라\"(요한일서 4장 16절)는 하나님에 대한 여러 설명 가운데 하나가 아니라 모든 본문을 읽는 렌즈입니다."},{"t":"h2","text":"2. 성경의 물음은 상과 벌이 아니라 생명과 사망입니다"},{"t":"p","text":"성경이 묻는 것은 \"누가 상을 받고 누가 벌을 받는가\"가 아니라 \"생명에 이어져 있는가, 끊어져 있는가\"입니다. 죄는 생명의 근원에서 끊어진 상태이고, 구원은 다시 이어지는 것입니다."},{"t":"h2","text":"3. 심판은 형벌이 아니라 결과이며, 그 안에도 사랑이 있습니다"},{"t":"p","text":"심판처럼 보이는 사건은 사랑을 거절한 데서 오는 결과이거나, 더 큰 파멸에서 건지시려는 손길입니다. 하나님이 하시는 일과 사탄이 하는 일을 구별해서 읽습니다."},{"t":"h2","text":"4. 구원은 이미 이루어진 선물입니다"},{"t":"p","text":"십자가에서 다 이루신 것을 믿음으로 받습니다. 구원의 확신은 내 상태를 들여다보는 데서가 아니라 하나님이 어떤 분이신지를 아는 데서 나옵니다."},{"t":"h2","text":"5. 두려움이 아니라 사랑이 신앙의 동기입니다"},{"t":"p","text":"벌이 무서워 섬기는 종이 아니라 사랑받는 자녀로 삽니다. 계명은 \"지켜라\"는 명령이기 전에 \"내가 그렇게 되게 해 주겠다\"는 약속입니다."},{"t":"h2","text":"6. 성령께서 날마다 함께하십니다"},{"t":"p","text":"신앙은 지식의 분량이 아니라 살아 계신 분과의 동행입니다. 열매는 짜내는 것이 아니라 붙어 있을 때 맺히는 것입니다."},{"t":"h2","text":"7. 복음은 몸과 마음을 함께 살립니다"},{"t":"p","text":"사랑받고 있음을 아는 평안은 마음뿐 아니라 몸에도 닿습니다. 다만 복음은 치료법이 아니며, 낫는 것이 믿음의 증거도 아닙니다. 복음이 약속하는 것은 어떤 형편에서도 끊어지지 않는 사랑입니다."}],"inPart":0,"audio":"audio/50.m4a"}]};
const ITEMS = DATA.items, BYID = Object.fromEntries(ITEMS.map(x => [x.id, x]));
const LESSONS = ITEMS.filter(x => x.kind === 'lesson');
const KEY = 'agape1.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
};

/* ---------- 저장 ---------- */
