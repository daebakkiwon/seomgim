아니라는 점, 곧 자유가 사랑의 증거라는 점만 짚고 넘어가면 충분합니다. 뱀의 정체를 길게 설명하기보다 '하나님을 오해하게 만드는 목소리'로 소개하고, 그 화법에 초점을 두십시오. 교회에서 상처받은 경험이 있는 분이 \"저는 하나님이 정말 무서웠습니다\" 하고 말을 꺼낼 수 있습니다. 고쳐 주려 하지 말고 충분히 들어 주십시오. 이 과의 목표는 누구를 탓하는 것이 아니라, 두려움이 하나님에게서 온 것이 아님을 알아보는 것입니다. '반드시 죽으리라'는 제15과에서 자세히 다루니 미루어도 됩니다."}],"inPart":3,"audio":"audio/14.m4a"},{"id":"15","kind":"lesson","no":12,"part":null,"title":"\"네가 어디 있느냐\"","sub":"잘못한 사람을 찾아오신 하나님은 무슨 마음으로 부르셨을까요","key":{"ref":"창세기 3장 9절","text":"여호와 하나님이 아담을 부르시며 그에게 이르시되 네가 어디 있느냐"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사가 들려주는 막내아들 데이빗의 이야기가 있습니다. 건강한 생활을 막 시작하던 무렵, 박사님은 자녀들에게 매우 엄격한 아버지였고 집에서는 초콜릿이 금지된 음식이었습니다. 어느 날 손님이 초콜릿을 가져왔는데, 네 살이던 데이빗이 누나들 몰래 혼자 다 먹고는 화장실에 숨어 버렸습니다. 누나들이 달려와 일러바쳤습니다. 아빠가 단단히 혼낼 것이라고 기대하면서 말입니다."},{"t":"p","text":"박사님은 두려움에 떨고 있을 아이를 떠올리고, 화난 목소리가 아니라 오히려 더 가볍고 다정한 목소리로 불렀다고 합니다. \"데이빗, 데이빗, 어디 있니?\" 아이가 배가 아프다며 나오자 \"초콜릿 먹었구나\" 하고 다그치고 싶은 마음을 누르고, 배를 쓰다듬어 주고 돌보며 노래를 불러 주었습니다. 누나들은 김이 샜습니다. 그런데 아이는 오히려 마음이 움직여 스스로 말했습니다. \"아빠, 나 초콜릿 먹었어.\""},{"t":"p","text":"지난 과에서 우리는 사람이 하나님을 오해하게 된 시작을 보았습니다. 그 뒤에 하나님은 사람을 찾아오십니다. 그리고 물으십니다. \"네가 어디 있느냐.\" 이 말은 어떤 목소리로 들어야 할까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"같은 발소리가 두려움이 되다"},{"t":"p","text":"열매를 먹은 뒤 사람에게 가장 먼저 일어난 변화를 성경은 이렇게 적습니다."},{"t":"verse","ref":"창세기 3장 8절","text":"그들이 그 날 바람이 불 때 동산에 거니시는 여호와 하나님의 소리를 듣고 아담과 그의 아내가 여호와 하나님의 낯을 피하여 동산 나무 사이에 숨은지라"},{"t":"p","text":"하나님은 그날도 여느 때처럼 동산을 거닐며 오셨습니다. 박사님의 설명대로, 전에는 하나님이 오시는 소리가 들리면 반갑게 뛰어나가 맞이하던 두 사람이었습니다. 그런데 이제는 같은 소리를 듣고 나무 사이로 숨습니다. 달라진 것은 하나님이 아니라 사람의 마음이었습니다. '말을 듣지 않으면 벌을 받는다'는 생각이 들어오자, 사랑하는 분이 다가오는 것이 위협으로 느껴진 것입니다."},{"t":"p","text":"박사님은 어린 시절의 기억 하나를 나눕니다. 전쟁 직후 부산에서 가난하게 자랄 때 삼촌의 두부 가게 일을 도왔는데, 두부가 많이 팔린 날에는 삼촌이 믿고 맡긴 돈에 몰래 손을 댔다고 합니다. 손대지 않은 날에는 삼촌이 돌아오는 것이 반가웠습니다. 그러나 손을 댄 날에는 삼촌이 오는 것이 두려웠습니다. 삼촌의 사랑은 조금도 변하지 않았는데, 자기가 먼저 자리를 피하고 싶어졌다는 것입니다."},{"t":"p","text":"숨기 전에 두 사람은 무화과나무 잎을 엮어 몸을 가렸습니다. 성경은 열매를 먹은 뒤 그들의 \"눈이 밝아져\" 자기들이 벗은 줄을 알았다고 적습니다(창세기 3장 7절). 박사님은 이것을 연애에 빗댑니다. 사랑이 가득할 때에는 상대의 허물이 보이지 않다가, 사랑이 식으면 허물이 눈에 들어오기 시작합니다. 하나님의 사랑을 조건이 붙은 사랑으로 오해하자, 어제까지 아무렇지도 않던 자기 모습이 갑자기 부끄러운 흠으로 보이기 시작한 것입니다. 그 전에는 엄마 앞의 갓난아기처럼 가릴 것이 없었습니다. 있는 그대로 사랑받는다는 확신이 있으면 숨길 것이 없습니다. 그 확신이 흔들리자 사람은 자기를 가리고, 꾸미고, 숨기 시작했습니다."},{"t":"h3","text":"다 아시면서 물으신 까닭"},{"t":"p","text":"하나님은 아담이 어디에 있는지 모르셔서 물으신 것이 아닙니다. 박사님은 이 '모른 척'에 하나님의 마음이 담겨 있다고 말합니다. 벌을 주러 온 사람이라면 \"숨어도 소용없다, 다 안다\" 하고 말했을 것입니다. 그런데 하나님은 \"네가 어디 있느냐\" 하고 물으십니다."},{"t":"p","text":"박사님은 이것을 어린 딸과 숨바꼭질하는 아빠에 빗댑니다. 치맛자락이 다 보이는데도 아빠는 \"우리 딸 어디 갔지, 도저히 못 찾겠네\" 하고 말해 줍니다. 끌어내어 몰아붙이면 아이는 더 궁지에 몰립니다. 스스로 걸어 나올 기회를 주는 것이 사랑의 배려입니다. \"어디서 이러고 있느냐\"가 아니라 \"얘들아, 안 보이는구나, 보고 싶은데\" 하는 부름입니다."},{"t":"p","text":"박사님은 이 대목을 성경 전체를 읽는 갈림길이라고 부릅니다. 하나님이 벌주러 오셨다고 읽으면 그 뒤의 성경은 끝까지 무서운 하나님의 이야기가 됩니다. 그러나 \"너희가 나를 떠났어도 내 사랑은 변하지 않았다\"는 것을 보여 주러 오셨다고 읽으면, 성경은 잃어버린 자녀를 찾는 아버지의 이야기가 됩니다. 제9과의 기다리는 아버지, 제10과의 찾을 때까지 찾는 목자가 이미 여기 에덴에 계셨습니다."},{"t":"h3","text":"두려워서 나온 대답"},{"t":"p","text":"아담의 대답은 이렇습니다."},{"t":"verse","ref":"창세기 3장 10절","text":"이르되 내가 동산에서 하나님의 소리를 듣고 내가 벗었으므로 두려워하여 숨었나이다"},{"t":"p","text":"성경에서 사람이 \"두렵다\"고 말하는 첫 장면입니다. 박사님은 이 대답이 반쪽짜리 진실이라고 짚습니다. 이미 잎으로 몸을 가렸으니 벗어서 두렵다는 말은 앞뒤가 맞지 않습니다. 실은 벌이 두려웠던 것입니다. 이어지는 장면에서 아담은 \"하나님이 주셔서 나와 함께 있게 하신 여자\"가 주어서 먹었다고 하고, 여자는 뱀이 꾀었다고 합니다. 책임이 옆 사람에게로, 마침내는 하나님께로 넘어갑니다."},{"t":"p","text":"그 사이에 하나님은 한 번 더 물으십니다. \"누가 너의 벗었음을 네게 알렸느냐.\" 박사님은 이 물음을 심문이 아니라 스스로 진실 앞에 설 기회를 주시는 부드러운 되물음으로 읽습니다. 벗은 것은 본래 부끄러운 일이 아니었는데, 누가 너에게 그것을 부끄러운 일이라고 일러 주었느냐는 것입니다. 그 말 속에는 '그것은 내가 한 말이 아니다, 네가 다른 목소리를 들었구나' 하는 안타까움이 담겨 있습니다."},{"t":"p","text":"우리는 이 모습을 비웃을 수 없습니다. 혼날 것이 두려운 자리에서는 누구나 변명이 먼저 나옵니다. 사랑을 확신하지 못할 때 사람은 정직해질 수 없습니다. 박사님은 건강강의에서도 같은 이야기를 합니다. 벌주시는 하나님을 믿으면 나쁜 일을 참게 되는 것이 아니라 숨기게 되고, 숨긴 만큼 마음의 긴장이 쌓인다는 것입니다."},{"t":"h3","text":"화내지 않으시고 약속을 주시다"},{"t":"p","text":"놀라운 것은 그다음입니다. 하나님은 이 뻔한 변명을 들으시고도 두 사람에게 화를 내지 않으십니다. 사과도 반성도 받지 않으신 채로, 뱀을 향해 말씀하시며 한 가지 약속을 들려주십니다. 장차 '여자의 후손'이 와서 뱀의 머리를 상하게 하리라는 것입니다(창세기 3장 15절). 박사님은 이것을 성경에 처음 나오는 구원의 약속이라고 부릅니다. 머리는 생각을 뜻하니, '하나님은 벌주시는 무서운 분'이라는 뱀의 생각을 깨뜨릴 분을 보내시겠다는 약속입니다. 이 약속이 어떻게 이루어졌는지는 제4부와 제5부에서 만나게 됩니다."},{"t":"p","text":"순서를 기억해 두면 좋겠습니다. 사람이 뉘우친 다음에 약속이 온 것이 아닙니다. 변명만 늘어놓은 바로 그 자리에 약속이 먼저 왔습니다. 데이빗이 \"나 초콜릿 먹었어\" 하고 말할 수 있었던 것은 아빠의 다정한 손길을 먼저 받았기 때문입니다. 하나님이 사람을 대하시는 순서도 그러합니다. 우리가 정직해진 다음에 사랑하시는 것이 아니라, 사랑이 먼저 확인될 때 우리가 비로소 정직해집니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"\"네가 어디 있느냐\"는 잡아내려는 심문이 아니라 보고 싶은 자녀를 찾는 부름입니다. 달라진 것은 하나님이 아니라 하나님을 무서운 분으로 여기게 된 사람의 마음이었습니다. 하나님은 숨은 사람을 다그치지 않으시고, 변명을 들으시고도 구원의 약속을 먼저 주셨습니다. 사랑이 먼저이고, 정직한 고백은 그 사랑 안에서 저절로 나옵니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 잘못을 하고 숨거나 시치미를 뗀 기억이 있습니까? 그때 어른들은 어떻게 하셨습니까?"},{"t":"q","i":1,"text":"둘째, 잘못했을 때 다그침을 받은 경험과 따뜻하게 받아들여진 경험이 있다면, 그 뒤에 내 마음은 각각 어떻게 달라졌습니까?"},{"t":"q","i":2,"text":"셋째, 요즘 내가 무화과 잎처럼 가리고 있는 것, 남에게 보이고 싶지 않아 애쓰는 것은 무엇입니까?"},{"t":"q","i":3,"text":"넷째, 지금 하나님이 나에게 \"네가 어디 있느냐\" 하고 물으신다면, 어떤 목소리로 들릴 것 같습니까? 나는 뭐라고 대답하고 싶습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"창세기 3장 9절","text":"여호와 하나님이 아담을 부르시며 그에게 이르시되 네가 어디 있느냐"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루에 한 번, 조용한 곳에서 내 이름을 넣어 \"○○아, 네가 어디 있느냐\" 하고 다정한 목소리로 읽어 보고, 지금 내 마음이 있는 자리를 솔직하게 말씀드려 봅니다."},{"t":"act","i":1,"text":"이번 주에 가족이나 동료가 실수했을 때, 다그치기 전에 먼저 \"괜찮아?\" 하고 물어봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 설명보다 목소리가 중요합니다. 창세기 3장 9절를 두 번 읽어 보게 하십시오. 한 번은 화난 목소리로, 한 번은 아이를 찾는 부모의 목소리로 읽고 느낌을 나누면 과의 핵심이 저절로 전해집니다. \"그래도 잘못은 잘못 아닙니까, 벌을 안 주면 버릇이 나빠지지 않습니까\" 하는 질문이 나올 수 있습니다. 잘못의 결과가 없다는 뜻이 아니라(제14, 15과에서 다룹니다), 하나님이 잘못한 사람을 대하시는 첫 태도가 찾아오심이라는 점을 짚어 주십시오. 셋째 질문은 깊은 이야기가 나올 수 있으니, 나눈 이야기는 모임 밖으로 옮기지 않기로 미리 약속하고, 말하지 않을 자유도 존중해 주십시오."}],"inPart":3,"audio":"audio/15.m4a"},{"id":"16","kind":"lesson","no":13,"part":null,"title":"가죽옷을 지어 입히시다","sub":"하나님은 잘못한 사람을 에덴에서 쫓아내신 것일까요","key":{"ref":"창세기 3장 21절","text":"여호와 하나님이 아담과 그의 아내를 위하여 가죽옷을 지어 입히시니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사는 1970년, 미국으로 유학을 떠나던 날의 김포공항을 이야기합니다. 아들이 더 넓은 세상으로 나가는 것은 기쁜 일이었습니다. 그러나 헤어짐이 아쉬워 아들은 차마 발걸음을 떼지 못했습니다. 결국 어머니가 눈물을 흘리면서 아들의 등을 떠밀어 보내셨다고 합니다."},{"t":"p","text":"그 장면을 멀리서 본 사람은 어머니가 아들을 밀어내는 줄 알았을지도 모릅니다. 그러나 그 손에 담긴 것이 미움이 아니라는 것은 누구나 압니다. 자식을 군대에 보내 본 부모, 먼 곳으로 시집 장가를 보내 본 부모는 그 마음을 압니다. 곁에 두고 싶지만, 가야 할 길이 있기에 보내는 것입니다. 사랑하는 곳을 떠난다고 해서 쫓겨나는 것은 아닙니다."},{"t":"p","text":"지난 과에서 우리는 숨은 사람을 찾아오신 하나님을 만났습니다. 그런데 창세기 3장은 아담과 하와가 에덴동산을 떠나는 장면으로 끝납니다. 많은 분들이 이 대목을 '죄를 지어 낙원에서 쫓겨났다'는 이야기로 알고 있습니다. 하나님은 정말 화가 나서 두 사람을 내쫓으셨을까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"떠나보내기 전에 하신 일"},{"t":"p","text":"에덴을 떠나는 장면 바로 앞에 한 문장이 놓여 있습니다. 하나님이 두 사람을 위하여 가죽옷을 지어 입히셨다는 것입니다. 박사님은 이 구절을 창세기 3장의 절정이라고 부릅니다."},{"t":"p","text":"두 사람은 이미 옷을 입고 있었습니다. 제 손으로 무화과나무 잎을 엮어 만든 치마였습니다. 그러나 잎은 곧 마르고 부서집니다. 자기 부끄러움을 자기 힘으로 가려 보려는 애씀은 오래가지 못합니다. 체면으로, 성취로, '나는 괜찮은 사람'이라는 증명으로 자기를 가려 본 사람은 그 옷이 얼마나 쉽게 해지는지 압니다."},{"t":"p","text":"하나님은 그 잎사귀 옷을 나무라지 않으셨습니다. 말없이 더 나은 옷을 손수 지어 입히셨습니다. \"지어 입히시니라\"는 말을 천천히 읽어 보면 좋겠습니다. 옷을 던져 주신 것이 아닙니다. 어머니가 아이에게 옷을 입히듯 몸소 입혀 주셨습니다. 두 사람이 옷을 달라고 청한 적도 없고, 잘못했다고 빈 기록도 없습니다. 박사님은 이것을 거지에게 값없이 왕의 옷을 입혀 신분을 되찾아 주는 일에 빗댑니다. 제9과에서 아버지가 돌아온 아들에게 입힌 '제일 좋은 옷'이 떠오릅니다."},{"t":"h3","text":"가죽옷에 담긴 약속"},{"t":"p","text":"가죽옷이 있으려면 짐승 하나가 죽어야 합니다. 박사님은 여기에서 앞으로 있을 일의 그림자를 봅니다. 사람의 부끄러움을 덮기 위해 누군가의 생명이 내어지는 일입니다. 지난 과에서 들은 약속, 곧 장차 오실 분에 대한 약속을 하나님이 눈에 보이는 옷으로 입혀 주신 셈입니다. 그 약속이 어떻게 이루어지는지는 제5부에서 십자가 이야기를 나눌 때 자세히 살피겠습니다."},{"t":"p","text":"그런데 옷을 입기 바로 앞 절에 눈여겨볼 일이 하나 있습니다. 아담이 아내의 이름을 '하와'라고 지어 부른 것입니다. 하와는 '생명'이라는 뜻이고, 성경은 그가 \"모든 산 자의 어머니\"가 되었다고 적습니다(창세기 3장 20절). 아담은 방금 \"너는 흙이니 흙으로 돌아갈 것이니라\"는 말씀을 들은 참이었습니다. 죽음을 들은 자리에서 그는 생명을 말했습니다. 박사님은 이것을, 아담이 장차 오실 분에 대한 약속을 믿음으로 받아들인 표시라고 읽습니다. 하나님의 약속이 먼저 있었고, 아담은 그 약속에 기대어 대답했을 뿐입니다."},{"t":"p","text":"지금 기억할 것은 한 가지입니다. 무화과 잎은 사람이 만들었고, 가죽옷은 하나님이 지으셨습니다. 부끄러움을 덮는 참된 옷은 사람이 짜내는 것이 아니라 하나님이 값없이 주시는 선물입니다. 그리고 그 옷은 두 사람이 아직 조금도 달라지지 않았을 때 입혀졌습니다. 두려움도, 남 탓하는 버릇도 그대로인 채였습니다. 하나님은 사람이 나아진 다음에 덮어 주시는 분이 아니라, 있는 그대로를 먼저 덮어 주시는 분입니다."},{"t":"h3","text":"'내보내심'이라는 말"},{"t":"p","text":"이제 떠나는 장면을 읽어 보겠습니다."},{"t":"verse","ref":"창세기 3장 23절","text":"여호와 하나님이 에덴 동산에서 그를 내보내어 그의 근원이 된 땅을 갈게 하시니라"},{"t":"verse","ref":"창세기 3장 24절","text":"이같이 하나님이 그 사람을 쫓아내시고 에덴 동산 동쪽에 그룹들과 두루 도는 불 칼을 두어 생명 나무의 길을 지키게 하시니라"},{"t":"p","text":"'그룹들'은 천사들을 가리키는 말입니다. 박사님은 23절의 '내보내다'와 24절의 '쫓아내다'가 성경이 처음 쓰인 히브리어에서 서로 다른 낱말이라는 데 주목합니다. 23절의 '내보내다'는 훗날 노아가 방주에서 비둘기를 날려 보낼 때 쓰인 것과 같은 말입니다. 노아는 비둘기가 미워서 쫓은 것이 아니라 할 일을 맡겨 보냈고, 비둘기는 다시 돌아왔습니다."},{"t":"p","text":"무엇을 위해 보내신 것일까요. 박사님은 에덴 밖 넓은 땅으로 나가 자녀를 낳고, 자기들이 몸소 겪은 하나님의 조건 없는 사랑을 그 자녀들에게 전하라는 사명이라고 설명합니다. 두 사람은 벌주시는 하나님을 예상했다가 옷을 지어 입히시는 하나님을 만났습니다. 그 이야기를 들려줄 사람이 세상에 필요했습니다."},{"t":"p","text":"24절의 '쫓아내다'는 더 센 말입니다. 박사님은 그 점을 인정하면서 이렇게 말합니다. \"미운 마음으로 가라 하는 장면이 아닙니다. 가야 되는데 안 갈 테야, 하는 굉장히 애틋한 안타까움이 들어 있는 것 같습니다.\" 정든 동산을 떠나기 싫어 머뭇거리는 두 사람의 등을, 눈물로 떠미시는 장면이라는 것입니다. 김포공항의 어머니처럼 말입니다."},{"t":"h3","text":"닫힌 문이 아니라 지켜 둔 길"},{"t":"p","text":"마지막으로 불 칼 이야기가 남았습니다. 흔히 생명나무로 가지 못하게 막아 놓은 것으로 읽습니다. 그러나 박사님은 '지키게 하셨다'는 말의 본뜻이 '막다'가 아니라, 골키퍼가 골문을 지키고 부모가 아기를 지키듯 '훼손되지 않게 보존하다'라고 설명합니다. 막힌 것은 사람이 아니라, 그 길을 없애려는 어둠입니다. 박사님은 불을 하나님의 영(성령)이 밝히시는 빛으로, 칼을 하나님의 말씀으로 풀이하면서, 캄캄한 세상에서 생명으로 돌아가는 길을 환히 비추어 주시는 것이라고 말합니다."},{"t":"p","text":"박사님은 어린이 성경 이야기책에 흔히 실리는 '천사들이 두 사람을 다시는 생명나무에 못 오게 쫓아 버렸다'는 설명을 받아들일 수 없다고 말합니다. 손수 옷까지 지어 입히신 분이 그 사람을 생명에서 떼어 놓으실 리가 없기 때문입니다."},{"t":"p","text":"그렇게 읽으면 창세기 3장의 마지막 장면은 문이 닫히는 장면이 아니라 등불이 켜지는 장면입니다. 박사님은 이렇게 말합니다. \"성경을 어떻게 이해하느냐에 따라 내가 믿는 하나님이 달라집니다.\" 화가 나서 내쫓았다고 읽으면 벌주는 하나님만 남습니다. 그러나 옷을 입히시고, 할 일을 맡기시고, 돌아올 길을 지켜 두셨다고 읽으면 자녀를 떠나보내는 부모의 얼굴이 보입니다."},{"t":"p","text":"지금 우리가 에덴 밖, 고단한 세상 한가운데 서 있는 것도 버림받았기 때문이 아닙니다. 옷은 이미 지어져 있고, 돌아가는 길은 한 번도 닫힌 적이 없습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님은 사람이 뉘우치기도 전에, 청하기도 전에 손수 옷을 지어 입히셨습니다. 에덴을 떠나게 하신 것은 화풀이가 아니라, 사랑을 전하라고 눈물로 등을 떠미신 일이었습니다. 생명으로 돌아가는 길은 막힌 것이 아니라 지켜져 있습니다. 창세기 3장은 쫓겨난 이야기가 아니라 덮어 주시고 보내시는 사랑의 이야기입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가를 떠나보내거나 내가 떠나오면서 마음 아팠던 기억이 있습니까? 그때 보내는 사람의 마음은 어떠했을까요?"},{"t":"q","i":1,"text":"둘째, 내가 부끄러움을 가리려고 애써 엮어 온 '무화과 잎'은 무엇이었습니까? 그 옷은 나를 편안하게 해 주었습니까?"},{"t":"q","i":2,"text":"셋째, 내 허물을 누군가 말없이 덮어 준 경험이 있다면 나누어 주십시오. 그때 어떤 마음이 들었습니까?"},{"t":"q","i":3,"text":"넷째, '쫓겨났다'와 '보내심을 받았다'는 큰 차이가 있습니다. 지금 내가 서 있는 자리를 '보내심을 받은 자리'로 본다면 무엇이 달라질까요?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"창세기 3장 21절","text":"여호와 하나님이 아담과 그의 아내를 위하여 가죽옷을 지어 입히시니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아침에 옷을 입을 때마다 \"하나님이 나를 덮어 주셨습니다\" 하고 한마디 마음속으로 말해 봅니다."},{"t":"act","i":1,"text":"이번 주에 가족이나 이웃의 실수를 하나 알게 되면, 지적하거나 옮기지 않고 조용히 덮어 줍니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"\"그래도 성경에 '쫓아내셨다'고 쓰여 있지 않습니까\" 하는 질문이 나올 수 있습니다. 낱말을 부정하지 말고, 같은 행동도 어떤 마음으로 했느냐에 따라 전혀 다른 일이 된다는 점을 공항의 어머니 이야기로 짚어 주십시오. 판단의 근거는 앞 절에 있습니다. 내쫓을 사람에게 손수 옷을 지어 입히는 분은 없습니다. 가죽옷과 짐승의 죽음 대목에서 제사나 대속 같은 교회 용어로 길게 설명하고 싶어질 수 있으나, 이 과에서는 '덮어 주시는 하나님'에 머무르고 나머지는 제5부로 미루십시오. 22절(생명나무와 영생)을 묻는 분이 있으면, 이 교재는 그 절을 막으심이 아닌 보호로 읽는다는 정도만 말하고 넘어가도 좋습니다."}],"inPart":3,"audio":"audio/16.m4a"},{"id":"17","kind":"lesson","no":14,"part":null,"title":"죄란 무엇일까요","sub":"성경이 말하는 '죄'는 나쁜 짓의 목록일까요, 다른 무엇일까요","key":{"ref":"요한복음 15장 5절","text":"나는 포도나무요 너희는 가지라 그가 내 안에, 내가 그 안에 거하면 사람이 열매를 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"꽃집에서 꽃 한 다발을 사다가 꽃병에 꽂아 본 적이 있으실 것입니다. 식탁 위에 놓인 꽃은 며칠 동안 참 곱습니다. 빛깔도 그대로이고 향기도 납니다. 겉으로 보아서는 뜰에 피어 있을 때와 다를 것이 없습니다. 그러나 우리는 압니다. 그 꽃은 꺾이는 순간부터 이미 시들기 시작했다는 것을 말입니다. 물을 갈아 주고 줄기 끝을 다듬어 주면 하루 이틀 더 가겠지만, 뿌리에서 떨어진 꽃이 다시 피어날 수는 없습니다."},{"t":"p","text":"꽃이 시든다고 해서 누가 꽃에게 벌을 준 것은 아닙니다. 꽃이 못된 짓을 한 것도 아닙니다. 다만 생명이 올라오던 길이 끊어졌을 뿐입니다."},{"t":"p","text":"교회 밖에 계신 분들이 가장 듣기 불편해하는 말이 아마 '죄인'이라는 말일 것입니다. 법을 어긴 적도 없고 남에게 큰 해를 끼친 적도 없는데 죄인이라니, 억울하고 불쾌하게 들립니다. 지난 세 과에서 우리는 사람이 하나님을 오해하여 숨었고, 하나님은 그런 사람을 찾아와 덮어 주셨음을 보았습니다. 이제 그 이야기 한가운데에 있는 낱말을 살펴볼 차례입니다. 성경이 말하는 죄란 도대체 무엇일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"죄는 행동의 목록이 아닙니다"},{"t":"p","text":"우리는 보통 죄라고 하면 도둑질이나 거짓말 같은 나쁜 행동을 떠올립니다. 세상의 법이 그렇게 되어 있기 때문입니다. 이상구 박사는 세상 어느 나라의 법도 행동만을 처벌한다는 점을 짚습니다. 마음속으로 아무리 미워해도 그것으로 고소당하지는 않습니다. 사람들은 이 기준을 그대로 성경에 옮겨 놓고, 성경도 '해서는 안 되는 행동의 목록'이라고 여기게 되었다는 것입니다."},{"t":"p","text":"그러나 제11과에서 보았듯이, 에덴에서 일이 틀어진 것은 열매에 손을 대기 전이었습니다. 하나님을 조건을 걸고 단속하는 분으로 오해한 순간, 믿음이 먼저 무너졌습니다. 그래서 박사님은 죄를 이렇게 풀이합니다. 죄란 조건 없는 사랑을 떠난 상태입니다. 나쁜 행동은 그 상태에서 맺히는 열매일 뿐입니다."},{"t":"p","text":"제8과에서 잠깐 들은 병아리 이야기를 조금 더 들여다보겠습니다. 못된 구석이라고는 찾아볼 수 없이 예쁜 병아리들에게 채소를 잘게 썰어 주면, 덜 썰려 조금 길게 남은 조각을 한 마리가 물고 달아납니다. 먹기 좋은 것이 얼마든지 남아 있는데도 다른 병아리들이 그것을 빼앗으려고 쫓아갑니다. 누가 가르친 것이 아닙니다. 우리도 비슷합니다. 누가 나에게 해를 끼치면 미움과 분노는 아무 애를 쓰지 않아도 저절로 올라옵니다. 용서하고 사랑하는 일은 애를 써도 잘 되지 않습니다. 성경은 이것을 두고 사람이 모두 같은 처지에 있다고 말합니다."},{"t":"verse","ref":"로마서 5장 12절","text":"그러므로 한 사람으로 말미암아 죄가 세상에 들어오고 죄로 말미암아 사망이 들어왔나니 이와 같이 모든 사람이 죄를 지었으므로 사망이 모든 사람에게 이르렀느니라"},{"t":"p","text":"이 말은 \"너희는 다 나쁜 사람이다\"라는 손가락질이 아닙니다. 꽃병의 꽃처럼, 사람이 모두 뿌리에서 떨어진 채 태어난다는 진단입니다. 진단은 정죄가 아닙니다. 의사가 병명을 말해 주는 것은 고치기 위해서입니다."},{"t":"h3","text":"갈라놓은 것은 누구일까요"},{"t":"p","text":"그렇다면 그 사이를 갈라놓은 쪽은 누구일까요. 성경의 한 예언자는 이렇게 적었습니다."},{"t":"verse","ref":"이사야 59장 1절에서 2절","text":"여호와의 손이 짧아 구원하지 못하심도 아니요 귀가 둔하여 듣지 못하심도 아니라 오직 너희 죄악이 너희와 너희 하나님 사이를 갈라 놓았고 너희 죄가 그의 얼굴을 가리어서 너희에게서 듣지 않으시게 함이니라"},{"t":"p","text":"박사님은 이 구절을 에덴에서 나무 사이에 숨은 두 사람의 모습과 겹쳐 읽습니다. 하나님과 우리 사이에 틈을 낸 것은 하나님이 아니라 우리 자신이라는 것입니다. 제12과에서 들은 두부 가게 이야기가 바로 이 구절에 붙은 이야기입니다. 삼촌의 사랑은 조금도 변하지 않았는데, 돈에 손을 댄 조카가 먼저 삼촌을 피했습니다. 박사님은 성경을 공부하기 시작하던 무렵 이 구절을 만나 큰 위로를 받았다고 고백합니다. 하나님이 얼굴을 돌리신 것이 아니었기 때문입니다."},{"t":"p","text":"박사님은 우리에게 익숙한 장면도 하나 듭니다. 큰 병에 걸리면 많은 분들이 곧바로 '벌을 받았구나' 하고 생각하고, 다니지 않던 교회를 찾기 시작합니다. 사람이 본능처럼 하나님을 조건을 거시는 분으로 여긴다는 증거입니다. 그러나 박사님은 건강강의에서 분명히 말합니다. 병은 하나님이 내리신 벌이 아닙니다. 그분은 여전히 그 자리에 계시고, 숨은 쪽은 우리입니다."},{"t":"h3","text":"포도나무와 가지"},{"t":"p","text":"죄가 '떨어져 있음'이라면, 그 반대는 무엇일까요. 예수님은 그것을 포도나무에 빗대어 말씀하셨습니다."},{"t":"verse","ref":"요한복음 15장 4절","text":"내 안에 거하라 나도 너희 안에 거하리라 가지가 포도나무에 붙어 있지 아니하면 스스로 열매를 맺을 수 없음 같이 너희도 내 안에 있지 아니하면 그러하리라"},{"t":"p","text":"가지는 열매를 맺으려고 이를 악물지 않습니다. 그저 나무에 붙어 있습니다. 붙어 있으면 나무에서 올라오는 생명이 가지를 지나 열매가 됩니다. 박사님은 남을 품는 힘도 내 노력으로 짜내는 것이 아니라 포도나무에 붙어 있을 때 맺히는 열매라고 말합니다. 내가 먼저 조건 없이 받아들여진 자리에서만 남을 받아들일 힘이 흘러나온다는 것입니다."},{"t":"p","text":"제1부에서 우리는 몸의 생명이 밖에서 공급되는 것임을 배웠습니다. 박사님은 작동을 멈춘 유전자를 전구에 빗댑니다. 전구는 멀쩡한데 전기가 끊어지면 불이 꺼집니다. 그때 필요한 것은 전구를 나무라는 일이 아니라 전기를 다시 이어 주는 일입니다. 죄를 '끊어진 생명줄'로 이해하면 하나님이 하시는 일도 달리 보입니다. 하나님은 꺼진 전구를 벌하시는 분이 아니라 끊어진 줄을 다시 이으시는 분입니다."},{"t":"h3","text":"순서가 중요합니다"},{"t":"p","text":"박사님은 여기에서 순서를 강조합니다. 열매를 보고 나서 가지를 나무에 붙여 주는 농부는 없습니다. 먼저 붙어야 열매가 맺힙니다. '착하게 살면 하나님이 받아 주신다'는 생각은 떨어진 가지에게 열매부터 맺어 오라고 하는 것과 같습니다. 지난 과에서 본 하나님은 두 사람이 달라지기 전에 먼저 옷을 지어 입히셨습니다."},{"t":"p","text":"그러니 '죄인'이라는 말을 들을 때 움츠러들 필요가 없습니다. 그 말은 \"너는 나쁜 사람이다\"가 아니라 \"너는 지금 생명에서 떨어져 있구나, 내가 다시 이어 주마\" 하시는 말씀의 앞부분입니다. 성경은 한 사람으로 말미암아 끊어진 줄이 또 한 분으로 말미암아 다시 이어졌다고 말합니다. 그분의 이야기는 제4부에서 시작됩니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"성경이 말하는 죄는 나쁜 행동의 목록이 아니라, 생명이신 하나님의 조건 없는 사랑에서 떨어져 있는 상태입니다. 그 사이를 갈라놓은 것은 하나님이 아니라 하나님을 오해하고 숨은 우리 쪽이었습니다. 하나님은 떨어진 가지를 나무라지 않으시고 다시 붙이려 하십니다. 열매는 붙어 있을 때 저절로 맺힙니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 꽃이나 화초를 길러 본 경험이 있습니까? 시들어 가던 것이 다시 살아난 일, 혹은 끝내 살리지 못한 일을 나누어 주십시오."},{"t":"q","i":1,"text":"둘째, '죄' 또는 '죄인'이라는 말을 들으면 어떤 느낌이 드십니까? 오늘 나눈 설명은 그 느낌과 어떻게 다릅니까?"},{"t":"q","i":2,"text":"셋째, 애쓰지 않아도 저절로 올라오는 미움이나 짜증을 최근에 겪은 적이 있습니까? 그때 내 마음은 무엇에 목말라 있었을까요?"},{"t":"q","i":3,"text":"넷째, 누군가와 '붙어 있다', '이어져 있다'고 느낄 때 나는 어떻게 달라집니까? 그런 관계가 있다면 이야기해 주십시오."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 15장 5절","text":"나는 포도나무요 너희는 가지라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"스스로를 나무라는 생각이 들 때, '나는 나쁜 사람이다' 대신 '나는 지금 사랑에 목마르구나' 하고 바꾸어 말해 봅니다."},{"t":"act","i":1,"text":"하루 5분, 아무것도 하지 않고 조용히 앉아 \"저는 가지입니다. 붙어 있겠습니다\" 하고 마음으로 말씀드려 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"'죄인'이라는 말에 거부감을 보이는 분이 있는 것은 자연스러운 일입니다. 설득하려 하지 말고, 성경의 죄가 도덕 점수가 아니라 관계의 끊어짐을 뜻한다는 점을 꽃과 가지의 그림으로 거듭 보여 주십시오. 반대로 \"그러면 나쁜 짓을 해도 괜찮다는 말입니까\" 하는 질문도 나옵니다. 괜찮지 않습니다. 떨어진 채로 살면 자신과 이웃이 실제로 상합니다. 다만 해결이 '더 애쓰기'가 아니라 '다시 붙기'에 있다는 점을 짚어 주십시오. 아픈 분이 계시면 \"병은 하나님이 내리신 벌이 아니다\"라는 대목을 천천히 읽어 주되, 믿으면 병이 낫는다는 식으로 들리지 않게 하고 치료는 성실히 받으시도록 권하십시오."}],"inPart":3,"audio":"audio/17.m4a"},{"id":"18","kind":"lesson","no":15,"part":null,"title":"죽음은 벌일까요","sub":"\"죄의 삯은 사망\"이라는 말은 하나님이 죽이신다는 뜻일까요","key":{"ref":"로마서 6장 23절","text":"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사는 초등학교와 중학교 시절의 교실을 이렇게 기억합니다. 누가 조금만 떠들어도 반 전체가 복도에 한 줄로 서서 손바닥을 자로 맞았습니다. 담임 선생님은 키 순서대로 줄을 세웠는데, 박사님은 키가 제일 커서 늘 맨 끝이었습니다. 앞의 수십 명이 맞는 동안 손을 내민 채 차례를 기다려야 했습니다. 먼저 맞은 아이들은 벌써 놀고 있는데 혼자 기다리는 그 시간이 매보다 더 힘들었다고 합니다."},{"t":"p","text":"그 시절에는 벌을 주는 것이 교육이라고 다들 믿었습니다. 잘못하면 벌을 받고, 잘하면 상을 받는다는 것은 우리 몸에 밴 생각입니다. 그래서 하나님도 당연히 그렇게 하시는 분이라고 여깁니다. 하늘 어딘가에서 장부를 들고 계시다가 때가 되면 값을 치르게 하시는 분 말입니다. 그렇게 믿으면 인생은 손을 내밀고 차례를 기다리는 복도가 됩니다."},{"t":"p","text":"지난 과에서 우리는 죄가 생명에서 떨어져 있는 상태임을 보았습니다. 그렇다면 죽음은 무엇일까요. 성경에는 \"죄의 삯은 사망\"이라는 말이 있습니다. 죽음은 하나님이 내리시는 가장 큰 벌일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"벌과 결과는 다릅니다"},{"t":"p","text":"먼저 두 낱말을 나누어 보겠습니다. 벌은 누군가가 정해서 밖에서 덧붙이는 것입니다. 떠든 것과 손바닥을 맞는 것 사이에는 본래 아무 관계가 없습니다. 선생님이 그렇게 정했을 뿐입니다. 결과는 다릅니다. 결과는 그 일 자체에서 나옵니다. 불에 손을 넣으면 뎁니다. 누가 벌을 주어서가 아닙니다."},{"t":"p","text":"제11과에서 읽은 하나님의 말씀을 다시 떠올려 보겠습니다. \"네가 먹는 날에는 반드시 죽으리라\"(창세기 2장 17절). 박사님은 이 말을 \"내가 너를 죽이겠다\"로 읽어서는 안 된다고 거듭 말합니다. 생명을 주시는 분에게서 스스로 떨어지면 생명이 없어지므로 죽는다는 결과를 미리 알려 주신 것입니다. 독을 먹으면 독 때문에 죽는 것과 같고, 컴퓨터에서 프로그램을 빼면 그 기능이 사라지는 것과 같다고 박사님은 설명합니다."},{"t":"p","text":"건강강의에서 박사님은 이렇게도 말합니다. 담배를 오래 피운 사람이 폐암에 걸리는 것은 하나님이 내린 벌이 아니라 담배를 선택한 데서 온 결과이고, 독한 술을 날마다 마셔 간이 상하는 것도 마찬가지라고 말입니다. 몸의 일을 두고는 누구나 이것을 압니다. 성경이 말하는 죽음도 같은 자리에서 읽어야 합니다."},{"t":"h3","text":"'삯'이라는 말"},{"t":"p","text":"'삯'은 일한 만큼 돌아오는 품삯, 곧 대가라는 뜻입니다. 죄가 생명에서 떨어져 있는 상태라면, 그 상태가 끝내 가 닿는 곳이 죽음입니다. 지난 과의 꽃을 떠올리면 쉽습니다. 꺾인 꽃이 시드는 것은 꺾임이 치르는 값이지, 누가 꽃을 미워해서 말려 죽이는 것이 아닙니다."},{"t":"p","text":"이렇게 읽으면 한 가지 궁금증도 풀립니다. 아담과 하와는 열매를 먹은 그날 숨이 끊어지지 않았습니다. 그래서 뱀의 말이 맞았던 것처럼 보입니다. 그러나 박사님은 하나님의 발소리에 반가워 달려 나가던 두 사람이 두려워 숨은 그 장면을 가리켜, 생명이신 분에게서 떨어진 그것이 곧 죽음이라고 말합니다. 꽃은 꺾인 날 시들지 않지만, 꺾인 날부터 시들기 시작합니다."},{"t":"p","text":"박사님의 가정에도 이 이야기가 있습니다. 큰딸은 아버지의 사랑을 받지 못한다고 느끼며 자랐고, 대학 시절 마약에 손을 댔다가 끝내 감옥에 가게 되었습니다. 박사님은 딸에게 네가 겪는 일은 하나님의 벌이 아니라 네 선택이 가져온 것이며, 하나님은 나쁜 선택을 했다고 너를 버리지 않으시니 언제든 돌아오면 된다고 말해 왔다고 합니다. 감방에 첫발을 들여놓던 날, 딸은 자기가 여기까지 온 것이 순간순간의 선택이 쌓인 결과임을 알아보았고, 그 자리에서 스스로 무릎을 꿇었습니다. 딸은 훗날 마약에 빠진 사람들을 돕는 상담사가 되었습니다. 벌이라고 믿었다면 원망하거나 숨었을 것입니다. 결과임을 알았기에 돌이킬 수 있었습니다."},{"t":"h3","text":"하나님이 하시는 일은 살리는 일입니다"},{"t":"p","text":"그러면 하나님은 그 결과 앞에서 무엇을 하고 계실까요. 박사님은 한마디로 말합니다. \"하나님은 구원을 위해 계신 분이지 형벌을 위해 존재하는 분이 아니다.\" 오늘의 핵심 성구는 뒤쪽 절반이 더 중요합니다. 죄에는 삯이 따르지만, 하나님에게서는 '은사' 곧 값없이 주시는 선물이 옵니다. 그 선물이 생명입니다. 죽음은 죄에서 나오고, 하나님에게서는 생명만 나옵니다."},{"t":"p","text":"박사님은 이렇게 묻기도 합니다. 생명에서 떨어진 채 태어난 사람은 이미 죽음 아래 있는 셈인데, 그런 사람에게 무슨 벌을 더 얹을 수 있겠느냐는 것입니다. 그러니 하나님이 하실 일은 하나뿐입니다. 조건 없는 사랑이라는 생기를 주어 살리는 일입니다."},{"t":"p","text":"성경의 다른 곳에서 하나님은 당신의 백성에게 이렇게 물으십니다. \"너희가 어찌하여 죽고자 하느냐\"(에스겔 18장 31절). 박사님은 이 말을 벌주겠다는 으름장이 아니라 안타까운 호소로 읽습니다. 낭떠러지로 걸어가는 자식을 부르는 부모의 목소리입니다. 예수님은 당신이 오신 까닭을 이렇게 밝히셨습니다."},{"t":"verse","ref":"요한복음 10장 10절","text":"도둑이 오는 것은 도둑질하고 죽이고 멸망시키려는 것뿐이요 내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라"},{"t":"p","text":"죽이고 멸망시키는 쪽과 생명을 주는 쪽이 분명히 갈려 있습니다. 하나님은 언제나 생명 쪽에 서 계십니다. 박사님은 한 걸음 더 나아가, 하나님은 사람에게 자유를 주신 이상 그 자유가 부른 죽음의 결과까지 당신이 책임지기로 하셨다고 말합니다. 가죽옷에 담긴 약속이 바로 그것입니다. 그 책임을 어떻게 지셨는지는 제5부에서 나누겠습니다."},{"t":"h3","text":"벌이라고 믿으면 생기는 일"},{"t":"p","text":"이것은 머릿속 생각의 차이로 그치지 않습니다. 박사님의 건강강의에 안젤라라는 분의 이야기가 나옵니다. 그분은 자기 관절염을 하나님이 주신 벌로 알았습니다. 그래서 병원에 가서 약을 먹고 덜 아프게 되는 것조차 하나님을 더 노엽게 하는 일이라고 여겼습니다. 고통을 겪으라고 주신 병인데 피하면 안 된다는 것입니다. 박사님은 그렇게 생각하는 한 어떤 치료도 들어갈 자리가 없다고 말합니다."},{"t":"p","text":"병을 벌로 읽으면 치료받는 일마저 죄스러워지고, 두려움과 긴장은 더 깊어집니다. 병을 결과로 읽으면 길이 열립니다. 원인을 찾아 생활을 바꾸고, 필요한 치료를 감사히 받고, 생명을 주시는 분께 마음 놓고 도움을 구할 수 있습니다. 하나님은 아픈 사람 맞은편에서 매를 들고 계신 분이 아니라, 아픈 사람 곁에서 살리는 일을 하시는 분이기 때문입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"죽음은 하나님이 내리시는 벌이 아니라, 생명이신 분에게서 떨어진 상태가 끝내 가 닿는 결과입니다. \"반드시 죽으리라\"는 위협이 아니라 낭떠러지 앞의 표지판이었습니다. 하나님에게서는 죽음이 나오지 않고 생명만 나옵니다. 그분은 \"어찌하여 죽고자 하느냐\" 하고 부르시며, 그 결과까지 몸소 책임지시는 분입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 학창 시절에 받은 벌 가운데 기억에 남는 것이 있습니까? 그 벌은 나를 어떻게 바꾸었습니까, 혹은 바꾸지 못했습니까?"},{"t":"q","i":1,"text":"둘째, 몸이 아프거나 일이 크게 틀어졌을 때 '내가 벌을 받나 보다' 하고 생각한 적이 있습니까? 그 생각은 그때의 나에게 어떤 영향을 주었습니까?"},{"t":"q","i":2,"text":"셋째, 같은 어려움을 '벌'로 받아들일 때와 '결과'로 받아들일 때, 그다음 나의 행동은 어떻게 달라질 것 같습니까?"},{"t":"q","i":3,"text":"넷째, \"하나님에게서는 생명만 나온다\"는 말이 사실이라면, 지금 내 삶에서 가장 먼저 내려놓고 싶은 두려움은 무엇입니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"로마서 6장 23절","text":"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 '벌 받았다'는 말이 입이나 마음에 떠오르면 '벌이 아니라 결과다. 하나님은 지금도 살리는 일을 하신다'로 바꾸어 말해 봅니다."},{"t":"act","i":1,"text":"내 몸을 위해 미루어 온 일 한 가지(검진, 치료, 산책, 잠자리 시간 등)를 정해 이번 주 안에 시작합니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"가족을 잃은 분이나 투병 중인 분이 계실 수 있습니다. \"결과\"라는 말이 \"당신 탓\"으로 들리지 않게 조심하십시오. 이 과가 말하는 결과는 인류 전체가 생명에서 떨어져 있다는 큰 그림이지, 개인의 병과 죽음을 그 사람의 잘못과 하나하나 잇는 것이 아닙니다. 병은 벌이 아니라는 점, 하나님이 곁에 계신다는 점에 무게를 두십시오. \"그러면 지옥이나 마지막 심판은 무엇입니까\" 하는 질문이 나오면, 같은 원리로 읽는다는 것만 말하고 이 모임에서는 깊이 들어가지 마십시오. 제5부에서 십자가를 나눈 뒤에 다루는 편이 좋습니다. 이 과로 제3부가 끝납니다. 다음 과부터 '눈에 보이는 하나님' 예수님을 만난다고 예고해 주십시오."}],"inPart":3,"audio":"audio/18.m4a"},{"id":"19","kind":"part","no":null,"part":4,"title":"예수님, 눈에 보이는 하나님","sub":null,"key":null,"blocks":[{"t":"p","text":"제3부에서 우리는 사람이 하나님을 오해하게 된 이야기를 살펴보았습니다. 하나님은 변함없이 사랑이셨지만, 두려움에 사로잡힌 사람의 눈에는 그분이 무서운 분으로만 보였습니다. 멀리서 들려오는 말로는 그 오해가 풀리지 않았습니다."},{"t":"p","text":"그래서 하나님은 직접 오셨습니다. 사람의 몸을 입고, 우리가 보고 듣고 만질 수 있는 자리까지 내려오셨습니다. 그분이 예수님입니다. 예수님은 \"나를 본 자는 아버지를 보았다\"고 말씀하셨습니다. 하나님이 어떤 분인지 궁금하다면 예수님을 보면 된다는 뜻입니다."},{"t":"p","text":"제4부에서는 다섯 걸음에 걸쳐 예수님을 가까이에서 지켜봅니다. 돌에 맞을 뻔한 여인 앞에서, 한낮의 우물가에서, 열두 해를 앓은 환자 곁에서, 그리고 제자들의 더러운 발 앞에서 그분이 어떻게 하셨는지를 봅니다. 장면마다 같은 얼굴이 보일 것입니다. 정죄하지 않으시고, 먼저 찾아오시고, 손을 내미시고, 무릎을 꿇으시는 얼굴입니다. 그 얼굴이 하나님의 얼굴입니다."}],"inPart":4,"audio":"audio/19.m4a"},{"id":"20","kind":"lesson","no":16,"part":null,"title":"나를 본 사람은 아버지를 보았습니다","sub":"눈에 보이지 않는 하나님이 어떤 분인지, 우리는 어떻게 알 수 있을까요?","key":{"ref":"요한복음 14장 9절","text":"예수께서 이르시되 빌립아 내가 이렇게 오래 너희와 함께 있으되 네가 나를 알지 못하느냐 나를 본 자는 아버지를 보았거늘 어찌하여 아버지를 보이라 하느냐"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사가 강의에서 든 비유가 하나 있습니다. 조금 풀어서 옮겨 보겠습니다. 어떤 사람이 개미를 몹시 사랑하게 되었다고 해 봅시다. 그는 개미들에게 \"나는 너희를 해치지 않는다, 너희를 사랑한다\"고 알려 주고 싶습니다. 그런데 방법이 없습니다. 가까이 다가가면 개미들은 커다란 그림자에 놀라 흩어집니다. 큰 소리로 말해도 개미에게는 천둥소리일 뿐입니다. 그 사람이 자기 마음을 개미에게 알릴 길은 하나뿐입니다. 자신이 개미가 되어 개미들 사이로 들어가는 것입니다."},{"t":"p","text":"지난 제3부에서 우리는 사람이 하나님을 오해하게 된 이야기를 살펴보았습니다. 사람은 하나님을 무서운 분으로 여겨 나무 뒤에 숨었고, 그 오해는 세대를 거치며 점점 굳어졌습니다. 멀리서 들려오는 큰 목소리만으로는 그 오해가 풀리지 않았습니다. 두려워하는 사람에게는 사랑의 말도 호통으로 들리기 때문입니다."},{"t":"p","text":"그렇다면 하나님은 어떻게 하셨을까요. 눈에 보이지 않는 그분의 마음을, 우리는 어디에서 확인할 수 있을까요. 제4부를 여는 이번 과는 이 질문에서 출발합니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"\"아버지를 보여 주십시오\""},{"t":"p","text":"예수님이 십자가에 달리시기 전날 밤의 일입니다. 삼 년 넘게 예수님을 따라다닌 제자 빌립이 아버지를 보여 달라고, 그러면 더 바랄 것이 없겠다고 청했습니다(요한복음 14장 8절). 여기서 '아버지'는 하나님을 가리킵니다. 예수님은 하나님을 늘 '아버지'라고 부르셨습니다."},{"t":"p","text":"빌립의 부탁은 사실 우리 모두의 부탁입니다. 하나님이 계시다면 한 번만 보여 달라는 것, 어떤 분인지 확실히 알고 싶다는 것입니다. 그런데 예수님의 대답은 뜻밖이었습니다. \"나를 본 자는 아버지를 보았다.\" 하나님이 궁금하면 나를 보라는 말씀입니다."},{"t":"p","text":"이 대답에는 서운함보다 안타까움이 배어 있습니다. \"내가 이렇게 오래 너희와 함께 있으되\"라고 하셨습니다. 빌립은 예수님이 아픈 사람을 고치시고, 손가락질받는 사람과 한 상에서 드시고, 아이들을 안아 주시는 것을 곁에서 다 보았습니다. 그런데도 그는 하나님은 어딘가 따로 계신 다른 모습의 분일 것이라고 여겼습니다. 눈앞의 이 따뜻한 분과, 자기가 어려서부터 들어 온 엄하신 하나님이 같은 분이라고는 미처 생각하지 못한 것입니다."},{"t":"p","text":"박사님은 이 구절을 두고, 예수님이 이 땅에 오신 첫째 목적을 설명합니다. 그때까지 세상 사람들은 하나님이 어떤 분인지 잘 몰랐습니다. 그래서 하나님의 진짜 모습을 실제로 보여 주시려고 오셨다는 것입니다. 그리고 예수님이 보여 주신 하나님의 모습을 한 단어로 하면 '은혜', 곧 자격을 묻지 않고 거저 주시는 무조건적인 사랑이라고 합니다."},{"t":"p","text":"요한복음의 첫머리도 같은 이야기를 합니다. 요한복음 1장 18절은 본래 하나님을 본 사람이 없지만, 아버지 품속에 계시던 독생하신 분이 그분을 나타내셨다고 말합니다. '독생하신 분'이란 하나님의 하나뿐인 아들, 곧 예수님을 뜻합니다. 아무도 본 적 없는 하나님을 예수님이 풀어서 보여 주셨다는 고백입니다."},{"t":"h3","text":"사랑은 몸을 입고 내려옵니다"},{"t":"verse","ref":"요한복음 1장 14절","text":"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"},{"t":"p","text":"'말씀이 육신이 되었다'는 표현이 낯설게 들릴 수 있습니다. 쉽게 말하면, 하나님이 사람의 몸을 입고 우리 곁에 와서 사셨다는 뜻입니다. 박사님은 여기서 \"은혜와 진리가 충만하더라\"는 말에 주목합니다. 은혜와 진리는 예수님이 들고 오신 물건이 아니라 예수님의 본성 그 자체라는 것입니다. 그러니 하나님의 본성이 사람의 몸을 입고 우리 가운데 왔다는 말이 됩니다."},{"t":"p","text":"성경의 다른 곳은 이 일을 이렇게 전합니다."},{"t":"verse","ref":"빌립보서 2장 7절에서 8절","text":"오히려 자기를 비워 종의 형체를 가지사 사람들과 같이 되셨고 사람의 모양으로 나타나사 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라"},{"t":"p","text":"박사님은 이 대목에서 되묻습니다. 왜 하필 '종'의 모습일까요. 섬기기 위해서입니다. 만약 하나님이 조건을 따지는 분이라면 하늘 높은 곳에 앉아 \"나를 열심히 섬겨라, 많이 바쳐라, 그러면 누구에게 복을 줄지 내가 정하겠다\"고 하셨을 것입니다. 그런 신은 결코 사람이 되어 종의 자리로 내려올 수 없습니다. 조건 없이 사랑하시는 하나님만이 그렇게 하실 수 있다고 박사님은 설명합니다. 처음에 나눈 개미 이야기가 바로 이 대목에서 나온 비유입니다."},{"t":"p","text":"하나님이 사랑이시라면, 그 사랑은 멀리서 말로만 머물지 않습니다. 만질 수 있는 자리까지 내려옵니다. 아기가 울면 엄마는 방 저편에서 \"사랑한다\"고 외치지 않고 달려가 안아 줍니다. 사랑은 본래 몸으로 가까이 가는 것입니다."},{"t":"h3","text":"이름을 아는 것과 그분을 아는 것"},{"t":"p","text":"이제 우리에게는 하나님을 알아볼 확실한 길이 생겼습니다. 하나님이 어떤 분인지 헷갈릴 때마다 예수님을 보면 됩니다. 예수님이 죄지은 사람을 어떻게 대하셨는지, 따돌림받는 사람에게 어떻게 다가가셨는지, 병든 사람 곁에서 무엇을 하셨는지를 보면 됩니다. 그것이 곧 하나님의 마음입니다. 예수님은 아버지와 다른 분이 아니었습니다. 아버지가 엄하고 아들이 그 사이에서 말리는 그림이 아닙니다. 아들의 얼굴이 곧 아버지의 얼굴입니다."},{"t":"p","text":"예수님은 기도 가운데 이렇게 말씀하셨습니다."},{"t":"verse","ref":"요한복음 17장 3절","text":"영생은 곧 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 아는 것이니이다"},{"t":"p","text":"'영생'은 영원한 생명이라는 뜻입니다. 박사님은 여기서 \"안다\"는 말을 풀어 줍니다. 대통령의 이름은 온 국민이 알지만, 그분을 개인적으로 아는 사람은 거의 없습니다. 이름을 들어 본 것과 함께 살며 속마음까지 아는 것은 전혀 다릅니다. 성경이 말하는 앎은 부부가 서로를 아는 것처럼 깊고 친밀한 앎이라고 합니다."},{"t":"p","text":"박사님은 \"유일하신 참 하나님\"이라는 표현도 짚습니다. 많은 사람이 하나님을 믿는다고 하지만, 무엇을 해 드리면 그 대가로 복을 주시는 조건적인 하나님을 떠올리는 경우가 많다는 것입니다. 예수님이 보여 주신 참 하나님은 조건 없이 사랑하시는 분입니다. 그분을 그렇게 알아 가는 것이 곧 생명이라고 성경은 말합니다."},{"t":"p","text":"그래서 앞으로 네 과에 걸쳐 우리는 예수님을 가까이에서 지켜보려고 합니다. 돌에 맞아 죽게 된 여인 앞에서, 한낮의 우물가에서, 열두 해를 앓은 환자 곁에서, 제자들의 더러운 발 앞에서 예수님이 어떻게 하셨는지를 보겠습니다. 그 장면 하나하나가 \"하나님은 이런 분이십니다\" 하고 보여 주는 창문입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"아무도 하나님을 본 적이 없기에 사람들은 저마다 두려운 하나님을 그려 왔습니다. 그래서 하나님은 직접 사람이 되어 우리 곁으로 오셨습니다. 예수님을 보면 하나님이 보입니다. 예수님에게서 볼 수 없는 무서운 얼굴은 하나님의 얼굴이 아닙니다. 하나님은 높은 데서 섬김을 요구하시는 분이 아니라, 낮은 데로 내려와 우리를 섬기시는 사랑이십니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 '하나님' 또는 '신'이라고 하면 어떤 모습이 떠올랐습니까? 그 그림은 어디에서 왔을까요?"},{"t":"q","i":1,"text":"둘째, 누군가를 소문으로만 알다가 직접 만나 보고 생각이 바뀐 적이 있습니까?"},{"t":"q","i":2,"text":"셋째, 말로 하는 \"사랑한다\"와, 곁에 와서 함께 있어 주는 것은 어떻게 다르게 느껴집니까? 기억나는 경험을 나누어 봅시다."},{"t":"q","i":3,"text":"넷째, \"예수님을 보면 하나님을 안다\"는 말이 사실이라면, 내가 가장 먼저 확인해 보고 싶은 것은 무엇입니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 14장 9절","text":"나를 본 자는 아버지를 보았거늘"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 요한복음 1장 1에서 18절을 천천히 한 번 읽고, 마음에 남는 한 구절을 적어 봅니다."},{"t":"act","i":1,"text":"멀리서 말로만 마음을 전하던 사람 한 명을 직접 찾아가거나 전화를 걸어 목소리로 안부를 전합니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 제4부의 문을 여는 과입니다. 결론을 서둘러 가르치기보다 \"예수님을 통해 하나님을 본다\"는 한 가지만 분명히 남기면 충분합니다. 처음 오신 분은 \"예수님이 하나님이라는 말입니까?\" 하고 물으실 수 있습니다. 교리로 길게 설명하기보다 \"성경은 하나님이 자신을 알리시려고 사람이 되어 오셨다고 말합니다. 앞으로 네 주 동안 그분이 어떤 분인지 함께 지켜보시지요\" 정도로 답하고 넘어가십시오. 구약의 무서운 장면을 들어 반문하는 분이 있으면 반박하지 말고, 그 질문을 품은 채 예수님의 모습을 먼저 보자고 권하십시오. 첫 질문에서 어린 시절의 하나님 상을 충분히 나누게 하면 이후 과들이 훨씬 잘 열립니다."}],"inPart":4,"audio":"audio/20.m4a"},{"id":"21","kind":"lesson","no":17,"part":null,"title":"\"나도 너를 정죄하지 않는다\"","sub":"잘못을 들킨 사람 앞에서 하나님은 어떤 표정을 지으실까요?","key":{"ref":"요한복음 8장 10절에서 11절","text":"예수께서 일어나사 여자 외에 아무도 없는 것을 보시고 이르시되 여자여 너를 고발하던 그들이 어디 있느냐 너를 정죄한 자가 없느냐 대답하되 주여 없나이다 예수께서 이르시되 나도 너를 정죄하지 아니하노니 가서 다시는 죄를 범하지 말라 하시니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"누구에게나 들키고 싶지 않은 순간이 있습니다. 어린 시절 어머니 지갑에 손을 댔다가 들킨 날, 시험지 점수를 고쳤다가 선생님께 불려 간 날을 떠올려 보십시오. 가슴이 쿵 내려앉고 얼굴이 달아오릅니다. 그때 가장 두려운 것은 매가 아니라 나를 바라보는 눈빛입니다. \"네가 그럴 줄 알았다\"는 눈빛 하나가 오래도록 마음에 남습니다."},{"t":"p","text":"어른이 되어서도 크게 다르지 않습니다. 우리는 실수와 잘못을 감추며 삽니다. 그리고 마음 한구석에서 이렇게 생각합니다. 사람은 속여도 하늘은 다 보고 있을 텐데, 하늘은 나를 어떻게 볼까 하고 말입니다. '정죄'라는 말은 \"너는 죄인이다\" 하고 판결을 내리는 것을 뜻합니다. 많은 분이 하나님을 바로 그 판결을 내리시는 분으로 알고 계십니다."},{"t":"p","text":"지난 과에서 우리는 예수님을 보면 하나님을 알 수 있다고 배웠습니다. 그렇다면 가장 부끄러운 순간에 들킨 한 사람 앞에서 예수님은 어떻게 하셨을까요. 오늘은 그 장면으로 들어가 봅니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"끌려 나온 여인, 그리고 함정"},{"t":"p","text":"어느 이른 아침, 예수님은 예루살렘 성전에서 사람들을 가르치고 계셨습니다. 그때 한 무리가 소란스럽게 들이닥쳤습니다."},{"t":"verse","ref":"요한복음 8장 3절에서 5절","text":"서기관들과 바리새인들이 음행중에 잡힌 여자를 끌고 와서 가운데 세우고 예수께 말하되 선생이여 이 여자가 간음하다가 현장에서 잡혔나이다 모세는 율법에 이러한 여자를 돌로 치라 명하였거니와 선생은 어떻게 말하겠나이까"},{"t":"p","text":"서기관은 성경을 손으로 베껴 쓰며 연구하던 학자들이고, 바리새인은 종교 규칙을 엄격히 지켜 존경받던 사람들입니다. '율법'은 모세를 통해 전해진 옛 이스라엘의 법입니다. 박사님은 이 장면의 구조를 하나씩 짚습니다. 먼저, 왜 여자만 끌려왔을까요. 그 법대로라면 남자도 함께 벌을 받아야 합니다. 남자는 빠져나가게 두고 여자만 붙잡아 온 것입니다."},{"t":"p","text":"더 중요한 점이 있습니다. 그들의 진짜 표적은 여자가 아니라 예수님이었습니다. 성경은 이것이 예수님을 고발할 구실을 얻으려는 시험이었다고 밝힙니다. \"돌로 치라\"고 하시면 그동안 전해 오신 사랑이 무너집니다. \"치지 말라\"고 하시면 모세의 법을 어겼다고 고발할 수 있습니다. 어느 쪽으로 답해도 걸리는 덫이었습니다. 한 사람의 목숨과 수치가 남을 넘어뜨리는 미끼로 쓰이고 있었습니다."},{"t":"p","text":"여인은 사람들 한가운데 서 있었습니다. 변명할 말도, 편들어 줄 사람도 없었습니다. 손에 돌을 쥔 사람들의 눈길이 온몸에 꽂혔을 것입니다."},{"t":"h3","text":"몸을 굽혀 땅에 쓰시다"},{"t":"verse","ref":"요한복음 8장 6절","text":"예수께서 몸을 굽히사 손가락으로 땅에 쓰시니"},{"t":"p","text":"예수님은 맞받아 논쟁하지 않으셨습니다. 조용히 몸을 굽혀 땅에 무언가를 쓰셨습니다. 박사님은 이것을 상대를 이기려는 '경쟁적 대화'가 아니라 스스로 깨닫게 하는 '사랑의 대화'라고 부릅니다. 고발하는 사람들조차 몰아세우지 않으신 것입니다. 그 순간 사람들의 눈길은 여인에게서 예수님의 손끝으로 옮겨 갔습니다."},{"t":"p","text":"무엇을 쓰셨는지 성경은 말하지 않습니다. 박사님은 하나의 추정을 내놓습니다. 성경에 밝은 그들 앞에, 옛 성경에 이미 나오는 용서받은 사람들의 이름을 쓰셨으리라는 것입니다. 이스라엘이 가장 존경하는 다윗 왕도 남의 아내를 빼앗고 그 남편을 죽게 한 사람이었지만 하나님께 용서받고 살았습니다. 어디까지나 추정이지만, 그 법대로라면 죽었어야 할 사람들을 하나님이 살려 오셨다는 것만은 성경에 분명히 적혀 있습니다."},{"t":"p","text":"사람들이 계속 다그치자 예수님은 일어나 한마디를 하셨습니다. \"너희 중에 죄 없는 자가 먼저 돌로 치라.\" 그리고 다시 몸을 굽히셨습니다."},{"t":"verse","ref":"요한복음 8장 9절","text":"그들이 이 말씀을 듣고 양심에 가책을 느껴 어른으로 시작하여 젊은이까지 하나씩 하나씩 나가고 오직 예수와 그 가운데 섰는 여자만 남았더라"},{"t":"p","text":"돌이 하나씩 땅에 떨어졌습니다. 나이 많은 사람부터 떠났다는 기록을 두고 박사님은, 오래 산 사람일수록 자기가 어떤 사람인지 더 잘 알기 때문이라고 풀이합니다. 눈여겨볼 것이 하나 더 있습니다. 여인은 달아나지 않았습니다. 고발하던 사람들은 떠났는데 고발당한 사람은 그분 곁에 남았습니다. 이분 곁이 가장 안전한 자리라는 것을 느꼈기 때문일 것입니다."},{"t":"h3","text":"용서가 먼저였습니다"},{"t":"p","text":"이제 두 사람만 남았습니다. 그 자리에서 돌을 들 자격이 있는 분이 있다면 예수님 한 분이었습니다. 그런데 그분의 입에서 나온 말은 이것이었습니다. \"나도 너를 정죄하지 아니하노니.\""},{"t":"p","text":"순서를 눈여겨보십시오. 여인은 아직 아무것도 하지 않았습니다. 잘못했다고 빌지도 않았고, 다시는 안 그러겠다고 약속하지도 않았습니다. 박사님은 이 여인이 어떤 조건도 채우지 않은 채 오직 예수님의 무조건적인 사랑으로 살아났다는 점을 거듭 강조합니다. 용서가 먼저였고, 새 삶은 그 뒤에 따라왔습니다."},{"t":"p","text":"그러면 \"가서 다시는 죄를 범하지 말라\"는 말씀은 무슨 뜻일까요. 박사님은 이 말이 두 가지로 오해된다고 합니다. 하나는 이제부터 한 점 잘못 없이 살라는 요구로 듣는 것이고, 다른 하나는 \"이번 한 번은 봐주지만 다음에는 끝이다\"라는 경고로 듣는 것입니다. 둘 다 아니라고 합니다. 그 말씀은 \"네가 이미 용서받았다는 것을 의심하지 말라\", 방금 받은 이 은혜를 붙들고 살라는 사랑의 당부라고 풀이합니다. 박사님은 이 말씀을 '새 출발'이라는 말로 옮기기도 합니다."},{"t":"p","text":"그렇다면 예수님은 법을 무시하신 것일까요. 박사님은 그렇지 않다고 합니다. 예수님은 법을 어기신 것이 아니라 가장 높은 법, 곧 사랑을 행하신 것이라고 설명합니다. 성경은 \"사랑은 율법의 완성\"이라고 말합니다(로마서 13장 10절). 법이 본래 지키려던 것은 사람입니다. 그 여인이 어쩌다 그런 처지에 이르렀는지 아무도 묻지 않았지만, 예수님은 죄목이 아니라 사람을 보셨습니다."},{"t":"p","text":"죄를 대수롭지 않게 여기신 것이 아닙니다. 죄가 사람을 얼마나 망가뜨리는지 누구보다 잘 아시는 분입니다. 다만 정죄가 사람을 살리지 못한다는 것도 아셨습니다. 수치를 당한 사람은 더 깊이 숨을 뿐입니다. 사람을 다시 일으키는 것은 \"너는 끝났다\"는 판결이 아니라 \"나는 너를 정죄하지 않는다\"는 음성입니다."},{"t":"p","text":"이 일이 있은 바로 뒤에 예수님은 \"나는 세상의 빛\"이라고 말씀하셨습니다(요한복음 8장 12절). 박사님은 이 말씀을, 정죄하는 눈으로 서로를 보던 어둠에서 나와 사랑의 하나님을 보는 생명의 빛으로 들어오라는 초청으로 읽습니다. 빛은 사람을 가려 가며 비치지 않습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"예수님을 보면 하나님을 봅니다. 가장 부끄러운 순간에 끌려 나온 사람 앞에서 하나님은 돌을 들지 않으십니다. 용서는 뉘우침의 대가로 주어진 것이 아니라 먼저 주어진 선물이었고, 새로운 삶은 그 선물에서 시작되었습니다. 오늘 내 마음속에서 나를 고발하는 소리가 아무리 커도, 하나님의 음성은 그 소리와 다릅니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 어릴 때 잘못을 들켰는데 뜻밖에 혼나지 않고 넘어간 기억이 있습니까? 그때 마음이 어땠습니까?"},{"t":"q","i":1,"text":"둘째, 이 장면에서 나는 누구와 가장 닮았다고 느낍니까? 돌을 든 사람, 구경하는 사람, 가운데 선 여인 가운데서 골라 이야기해 봅시다."},{"t":"q","i":2,"text":"셋째, 누군가의 비난보다 내가 나 자신을 정죄하는 소리가 더 클 때가 있습니다. 그 소리는 주로 어떤 말을 합니까?"},{"t":"q","i":3,"text":"넷째, \"나도 너를 정죄하지 않는다\"는 말을 내가 직접 듣는다면, 내 삶에서 무엇이 달라질 것 같습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 8장 11절","text":"나도 너를 정죄하지 아니하노니"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 스스로를 탓하는 생각이 올라올 때마다 \"나도 너를 정죄하지 않는다\"는 말씀을 소리 내어 한 번 읽습니다."},{"t":"act","i":1,"text":"가족이나 동료의 실수를 보았을 때 지적하는 말을 한 번 참고, 대신 \"괜찮아요, 다시 하면 되지요\" 하고 말해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서 가장 자주 나오는 질문은 \"그러면 죄를 지어도 괜찮다는 말입니까?\"입니다. 서둘러 방어하지 마시고, 본문의 순서를 함께 다시 보자고 하십시오. 예수님은 죄를 괜찮다고 하지 않으셨습니다. 다만 정죄보다 용서를 먼저 주셨고, 새 삶은 거기서 나왔습니다. 혼나서 달라진 경험과 용서받아서 달라진 경험을 서로 나누게 하면 자연스럽게 풀립니다. 나눔 가운데 부끄러운 과거를 꺼내는 분이 있으면 조언하거나 평가하지 말고 그저 들어 주십시오. 이 모임이 돌을 내려놓는 자리가 되는 것이 이 과의 목표입니다. 땅에 쓰신 글의 내용은 추정이라는 점도 분명히 해 두십시오."}],"inPart":4,"audio":"audio/21.m4a"},{"id":"22","kind":"lesson","no":18,"part":null,"title":"우물가에서 만난 분","sub":"사람들을 피해 숨어 사는 이에게 하나님은 어떻게 다가오실까요?","key":{"ref":"요한복음 4장 13절에서 14절","text":"이 물을 마시는 자마다 다시 목마르려니와 내가 주는 물을 마시는 자는 영원히 목마르지 아니하리니 내가 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"사람을 피하고 싶은 때가 있습니다. 일이 잘못되어 소문이 돌 때, 이혼이나 실직처럼 설명하기 싫은 일을 겪을 때 우리는 아는 얼굴과 마주치지 않으려고 시간을 고릅니다. 장을 보러 가도 사람이 뜸한 시간에 가고, 엘리베이터에 누가 타고 있으면 다음 것을 기다립니다. 누가 뭐라고 하지 않아도 쳐다보는 눈길만으로 마음이 움츠러듭니다."},{"t":"p","text":"그렇게 지내다 보면 몸보다 마음이 먼저 마릅니다. 누군가 나를 있는 그대로 받아 주었으면 하는 바람은 깊어지는데, 그런 바람을 품는 것조차 염치없게 느껴집니다. 나 같은 사람을 누가 받아 주겠나 싶은 것입니다."},{"t":"p","text":"지난 과에서 우리는 사람들 앞에 끌려 나온 여인을 만났습니다. 오늘 만날 여인은 반대로 스스로 사람들을 피해 숨어 살던 사람입니다. 예수님은 이 여인에게 어떻게 다가가셨을까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"한낮의 우물가"},{"t":"p","text":"예수님이 남쪽 유대 지방을 떠나 북쪽 갈릴리로 가시던 길이었습니다. 성경은 이렇게 적습니다. \"사마리아를 통과하여야 하겠는지라\"(요한복음 4장 4절). 사마리아는 그 두 지방 사이에 있는 땅입니다. 당시 유대인들은 역사적인 이유로 사마리아 사람들을 몹시 멸시해서, 먼 길을 돌아가더라도 그 땅을 밟지 않으려 했습니다."},{"t":"p","text":"박사님은 이 짧은 구절의 한 단어에 주목합니다. 영어 성경에는 이 대목이 '반드시 가야만 했다'는 뜻으로 옮겨져 있다고 합니다. 지나는 길에 들르신 것이 아니라, 그곳에 꼭 가셔야 할 까닭이 있었다는 것입니다. 그 까닭은 한 사람이었습니다."},{"t":"p","text":"예수님은 길을 걷다 지쳐 우물 곁에 앉으셨습니다. 때는 한낮이었습니다. 박사님의 설명에 따르면, 그 시절 마을 여인들은 서늘한 아침에 함께 물을 길으러 나왔습니다. 해가 머리 위에 있는 정오에는 아무도 나오지 않습니다. 그런데 바로 그 시간에 한 여인이 물동이를 이고 혼자 나타났습니다. 남편이 다섯이나 있었고 지금은 또 다른 남자와 살고 있는 여인이었습니다. 다른 여인들과 어울릴 수 없는 처지였기에 뙤약볕 아래 홀로 나올 수밖에 없었던 것입니다."},{"t":"p","text":"박사님은 이 여인의 속마음도 헤아려 봅니다. 마을 사람들은 저런 여자는 구원받을 수 없다고 낙인찍었고, 여인 자신도 그렇게 믿으며 살았을 것이라고 합니다. 그러면서도 마음 깊은 곳에서는, 나 같은 사람도 조건 없이 받아 주시는 하나님이면 얼마나 좋을까 하고 바라고 있었으리라는 것입니다."},{"t":"p","text":"하나님은 사람이 북적이는 아침이 아니라, 아무도 오지 않는 한낮의 우물가에 먼저 와서 앉아 기다리고 계셨습니다."},{"t":"h3","text":"\"물을 좀 달라\""},{"t":"verse","ref":"요한복음 4장 7절","text":"사마리아 여자 한 사람이 물을 길으러 왔으매 예수께서 물을 좀 달라 하시니"},{"t":"p","text":"먼저 말을 거신 쪽은 예수님이었습니다. 여인은 깜짝 놀랐습니다. 유대인 남자가 사마리아 여자에게 말을 걸고 물까지 청하는 것은 그 시대에는 있을 수 없는 일이었습니다. 박사님은 이 장면을 이렇게 말합니다. \"사마리아 사람은 특히 유대인들에게는 사람 취급을 안 해요. 그런데 예수님은 사람 취급을 한 거예요.\" 그 여인에게는 참으로 오랜만에 받아 보는 사람대접이었을 것입니다."},{"t":"p","text":"예수님은 사랑을 설명하기 전에 먼저 행동으로 보여 주셨습니다. 도움을 주겠다고 내려다보며 다가가지 않으시고, 물 한 모금을 청하는 낮은 자리에서 말문을 여셨습니다. 그리고 이렇게 말씀하셨습니다. 네가 하나님의 선물을 알고 지금 말하는 이가 누구인지 알았더라면, 네가 먼저 구했을 것이고 그가 생수를 주었을 것이라고 말입니다(요한복음 4장 10절)."},{"t":"p","text":"박사님은 '선물'이라는 말에 주목합니다. 선물은 값을 치르고 받는 것이 아닙니다. 그리고 이 만남에서 먼저 찾아온 쪽은 여인이 아니라 하나님이셨다고 합니다. 여인은 처음에 이 말을 알아듣지 못했습니다. 두레박도 없으면서 어디서 물을 구하느냐고 되물었습니다. 그래도 예수님은 대화를 끊지 않으시고, 이 과의 첫머리에 실린 말씀을 들려주셨습니다. 길어도 길어도 다시 목마른 물이 있고, 사람 속에서 샘처럼 솟아나는 물이 있다는 것입니다. 박사님은 이 생수를 무조건적인 사랑 그 자체라고 풀이합니다. 사람의 인정과 애정을 찾아 이 사람 저 사람에게로 옮겨 다녀도 채워지지 않던 목마름이 바로 그 사랑을 향한 것이었습니다."},{"t":"h3","text":"\"네 말이 참되도다\""},{"t":"verse","ref":"요한복음 4장 16절에서 18절","text":"이르시되 가서 네 남편을 불러 오라 여자가 대답하여 이르되 나는 남편이 없나이다 예수께서 이르시되 네가 남편이 없다 하는 말이 옳도다 너에게 남편 다섯이 있었고 지금 있는 자도 네 남편이 아니니 네 말이 참되도다"},{"t":"p","text":"박사님이 이 이야기에서 가장 아름답다고 하는 대목입니다. 여인은 감추고 싶은 곳을 건드리자 \"남편이 없습니다\" 하고 얼버무렸습니다. 예수님은 사정을 다 알고 계셨습니다. 그런데 \"어디서 거짓말이냐\"고 하지 않으시고 \"네 말이 옳다\"고 하셨습니다. 얼버무린 대답에서도 참된 구석을 찾아 인정해 주신 것입니다. 진실을 덮지는 않으셨지만, 그것으로 사람을 찌르지도 않으셨습니다."},{"t":"p","text":"박사님은 자신의 경험 하나를 들려줍니다. 막내아들이 오렌지 주스를 쏟고는 자기가 안 그랬다고 발뺌을 했습니다. 다그치는 대신 \"주스병이 스스로 넘어졌나 보다\" 하고 넘어가 주었더니, 아이가 먼저 \"아빠, 내가 쏟았어\" 하고 말하더라는 것입니다. 사람을 정직하게 만드는 것은 추궁이 아니라 사랑이라는 이야기입니다."},{"t":"p","text":"여인의 마음이 열렸습니다. 여인은 언젠가 구원자가 오시면 모든 것을 알려 주실 것이라고 말했습니다. 예수님이 대답하셨습니다. \"네게 말하는 내가 그라.\" 박사님은 이 선언이 누구에게 가장 먼저 주어졌는지를 눈여겨보라고 합니다. 존경받는 지도자가 아니라, 마을에서 가장 따돌림받던 한 여인이었습니다."},{"t":"p","text":"그다음 장면이 놀랍습니다."},{"t":"verse","ref":"요한복음 4장 28절에서 29절","text":"여자가 물동이를 버려 두고 동네로 들어가서 사람들에게 이르되 내가 행한 모든 일을 내게 말한 사람을 와서 보라 이는 그리스도가 아니냐 하니"},{"t":"p","text":"박사님은 묻습니다. 이 여인이 제일 가기 싫은 곳이 어디였겠습니까. 사람들이 있는 동네입니다. 그런데 여인은 물동이도 내버려 둔 채 바로 그곳으로 달려갔습니다. 자기 과거를 다 아시면서도 캐묻지 않고 받아 주신 분을 만났기 때문입니다. 숨어 살던 사람이 사람들 앞에 섰습니다. 받아들여진 사람은 더 이상 숨지 않습니다."},{"t":"p","text":"성경은 그 뒤의 일도 전합니다. 여인의 말을 들은 마을 사람들이 예수님께 나아왔고, 예수님은 그들의 청으로 이틀을 더 머무셨습니다(요한복음 4장 39절에서 41절). 한 사람을 만나러 가신 걸음이 온 마을을 살리는 걸음이 되었습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"하나님은 우리가 찾아오기를 기다리고만 계시지 않습니다. 가장 외로운 시간, 아무도 오지 않는 자리에 먼저 와서 앉아 계십니다. 우리의 과거를 다 아시면서도 그것으로 우리를 규정하지 않으십니다. 그분이 주시는 것은 값을 치르는 물건이 아니라 선물이며, 그 선물은 사람 속에서 마르지 않는 샘이 됩니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 사람을 피하고 싶어서 일부러 시간이나 길을 골라 다닌 적이 있습니까?"},{"t":"q","i":1,"text":"둘째, 내가 \"길어도 길어도 다시 목마른 우물\"처럼 되풀이해 찾아가는 것은 무엇입니까? 인정, 성취, 관계, 물건 등 무엇이든 좋습니다."},{"t":"q","i":2,"text":"셋째, 나의 부끄러운 부분을 알면서도 변함없이 대해 준 사람이 있었습니까? 그 경험은 나를 어떻게 바꾸었습니까?"},{"t":"q","i":3,"text":"넷째, 여인은 가장 가기 싫던 동네로 달려갔습니다. 내가 받아들여졌다고 느낀다면, 나는 어디로 가서 누구를 만나고 싶습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 4장 14절","text":"내가 주는 물을 마시는 자는 영원히 목마르지 아니하리니"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"물을 마실 때마다 하루 한 번, \"하나님은 나를 다 아시고도 받아 주신다\"는 말을 마음속으로 되뇌어 봅니다."},{"t":"act","i":1,"text":"주변에서 혼자 겉도는 사람 한 명에게 이번 주에 먼저 말을 걸어 봅니다. 가르치려 하지 말고 작은 부탁이나 안부로 시작합니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"요한복음 4장은 길기 때문에 모임 전에 1에서 30절을 미리 읽어 오도록 부탁하거나, 모임에서 두세 사람이 나누어 소리 내어 읽으면 좋습니다. 여인의 과거를 두고 흥미 위주의 이야기로 흐르지 않게 하십시오. 초점은 여인의 죄가 아니라 예수님의 태도입니다. \"네 말이 옳다\"는 대목에서 \"거짓말을 눈감아 주신 것이냐\"는 질문이 나올 수 있습니다. 예수님은 사실을 분명히 말씀하셨지만 그것으로 여인을 몰아세우지 않으셨다는 점을 짚어 주십시오. 예배 장소를 둘러싼 대화(20에서 24절)는 이 과에서 다루지 않으니, 질문이 나오면 간단히 \"장소보다 마음\"이라는 정도로 답하고 넘어가십시오."}],"inPart":4,"audio":"audio/22.m4a"},{"id":"23","kind":"lesson","no":19,"part":null,"title":"병든 사람 곁에 서신 분","sub":"아픈 사람을 하나님은 어떤 눈으로 보실까요?","key":{"ref":"마가복음 5장 34절","text":"예수께서 이르시되 딸아 네 믿음이 너를 구원하였으니 평안히 가라 네 병에서 놓여 건강할지어다"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"이상구 박사는 건강강의에서 어린 시절 이야기를 들려준 적이 있습니다. 6, 25 전쟁 중에 아버지를 잃고, 어머니는 국제시장에서 새벽부터 좌판 장사를 하며 자식들을 키우셨습니다. 어머니 얼굴을 거의 보지 못하고 자란 소년은 오랫동안 '어머니가 나를 버렸다'는 생각에 사로잡혀 있었습니다. 그러던 어느 밤, 잠결에 누군가 얼굴을 어루만지며 흐느끼는 것을 느꼈습니다. 눈을 떠 보니 어머니가 눈물을 흘리며 자신을 쓰다듬고 계셨습니다. 박사님은 그 순간의 깨달음이 훗날 하나님의 무조건적인 사랑을 받아들이는 결정적인 계기가 되었다고 고백합니다."},{"t":"p","text":"말보다 손길이 먼저 닿을 때가 있습니다. 아플 때는 더욱 그렇습니다. 몸이 아프면 마음도 약해지고, '내가 뭘 잘못해서 이렇게 됐나' 하는 생각이 고개를 듭니다. 곁에 와서 손을 잡아 주는 사람 하나가 어떤 말보다 큰 힘이 됩니다."},{"t":"p","text":"지난 두 과에서 우리는 정죄받던 사람, 숨어 살던 사람 곁에 서신 예수님을 보았습니다. 오늘은 오래 앓아 온 사람 곁에 서신 예수님을 만납니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"열두 해를 앓은 여인"},{"t":"verse","ref":"마가복음 5장 25절에서 26절","text":"열두 해를 혈루증으로 앓아 온 한 여자가 있어 많은 의사에게 많은 괴로움을 받았고 가진 것도 다 허비하였으되 아무 효험이 없고 도리어 더 중하여졌던 차에"},{"t":"p","text":"혈루증은 하혈이 멎지 않는 병입니다. 박사님은 이 병이 그 시대에 어떤 의미였는지를 먼저 설명합니다. 당시 관습으로는 피를 흘리는 여인은 '부정하다'고 여겨졌습니다. 이 여인은 열두 해 동안 하혈이 계속되었으니 늘 부정한 사람이었습니다. 남을 만질 수도, 남이 자기를 만질 수도 없었습니다. 사실상 격리된 삶이었습니다."},{"t":"p","text":"더 아픈 것이 있었습니다. 그 시대 사람들은 죄가 많아서 하나님께 벌을 받아 그런 병에 걸린다고 생각했습니다. 그러니 이 여인은 병과 함께 '저주받은 사람'이라는 낙인까지 지고 살았습니다. 재산은 치료비로 다 없어졌고 병은 더 깊어졌습니다. 몸도, 돈도, 사람도, 하나님도 다 자기를 떠났다고 느꼈을 것입니다."},{"t":"p","text":"오늘도 오래 아픈 분들의 마음이 이와 비슷할 때가 있습니다. 병 자체보다 '내 탓이다', '벌을 받는 것이다'라는 생각이 사람을 더 깊이 가라앉힙니다."},{"t":"h3","text":"소문을 듣고 내민 손"},{"t":"verse","ref":"마가복음 5장 27절에서 28절","text":"예수의 소문을 듣고 무리 가운데 끼어 뒤로 와서 그의 옷에 손을 대니 이는 내가 그의 옷에만 손을 대어도 구원을 받으리라 생각함일러라"},{"t":"p","text":"박사님이 이 본문에서 던지는 질문은 하나입니다. 무슨 소문을 들었기에 이 여인은 손을 내밀 수 있었을까요. 부정하다고 여겨지던 사람이 무리 속에 섞여 남의 옷을 만지는 것은 큰 비난을 살 일이었습니다. 그 금기를 넘게 한 것은 예수님에 대한 소문이었습니다."},{"t":"p","text":"그 소문 가운데 하나가 나병 환자 이야기입니다. 나병 환자는 아무도 가까이하지 않던 사람입니다. 그런 사람이 예수님께 와서 엎드렸습니다."},{"t":"verse","ref":"마가복음 1장 41절에서 42절","text":"예수께서 불쌍히 여기사 손을 내밀어 그에게 대시며 이르시되 내가 원하노니 깨끗함을 받으라 하시니 곧 나병이 그 사람에게서 떠나가고 깨끗하여진지라"},{"t":"p","text":"박사님은 예수님이 안 하셔도 될 일을 하셨다는 데 주목합니다. 말씀 한마디로도 충분했을 텐데 굳이 손을 대셨습니다. 그 시대의 규정으로는 나병 환자를 만지면 만진 사람도 부정해집니다. 그런데도 손을 내미신 까닭을 박사님은, 오랜 세월 아무도 만져 주지 않아 사랑에 굶주린 사람에게 사랑을 더 진하게 전하시려는 것이었다고 설명합니다. 그리고 예수님은 병을 고치실 때 \"네 죄를 먼저 뉘우쳐라\" 하고 요구하신 적이 없다는 점도 짚습니다."},{"t":"p","text":"그 환자가 예수님께 한 말은 \"원하시면 저를 깨끗하게 하실 수 있나이다\"였습니다(마가복음 1장 40절). 혹시 원하지 않으실지도 모른다는 머뭇거림이 담긴 말입니다. 예수님의 대답은 망설임이 없었습니다. \"내가 원하노니.\" 박사님은 이 한마디를, 하나님은 고쳐 줄지 말지를 저울질하시는 분이 아니라 언제나 살리기를 원하시는 분이라는 선언으로 읽습니다."},{"t":"p","text":"이런 소문들이 여인의 귀에 들어갔습니다. 박사님은 여인이 그 소문들을 모아 하나의 결론에 이르렀다고 봅니다. '그분은 아무도 차별하지 않으시는구나. 나 같은 사람도 받아 주시겠구나.' 그 결론이 곧 그 여인의 믿음이었습니다. 믿음은 억지로 짜내는 결심이 아니라, 그분이 어떤 분인지 알게 될 때 저절로 생기는 신뢰라는 것입니다."},{"t":"h3","text":"\"딸아\""},{"t":"p","text":"여인의 손이 옷자락에 닿았고, 여인은 병이 나은 것을 몸으로 느꼈습니다. 그때 예수님이 돌아보며 물으셨습니다. \"누가 내 옷에 손을 대었느냐.\""},{"t":"p","text":"박사님은 이것이 몰라서 하신 질문이 아니라고 하며 이야기 하나를 들려줍니다. 외국에 공부하러 간 손자가 몇 해 만에 돌아옵니다. 공항에 온 식구가 마중을 나갔는데, 누구보다 애타게 기다린 분은 할머니입니다. 손자가 달려와 \"할머니!\" 하고 손을 잡으면 할머니는 \"네가 누구냐\" 하고 물으십니다. 몰라서가 아닙니다. 너무 반갑고 사랑스러워서 나오는 말입니다. \"누가 내 옷에 손을 대었느냐\"는 물음도 \"드디어 네가 왔구나\" 하는 반가움이라는 것입니다."},{"t":"p","text":"제자들은 사람들이 이렇게 밀치는데 누가 손을 댔는지 어떻게 아느냐고 했습니다. 그러나 예수님은 구경하러 온 많은 사람과, 간절한 마음으로 다가온 한 사람을 구별하고 계셨습니다. 박사님은 예수님이 그 여인이 사람들에게 밀려 포기할까 봐 마음을 졸이며 기다리고 계셨을 것이라고 말합니다. 하나님은 군중 속에서도 한 사람을 알아보십니다."},{"t":"p","text":"여인은 두려워 떨며 나와 엎드려 사실대로 말했습니다. 야단맞을 줄 알았을 것입니다. 그런데 예수님의 첫마디는 \"딸아\"였습니다. 열두 해 동안 아무도 가까이하지 않던 사람을 딸이라고 부르셨습니다. 뉘우치라는 말씀도, 왜 허락 없이 만졌느냐는 말씀도 없었습니다. \"평안히 가라\"고 하셨습니다."},{"t":"p","text":"이 이야기를 읽을 때 조심할 것이 있습니다. 이 본문은 믿기만 하면 어떤 병이든 낫는다는 약속이 아니며, 병원 치료를 그만두라는 말은 더더욱 아닙니다. 이 이야기가 보여 주는 것은 그보다 깊은 것입니다. 병든 사람은 하나님께 벌받는 사람이 아니라 하나님이 '딸'이라고, '아들'이라고 부르시는 사람이라는 사실입니다. 박사님은 치유의 본질을 옷자락에 손이 닿은 것이 아니라 마음과 마음이 통한 것이라고 말합니다. 제1부에서 살펴본 대로 사랑받고 있다는 확신은 우리 몸에도 좋은 영향을 준다고 박사님은 설명합니다. 낫고 안 낫고를 떠나, 아픈 사람에게 가장 먼저 필요한 것은 \"너는 버림받지 않았다\"는 음성입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"병은 하나님이 내리시는 벌이 아닙니다. 예수님은 병든 사람에게 죄를 캐묻지 않으셨고, 모두가 피하던 사람에게 먼저 손을 내미셨습니다. 그분은 아픈 사람을 멀리서 판단하지 않으시고 곁에 서서 \"딸아\" 하고 부르십니다. 예수님이 그러셨다면 하나님이 그런 분이십니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 아플 때 곁에 있어 준 사람 가운데 가장 기억에 남는 사람은 누구입니까? 그 사람은 무엇을 해 주었습니까?"},{"t":"q","i":1,"text":"둘째, 몸이나 마음이 아플 때 '내가 뭘 잘못해서 이런가' 하는 생각이 든 적이 있습니까? 그 생각은 나에게 어떤 영향을 주었습니까?"},{"t":"q","i":2,"text":"셋째, 여인은 '소문'을 듣고 손을 내밀었습니다. 지금까지 내가 들어 온 하나님에 대한 소문은 어떤 것이었습니까?"},{"t":"q","i":3,"text":"넷째, 예수님이 나를 \"딸아\", \"아들아\" 하고 부르신다면, 나는 그분께 어떤 이야기를 먼저 털어놓고 싶습니까?"},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"마가복음 5장 34절","text":"딸아 네 믿음이 너를 구원하였으니 평안히 가라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아픈 가족이나 이웃 한 사람을 찾아가거나 전화해서, 조언은 하지 말고 이야기를 들어 주고 손을 한 번 잡아 드립니다."},{"t":"act","i":1,"text":"내 몸의 아픈 곳에 손을 얹고 \"이것은 벌이 아닙니다. 나는 사랑받는 사람입니다\" 하고 조용히 말해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"모임 안에 지금 병을 앓는 분이나 가족을 병으로 잃은 분이 계실 수 있습니다. \"믿으면 낫는다\"는 식으로 흐르지 않게 각별히 주의하십시오. 그런 말은 낫지 않은 분에게 \"네 믿음이 부족하다\"는 또 하나의 정죄가 됩니다. 이 과의 초점은 치유의 방법이 아니라 아픈 사람을 대하시는 하나님의 마음입니다. \"그러면 왜 나는 안 낫습니까?\"라는 질문이 나오면 답을 주려 하지 말고, 그 아픔을 충분히 들어 주십시오. 고난의 문제는 제37과에서 따로 다룬다고 안내하셔도 좋습니다. 치료를 받고 계신 분께는 치료를 꾸준히 이어 가시도록 격려해 주십시오."}],"inPart":4,"audio":"audio/23.m4a"},{"id":"24","kind":"lesson","no":20,"part":null,"title":"무릎 꿇고 발을 씻기신 하나님","sub":"하나님은 섬김을 받으시는 분일까요, 섬기시는 분일까요?","key":{"ref":"요한복음 13장 4절에서 5절","text":"저녁 잡수시던 자리에서 일어나 겉옷을 벗고 수건을 가져다가 허리에 두르시고 이에 대야에 물을 떠서 제자들의 발을 씻으시고 그 두르신 수건으로 닦기를 시작하여"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"갓난아기를 키워 본 분은 아실 것입니다. 부모는 하루에도 몇 번씩 기저귀를 갈고, 토한 것을 닦고, 밤중에 일어나 아기를 안고 서성입니다. 아기는 고맙다는 말 한마디 하지 않습니다. 그래도 부모는 그 일을 억울해하지 않습니다. 집안에서 가장 큰 사람이 가장 작은 사람의 시중을 듭니다. 사랑이 있는 곳에서는 그것이 조금도 이상하지 않습니다."},{"t":"p","text":"그런데 우리는 '신'을 생각할 때는 정반대의 그림을 떠올립니다. 높은 자리에 앉아 절을 받고, 정성이 모자라면 노여워하는 존재를 그립니다. 사람이 신을 섬겨야 하고, 잘 섬기면 복을 받고 못 섬기면 벌을 받는다고 여깁니다. 이것은 아주 오래되고 익숙한 생각입니다."},{"t":"p","text":"지난 세 과에서 우리는 정죄받던 사람, 숨어 살던 사람, 병든 사람 곁에 서신 예수님을 보았습니다. 제4부의 마지막인 오늘은 십자가 전날 밤으로 갑니다. 그 밤에 예수님은 하나님이 어떤 분이신지를 몸으로 보여 주셨습니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"끝까지 사랑하시다"},{"t":"verse","ref":"요한복음 13장 1절","text":"유월절 전에 예수께서 자기가 세상을 떠나 아버지께로 돌아가실 때가 이른 줄 아시고 세상에 있는 자기 사람들을 사랑하시되 끝까지 사랑하시니라"},{"t":"p","text":"유월절은 이스라엘의 가장 큰 명절입니다. 예수님은 다음 날이면 자신이 죽게 된다는 것을 알고 계셨습니다. 사람이 죽음을 앞두면 자기 일로 마음이 가득 차기 마련입니다. 그런데 성경은 그 밤 예수님의 마음을 \"끝까지 사랑하시니라\"는 말로 적습니다."},{"t":"p","text":"박사님은 '끝까지'라는 말을 무조건적인 사랑의 정의로 읽습니다. 조건이 붙은 사랑은 상대가 그 조건을 어기는 순간 끊어집니다. 그래서 끝까지 갈 수 없습니다. 상대가 어떻게 하든 변하지 않는 사랑만이 끝까지 갑니다."},{"t":"p","text":"그 밤, 식탁에는 제자 가룟 유다도 앉아 있었습니다. 그는 이미 예수님을 돈을 받고 넘기기로 마음먹은 사람이었습니다. 예수님은 그것을 다 아셨습니다. 그러면서도 그를 자리에서 내보내지 않으셨고, 다른 제자들과 똑같이 그의 발도 씻어 주셨습니다. 박사님은 이것이 우리의 상식과는 다른 사랑이라고 말합니다. '끝까지'라는 말의 뜻이 이 장면에서 드러납니다."},{"t":"h3","text":"수건을 두르신 하나님"},{"t":"p","text":"박사님은 그 시대의 형편부터 설명합니다. 사람들은 샌들을 신고 포장되지 않은 흙길을 다녔기 때문에 발이 늘 더러웠습니다. 집에 들어온 손님의 발을 씻기는 일은 종이 하는 일이었습니다. 하나님의 아들이 할 일은 결코 아니었습니다."},{"t":"p","text":"그때 예수님이 일어나셨습니다. 겉옷을 벗고, 수건을 허리에 두르고, 대야에 물을 떠서 제자들 앞에 무릎을 꿇으셨습니다. 그리고 어부였던 제자들의 거친 발을 하나씩 씻고 수건으로 닦아 주셨습니다."},{"t":"p","text":"박사님은 이 행동이 얼마나 큰 충격이었는지를 거듭 강조합니다. 당시 사람들의 생각에 신은 사람이 섬겨야 하는 존재였습니다. 신의 발이 더러우면 사람이 가서 씻어 드려야 하는 것이 상식이었습니다. 예수님은 그 생각을 뿌리에서부터 뒤집으셨습니다. 사람이 신을 섬기는 것이 아니라 신이 사람을 섬기는 것, 그것이 참 하나님이라는 선언이라고 박사님은 설명합니다. 예수님은 다른 자리에서 이렇게 말씀하신 적이 있습니다."},{"t":"verse","ref":"마가복음 10장 45절","text":"인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라"},{"t":"p","text":"'인자'는 예수님이 자신을 가리켜 쓰신 말이고, '대속물'은 남을 풀어 주려고 대신 치르는 값을 뜻합니다. 제16과에서 우리는 예수님을 본 사람은 하나님을 본 것이라고 배웠습니다. 그렇다면 수건을 두르고 무릎을 꿇은 그 모습이 곧 하나님의 모습입니다. 하나님은 우리에게 섬김을 받아 내려는 분이 아니라 우리를 섬기시는 분입니다. 박사님은 하나님을 우리 몸속에서 쉬지 않고 돌보시는 '위대한 주치의'에 빗대기도 합니다. 내가 잠든 사이에도 심장이 뛰고 상처가 아무는 것을 떠올려 보면, 섬기시는 하나님이라는 말이 조금 가깝게 다가옵니다."},{"t":"h3","text":"\"주께서 내 발을 씻으시나이까\""},{"t":"p","text":"차례가 베드로에게 왔습니다. 앞의 제자들은 당황한 채 말없이 발을 내밀었습니다. 베드로는 가만있지 못했습니다. 주님이 어떻게 제 발을 씻으십니까, 절대로 안 됩니다 하고 물러섰습니다."},{"t":"p","text":"박사님은 베드로의 이 물음을 나무라지 않고 오히려 믿음의 표시로 봅니다. 물어볼 수 있다는 것은 상대를 '물어도 괜찮은 분'으로 믿는다는 뜻이기 때문입니다. 베드로는 삼 년 넘게 예수님과 지내면서, 이분은 대들어도 야단치지 않고 설명해 주시는 분이라는 것을 알고 있었습니다. 무서워서 아무 말 못 하고 따르는 것과, 믿기 때문에 묻는 것은 다릅니다."},{"t":"p","text":"예수님은 베드로에게 먼저 이렇게 말씀하셨습니다."},{"t":"verse","ref":"요한복음 13장 7절","text":"예수께서 대답하여 이르시되 내가 하는 것을 네가 지금은 알지 못하나 이 후에는 알리라"},{"t":"p","text":"박사님은 발에 묻은 흙을 죄의 상징으로, 발을 씻기시는 일을 용서의 상징으로 읽습니다. 곧 십자가에서 이루실 용서를 미리 몸으로 보여 주신 것이며, 제자들은 십자가와 부활을 겪은 뒤에야 그 밤의 뜻을 알게 되리라는 말씀이라고 풀이합니다. 하나님은 다 이해하지 못하는 사람에게도 먼저 사랑을 베푸시고, 깨달음이 뒤따라오기를 기다려 주십니다."},{"t":"p","text":"그래도 베드로가 물러서자 예수님은 다시 말씀하셨습니다. 내가 너를 씻어 주지 않으면 너는 나와 상관이 없다고 말입니다(요한복음 13장 8절). 차갑게 들릴 수 있지만 뜻은 그 반대입니다. 박사님은 이 말씀을, 사람이 스스로 깨끗해져서 하나님께 가는 것이 아니라 하나님이 씻어 주셔야 한다는 뜻으로 풀이합니다. 우리가 할 일은 발을 내미는 것입니다. 그러자 베드로는 발뿐 아니라 손과 머리도 씻어 달라고 했습니다."},{"t":"verse","ref":"요한복음 13장 10절","text":"예수께서 이르시되 이미 목욕한 자는 발밖에 씻을 필요가 없느니라 온 몸이 깨끗하니라"},{"t":"p","text":"박사님은 이 말씀을 이렇게 설명합니다. 예수님을 믿고 받아들인 사람은 이미 온몸을 씻은 사람으로 여겨 주십니다. 그래도 흙길을 걷는 한 발은 날마다 더러워집니다. 우리도 살면서 날마다 넘어지고 실수합니다. 그때마다 처음부터 다시 시작해야 하는 것이 아닙니다. 하나님은 날마다 대야를 들고 오셔서 그 발을 다시 씻어 주십니다. 더러워진 발 때문에 쫓겨나는 집이 아니라, 더러워진 발을 씻어 주는 집. 그것이 하나님의 집입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"사람들은 오랫동안 신을 섬겨야 복을 받는다고 믿어 왔습니다. 예수님은 수건을 두르고 무릎을 꿇어 그 생각을 뒤집으셨습니다. 하나님은 높은 곳에서 섬김을 요구하시는 분이 아니라 낮은 곳에서 우리 발을 씻기시는 분입니다. 배반할 사람의 발까지 씻으신 그 사랑은 끝까지 가는 사랑입니다. 그리고 그 사랑은 이제 십자가로 향합니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가 나를 위해 궂은일을 말없이 해 준 기억이 있습니까? 그때 어떤 마음이 들었습니까?"},{"t":"q","i":1,"text":"둘째, 나는 도움을 받는 것이 편합니까, 불편합니까? 베드로처럼 \"괜찮습니다, 제가 하겠습니다\" 하고 물러서게 되는 까닭은 무엇일까요?"},{"t":"q","i":2,"text":"셋째, '하나님이 나를 섬기신다'는 말을 들을 때 어떤 느낌이 듭니까? 어색하다면 왜 그럴까요?"},{"t":"q","i":3,"text":"넷째, 예수님은 자신을 배반할 사람의 발도 씻으셨습니다. 내가 끝까지 사랑하기 어려운 사람은 누구입니까? 그 사람을 생각할 때 드는 솔직한 마음을 나누어 봅시다."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 13장 1절","text":"세상에 있는 자기 사람들을 사랑하시되 끝까지 사랑하시니라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"이번 주에 가족 가운데 한 사람의 발을 씻어 주거나 주물러 드립니다. 쑥스러우면 따뜻한 물수건을 건네는 것으로 시작합니다."},{"t":"act","i":1,"text":"누군가 나를 도우려 할 때 한 번은 사양하지 않고 \"고맙습니다\" 하며 그대로 받아 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과는 제4부를 맺고 제5부 십자가로 넘어가는 다리입니다. 마지막에 \"이렇게까지 낮아지신 분이 다음 날 어디로 가셨는지 다음 주에 보겠습니다\" 하고 기대를 남겨 주십시오. 흔히 나오는 반응은 \"그래도 하나님을 섬겨야 하지 않습니까?\"입니다. 섬김을 부정하는 것이 아니라 순서가 다르다는 점을 짚어 주십시오. 먼저 섬김을 받은 사람이 기쁨으로 남을 섬기게 됩니다. 예수님이 제자들에게도 서로 발을 씻어 주라고 하신 말씀(14에서 15절)은 제8부에서 이웃 사랑을 다룰 때 이어집니다. 유다 이야기에서 \"그는 왜 변하지 않았습니까?\"라는 질문이 나오면, 사랑은 강요하지 않는다는 정도로 답하고 깊이 들어가지 않으셔도 됩니다. 형편이 되면 모임에서 실제로 서로의 손을 씻겨 주는 시간을 가져도 좋습니다."}],"inPart":4,"audio":"audio/24.m4a"},{"id":"25","kind":"part","no":null,"part":5,"title":"십자가, 사랑의 확증","sub":null,"key":null,"blocks":[{"t":"p","text":"제4부에서 우리는 예수님의 얼굴에서 하나님의 얼굴을 보았습니다. 정죄하지 않으시고, 먼저 찾아오시고, 무릎을 꿇어 발을 씻기시는 얼굴이었습니다. 그 예수님이 이제 십자가로 가십니다."},{"t":"p","text":"많은 분에게 십자가는 낯설고 무거운 표시입니다. 하나님이 사랑이시라면 왜 그 아들이 죽어야 했는지 묻게 됩니다. 제5부는 그 물음을 품고 언덕 위로 함께 올라갑니다."},{"t":"p","text":"먼저 십자가가 왜 '아직 죄인 되었을 때에' 주어진 사랑의 증거인지를 살핍니다. 이어서 십자가 위에서 들려온 세 마디 말씀을 차례로 듣습니다. 못 박는 사람들을 위한 용서의 기도, 내놓을 것이 없는 강도에게 주신 \"오늘\"이라는 약속, 그리고 \"다 이루었다\"는 마지막 한마디입니다. 끝으로 빈 무덤 앞에 서서, 그 사랑이 죽음으로도 끊어지지 않았음을 봅니다."},{"t":"p","text":"십자가는 하나님의 마음을 바꾼 사건이 아니라, 처음부터 우리를 향해 있던 그 마음을 남김없이 보여 준 사건입니다."}],"inPart":5,"audio":"audio/25.m4a"},{"id":"26","kind":"lesson","no":21,"part":null,"title":"왜 십자가였을까요","sub":"하나님이 사랑이시라면, 왜 그 아들이 죽어야 했을까요","key":{"ref":"로마서 5장 8절","text":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 무릎을 꿇고 제자들의 발을 씻기시는 예수님을 보았습니다. 그 저녁이 지나고 하루가 채 못 되어, 예수님은 십자가에 달리십니다."},{"t":"p","text":"이상구 박사는 이 대목을 설명할 때 이런 비유를 듭니다. 딸이 강물에 빠졌습니다. 허우적거리는 딸을 보면서 \"네가 잘못을 뉘우치면 건져 주겠다\"고 조건을 거는 부모는 없습니다. 부모는 묻지도 따지지도 않고 물에 뛰어듭니다. 딸이 말을 잘 들었는지, 왜 물가에 갔는지는 그 순간 아무 문제가 되지 않습니다."},{"t":"p","text":"박사님은 어린 시절의 기억도 하나 들려줍니다. 뒷마당에서 토끼 새끼가 고양이에게 잡힐 뻔한 것을 구해 준 일입니다. 토끼가 박사님께 잘해 준 것은 아무것도 없었습니다. 그저 그 작은 것이 사랑스러웠기 때문에 구했습니다."},{"t":"p","text":"교회 지붕마다 서 있는 십자가를 보며 많은 분들이 궁금해합니다. 저것은 사형 틀인데, 왜 저것이 사랑의 표시라는 것일까. 하나님이 사랑이시라면 왜 그 아들이 죽어야 했을까. 이 과에서는 그 질문을 품고 성경에서 가장 널리 알려진 한 구절을 천천히 읽어 보려 합니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"\"세상을 이처럼 사랑하사\""},{"t":"verse","ref":"요한복음 3장 16절","text":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라"},{"t":"p","text":"독생자는 하나뿐인 아들이라는 뜻이고, 영생은 끊어지지 않는 생명이라는 뜻입니다. 박사님은 이 구절을 두고 가장 많이 외우면서도 가장 잘못 읽기 쉬운 구절이라고 합니다. 그래서 단어 하나하나를 짚어 가며 읽습니다."},{"t":"p","text":"먼저 '세상'입니다. 박사님은 이 세상을 온 우주에서 유일하게 죄가 있는 곳이라고 풀이합니다. 미움과 다툼과 눈물이 있는 곳, 바로 우리가 사는 이 땅입니다. 하나님이 사랑하신 대상은 흠 없는 사람들의 모임이 아니었습니다. 죄가 있는 그대로의 세상이었습니다. 깨끗해지면 사랑하겠다고 하지 않으시고, 있는 그대로를 사랑하셨다는 것입니다. 여기서 이미 조건 없는 사랑이 드러납니다."},{"t":"p","text":"'이처럼'이라는 말에도 박사님은 눈길을 줍니다. 정말로, 진짜로 사랑하셨다는 강조의 말이라는 것입니다. 얼마나 정말로 사랑하셨는가 하면, 하나뿐인 아들을 내어 주실 만큼이었습니다. 박사님의 강의를 정리한 해설은 이것을 이렇게 요약합니다. 값을 요구하는 대신 값을 치르는 것, 그것이 아가페라고 말입니다. 아가페는 조건을 달지 않는 사랑을 가리키는 성경의 말입니다."},{"t":"p","text":"'멸망하지 않고'라는 말도 그냥 지나치지 않습니다. 박사님은 한을 품은 채 생을 마치는 사람은 몸의 생사와 상관없이 이미 멸망한 것과 같고, 원한을 넘어서서 눈을 감는 것이 참된 영생이라고 짚습니다. 영생은 죽은 뒤에 얻는 긴 시간만을 뜻하지 않습니다. 사랑 안에서 지금 살아나는 생명을 가리킵니다. 하나님이 아들을 주시면서까지 막고 싶으셨던 것은, 사랑하는 사람들이 미움과 절망 속에서 스러져 가는 일이었습니다."},{"t":"h3","text":"재판하러 오신 것이 아닙니다"},{"t":"p","text":"바로 다음 절은 아들이 오신 목적을 분명히 밝힙니다."},{"t":"verse","ref":"요한복음 3장 17절","text":"하나님이 그 아들을 세상에 보내신 것은 세상을 심판하려 하심이 아니요 그로 말미암아 세상이 구원을 받게 하려 하심이라"},{"t":"p","text":"제3부에서 우리는 죄를 끊어진 생명줄로, 죽음을 벌이 아니라 그 끊어짐의 결과로 살펴보았습니다. 박사님은 같은 자리에서 이 구절을 읽습니다. 사람은 장차 벌을 받을까 봐 떨어야 하는 처지가 아니라, 이미 죽음 아래에서 살고 있는 처지입니다. 그렇다면 하나님이 하실 일은 새삼 죄를 따지는 일이 아니라 건져 내는 일입니다."},{"t":"p","text":"그 해설은 이 장면을 한 폭의 그림으로 보여 줍니다. 하나님은 재판석에 앉으신 분이 아니라, 이미 사형수가 된 인류를 빼내러 사형장으로 걸어 들어오신 구조자라는 것입니다. 박사님은 건강강의에서 이렇게 덧붙입니다. 하나님은 하나님으로서는 죽으실 수 없기에 죽을 수 있는 사람이 되어 오셨고, 죽음이라는 값을 십자가에서 대신 치르셨다고 말입니다. 물에 빠진 딸을 건지려면 물에 들어가야 합니다. 죽음에 빠진 사람을 건지시려고 하나님은 죽음 속으로 들어오셨습니다."},{"t":"p","text":"강의를 듣던 분이 물은 적이 있다고 합니다. 그럴 바에야 왜 하나님은 세상을 아예 천국으로 만들어 버리지 않으십니까. 박사님의 대답은 이렇습니다. 아들을 내어 주신 것 자체가 하나님의 방식이라는 것입니다. 힘으로 통제하지 않으시고, 사랑을 보여 주셔서 사람이 스스로 마음을 열기를 바라십니다. 강제로 얻은 것은 사랑이 아니기 때문입니다."},{"t":"p","text":"우리도 경험으로 압니다. 아이를 힘으로 눌러 앉힐 수는 있어도, 힘으로 아이의 마음을 얻을 수는 없습니다. 마음은 사랑을 보았을 때에만 열립니다. 십자가는 하나님이 사람의 마음을 얻으시려고 택하신, 가장 멀고도 가장 확실한 길이었습니다."},{"t":"h3","text":"\"아직 죄인 되었을 때에\""},{"t":"p","text":"이 과의 핵심 성구인 로마서 5장 8절에서 눈여겨볼 말은 '아직'입니다. 우리가 달라진 다음이 아니었습니다. 미안하다고 말한 다음도 아니었습니다. 아직 등을 돌리고 있을 때에 십자가는 이미 세워졌습니다. 강의 해설은 이렇게 풉니다. 하나님의 사랑은 우리가 사랑스러워졌을 때 시작된 것이 아니라, 가장 사랑스럽지 않을 때 확증되었다고 말입니다. 확증이란 의심할 수 없도록 증거를 내어 보이는 것입니다."},{"t":"p","text":"박사님은 이 구절을 자신의 이야기와 나란히 놓습니다. 제6과에서 들은 대로 박사님은 젊은 날 하나님을 몹시 싫어하던 무신론자였습니다. 십자가 이야기를 들으면서도 '어느 바보가 저런 말을 믿나' 하고 코웃음을 쳤다고 고백합니다. 그런 자신을 하나님은 내치지 않으시고 찾아오셨습니다. '아직 죄인 되었을 때에'라는 말은 박사님께 책 속의 문장이 아니라 자신이 겪은 일이었습니다."},{"t":"p","text":"그러니 십자가는 하나님의 마음을 돌려놓으려고 치른 값이 아닙니다. 하나님의 마음은 처음부터 우리를 향해 있었습니다. 십자가는 그 마음이 어디까지 가는지를, 의심 많은 우리가 볼 수 있게 내어 보이신 증거입니다."},{"t":"h3","text":"이미 주어진 것"},{"t":"p","text":"박사님은 '영생을 얻게 하려 하심이라'는 대목도 짚습니다. 원어에서 이 '가지다'라는 말은 앞날의 일이 아니라 지금의 일을 가리킨다고 설명합니다. 언젠가 받을지도 모르는 것이 아니라 지금 가지고 있다는 뜻입니다. 박사님 자신도 오랫동안 영생을 먼 훗날의 일로만 알았다고 털어놓습니다."},{"t":"p","text":"이 선물은 이미 모든 사람 앞에 놓여 있습니다. 박사님은 정부 지원금에 빗댑니다. 지원금이 나와도 신청하지 않는 사람이 있듯이, 주어진 것을 받는 사람과 받지 않는 사람이 있을 뿐입니다. 받는다는 것이 무엇인지는 제6부에서 차근차근 살피겠습니다. 오늘은 한 가지만 기억하면 좋겠습니다. 십자가는 '네가 잘하면 사랑하겠다'는 말이 아니라 '내가 너를 이만큼 사랑한다'는 말입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"십자가는 화가 나신 하나님을 달래려고 드린 값이 아닙니다. 죄 있는 세상을 있는 그대로 사랑하신 하나님이, 죽음 속에 있는 우리를 건지시려고 몸소 그 속으로 들어오신 사건입니다. 그 일은 우리가 '아직' 등을 돌리고 있을 때 일어났습니다. 그래서 십자가는 조건 없는 사랑의 확증입니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 길에서 십자가를 볼 때 그동안 어떤 느낌이 들었습니까. 무거움, 낯섦, 아무 느낌 없음, 무엇이든 좋습니다."},{"t":"q","i":1,"text":"둘째, 내가 아무것도 해 준 것이 없는데 누군가 나를 위해 큰 수고를 해 준 기억이 있습니까. 그때 마음이 어땠습니까."},{"t":"q","i":2,"text":"셋째, '달라지면 사랑받을 수 있다'는 생각과 '아직 그대로일 때 이미 사랑받고 있다'는 말 가운데, 어느 쪽이 나에게 더 익숙합니까."},{"t":"q","i":3,"text":"넷째, 힘으로 바꾸지 않으시고 사랑을 보여 주며 기다리신다는 하나님의 방식을 어떻게 생각하십니까."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 3장 16절","text":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"요한복음 3장 16절의 '세상' 자리에 내 이름을 넣어 하루 한 번 소리 내어 읽어 봅니다."},{"t":"act","i":1,"text":"이번 주에 한 사람에게, 그가 무엇을 해 주어서가 아니라 그냥 그 사람이어서 고맙다는 말을 전해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서 가장 자주 나오는 질문은 \"하나님이 전능하시다면 그냥 용서하시면 되지 왜 굳이 죽으셔야 했습니까\"입니다. 서둘러 이론으로 답하기보다 물에 빠진 딸의 비유로 돌아가십시오. 건지려면 들어가야 한다는 것, 그리고 십자가가 하나님의 마음을 바꾼 사건이 아니라 하나님의 마음을 보여 준 사건이라는 두 가지만 붙들면 충분합니다. 지옥이나 심판에 대한 질문이 나오면 제3부에서 나눈 '결과와 벌의 차이'를 짧게 되짚고 넘어가십시오. 참석자 가운데 십자가에 거부감을 가진 분이 있다면 그 느낌을 고치려 들지 말고 끝까지 들어 주시기 바랍니다."}],"inPart":5,"audio":"audio/26.m4a"},{"id":"27","kind":"lesson","no":22,"part":null,"title":"\"아버지, 저들을 용서하여 주옵소서\"","sub":"사과 한마디 없는 사람들을 어떻게 용서하실 수 있었을까요","key":{"ref":"누가복음 23장 34절","text":"이에 예수께서 이르시되 아버지 저들을 사하여 주옵소서 자기들이 하는 것을 알지 못함이니이다 하시더라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 십자가가 '아직 죄인 되었을 때에' 세워진 사랑의 증거라는 것을 보았습니다. 이번 과에서는 그 십자가 가까이 다가가, 거기서 들려온 첫마디에 귀를 기울여 보려 합니다."},{"t":"p","text":"누구에게나 마음에 걸려 있는 사람이 한둘은 있습니다. 세월이 꽤 흘렀는데도 그 이름만 들으면 가슴이 답답해집니다. 그럴 때 우리는 흔히 이렇게 말합니다. \"그 사람이 와서 진심으로 미안하다고 하면, 그때는 나도 풀 수 있을 것 같아요.\" 자연스러운 마음입니다. 우리에게 용서는 대개 사과 다음에 옵니다. 잘못한 쪽이 먼저 고개를 숙여야 용서하는 쪽도 마음을 엽니다."},{"t":"p","text":"그런데 십자가 위에서는 이 순서가 뒤집힙니다. 사과한 사람이 아무도 없었습니다. 뉘우친 사람도 없었습니다. 못을 박는 망치 소리와 비웃는 소리가 아직 그치지 않았는데, 예수님의 입에서 용서를 구하는 기도가 먼저 나왔습니다. 이상구 박사는 이 장면을 조건 없는 사랑이 가장 극적으로 드러난 자리로 꼽습니다. 어떻게 그럴 수 있으셨을까요. 그리고 그 기도는 오늘 나와 무슨 상관이 있을까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"그날 언덕의 풍경"},{"t":"p","text":"'사하여 주옵소서'는 용서해 달라는 뜻의 옛말입니다. 이 기도가 어떤 자리에서 나왔는지, 박사님은 그날의 풍경을 하나씩 짚어 줍니다."},{"t":"p","text":"예수님 좌우에는 두 죄수가 함께 달렸습니다. 십자가 아래에서 로마 군인들은 한 사람이 죽어 가는 것에는 관심이 없고, 그의 옷을 누가 가질지 제비를 뽑느라 바빴습니다. 구경하던 백성과 관리들은 조롱을 퍼부었습니다. 네가 하나님의 아들이라면 거기서 내려와 너 자신부터 구해 보라는 것이었습니다."},{"t":"p","text":"박사님의 표현을 빌리면, 사람들은 예수님을 벗겨 놓고 조롱하고 욕하고 침을 뱉고 발길질을 했습니다. 그런데 예수님은 바로 그 사람들을 위해 기도하고 계셨습니다. 한 사람도 빼놓지 않으셨습니다. 못을 박은 군인도, 비웃던 관리도, 소리치던 구경꾼도 그 '저들' 안에 들어 있었습니다."},{"t":"p","text":"우리라면 어땠을까요. 억울한 일을 당하면 우리 입에서는 먼저 항변이 나옵니다. 내가 무슨 잘못을 했느냐고, 두고 보자고 말합니다. 힘이 없으면 속으로라도 그렇게 합니다. 그것이 사람의 자연스러운 마음입니다. 그런데 예수님의 입에서는 자신을 위한 말이 한마디도 나오지 않았습니다. 그 순간에도 예수님의 관심은 자신의 억울함이 아니라 눈앞의 사람들이었습니다."},{"t":"h3","text":"\"알지 못함이니이다\""},{"t":"verse","ref":"누가복음 23장 34절","text":"이에 예수께서 이르시되 아버지 저들을 사하여 주옵소서 자기들이 하는 것을 알지 못함이니이다 하시더라"},{"t":"p","text":"기도의 뒷부분을 눈여겨보면 좋겠습니다. 예수님은 용서를 구하시면서 이유를 대십니다. 자기들이 하는 일을 알지 못한다는 것입니다."},{"t":"p","text":"이것은 고발하는 말이 아니라 변호하는 말입니다. 박사님의 강의를 정리한 해설은 이렇게 말합니다. 하나님은 우리의 죄를 '알지 못해서 한 일'로 감싸 주시며, 정죄의 자리에서조차 변호사로 서 계신다고 말입니다. 정죄란 죄가 있다고 못 박아 판결하는 것을 뜻합니다. 가장 큰 피해를 입고 계신 분이, 해를 끼치는 사람들 편에 서서 변호하고 계십니다."},{"t":"p","text":"사실 그들은 정말 몰랐습니다. 자기들이 조롱하는 분이 누구인지 몰랐고, 하나님이 어떤 분이신지도 몰랐습니다. 제3부에서 살핀 대로 사람의 문제는 하나님을 오해한 데서 시작되었습니다. 하나님을 무서운 분, 조건을 따지는 분으로 알았기에 사랑이 눈앞에 와 있어도 알아보지 못했습니다. 예수님은 그 오해 밑에 깔린 어둠을 보셨고, 그래서 화를 내는 대신 불쌍히 여기셨습니다."},{"t":"p","text":"이 기도는 어쩌다 한 번 나온 너그러움이 아닙니다. 제4부에서 우리는 이 말씀을 배웠습니다."},{"t":"verse","ref":"요한복음 14장 9절","text":"예수께서 이르시되 빌립아 내가 이렇게 오래 너희와 함께 있으되 네가 나를 알지 못하느냐 나를 본 자는 아버지를 보았거늘 어찌하여 아버지를 보이라 하느냐"},{"t":"p","text":"그렇다면 십자가 위의 이 기도는 하나님이 사람을 어떤 눈으로 보고 계시는지를 그대로 보여 줍니다. 하나님은 우리의 잘못을 하나하나 세고 계신 분이 아니라, 몰라서 헤매는 우리를 변호하고 계신 분입니다."},{"t":"h3","text":"내려오지 않으신 힘"},{"t":"p","text":"사람들은 내려와 보라고 소리쳤습니다. 힘이 있다면 보여 달라는 것이었습니다. 예수님은 내려오지 않으셨습니다. 박사님은 바로 그것, 조롱을 받으면서도 그 힘을 자신을 구하는 데 쓰지 않으신 것이 오히려 하나님의 사랑을 증명한다고 풀이합니다. 내려오시면 자신은 사실지 몰라도, 건지러 오신 사람들은 그대로 남기 때문입니다."},{"t":"p","text":"여기서 박사님이 자주 받는 질문이 있습니다. 박사님은 늘 사랑 이야기만 하고 공의 이야기는 하지 않는다는 것입니다. 공의란 옳고 바르게 하는 것을 말합니다. 박사님은 되묻습니다. 공의가 무엇입니까. 사람들이 생각하는 공의는 법대로 하는 것, 곧 잘못한 사람에게 벌을 주는 것입니다. 그러나 가장 높은 법은 사랑이고, 그 사랑에 따른 공의는 원수까지도 용서하는 것이라고 박사님은 말합니다. 박사님의 말을 그대로 옮기면 이렇습니다. \"율법대로라면 내 죄로 내가 죽는 것이 공의다. 그러나 예수 그리스도께서 '너희가 죽는 대신 내가 죽는다'고 하신 것, 하나님께는 그것이 옳은 것이고 그것이 공의다.\""},{"t":"p","text":"하나님께 '옳은 일'은 잘못한 사람을 없애는 것이 아니라 살리는 것입니다. 사랑과 공의는 서로 줄다리기를 하는 두 성품이 아닙니다. 하나님께는 사랑하는 것이 곧 옳은 일입니다."},{"t":"p","text":"부모의 마음을 떠올려 보면 조금 짐작이 됩니다. 자식이 큰 잘못을 저질렀을 때, 부모에게 '옳은 결말'은 자식이 벌을 받고 끝나는 것이 아닙니다. 자식이 다시 살아나는 것입니다. 그 일을 위해서라면 부모는 제 몫이 아닌 짐도 기꺼이 집니다. 십자가는 하나님이 그런 아버지이심을 보여 줍니다."},{"t":"h3","text":"그 기도 안에 나도 있습니다"},{"t":"p","text":"이 기도는 이천 년 전 언덕 위의 사람들만을 위한 것이 아닙니다. 우리도 알지 못하고 한 일이 많습니다. 하나님을 오해한 채 살았고, 몰라서 가까운 사람에게 상처를 주었고, 몰라서 나 자신을 미워했습니다. '저들을 사하여 주옵소서'라는 기도 안에는 그런 우리도 들어 있습니다. 내가 미안하다고 말하기도 전에, 용서는 이미 나를 향해 와 있었습니다."},{"t":"p","text":"박사님은 건강강의에서 용서를 두 가지로 나누어 설명합니다. 하나는 더 따지지 않겠다며 참고 넘어가는 용서입니다. 겉으로는 끝났어도 그 사람을 떠올리면 속이 여전히 쓰립니다. 다른 하나는 조건 없는 사랑이 마음에 부어질 때 일어나는 용서입니다. 박사님은 이것이 사람의 의지나 훈련으로는 닿을 수 없는 용서이고, 예수님의 기도가 바로 그 원형이라고 합니다."},{"t":"p","text":"그러니 이 과를 마치며 '나도 저렇게 용서해야 한다'는 짐을 지실 필요는 없습니다. 용서하는 삶에 대해서는 제7부에서 따로 나누겠습니다. 오늘은 순서만 기억하면 됩니다. 내가 용서하기 전에 내가 먼저 용서받았습니다. 용서하는 힘은 용서받은 자리에서 흘러나옵니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"십자가에서 들려온 첫마디는 원망도 저주도 아니고 용서를 구하는 기도였습니다. 사과한 사람이 아무도 없는데 용서가 먼저 나왔습니다. 하나님은 우리의 잘못을 세는 분이 아니라 \"알지 못해서 그렇습니다\" 하고 우리를 변호하시는 분입니다. 그 기도 안에 오늘의 나도 들어 있습니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가에게서 \"괜찮아, 다 잊었어\"라는 말을 들어 본 적이 있습니까. 그때 마음이 어땠습니까."},{"t":"q","i":1,"text":"둘째, 돌이켜 보면 그때는 정말 몰라서 그랬다 싶은 일이 있습니까."},{"t":"q","i":2,"text":"셋째, 사과를 받기 전에 먼저 용서한다는 것이 나에게는 어떻게 느껴집니까. 솔직한 마음을 나누어 봅시다."},{"t":"q","i":3,"text":"넷째, 하나님이 나를 고발하시는 분이 아니라 변호하시는 분이라면, 하나님께 말을 거는 내 태도가 어떻게 달라질 것 같습니까."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"누가복음 23장 34절","text":"아버지 저들을 사하여 주옵소서 자기들이 하는 것을 알지 못함이니이다"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"하루를 마치며 \"오늘도 몰라서 한 일이 많았습니다. 그래도 저를 변호해 주셔서 고맙습니다\" 하고 한 문장으로 말해 봅니다."},{"t":"act","i":1,"text":"마음에 걸리는 한 사람을 떠올리고, 용서하려고 애쓰는 대신 \"저 사람도 그 기도 안에 들어 있구나\" 하고 한 번만 생각해 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"용서라는 주제는 아픈 기억을 건드립니다. 큰 상처를 입은 분에게 \"그러니 당신도 용서하십시오\"라는 말로 들리지 않도록 각별히 조심해 주십시오. 이 과의 중심은 내가 해야 할 용서가 아니라 내가 이미 받은 용서입니다. \"몰랐다고 하면 다 용서가 됩니까, 그러면 피해자는 어떻게 됩니까\"라는 질문이 나올 수 있습니다. 용서가 잘못을 괜찮다고 하는 것이 아니라는 점, 그리고 예수님 자신이 가장 큰 피해자의 자리에서 이 기도를 하셨다는 점을 짚어 주시면 됩니다. 나눔이 깊어져 누군가 눈물을 보이면 서둘러 위로하거나 결론을 내리지 말고 잠시 함께 머물러 주십시오."}],"inPart":5,"audio":"audio/27.m4a"},{"id":"28","kind":"lesson","no":23,"part":null,"title":"곁에 달린 강도","sub":"착해질 시간이 남아 있지 않은 사람도 받아 주실까요","key":{"ref":"누가복음 23장 42절에서 43절","text":"이르되 예수여 당신의 나라에 임하실 때에 나를 기억하소서 하니 예수께서 이르시되 내가 진실로 네게 이르노니 오늘 네가 나와 함께 낙원에 있으리라 하시니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 십자가 위에서 들려온 기도를 들었습니다. 아버지, 저들을 용서하여 주옵소서. 그 기도를 가장 가까운 자리에서 들은 사람이 있었습니다. 바로 곁에 함께 달려 있던 죄수입니다."},{"t":"p","text":"살다 보면 '이제는 늦었다'는 생각이 들 때가 있습니다. 젊은 날에 저지른 일이 떠오를 때, 가족에게 준 상처를 되돌릴 길이 없을 때, 병상에 누워 지난 세월을 헤아려 볼 때 그렇습니다. 이제 와서 무슨 낯으로, 하는 마음이 듭니다. 하나님 이야기를 들어도 이런 생각이 앞섭니다. 저런 말은 착하게 산 사람들에게나 해당되는 말이지, 나 같은 사람은 자격이 없다고 말입니다."},{"t":"p","text":"이상구 박사가 강의에서 가장 자주 꺼내는 이야기 가운데 하나가 이 강도의 이야기입니다. 그는 평생 남의 것을 빼앗으며 살았고, 그 일로 붙잡혀 사형을 당하는 중이었습니다. 남은 시간은 몇 시간뿐이었습니다. 잘못을 갚을 길도, 새사람이 되어 볼 기회도 없었습니다. 그런 사람에게도 하나님의 사랑은 닿을 수 있을까요. 오늘은 이 질문을 품고 그 언덕에 다시 서 봅니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"같은 자리, 다른 눈"},{"t":"p","text":"예수님 좌우에는 두 강도가 달려 있었습니다. 두 사람은 같은 죄로 같은 형벌을 받고 있었고, 같은 거리에서 같은 예수님을 보았습니다. 그런데 본 것이 달랐습니다."},{"t":"verse","ref":"누가복음 23장 39절","text":"달린 행악자 중 하나는 비방하여 이르되 네가 그리스도가 아니냐 너와 우리를 구원하라 하되"},{"t":"p","text":"행악자는 악한 일을 한 사람이라는 뜻입니다. 한 사람은 이렇게 예수님을 비방했습니다. 그리스도는 세상을 구하러 오는 분을 가리키는 말입니다. 박사님은 이 사람이 바란 것이 무엇이었는지를 짚습니다. 당장 이 십자가에서 내려가게 해 달라는 것, 눈앞의 처지를 바꿔 달라는 것이었습니다. 십자가 아래에서 조롱하던 사람들의 말과 같은 내용입니다. 건강강의에서 박사님은 그의 속마음을 이렇게 풀어 줍니다. 얻어맞으면서 한 사람도 제압하지 못하는 것이 무슨 하나님이냐는 것입니다. 그에게 하나님은 힘을 보여 주어야 하는 분이었습니다."},{"t":"p","text":"다른 한 사람은 정반대로 보았습니다. 같은 장면에서 그는 힘없는 사람이 아니라, 본 적 없는 사랑을 보았습니다."},{"t":"h3","text":"강도가 본 것"},{"t":"p","text":"박사님은 이 사람이 어떤 사람이었는지부터 말합니다. 어릴 때부터 약한 아이들을 때리며 자랐고, 커서는 강도가 되어 사람을 해치고 빼앗으며 산 사람이었다고 합니다. 그러니 그는 스스로 잘 알고 있었습니다. 나 같은 사람을 하나님이 사랑하실 리 없다, 나 같은 자가 좋은 곳에 간다는 것은 말도 안 된다. 그는 평생 이 생각을 품고 살았고, 누구도 그 생각을 바꿔 줄 수 없었습니다."},{"t":"p","text":"그 생각을 뒤집은 것은 누군가의 설득이 아니라 한 장면이었습니다. 침을 뱉고 때리고 조롱하는 사람들을 위해, 바로 옆에서 예수님이 기도하고 계셨습니다. 저들은 자기가 하는 일을 알지 못합니다, 용서해 주십시오. 박사님은 그 기도를 들은 강도의 마음을 이렇게 옮깁니다. \"저렇게 못된 사람들까지 저 사람이 사랑하고, 저들을 구원해 달라고 기도하는구나. 그렇다면 나 같은 놈도 사랑하시겠구나.\""},{"t":"p","text":"그는 알아차렸습니다. 이분이 믿는 하나님은 조건을 다는 분이 아니라는 것을 말입니다. 몇 시간 뒤면 숨이 끊어질 자신에게 필요한 하나님이 바로 이런 하나님이라는 것도 알았습니다. 그래서 용기를 내어 청했습니다. 예수여, 당신의 나라에 임하실 때에 나를 기억하소서. 박사님은 이 청 자체가 조건 없는 사랑을 믿었다는 표시라고 합니다. 자격을 내세울 것이 하나도 없는 사람이, 오직 상대의 사랑을 믿고 내민 손이었습니다."},{"t":"p","text":"그는 비방하는 동료를 꾸짖으며 이런 말도 했습니다."},{"t":"verse","ref":"누가복음 23장 41절","text":"우리는 우리가 행한 일에 상당한 보응을 받는 것이니 이에 당연하거니와 이 사람이 행한 것은 옳지 않은 것이 없느니라 하고"},{"t":"p","text":"예수님께 죄가 없다는 사실이 다른 누구도 아닌 강도의 입을 통해 증언되었습니다. 박사님은 이 대목에도 주목합니다."},{"t":"h3","text":"착해질 시간이 없었던 사람"},{"t":"p","text":"박사님이 이 이야기에서 힘주어 말하는 것이 있습니다. 이 강도에게는 착해질 시간이 없었다는 것입니다. 빼앗은 것을 돌려줄 수 없었고, 해친 사람들을 찾아가 빌 수도 없었습니다. 믿는 사람이 되는 어떤 예식을 치른 것도 아니었습니다. 앞으로 선한 일을 쌓을 기회 자체가 없었습니다. 그런데 예수님은 그를 받으셨습니다."},{"t":"p","text":"그에게 믿음이 생긴 것도 그의 착한 구석 때문이 아니었습니다. 곁에서 본 예수님의 사랑 때문이었습니다. 받아 주신 까닭이 강도 쪽에 있지 않고 온전히 예수님 쪽에 있었습니다. 박사님의 강의를 정리한 해설은 이것을 이렇게 풀어 줍니다. 사랑받는 근거가 내 자격에 있으면 그 사랑은 언제든 거두어질 수 있지만, 근거가 하나님 자신에게 있으면 그 사랑은 내가 무너져도 무너지지 않는다고 말입니다."},{"t":"p","text":"두 강도의 길을 가른 것은 죄의 많고 적음이 아니었습니다. 두 사람의 죄는 같았습니다. 다른 것은 어떤 하나님을 보았느냐였습니다."},{"t":"p","text":"그렇다고 예수님이 다른 쪽 강도를 내치신 것은 아닙니다. 용서를 구하는 기도는 그 사람 위에도 똑같이 드려졌습니다. 박사님은 하나님의 '진노'라는 말조차 사람의 화와는 다르다고 합니다. 건지고 싶은데 거절당하는 안타까움, 애끓는 심정이라는 것입니다. 문은 두 사람 모두에게 마지막 순간까지 열려 있었습니다."},{"t":"h3","text":"\"오늘\""},{"t":"p","text":"예수님의 대답은 짧았습니다. 오늘 네가 나와 함께 낙원에 있으리라. 낙원은 하나님과 함께하는 기쁨의 자리를 뜻합니다. 건강강의에서 박사님은 이 대답을 한마디로 짚습니다. 대답은 조건이 아니라 '오늘'이었다는 것입니다. 네가 얼마나 뉘우치는지 좀 더 지켜보겠다고 하지 않으셨습니다. 그동안 저지른 일을 하나하나 말해 보라고도 하지 않으셨습니다."},{"t":"p","text":"박사님은 여기서 '회개'라는 말을 다시 풀이합니다. 회개는 돌이킨다는 뜻의 교회 용어인데, 흔히 지은 죄를 낱낱이 고백하는 일로 알려져 있습니다. 박사님은 그보다 깊은 돌이킴이 있다고 합니다. 하나님은 내가 생각했던 것처럼 조건을 따지는 분이 아니라 조건 없이 사랑하시는 분이시구나 하고 받아들이는 마음의 돌이킴입니다. 강도에게 일어난 일이 바로 이것이었습니다. 그는 죄의 목록을 읊지 않았습니다. 하나님을 보는 눈이 바뀌었고, 그 순간 평생의 생각이 통째로 뒤집혔습니다."},{"t":"p","text":"박사님은 또 '오늘'이라는 말을, 그 사랑을 받아들인 바로 그 순간이 그에게 이미 쉼이고 천국이었다는 뜻으로도 풀이합니다. 몸은 여전히 십자가에 달려 있었지만, 그는 난생처음 '나도 사랑받는 사람'이라는 평안 속에 있었습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"강도에게는 내놓을 것이 아무것도 없었습니다. 착하게 산 세월도, 앞으로 착해질 시간도 없었습니다. 그가 가진 것은 곁에서 본 사랑 하나였고, 그 사랑을 믿고 내민 손 하나였습니다. 예수님은 그 손을 잡으시며 \"오늘\"이라고 하셨습니다. 하나님의 사랑 앞에서 너무 늦은 사람은 없습니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, '이제는 늦었다'고 생각했는데 뜻밖에 기회가 다시 주어졌던 경험이 있습니까."},{"t":"q","i":1,"text":"둘째, 두 강도는 같은 장면을 보고도 전혀 다르게 받아들였습니다. 같은 일을 두고 마음먹기에 따라 다르게 보였던 경험이 있다면 나누어 봅시다."},{"t":"q","i":2,"text":"셋째, '나 같은 사람은 자격이 없다'는 생각이 들 때가 있습니까. 그 생각은 어디에서 왔을까요."},{"t":"q","i":3,"text":"넷째, \"오늘 네가 나와 함께\"라는 말을 지금 내가 듣는다면, 어떤 마음이 들 것 같습니까."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"누가복음 23장 43절","text":"내가 진실로 네게 이르노니 오늘 네가 나와 함께 낙원에 있으리라"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"'나 같은 사람은' 하는 생각이 올라올 때마다, 그 뒤에 '그래도 사랑하신다'를 붙여 속으로 말해 봅니다."},{"t":"act","i":1,"text":"스스로 자격이 없다고 움츠러든 사람이 주변에 있다면, 조언 대신 따뜻한 말 한마디나 밥 한 끼를 건네 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"이 과에서는 두 가지 반응이 자주 나옵니다. 하나는 \"그러면 평생 마음대로 살다가 마지막에 믿으면 되겠네요\"입니다. 웃으며 받으시되, 강도가 그날 얻은 것이 죽은 뒤의 자리만이 아니라 '나도 사랑받는 사람'이라는 평안이었음을 짚어 주십시오. 그 평안을 굳이 마지막 날까지 미룰 까닭이 없습니다. 다른 하나는 믿지 않고 세상을 떠난 가족을 떠올리며 마음 아파하는 경우입니다. 그분의 마지막 순간을 우리는 알지 못하며, 하나님은 끝까지 곁에 계시는 분이라는 것만 조용히 전하고 단정은 피하십시오. 다른 쪽 강도를 나무라는 분위기로 흐르지 않게 해 주시고, 그에게도 같은 기도가 드려졌음을 기억해 주십시오."}],"inPart":5,"audio":"audio/28.m4a"},{"id":"29","kind":"lesson","no":24,"part":null,"title":"\"다 이루었다\"","sub":"그렇다면 내가 더 채워야 할 몫은 얼마나 남아 있을까요","key":{"ref":"요한복음 19장 30절","text":"예수께서 신 포도주를 받으신 후에 이르시되 다 이루었다 하시고 머리를 숙이니 영혼이 떠나가시니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 우리는 내놓을 것이 하나도 없던 강도가 \"오늘\"이라는 대답을 듣는 것을 보았습니다. 이번 과에서는 예수님이 숨을 거두시기 직전에 남기신 한마디를 듣습니다."},{"t":"p","text":"이상구 박사가 건강강의에서 들려준 이야기가 있습니다. 박사님 부부는 뉴질랜드의 밀포드 트랙이라는 산길을 걸어 보고 싶어 했습니다. 4박 5일 동안 걷는 길인데, 한 사람에 700만 원이나 드는 비용 때문에 엄두를 내지 못하고 있었습니다. 그런데 얼마 뒤, 박사님이 특별히 잘해 준 것도 없는 동서 부부가 그 비용을 미리 다 내주었습니다."},{"t":"p","text":"그날부터 박사님은 그 여행을 두고 돈 걱정을 할 일이 없어졌습니다. 그렇다고 손을 놓고 있지도 않았습니다. 배낭에 돌을 넣고 걸으며 체력을 길렀는데, 그것은 돈을 마련하려는 고생이 아니라 떠날 날을 기다리는 즐거움이었습니다. 박사님은 이 일을 겪으며 십자가의 한마디를 몸으로 느꼈다고 합니다."},{"t":"p","text":"사람은 누구나 마음 한구석에 아직 갚지 못한 빚 같은 것을 안고 삽니다. 더 잘해야 하는데, 아직 모자란데 하는 마음입니다. 하나님 앞이라면 더 그렇습니다. 내가 채워야 할 몫은 얼마나 남아 있는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"끝났다, 다 갚았다"},{"t":"p","text":"긴 고통의 시간이 지나고, 예수님은 마지막에 한마디를 남기십니다. 다 이루었다. 박사님은 이 말의 본뜻을 두 갈래로 풀어 줍니다."},{"t":"p","text":"하나는 영어 성경이 옮긴 대로 '끝냈다'는 뜻입니다. 하다가 만 것이 아니라 끝까지 마쳤다는 것입니다. 다른 하나는 이 말이 그 시대 장터에서도 쓰이던 말이라는 점입니다. 거래에서 이 말은 '다 갚았다'는 뜻이었다고 합니다. 박사님은 건강강의에서 이것을 영수증에 찍는 '완불' 도장에 빗댑니다. 빚을 남김없이 갚았을 때 찍는 도장입니다."},{"t":"p","text":"무슨 빚일까요. 제3부에서 우리는 생명의 근원에서 끊어진 결과가 죽음이라는 것을 살폈습니다. 그것은 사람의 힘으로는 풀 수 없는 문제였습니다. 박사님은 이렇게 설명합니다. 하나님은 하나님으로서는 죽으실 수 없기에 죽을 수 있는 사람이 되어 오셨고, 죽음이라는 값을 십자가에서 대신 남김없이 치르셨다고 말입니다. 밀포드 트랙의 비용을 동서가 다 냈듯이, 우리가 어찌할 수 없던 값을 예수님이 다 내셨습니다. '다 이루었다'는 그 영수증에 찍힌 도장입니다."},{"t":"p","text":"완불 도장이 찍힌 영수증을 받아 든 사람은 같은 빚을 두고 다시 독촉을 받지 않습니다. 밤잠을 설치며 이자를 셈할 일도 없습니다. 그 영수증은 빚진 사람이 애써서 얻어 낸 것이 아니라, 값을 치른 분이 손에 쥐여 준 것입니다."},{"t":"h3","text":"약속을 지키셨습니다"},{"t":"p","text":"박사님은 이 말을 '약속을 다 이루었다'는 뜻으로도 읽습니다. 성경의 앞부분인 구약은 예수님이 오시기 전에 쓰인 책들입니다. 박사님은 구약 전체를 하나의 약속으로 요약합니다. 내 아들을 보내어 너희 대신 죽게 하겠다는 약속입니다. 에덴에서 가죽옷을 지어 입히시던 날부터 이어져 온 그 약속이 십자가에서 이루어졌습니다. 사람이 약속을 지킨 것이 아니라 하나님이 약속을 지키셨습니다."},{"t":"p","text":"박사님은 이 일을 집에 빗대어 설명하기도 합니다. 산에 오르다가 경치가 기막힌 자리를 만났는데, 거기에 낡고 허물어져 가는 집이 한 채 서 있습니다. 그 집이 아무리 마음에 들어도 내 집이 아니면 함부로 고칠 수 없습니다. 고치든 새로 짓든, 먼저 값을 치르고 그 집을 사야 합니다. 박사님은 죄 때문에 사람의 소유권이 죽음에게 넘어가 있었다고 합니다. 십자가는 하나님이 값을 치르고 우리를 도로 사신 사건입니다. 그래서 이제 우리는 하나님의 것입니다."},{"t":"verse","ref":"고린도전서 6장 19절에서 20절","text":"너희는 너희 자신의 것이 아니라 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라"},{"t":"p","text":"박사님은 '샀다'는 말이 다 고쳐졌다는 뜻이 아니라 주인이 바뀌었다는 뜻이라고 풀이합니다. 집은 아직 낡은 그대로일 수 있습니다. 그러나 이제 그 집에는 끝까지 책임질 주인이 있습니다."},{"t":"p","text":"여기서 중요한 것은 그다음입니다. 집을 산 사람은 그 집을 고칠 책임도 집니다. 박사님은 하나님의 자녀가 되었다는 말이 내 마음이 착해졌다는 뜻이 아니라 소유권이 넘어갔다는 뜻이라고 합니다. 나를 자녀 삼는 일도, 허물어진 나를 고쳐 놓는 일도 내가 해내야 할 숙제가 아니라 집주인의 책임이라는 것입니다."},{"t":"h3","text":"아버지 손에"},{"t":"p","text":"예수님은 이 말씀을 하신 뒤 마지막 기도를 드리십니다."},{"t":"verse","ref":"누가복음 23장 46절","text":"예수께서 큰 소리로 불러 이르시되 아버지 내 영혼을 아버지 손에 부탁하나이다 하고 이 말씀을 하신 후 숨지시니라"},{"t":"p","text":"박사님은 여기서 '아버지'라는 부름에 주목합니다. 이보다 조금 앞서 예수님은 \"나의 하나님, 나의 하나님, 어찌하여 나를 버리셨나이까\" 하고 부르짖으셨습니다. 사람의 죄를 짊어지신 예수님은 그 순간 하나님께 버림받은 듯한 느낌까지 겪으셨습니다. 박사님은 예수님이 그 어둠 속에서도 아버지께서 자신을 버리신 것이 아님을 깨달으시고, 마지막에는 다시 '아버지'라는 가까운 부름으로 돌아오셨다고 설명합니다."},{"t":"p","text":"'하나님'에서 '아버지'로 돌아오는 이 길이 우리에게 위로가 됩니다. 살다 보면 우리에게도 하나님이 멀게만 느껴지고, 버려진 것 같은 날이 있습니다. 박사님은 관계가 흔들려도 끊어지지 않는 것, 그것이 믿음이라고 합니다. 캄캄한 한복판에서 '아버지' 하고 부를 수 있다면 그 줄은 끊어지지 않은 것입니다. 예수님은 그 길을 우리보다 먼저 걸으셨습니다."},{"t":"h3","text":"그러면 내가 할 일은"},{"t":"p","text":"다 갚아졌다면 갚을 것이 없습니다. 갚을 것이 없다면 조건도 없습니다. 박사님의 강의를 정리한 해설은 이 한마디를 두고, 사람이 채워야 할 몫이 하나도 남지 않았다는 선언이라고 말합니다. 우리가 할 일은 갚는 것이 아니라 다 갚아졌다는 사실을 믿는 것입니다. 박사님은 그것이 사람에게는 참 믿기 어려운 일이어서, 하나님의 영이신 성령께서 곁에서 도우신다고 덧붙입니다."},{"t":"p","text":"박사님은 한 가지를 안타까워합니다. 자신이 충분히 좋은 사람이 되었는지를 심사받아야 비로소 안심할 수 있다고 여기면, 신앙이 억지로 하는 체력 단련처럼 되어 버린다는 것입니다. 이미 값이 치러진 여행인데도 그 값을 마련하겠다고 밤낮으로 애쓰는 것과 같습니다."},{"t":"p","text":"밀포드 트랙 이야기의 뒷부분을 다시 떠올려 봅니다. 비용이 다 치러진 뒤에도 박사님은 배낭에 돌을 넣고 걸었습니다. 달라진 것은 걷는 마음이었습니다. 사랑받기 위해 애쓰는 걸음과, 사랑받고 있어서 기쁘게 걷는 걸음은 겉모습이 같아도 전혀 다른 걸음입니다."},{"t":"p","text":"부모의 사랑을 의심하지 않는 아이를 떠올려 보면 좋겠습니다. 그 아이는 쫓겨날까 봐 심부름을 하지 않습니다. 집이 제집이고 부모가 제 부모이기 때문에, 마음이 놓인 채로 뛰놀고 자라고 돕습니다. '다 이루었다'는 말은 우리를 그런 자리로 부르는 말입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"\"다 이루었다\"는 끝까지 마쳤다는 말이고, 남김없이 갚았다는 말이고, 약속을 지켰다는 말입니다. 사람이 채워야 할 몫은 남아 있지 않습니다. 하나님은 값을 치르고 우리를 도로 찾으셨고, 허물어진 우리를 고치는 일까지 당신의 책임으로 맡으셨습니다. 우리는 빚진 사람으로가 아니라 이미 사랑받는 사람으로 오늘을 삽니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 누군가 내 몫의 값을 대신 치러 준 적이 있습니까. 밥값처럼 작은 것이어도 좋습니다. 그때 어떤 마음이 들었습니까."},{"t":"q","i":1,"text":"둘째, '아직 모자라다, 더 잘해야 한다'는 마음이 나를 가장 자주 몰아붙이는 곳은 어디입니까. 가정, 일터, 나 자신과의 관계 어디든 좋습니다."},{"t":"q","i":2,"text":"셋째, 버려진 것 같던 날이 있었습니까. 그때 나는 누구를 불렀습니까."},{"t":"q","i":3,"text":"넷째, 사랑받으려고 애쓰는 것과 사랑받고 있어서 기쁘게 하는 것은 어떻게 다를까요. 내 경험에서 떠오르는 장면이 있습니까."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 19장 30절","text":"예수께서 신 포도주를 받으신 후에 이르시되 다 이루었다 하시고"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"'아직 멀었다'는 생각이 들 때마다 속으로 \"다 이루었다\" 하고 한 번 되뇌어 봅니다."},{"t":"act","i":1,"text":"이번 주에 한 번, 누군가의 작은 몫(찻값, 밥값, 수고)을 말없이 대신 치러 주고 그 기쁨을 느껴 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"가장 흔한 질문은 \"그러면 아무렇게나 살아도 된다는 말입니까\"입니다. 밀포드 트랙 이야기의 뒷부분이 좋은 답이 됩니다. 값이 다 치러진 뒤에도 박사님은 즐겁게 몸을 단련했습니다. 사랑받는 사람은 멋대로 사는 것이 아니라 가볍게 삽니다. '대신 값을 치렀다'는 표현에서 하나님을 빚 받아 내는 분으로 떠올리는 분이 있을 수 있습니다. 값을 치르신 분이 바로 하나님 자신이라는 점, 제21과에서 나눈 대로 십자가는 하나님의 마음을 바꾼 것이 아니라 보여 준 것이라는 점을 짚어 주십시오. \"어찌하여 나를 버리셨나이까\"를 깊이 묻는 분이 있으면, 버려진 것 같은 느낌까지 함께 겪으신 분이라는 데까지만 나누어도 충분합니다."}],"inPart":5,"audio":"audio/29.m4a"},{"id":"30","kind":"lesson","no":25,"part":null,"title":"빈 무덤, 생명이 이겼습니다","sub":"죽음이 정말 마지막일까요","key":{"ref":"고린도전서 15장 55절","text":"사망아 너의 승리가 어디 있느냐 사망아 네가 쏘는 것이 어디 있느냐"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과에서 예수님은 \"다 이루었다\" 하시고 숨을 거두셨습니다. 이야기가 거기서 끝났다면, 십자가는 한 착한 사람의 슬픈 마지막으로 남았을 것입니다. 성경은 그다음 이야기를 전합니다. 사흘째 되는 날 새벽, 무덤이 비어 있었습니다."},{"t":"p","text":"죽은 사람이 다시 살아났다는 말은 믿기 어렵습니다. 이상구 박사도 그랬습니다. 의과대학 시절, 학교에서 의무로 참석하던 예배 시간에 한 목사님이 죽은 나사로가 무덤에서 살아난 이야기를 설교했습니다. 젊은 의학도였던 박사님은 속으로 '죽은 사람이 어떻게 다시 사느냐'며 믿는 사람들을 비웃었다고 고백합니다."},{"t":"p","text":"그러니 이 과의 이야기가 선뜻 받아들여지지 않아도 괜찮습니다. 예수님의 제자들도 처음에는 믿지 못했습니다. 여인들이 무덤이 비었다고 알렸을 때 그들은 허튼소리로 여겼고, 직접 달려가 빈 무덤을 들여다본 베드로도 그저 이상하게 여기며 돌아왔습니다."},{"t":"p","text":"다만 우리 모두는 언젠가 사랑하는 사람을 떠나보내고, 자신도 떠나야 합니다. 그래서 묻게 됩니다. 죽음이 정말 마지막일까요. 사랑은 죽음 앞에서 끝나는 것일까요."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"닫힌 문 안으로 오신 분"},{"t":"p","text":"예수님이 돌아가신 뒤 제자들은 문을 걸어 잠그고 숨어 있었습니다. 그들은 스승이 붙잡히던 밤에 모두 달아난 사람들이었습니다. 가장 큰소리치던 베드로는 세 번이나 그분을 모른다고 했습니다. 두려움과 부끄러움이 한데 엉겨 있던 방이었습니다. 그 방 한가운데에 부활하신 예수님이 오셔서 서십니다. 부활은 죽음에서 다시 살아나는 것을 말합니다."},{"t":"verse","ref":"요한복음 20장 21절","text":"예수께서 또 이르시되 너희에게 평강이 있을지어다"},{"t":"p","text":"평강은 깊은 평안을 뜻합니다. 첫마디는 \"너희가 어떻게 나를 버릴 수 있었느냐\"가 아니었습니다. 꾸중도 서운함도 없었습니다. 십자가 위에서 용서를 구하시던 분은 무덤을 지나서도 같은 분이셨습니다. 박사님의 강의를 정리한 해설은 이 만남을, 제자들의 낙심과 좌절을 기쁨으로 바꾼 조건 없는 사랑의 회복 사건이라고 부릅니다."},{"t":"verse","ref":"요한복음 20장 22절","text":"이 말씀을 하시고 그들을 향하사 숨을 내쉬며 이르시되 성령을 받으라"},{"t":"p","text":"박사님은 이 '숨'에 주목합니다. 제1부에서 우리는 하나님이 흙으로 빚은 사람의 코에 생기를 불어넣으시자 사람이 살아났다는 말씀을 읽었습니다. 박사님은 낙심해 주저앉은 제자들에게 숨을 내쉬시는 이 장면을, 그 첫 창조 때와 같은 일로 읽습니다. 흙에 입 맞추셨던 분이, 두려움에 얼어붙은 제자들에게 다시 숨을 불어넣고 계신 것입니다. 성령은 하나님의 영을 가리키는 말인데, 이에 대해서는 제7부에서 더 나누겠습니다."},{"t":"p","text":"같은 날 엠마오라는 마을로 걸어가던 두 제자 곁에도 예수님이 다가와 함께 걸으셨습니다. 그런데 그들은 알아보지 못했습니다. 박사님은 그들의 눈이 가려진 까닭을, 예수님은 이미 돌아가셨다는 실망과 선입견이 마음의 눈을 가렸기 때문이라고 풀이합니다. 사람은 눈으로만 보는 것이 아니라 마음으로 본다는 것입니다. 그래도 예수님은 알아보지 못하는 그들을 나무라지 않으시고, 먼 길을 끝까지 함께 걸어 주셨습니다."},{"t":"h3","text":"못자국이 남은 손"},{"t":"p","text":"다른 기록을 보면 제자들은 예수님을 보고도 유령인 줄 알고 놀랐습니다. 예수님은 내 손과 발을 보고, 만져 보라고 하십니다. 그리고 구운 생선 한 토막을 받아 그들 앞에서 잡수십니다. 갈릴리 호숫가에서는 밤새 허탕을 친 제자들을 위해 손수 아침을 차려 주기도 하셨습니다. 해설은 이렇게 말합니다. 영광의 몸으로도 밥상에 앉으시는 것이 하나님의 사랑 방식이라고 말입니다."},{"t":"p","text":"박사님은 부활하신 예수님의 몸에 못자국이 그대로 남아 있었다는 점을 짚습니다. 모든 것이 새로워진 몸인데 상처 자국만은 지워지지 않았습니다. 박사님은 그것을 지워지지 않는 사랑의 증거로 읽습니다. 끝내 받아들이지 않을 사람들이 있을 것을 아시면서도 그들을 위해 못 박히신 사랑의 흔적이라는 것입니다."},{"t":"p","text":"그러니 부활은 십자가의 사랑을 뒤집은 사건이 아닙니다. 고난은 이제 끝났으니 힘으로 갚아 주겠다는 이야기가 아닙니다. 부활하신 분은 여전히 못자국 난 손으로 평안을 비시고, 생선을 구워 주시는 분입니다. 부활은 그 사랑이 죽음으로도 끊어지지 않는다는 것을 보여 주었습니다."},{"t":"h3","text":"\"사망아 너의 승리가 어디 있느냐\""},{"t":"p","text":"예수님을 따르던 바울이라는 사람은 부활을 두고 이 과의 핵심 성구를 썼습니다. 죽음을 향해, 네가 이긴 것이 어디 있느냐고 묻는 말입니다. 사망은 죽음을 뜻합니다. 그는 같은 글에서 죽음을 '맨 나중에 멸망 받을 원수'라고도 불렀습니다."},{"t":"p","text":"해설은 여기서 한 가지를 짚어 줍니다. 죽음이 원수라는 말은, 하나님이 죽음을 무기로 쓰시는 분이 아니라는 뜻이기도 하다는 것입니다. 하나님은 죽음을 집행하시는 분이 아니라 죽음을 없애시는 분입니다. 제3부에서 우리는 죽음이 하나님이 내리시는 벌이 아니라 생명에서 끊어진 결과라는 것을 살폈습니다. 부활은 그 이야기의 맺음입니다. 생명이신 분이 죽음 속으로 들어가셨고, 죽음은 그분을 붙들어 둘 수 없었습니다."},{"t":"p","text":"박사님은 건강강의에서 '다 이루었다'와 부활을 이어서 말합니다. 죽음이라는 값을 대신 다 치르신 결과가 부활로 나타났다는 것입니다. 그리고 이 완불을 정말로 믿을 때 비로소 죽음에 대한 불안이 풀린다고 말합니다."},{"t":"h3","text":"잠들었다 눈을 뜨면"},{"t":"p","text":"예수님은 나사로의 무덤 앞에서 이렇게 말씀하신 적이 있습니다."},{"t":"verse","ref":"요한복음 11장 25절","text":"예수께서 이르시되 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"},{"t":"p","text":"박사님은 예수님의 부활이 우리에게도 약속이 된다고 하며, 죽음을 잠에 빗대어 설명합니다. 곤히 잠들었다가 눈을 뜨면 밤이 얼마나 길었는지 전혀 느끼지 못합니다. 그와 같이 숨을 거둔 사람에게는 시간이 흐르지 않는다는 것입니다. 박사님은 이렇게 말합니다. \"아내는 30년을 기다렸어도, 죽은 남편에게는 죽는 순간이 곧 부활의 순간입니다.\" 기다림은 남은 사람의 시간일 뿐, 떠난 사람의 시간이 아닙니다."},{"t":"p","text":"박사님은 가을 단풍잎 이야기도 들려줍니다. 잎은 춤추듯 떨어져 길을 덮고, 겨우내 부서져 흙으로 스며들었다가, 이듬해 새 잎으로 올라옵니다. 박사님은 이것을 부활을 보여 주는 실물 교육이라고 부르며, 떨어지는 잎을 보고 내 인생도 저렇게 끝난다고 슬퍼할 까닭이 없다고 합니다."},{"t":"p","text":"박사님이 이 이야기들을 하는 까닭은 병이나 죽음을 두려워하며 사는 대신 마음의 쉼을 얻게 하려는 데 있습니다. 죽음이 마지막이 아니라면, 오늘을 떨며 살 이유가 줄어듭니다. 물론 이것은 아플 때 치료를 가볍게 여기라는 말이 아닙니다. 몸을 돌보는 일은 그대로 소중합니다. 다만 그 모든 날을 두려움이 아니라 평안 위에서 살 수 있다는 것입니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"부활은 사랑이 죽음보다 강하다는 하나님의 대답입니다. 다시 사신 예수님은 달아났던 제자들에게 꾸중이 아니라 평안을 건네셨고, 못자국 난 손으로 그들을 먹이셨습니다. 하나님은 죽음을 무기로 쓰시는 분이 아니라 죽음을 없애시는 분입니다. 그래서 우리에게도 죽음은 마지막 말이 아닙니다."},{"t":"h2","text":"함께 나누기"},{"t":"q","i":0,"text":"첫째, 긴 겨울 끝에 새싹을 보거나, 끝난 줄 알았던 일이 다시 시작되는 것을 본 적이 있습니까. 그때 어떤 느낌이었습니까."},{"t":"q","i":1,"text":"둘째, 실망시킨 사람 앞에 다시 서야 했던 적이 있습니까. 그때 가장 듣고 싶었던 말은 무엇이었습니까."},{"t":"q","i":2,"text":"셋째, 죽음을 생각할 때 마음에 가장 먼저 올라오는 것은 무엇입니까. 두려움, 그리움, 궁금함, 무엇이든 좋습니다."},{"t":"q","i":3,"text":"넷째, 죽음이 마지막이 아니라면, 오늘 내가 사는 모습에서 무엇이 달라질 것 같습니까."},{"t":"h2","text":"마음에 새기기"},{"t":"memory","ref":"요한복음 11장 25절","text":"예수께서 이르시되 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"},{"t":"h2","text":"한 주 실천"},{"t":"act","i":0,"text":"아침에 눈을 뜰 때 \"오늘도 숨을 불어넣어 주셔서 고맙습니다\" 하고 한마디로 하루를 시작해 봅니다."},{"t":"act","i":1,"text":"먼저 떠난 그리운 사람을 떠올리며, 그에게 하고 싶은 말을 짧은 편지로 적어 봅니다."},{"t":"h2","text":"인도자 도움말"},{"t":"p","text":"부활은 처음 듣는 분에게 가장 큰 걸림돌일 수 있습니다. 믿으라고 밀어붙이지 마십시오. 제자들도, 젊은 날의 박사님도 믿지 못했다는 데서 시작하면 마음이 편해집니다. 최근에 가족을 잃은 분이 있다면 3번 질문은 건너뛰어도 좋고, 나눔이 길어지면 충분히 들어 주십시오. 떠난 가족이 지금 어디에 있느냐는 질문에는 단정하지 말고, 떠난 이에게는 기다림의 시간이 없다는 박사님의 설명과, 하나님은 죽음을 없애시는 분이라는 점만 전하십시오. 병을 앓는 분이 \"그러면 저도 낫습니까\" 하고 물으면 낫는다고 약속하지 마시고, 어떤 날에도 끊어지지 않는 사랑과 평안을 함께 구하십시오. 이것으로 제5부를 마칩니다. 다음 과부터는 이 사랑을 '받는 손', 곧 믿음을 이야기합니다."}],"inPart":5,"audio":"audio/30.m4a"},{"id":"31","kind":"part","no":null,"part":6,"title":"믿음, 선물을 받는 손","sub":null,"key":null,"blocks":[{"t":"p","text":"제5부에서 우리는 십자가와 빈 무덤 앞에 섰습니다. 하나님의 사랑이 어디까지 갔는지, 그리고 그 사랑이 죽음보다 강하다는 것을 보았습니다. 이제 물음이 나에게로 옵니다. 그 사랑이 어떻게 내 것이 됩니까."},{"t":"p","text":"성경의 대답은 \"믿음으로\"입니다. 그런데 이 말이 많은 분에게는 또 하나의 짐처럼 들립니다. 믿으려 해도 믿어지지 않는 마음, 공짜라는 말이 도리어 미덥지 않은 마음, 이 나이에 무엇이 달라지겠느냐는 마음, 지킬 것이 많아 보여 무거운 마음, 그리고 이런 나도 정말 받아들여졌을까 하는 마음이 있습니다."},{"t":"p","text":"제6부는 이 다섯 가지 마음을 하나씩 따라갑니다. 믿음은 애써 짜내는 것이 아니라 사랑을 알 때 생기는 신뢰이고, 구원은 값없이 받는 선물이며, 새로 태어남은 하나님이 해 주시는 일이고, 계명은 명령이 아니라 약속이며, 확신은 내 느낌이 아니라 \"너는 내 것이라\" 하신 말씀에 놓여 있음을 차례로 살펴봅니다. 빈손이면 충분합니다. 선물은 빈손으로 받는 것입니다."}],"inPart":6,"audio":"audio/31.m4a"},{"id":"32","kind":"lesson","no":26,"part":null,"title":"믿음이란 무엇일까요","sub":"믿어지지 않는데 어떻게 믿을 수 있을까요","key":{"ref":"요한일서 4장 16절","text":"하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 하나님은 사랑이시라 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그의 안에 거하시느니라"},"blocks":[{"t":"h2","text":"마음 열기"},{"t":"p","text":"지난 과까지 우리는 십자가와 빈 무덤에서 하나님의 사랑이 어디까지 갔는지를 보았습니다. 이제 남은 물음은 하나입니다. 그 사랑을 나는 어떻게 받습니까. 성경은 \"믿음으로\"라고 답합니다. 그런데 바로 이 말 앞에서 많은 분이 걸음을 멈춥니다. \"저는 믿어지지가 않습니다. 믿고 싶어도 안 되는 걸 어떻게 합니까.\""},{"t":"p","text":"이상구 박사는 자기 집 개 이야기를 들려줍니다. 개의 눈곱을 떼어 주려면 주둥이를 잡아야 하는데, 개에게는 주둥이를 잡혀 입을 벌리지 못하게 되는 일이 가장 무서운 일이어서 처음에는 질색을 했다고 합니다. 그런데 사랑을 오래 받은 지금은 주둥이를 잡혀도 가만히 있더랍니다. 주인이 나를 정말 사랑한다는 것을 알게 되었기 때문입니다. 박사님은 그것이 믿음이라고 말합니다."},{"t":"p","text":"개는 믿으려고 애쓴 적이 없습니다. 결심한 적도 없습니다. 다만 사랑을 받았고, 알게 되었고, 그래서 가만히 있게 되었습니다. 믿음이 이런 것이라면 어떻겠습니까. 오늘은 믿음이라는 말을 처음부터 다시 생각해 보려 합니다."},{"t":"h2","text":"말씀 속으로"},{"t":"h3","text":"믿음은 짜내는 것이 아닙니다"},{"t":"p","text":"많은 분이 믿음을 의지의 힘으로 압니다. 의심이 들어도 꾹 누르고, 믿어지지 않아도 믿는다고 되뇌는 것이 믿음이라고 배워 왔습니다. 박사님은 이런 믿음에 '깡다구 믿음'이라는 이름을 붙입니다. 목청을 높여 \"믿습니다\" 하고 되뇌는 말은 실은 믿어 보려고 애쓰겠다는 말이고, 오히려 믿어지지 않을 때 나오는 말이라는 것입니다."},{"t":"p","text":"박사님의 설명은 단순합니다. 믿음은 내가 만들어 내는 심리 상태가 아닙니다. 상대가 나를 어떻게 대하는지 알게 되었을 때 그 상대에게 저절로 생기는 신뢰입니다. 그래서 \"믿으라\"는 말은 사실 말이 되지 않는다고 합니다. 믿지 못하는 사람은 믿을 만한 이유를 아직 모르는 것이고, 이유를 알면 저절로 믿기기 때문입니다."},{"t":"p","text":"그렇다면 할 일은 믿으라고 다그치는 것이 아닙니다. 믿을 수 있는 이유를 알려 주는 것입니다. 이 책이 지금까지 해 온 일이 바로 그것입니다. 하나님이 어떤 분이신지, 예수님이 사람들을 어떻게 대하셨는지, 십자가에서 무슨 일이 있었는지를 하나씩 살펴보았습니다. 믿음을 요구하기 전에 사랑을 먼저 보여 드리고 싶었습니다."},{"t":"h3","text":"알고, 그리고 믿었습니다"},{"t":"p","text":"오늘의 중심 말씀을 쓴 요한은 예수님을 가장 가까이서 따랐던 제자입니다. 그는 노년에 이렇게 적었습니다. \"하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니.\" 순서를 눈여겨보십시오. 먼저 '알고', 그다음에 '믿었다'고 합니다. 믿음이 앞서지 않고 앎이 앞섭니다. 요한은 3년 동안 예수님 곁에서 그 사랑을 보고 듣고 겪었습니다. 그렇게 알게 되니 믿어졌습니다."},{"t":"p","text":"무엇을 믿었는지도 보십시오. 어려운 교리를 믿은 것이 아닙니다. \"하나님이 우리를 사랑하시는 사랑\"을 믿었습니다. 성경이 말하는 믿음의 내용은 결국 이것 하나입니다. 하나님이 나를 조건 없이 사랑하신다는 것, 그 사랑을 믿는 것입니다."},{"t":"p","text":"여기서 하나님을 어떤 분으로 아느냐가 결정적입니다. 박사님은 이렇게 설명합니다. 말을 잘 들으면 복을 주고 안 들으면 벌을 주는 조건적인 하나님에게는 아무리 애를 써도 신뢰가 생기지 않습니다. 언제든지 나를 미워할 수 있는 상대를 온전히 믿을 수는 없기 때문입니다. 사람이 하나님을 온전히 신뢰할 수 있는 때는 그분이 조건 없이 사랑하시는 분임을 알게 될 때뿐입니다. 그러니 믿음이 생기지 않아 괴로웠던 분이 계시다면, 믿음이 모자랐던 것이 아닐 수 있습니다. 믿을 수 없는 모습의 하나님을 소개받았던 것일 수 있습니다."},{"t":"h3","text":"바라는 마음에서 시작됩니다"},{"t":"p","text":"성경에는 믿음을 한 문장으로 말해 주는 구절이 있습니다."},{"t":"verse","ref":"히브리서 11장 1절","text":"믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니"},{"t":"p","text":"보이지 않는 것을 어떻게 믿느냐고 묻는 분들에게 박사님은 과학 이야기를 꺼냅니다. 뉴턴은 사과가 그냥 떨어진다고 하지 않고, 보이지 않는 힘이 작용했다고 추론했습니다. 중력은 눈에 보이지 않지만 그 작용의 결과를 보고 우리는 중력이 있음을 압니다. 하나님의 사랑도 눈에 보이지 않습니다. 그러나 그 사랑이 하는 일, 곧 생명이 유지되고 상한 마음이 회복되는 일을 보면서 우리는 그 사랑이 있음을 알아 갑니다."},{"t":"p","text":"이 구절에서 더 눈여겨볼 말은 '바라는 것'입니다. 믿음은 완성된 확신에서 출발하지 않습니다. 박사님은 강의를 마치는 기도에서 이렇게 말했습니다. \"하나님이 계시면 얼마나 좋을까라는 하나님의 존재를 바라는 마음으로 우리가 강의를 들을 때, 드디어 성령께서는 우리가 바라는 실상을 깨닫게 하여 줍니다.\" 여기서 성령은 우리 마음에 찾아와 일하시는 하나님을 가리키는 말입니다. \"그런 사랑이 정말 있다면 얼마나 좋을까.\" 그 바람이면 시작으로 충분합니다. 하나님은 다 갖춘 확신을 조건으로 요구하지 않으십니다."},{"t":"h3","text":"맛보아 아는 길"},{"t":"p","text":"그러면 그 바람은 어떻게 자라 갑니까. 제6과에서 들은 토끼 이야기를 떠올려 보십시오. 달아나기만 하던 토끼는 날마다 먹이를 받으면서 먼저 다가오게 되었습니다. 박사님은 비슷한 이야기를 하나 더 들려줍니다. 기르던 개가 자주 앓아 약을 먹여야 했는데, 입을 억지로 벌려 알약을 넣는 일이 개에게는 무서운 일이었습니다. 그래서 먹이기 전마다 \"힘들겠지만 너를 해롭게 하려는 것이 아니다\" 하고 말해 주었고, 몇 번 그렇게 하니 겁내지 않고 받아먹더라고 합니다. 주인이 하는 일은 다 사랑이라는 것을 믿게 된 것입니다. 신뢰는 반복된 사랑의 경험 속에서 자랍니다. 하나님도 우리를 그렇게 대하십니다. 쫓아가 붙잡지 않으시고, 먹이시고 기다리십니다."},{"t":"p","text":"성경은 \"믿음은 들음에서 나며\"(로마서 10장 17절)라고 말합니다. 박사님은 이 들음이 소리를 들었다는 뜻이 아니라 듣고 이해했다는 뜻이라고 풉니다. 하나님의 사랑 이야기를 듣고, 아 이것이 정말 조건 없는 사랑이구나 하고 깨닫는 순간 믿음은 애쓰지 않아도 생깁니다."},{"t":"p","text":"박사님은 또 이렇게 비유합니다. 하나님이 나를 사랑하신다고 말하는 것은 수박이 달다고 말하는 것과 같습니다. 먹어 보지 않고도 달다고 말할 수는 있습니다. 그러나 직접 먹어 본 사람의 말은 다릅니다. 성경이 \"맛보아 알지어다\"(시편 34편 8절)라고 한 것은 머리로 공부해서 아는 데 그치지 말고 마음으로 맛보라는 뜻입니다. 믿음은 그렇게 한 입씩 맛보며 자라 갑니다."},{"t":"p","text":"오늘 말씀의 뒷부분은 그렇게 자란 믿음이 어디에 이르는지를 말해 줍니다. \"사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그의 안에 거하시느니라.\" '거한다'는 말은 머물러 산다는 뜻입니다. 믿음은 시험에 합격하듯 한 번 통과하는 관문이 아닙니다. 사랑받는 자리에 머물러 사는 것입니다. 아이가 엄마 품에 안겨 있을 때 아이가 하는 일은 없습니다. 그저 안겨 있습니다. 믿음은 그 품에 안겨 있는 것과 닮았습니다."},{"t":"h2","text":"아가페로 읽기"},{"t":"p","text":"믿음은 내가 하나님께 바치는 노력이 아니라, 하나님의 사랑을 알게 된 사람 안에 저절로 생기는 신뢰입니다. 요한은 \"알고 믿었다\"고 했습니다. 조건을 다는 하나님은 믿으려 해도 믿어지지 않지만, 조건 없이 사랑하시는 하나님은 알면 알수록 믿어집니다. 그래서 하나님은 우리에
